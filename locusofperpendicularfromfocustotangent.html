<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabola Tangent Animation (Cinematic Fixed)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js?v=20250617"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ccapture.js/1.1.0/CCapture.all.min.js?v=20250617"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0a0a1a;
      font-family: 'Arial', sans-serif;
    }
    #canvas-container {
      border: 4px solid #00ffcc;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
    }
    #controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    button, input[type="range"] {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(45deg, #00ffcc, #ff00cc);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.2s;
      position: relative;
    }
    button:hover, input[type="range"]:hover {
      transform: scale(1.05);
    }
    button:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
    }
    input[type="checkbox"] {
      margin-left: 10px;
    }
    label {
      color: #00ffcc;
      font-size: 14px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="controls">
    <input type="range" id="t-slider" min="-5" max="5" step="0.01" value="1" data-tooltip="Adjust point P position">
    <button id="play-button" onclick="toggleAnimation()" data-tooltip="Start or resume animation">Play</button>
    <button onclick="pauseAnimation()" data-tooltip="Pause animation">Pause</button>
    <button onclick="resetAnimation()" data-tooltip="Reset to initial state">Reset</button>
    <button onclick="showVertexCase()" data-tooltip="Show tangent at vertex">Vertex</button>
    <button id="export-button" onclick="toggleExport()" data-tooltip="Export animation as GIF">Export GIF</button>
    <label><input type="checkbox" id="show-labels" checked> Show Labels & Info</label>
  </div>
  <script>
    let t = 1;
    let a = 50;
    let animating = false;
    let paused = false;
    let animState = 0;
    let animT = 0;
    let showLabels = true;
    let focusParticles = [];
    let intersectionParticles = [];
    let pTrail = [];
    let stars = [];
    let nebula;
    let zoom = 1;
    let minZoom = 0.5;
    let maxZoom = 2;
    let isVertexCase = false;
    let capturer = null;
    let exporting = false;

    class Particle {
      constructor(x, y, color) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(0.5, 2));
        this.lifespan = 255;
        this.size = random(2, 6);
        this.color = color;
      }
      update() {
        this.pos.add(this.vel);
        this.lifespan -= 3;
      }
      display() {
        noStroke();
        fill(this.color[0], this.color[1], this.color[2], this.lifespan);
        ellipse(this.pos.x, this.pos.y, this.size, this.size);
      }
      isDead() {
        return this.lifespan <= 0;
      }
    }

    function spawnParticles(x, y, color, count, arr) {
      for (let i = 0; i < count; i++) {
        arr.push(new Particle(x, y, color));
      }
    }

    function easeOutQuad(t) {
      return 1 - (1 - t) * (1 - t);
    }

    function setup() {
      let canvas = createCanvas(800, 600);
      canvas.parent('canvas-container');
      // Initialize stars
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: random(width),
          y: random(height),
          size: random(1, 3),
          alpha: random(100, 255)
        });
      }
      // Create nebula texture
      nebula = createGraphics(width, height);
      for (let i = 0; i < 1000; i++) {
        nebula.fill(50, 0, random(50, 100), random(20, 50));
        nebula.noStroke();
        nebula.ellipse(random(width), random(height), random(50, 150));
      }
      // Audio removed to fix "no supported sources" error
      // To enable audio, add <audio> tags with valid MP3s and initialize in setup()
    }

    function draw() {
      // Cosmic background
      background(10, 10, 30);
      image(nebula, 0, 0);
      stars.forEach(s => {
        fill(255, s.alpha + 50 * sin(frameCount * 0.02 + s.x));
        noStroke();
        ellipse(s.x, s.y, s.size, s.size);
      });
      let bgGradient = drawingContext.createLinearGradient(0, 0, 0, height);
      bgGradient.addColorStop(0, 'rgba(0, 0, 50, 0.4)');
      bgGradient.addColorStop(1, 'rgba(50, 0, 50, 0.4)');
      drawingContext.fillStyle = bgGradient;
      rect(0, 0, width, height);

      // Apply zoom and fixed transformation
      push();
      translate(width / 2, height / 2);
      scale(zoom, -zoom);
      translate(0, 0);

      // Coordinate axes
      stroke(150, 150, 200, 100);
      strokeWeight(1 / zoom);
      line(-width/(2*zoom), 0, width/(2*zoom), 0);
      line(0, -height/(2*zoom), 0, height/(2*zoom));

      // Parabola
      if (animState >= 1) {
        let alpha = animState == 1 ? easeOutQuad(animT / TWO_PI) * 255 : 255;
        let gradient = drawingContext.createLinearGradient(-200, 0, 200, 0);
        gradient.addColorStop(0, `rgba(0, 128, 255, ${alpha / 255})`);
        gradient.addColorStop(0.5, `rgba(200, 200, 255, ${alpha / 255})`);
        gradient.addColorStop(1, `rgba(0, 255, 128, ${alpha / 255})`);
        drawingContext.fillStyle = gradient;
        drawingContext.shadowBlur = 20 / zoom;
        drawingContext.shadowColor = 'rgba(0, 128, 255, 0.7)';
        beginShape();
        for (let x = -200; x <= 200; x += 1) {
          let y = sqrt(4 * a * max(x, 0));
          vertex(x, y);
        }
        for (let x = 200; x >= -200; x -= 1) {
          let y = -sqrt(4 * a * max(x, 0));
          vertex(x, y);
        }
        endShape(CLOSE);
        drawingContext.shadowBlur = 0;
      }

      // Focus
      if (animState >= 2) {
        let alpha = animState == 2 ? easeOutQuad(animT / TWO_PI) * 255 : 255;
        // Lens flare
        for (let r = 40; r >= 10; r -= 5) {
          fill(255, 69, 0, alpha * (40 - r) / 30);
          ellipse(a, 0, r / zoom, r / zoom);
        }
        fill(255, 69, 0, alpha);
        ellipse(a, 0, 10 / zoom, 10 / zoom);
        // Particles
        if (frameCount % 3 === 0) spawnParticles(a, 0, [255, 165, 0], 2, focusParticles);
        focusParticles = focusParticles.filter(p => !p.isDead());
        focusParticles.forEach(p => { p.update(); p.display(); });
        if (showLabels) {
          push();
          scale(1, -1);
          textAlign(LEFT, BOTTOM);
          textSize(12 / zoom);
          fill(255);
          text('Focus (F: (a, 0))', a + 15 / zoom, 15 / zoom);
          pop();
        }
      }

      // Directrix
      if (animState >= 3) {
        let alpha = animState == 3 ? easeOutQuad(animT / TWO_PI) * 255 : 255;
        stroke(0, 0, 255, alpha);
        drawingContext.setLineDash([5 / zoom, 5 / zoom]);
        drawingContext.shadowBlur = 15 / zoom;
        drawingContext.shadowColor = 'rgba(0, 0, 255, 0.7)';
        strokeWeight(2 / zoom);
        line(-a, -200, -a, 200);
        drawingContext.setLineDash([]);
        drawingContext.shadowBlur = 0;
        if (showLabels) {
          push();
          scale(1, -1);
          textAlign(RIGHT, CENTER);
          textSize(12 / zoom);
          fill(255);
          text('Directrix (x = -a)', -a - 15 / zoom, 0);
          pop();
        }
      }

      // Point P and Tangent
      if (animState >= 4) {
        let px, py, slope, x1, x2, y1, y2, x3, y3, xi, yi;
        let alpha = animState == 4 ? easeOutQuad(animT / TWO_PI) * 255 : 255;

        if (isVertexCase) {
          px = 0;
          py = 0;
          x1 = 0;
          x2 = 0;
          y1 = -200;
          y2 = 200;
          x3 = a;
          y3 = 0;
          xi = 0;
          yi = 0;
        } else if (t !== 0) {
          px = a * t * t;
          py = 2 * a * t;
          slope = 1 / t;
          x1 = -200;
          x2 = 200;
          y1 = (x1 + a * t * t) / t;
          y2 = (x2 + a * t * t) / t;
          x3 = -200;
          y3 = -t * (x3 - a);
          xi = -a;
          yi = (-a + a * t * t) / t;
        } else {
          return; // Skip if t = 0 and not vertex case
        }

        // Point P
        pTrail.push({ x: px, y: py, alpha: alpha });
        if (pTrail.length > 10) pTrail.shift();
        pTrail.forEach((p, i) => {
          fill(0, 255, 0, p.alpha * (i + 1) / 10);
          ellipse(p.x, p.y, (8 * (i + 1) / 10) / zoom, (8 * (i + 1) / 10) / zoom);
        });
        fill(0, 255, 0, alpha);
        ellipse(px, py, 8 / zoom, 8 / zoom);
        if (showLabels) {
          push();
          scale(1, -1);
          textAlign(LEFT, BOTTOM);
          textSize(12 / zoom);
          fill(255);
          text(`P: (${(px/a).toFixed(2)}a, ${(py/a).toFixed(2)}a)`, px + 10 / zoom, -(py + 10 / zoom));
          pop();
        }

        // Tangent
        let gradient = drawingContext.createLinearGradient(x1, y1, x2, y2);
        gradient.addColorStop(0, `rgba(128, 0, 128, ${alpha / 255})`);
        gradient.addColorStop(0.5, `rgba(255, 100, 255, ${alpha / 255})`);
        gradient.addColorStop(1, `rgba(128, 0, 128, ${alpha / 255})`);
        drawingContext.strokeStyle = gradient;
        drawingContext.shadowBlur = 15 / zoom;
        drawingContext.shadowColor = 'rgba(128, 0, 128, 0.7)';
        strokeWeight(3 / zoom);
        line(x1, y1, x2, y2);
        drawingContext.shadowBlur = 0;
        if (showLabels) {
          push();
          scale(1, -1);
          textAlign(CENTER, TOP);
          textSize(12 / zoom);
          fill(255);
          text(isVertexCase ? 'Tangent: x = 0' : `Tangent: y = ${(1/t).toFixed(2)}x + ${(a*t).toFixed(2)}`, 0, -(y1 + 30 / zoom));
          pop();
        }

        // Normal (Perpendicular) from Focus
        if (animState >= 5) {
          let alphaPerp = animState == 5 ? easeOutQuad(animT / TWO_PI) * 255 : 255;
          let gradient = drawingContext.createLinearGradient(a, 0, x3, y3);
          gradient.addColorStop(0, `rgba(255, 165, 0, ${alphaPerp / 255})`);
          gradient.addColorStop(1, `rgba(255, 215, 0, ${alphaPerp / 255})`);
          drawingContext.strokeStyle = gradient;
          drawingContext.shadowBlur = 15 / zoom;
          drawingContext.shadowColor = 'rgba(255, 165, 0, 0.7)';
          strokeWeight(3 / zoom);
          line(a, 0, x3, y3);
          drawingContext.shadowBlur = 0;

          // Intersection of Normal
          let pulse = 1 + 0.15 * sin(frameCount * 0.1);
          for (let r = 40 * pulse; r >= 8; r -= 5) {
            fill(255, 0, 255, alphaPerp * (40 - r) / 32);
            ellipse(xi, yi, r / zoom, r / zoom);
          }
          fill(255, 0, 255, alphaPerp);
          ellipse(xi, yi, 8 / zoom, 8 / zoom);
          if (frameCount % 2 === 0) spawnParticles(xi, yi, [255, 0, 255], 3, intersectionParticles);
          intersectionParticles = intersectionParticles.filter(p => !p.isDead());
          intersectionParticles.forEach(p => { p.update(); p.display(); });
          if (showLabels) {
            push();
            scale(1, -1);
            textAlign(RIGHT, TOP);
            textSize(12 / zoom);
            fill(255);
            text(`Intersection of Normal: (${(xi/a).toFixed(2)}a, ${(yi/a).toFixed(2)}a)`, xi - 10 / zoom, -(yi + 10 / zoom));
            if (isVertexCase) {
              text('Note: Special case, not on directrix', xi - 10 / zoom, -(yi + 30 / zoom));
            }
            pop();
          }
        }
      }

      pop();

      // Annotations (unscaled)
      if (showLabels) {
        push();
        translate(0, 0);
        scale(1, 1);
        fill(255, 200);
        rect(10, 10, 300, 200, 10);
        fill(0);
        textAlign(LEFT, TOP);
        textSize(12);
        let info = [
          `Step ${animState}:`,
          animState == 0 ? 'Ready to start' :
          animState == 1 ? 'Parabola: y² = 4ax' :
          animState == 2 ? 'Focus at (a, 0)' :
          animState == 3 ? 'Directrix: x = -a' :
          animState == 4 ? 'Point P and Tangent' :
          isVertexCase ? 'Normal intersects at vertex (0, 0)' :
          'Normal from focus intersects directrix at (-a, a(t - 1/t))'
        ];
        text(info.join('\n'), 20, 20);
        pop();
      }

      // Legend (unscaled)
      if (showLabels) {
        push();
        translate(0, 0);
        scale(1, 1);
        fill(255, 200);
        rect(width - 110, 10, 100, 140, 10);
        fill(0);
        textAlign(LEFT, TOP);
        textSize(10);
        text('Legend:', width - 100, 20);
        fill(0, 128, 255);
        rect(width - 100, 40, 10, 10);
        fill(0);
        text('Parabola', width - 85, 40);
        fill(255, 69, 0);
        rect(width - 100, 60, 10, 10);
        fill(0);
        text('Focus', width - 85, 60);
        fill(0, 0, 255);
        rect(width - 100, 80, 10, 10);
        fill(0);
        text('Directrix', width - 85, 80);
        fill(0, 255, 0);
        rect(width - 100, 100, 10, 10);
        fill(0);
        text('Point P', width - 85, 100);
        fill(128, 0, 128);
        rect(width - 100, 120, 10, 10);
        fill(0);
        text('Tangent', width - 85, 120);
        fill(255, 0, 255);
        rect(width - 100, 140, 10, 10);
        fill(0);
        text('Intersection', width - 85, 140);
        pop();
      }

      // Update animation if not paused
      if (animating && !paused) {
        animT += 0.02;
        if (!isVertexCase) {
          t = 3 * sin(animT);
          if (t === 0) t = 0.01;
          tSlider.value = t;
        }
        if (animT > TWO_PI) {
          animT = 0;
          animState = min(animState + 1, 5);
        }
      }

      // Capture frame for GIF
      if (exporting && capturer) {
        capturer.capture(document.getElementById('defaultCanvas0'));
      }
    }

    function mouseDragged() {
      let mx = (mouseX - width / 2) / zoom;
      let my = -((mouseY - height / 2) / zoom);
      if (abs(my / (2 * a)) <= 5 && !isVertexCase) {
        t = my / (2 * a);
        if (t === 0) t = 0.01;
        tSlider.value = t;
        animating = false;
        paused = false;
        document.getElementById('play-button').textContent = 'Play';
      }
    }

    function mouseWheel(event) {
      let newZoom = zoom - event.delta * 0.001;
      zoom = constrain(newZoom, minZoom, maxZoom);
      return false;
    }

    function toggleAnimation() {
      if (paused) {
        paused = false;
        animating = true;
        document.getElementById('play-button').textContent = 'Play';
      } else {
        animating = !animating;
        if (!animating) {
          animState = 0;
          animT = 0;
          focusParticles = [];
          intersectionParticles = [];
          pTrail = [];
          document.getElementById('play-button').textContent = 'Play';
        } else {
          document.getElementById('play-button').textContent = 'Play';
        }
      }
    }

    function pauseAnimation() {
      if (animating && !paused) {
        paused = true;
        document.getElementById('play-button').textContent = 'Resume';
      }
    }

    function resetAnimation() {
      animating = false;
      paused = false;
      animState = 0;
      animT = 0;
      t = 1;
      isVertexCase = false;
      tSlider.value = 1;
      focusParticles = [];
      intersectionParticles = [];
      pTrail = [];
      document.getElementById('play-button').textContent = 'Play';
    }

    function showVertexCase() {
      isVertexCase = true;
      t = 0;
      animating = false;
      paused = false;
      animState = 4; // Start at point P step
      animT = 0;
      focusParticles = [];
      intersectionParticles = [];
      pTrail = [];
      document.getElementById('play-button').textContent = 'Play';
    }

    function toggleExport() {
      if (!exporting) {
        capturer = new CCapture({ format: 'gif', workersPath: 'https://cdnjs.cloudflare.com/ajax/libs/ccapture.js/1.1.0/', framerate: 30 });
        capturer.start();
        exporting = true;
        document.getElementById('export-button').textContent = 'Stop Export';
        animating = true;
        paused = false;
        animState = 0;
        animT = 0;
      } else {
        capturer.stop();
        capturer.save();
        capturer = null;
        exporting = false;
        document.getElementById('export-button').textContent = 'Export GIF';
        animating = false;
        paused = false;
        document.getElementById('play-button').textContent = 'Play';
      }
    }

    let tSlider = document.getElementById('t-slider');
    tSlider.addEventListener('input', () => {
      if (!isVertexCase) {
        t = parseFloat(tSlider.value);
        if (t === 0) t = 0.01;
        animating = false;
        paused = false;
        document.getElementById('play-button').textContent = 'Play';
      }
    });

    let showLabelsCheckbox = document.getElementById('show-labels');
    showLabelsCheckbox.addEventListener('change', () => {
      showLabels = showLabelsCheckbox.checked;
    });
  </script>
</body>
</html>
