<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjoint Mastery: Digital Board Edition</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0044;
            --neon-green: #44ffaa;
            --bg-color: #00050a; 
        }

        body { 
            margin: 0; background: var(--bg-color); overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            user-select: none; 
        }
        
        canvas { display: block; }

        /* Full Width HUD */
        #hud {
            position: absolute; top: 30px; left: 30px; right: 30px; 
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue); pointer-events: none;
            text-transform: uppercase; letter-spacing: 2px; z-index: 10;
            display: flex; justify-content: space-between; 
        }

        .status-box {
            border: 2px solid rgba(0, 242, 255, 0.4); padding: 25px;
            background: linear-gradient(180deg, rgba(0, 10, 20, 0.9) 0%, rgba(0, 20, 40, 0.9) 100%);
            min-width: 320px; border-radius: 8px;
            backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .status-box::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 3px 100%; pointer-events: none; opacity: 0.5;
        }

        /* --- NEW ENHANCEMENT: Dimension Monitor --- */
        .dimension-monitor {
            margin-top: 15px; padding: 10px; border: 1px dashed rgba(0, 242, 255, 0.5);
            background: rgba(0, 242, 255, 0.05); border-radius: 4px;
        }
        #dim-val { font-size: 22px; font-weight: bold; color: var(--neon-blue); transition: color 0.3s; }
        .dim-alert { color: var(--neon-red) !important; text-shadow: 0 0 15px var(--neon-red); animation: pulse 1s infinite;}

        .matrix-wrapper {
            position: relative; padding: 0 20px; margin-top: 15px; display: inline-block; pointer-events: auto;
        }
        .matrix-wrapper::before, .matrix-wrapper::after {
            content: ''; position: absolute; top: -5px; bottom: -5px; width: 12px; border: 3px solid var(--neon-blue);
        }
        .matrix-wrapper::before { left: 0; border-right: none; }
        .matrix-wrapper::after { right: 0; border-left: none; }

        .matrix-display {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; font-size: 20px; color: #fff; font-weight: bold;
        }

        .matrix-cell {
            background: rgba(0, 242, 255, 0.05); padding: 8px 0; text-align: center; 
            cursor: crosshair; transition: all 0.2s ease; border-radius: 4px;
        }

        .matrix-cell:hover {
            background: rgba(0, 242, 255, 0.5); text-shadow: 0 0 12px #fff;
            transform: scale(1.1); box-shadow: 0 0 15px var(--neon-blue);
        }

        .instruction { font-size: 12px; color: #ffaa00; margin-top: 20px; animation: pulse 2s infinite; font-weight: bold; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .legend { display: flex; gap: 15px; margin-top: 10px; font-size: 14px; font-weight: bold; }
        .red { color: #ff5555; text-shadow: 0 0 10px #ff5555;} 
        .green { color: #55ff55; text-shadow: 0 0 10px #55ff55;} 
        .blue { color: #5555ff; text-shadow: 0 0 10px #5555ff;}
        
        .det-container {
            display: flex; align-items: center; justify-content: space-between;
            margin: 20px 0; padding: 15px; background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.3); border-radius: 6px;
        }

        .cylinder-wrapper {
            width: 36px; height: 100px; border: 3px solid rgba(0, 242, 255, 0.8);
            border-radius: 18px; position: relative; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,242,255,0.4), 0 0 20px rgba(0,242,255,0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .fluid {
            width: 100%; height: 100%; position: absolute; bottom: 0; left: 0;
            background: linear-gradient(to top, #005588, var(--neon-blue));
            box-shadow: 0 -5px 20px var(--neon-blue);
            transition: height 0.15s ease-out, background 0.3s;
        }

        .fluid-empty { background: linear-gradient(to top, #660000, var(--neon-red)); box-shadow: 0 -5px 20px var(--neon-red); }

        #det-val { font-size: 42px; font-weight: bold; color: var(--neon-blue); transition: color 0.3s; }
        
        #inverse-status { 
            color: var(--neon-blue); padding: 10px; border: 2px solid transparent; 
            text-align: center; font-size: 16px; font-weight: bold; transition: all 0.3s;
            border-radius: 4px;
        }

        .error { 
            color: var(--neon-red) !important; border-color: var(--neon-red) !important;
            background: rgba(255, 0, 68, 0.15); text-shadow: 0 0 15px var(--neon-red) !important; 
        }

        #math-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: bold; color: #fff;
            text-shadow: 0 0 30px var(--neon-blue), 0 0 60px var(--neon-blue), 0 0 90px var(--neon-blue);
            opacity: 0; pointer-events: none; z-index: 20; text-align: center;
            background: rgba(0, 10, 20, 0.7); padding: 40px 80px; border-radius: 15px;
            backdrop-filter: blur(15px); border: 2px solid rgba(0, 242, 255, 0.6);
            letter-spacing: 5px;
        }

        #controls {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 20px; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; backdrop-filter: blur(10px);
        }

        button {
            background: rgba(0, 20, 40, 0.8); border: 2px solid var(--neon-blue);
            color: var(--neon-blue); padding: 18px 30px; cursor: pointer;
            text-transform: uppercase; transition: 0.2s; font-weight: bold; font-size: 16px;
            border-radius: 6px; position: relative; overflow: hidden;
        }

        button .hotkey {
            position: absolute; top: 2px; left: 5px; font-size: 10px; color: #fff; opacity: 0.5;
        }

        button:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; filter: grayscale(100%); }
        
        #btn-cinematic { border-color: #ffaa00; color: #ffaa00; }
        #btn-cinematic:hover { background: #ffaa00; color: #000; box-shadow: 0 0 30px #ffaa00; }

    </style>
</head>
<body>

<div id="hud">
    <div class="status-box">
        <div>
            <div style="font-size: 14px; opacity: 0.8; color: #fff;">System: Basis Vectors [i, j, k]</div>
            <div class="legend">
                <span class="red">Vector i</span>
                <span class="green">Vector j</span>
                <span class="blue">Vector k</span>
            </div>
        </div>

        <div class="dimension-monitor">
            <div style="font-size: 11px; color: #fff; opacity: 0.8;">SPATIAL DIMENSION (RANK)</div>
            <div id="dim-val">3D (Volume Active)</div>
        </div>
        
        <div class="det-container">
            <div>
                <div style="font-size: 14px; opacity: 0.8; color: #fff;">DETERMINANT |A|</div>
                <div id="det-val">1.00</div>
            </div>
            <div class="cylinder-wrapper">
                <div id="det-fluid" class="fluid"></div>
            </div>
        </div>

        <div id="inverse-status">INVERSE: STABLE</div>
    </div>
    
    <div class="status-box" style="pointer-events: auto;">
        <div>
            <div style="font-size: 14px; opacity: 0.8; color: #fff;">Operator: Adjoint Matrix</div>
            <div style="color: var(--neon-green); font-size: 16px; margin-top: 8px; font-weight: bold;">[ SYSTEM RESILIENT ]</div>
        </div>
        
        <div class="matrix-wrapper">
            <div id="adj-display" class="matrix-display"></div>
        </div>
        
        <div class="instruction">TAP VALUES TO VIEW COFACTOR AREAS</div>
    </div>
</div>

<div id="math-overlay">A &middot; adj(A) = |A|I</div>

<div id="controls">
    <button id="btn-distort" onclick="runTransformation()"><span class="hotkey">[1]</span> DISTORT SPACE</button>
    <button id="btn-singularity" onclick="triggerSingularity()"><span class="hotkey">[2]</span> TRIGGER SINGULARITY</button>
    <button id="btn-recover" onclick="applyAdjoint()"><span class="hotkey">[3]</span> APPLY ADJOINT</button>
    <button id="btn-cinematic" onclick="playIdentitySnap()"><span class="hotkey">[4]</span> ★ IDENTITY RECONSTRUCTION</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let scene, camera, renderer, composer, bloomPass;
    let grid, points, sceneGroup, particles;
    let arrowI, arrowJ, arrowK; 
    let planeJK, planeIK, planeIJ; 
    let ghostCube; 
    let currentMatrix = new THREE.Matrix4();

    const init = () => {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x00050a);
        scene.fog = new THREE.FogExp2(0x00050a, 0.055);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.85);
        composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        sceneGroup = new THREE.Group();
        scene.add(sceneGroup);

        const partGeo = new THREE.BufferGeometry();
        const partPos = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i++) { partPos[i] = (Math.random() - 0.5) * 40; }
        partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        const partMat = new THREE.PointsMaterial({color: 0x00f2ff, size: 0.05, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending});
        particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        grid = new THREE.GridHelper(20, 20, 0x00f2ff, 0x001122);
        grid.material.transparent = true;
        grid.material.opacity = 0.25;
        grid.position.y = -3; 
        scene.add(grid);

        const ghostGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(3, 3, 3));
        const ghostMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 });
        ghostCube = new THREE.LineSegments(ghostGeo, ghostMat);
        sceneGroup.add(ghostCube);

        const geometry = new THREE.BoxGeometry(3, 3, 3, 12, 12, 12); 
        const material = new THREE.PointsMaterial({ color: 0x00f2ff, size: 0.04, transparent: true, blending: THREE.AdditiveBlending });
        points = new THREE.Points(geometry, material);
        sceneGroup.add(points);

        const origin = new THREE.Vector3(0, 0, 0);
        arrowI = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), origin, 2.8, 0xff4444, 0.6, 0.3);
        arrowJ = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), origin, 2.8, 0x44ff44, 0.6, 0.3);
        arrowK = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), origin, 2.8, 0x4444ff, 0.6, 0.3);
        sceneGroup.add(arrowI, arrowJ, arrowK);

        planeJK = createAreaMesh(0x00ffff); 
        planeIK = createAreaMesh(0xff00ff); 
        planeIJ = createAreaMesh(0xffff00); 
        sceneGroup.add(planeJK, planeIK, planeIJ);

        setupInteractions();
        setupKeyboardControls();
        animate();
    };

    const createAreaMesh = (colorHex) => {
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(18), 3)); 
        const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
        return new THREE.Mesh(geom, mat);
    };

    const updatePlaneGeometry = (mesh, v1, v2) => {
        const p1 = new THREE.Vector3(0,0,0);
        const p2 = v1.clone().multiplyScalar(2.8); 
        const p4 = v2.clone().multiplyScalar(2.8);
        const p3 = new THREE.Vector3().addVectors(p2, p4);

        const positions = new Float32Array([
            p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z, 
            p1.x, p1.y, p1.z,  p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z  
        ]);
        
        mesh.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        mesh.geometry.attributes.position.needsUpdate = true;
    };

    const setupInteractions = () => {
        const adjDisplay = document.getElementById('adj-display');
        
        adjDisplay.addEventListener('pointerover', (e) => {
            if (e.target.classList.contains('matrix-cell')) {
                const row = parseInt(e.target.getAttribute('data-row'));
                if(row === 0) gsap.to(planeJK.material, { opacity: 0.7, duration: 0.2 });
                if(row === 1) gsap.to(planeIK.material, { opacity: 0.7, duration: 0.2 });
                if(row === 2) gsap.to(planeIJ.material, { opacity: 0.7, duration: 0.2 });
            }
        });

        adjDisplay.addEventListener('pointerout', (e) => {
            if (e.target.classList.contains('matrix-cell')) {
                gsap.to([planeJK.material, planeIK.material, planeIJ.material], { opacity: 0, duration: 0.2 });
            }
        });
    };

    const setupKeyboardControls = () => {
        window.addEventListener('keydown', (e) => {
            const isBusy = document.getElementById('btn-distort').disabled;
            if (isBusy) return;

            if (e.key === '1') window.runTransformation();
            if (e.key === '2') window.triggerSingularity();
            if (e.key === '3') window.applyAdjoint();
            if (e.key === '4') window.playIdentitySnap();
        });
    };

    const updateHUDAndVectors = () => {
        const m = currentMatrix.elements;
        
        const vI = new THREE.Vector3(m[0], m[1], m[2]);
        const vJ = new THREE.Vector3(m[4], m[5], m[6]);
        const vK = new THREE.Vector3(m[8], m[9], m[10]);

        updateArrow(arrowI, vI);
        updateArrow(arrowJ, vJ);
        updateArrow(arrowK, vK);

        updatePlaneGeometry(planeJK, vJ, vK);
        updatePlaneGeometry(planeIK, vI, vK);
        updatePlaneGeometry(planeIJ, vI, vJ);

        const det = m[0]*(m[5]*m[10]-m[6]*m[9]) - m[4]*(m[1]*m[10]-m[2]*m[9]) + m[8]*(m[1]*m[6]-m[2]*m[5]);
        
        const detEl = document.getElementById('det-val');
        const fluid = document.getElementById('det-fluid');
        const status = document.getElementById('inverse-status');
        const btnSingularity = document.getElementById('btn-singularity');
        const dimVal = document.getElementById('dim-val');

        let displayDet = Math.abs(det).toFixed(2);
        if(displayDet === "0.00") displayDet = "0.00"; 
        detEl.innerText = displayDet;
        
        let fillPercentage = Math.min(Math.max(Math.abs(det) * 100, 0), 100);
        fluid.style.height = `${fillPercentage}%`;

        // Update Dimension Logic based on Determinant
        if (Math.abs(det) < 0.05) {
            status.innerText = "INVERSE: FATAL COLLAPSE";
            status.classList.add('error');
            detEl.style.color = "var(--neon-red)";
            fluid.classList.add('fluid-empty');
            
            dimVal.innerText = "2D (FLAT PLANE)";
            dimVal.classList.add('dim-alert');

            if(!btnSingularity.disabled) btnSingularity.disabled = true; 
        } else {
            status.innerText = "INVERSE: STABLE";
            status.classList.remove('error');
            detEl.style.color = "var(--neon-blue)";
            fluid.classList.remove('fluid-empty');
            
            dimVal.innerText = "3D (VOLUME ACTIVE)";
            dimVal.classList.remove('dim-alert');

            btnSingularity.disabled = false;
        }

        const adj = [
            (m[5]*m[10]-m[6]*m[9]), -(m[4]*m[10]-m[6]*m[8]), (m[4]*m[9]-m[5]*m[8]),
            -(m[1]*m[10]-m[2]*m[9]), (m[0]*m[10]-m[2]*m[8]), -(m[0]*m[9]-m[1]*m[8]),
            (m[1]*m[6]-m[2]*m[5]), -(m[0]*m[6]-m[2]*m[4]), (m[0]*m[5]-m[1]*m[4])
        ];
        
        document.getElementById('adj-display').innerHTML = adj.map((v, i) => {
            const row = Math.floor(i / 3);
            let val = v.toFixed(1);
            if(val === "-0.0") val = "0.0";
            return `<div class="matrix-cell" data-row="${row}">${val}</div>`;
        }).join('');
    };

    const updateArrow = (arrow, vector) => {
        const length = vector.length();
        if (length > 0.005) {
            arrow.setDirection(vector.clone().normalize());
            arrow.setLength(length * 2.8);
            arrow.visible = true;
        } else {
            arrow.visible = false;
        }
    };

    const toggleButtons = (disabledState) => {
        document.querySelectorAll('button').forEach(b => b.disabled = disabledState);
    };

    window.runTransformation = () => {
        gsap.to(currentMatrix.elements, {
            duration: 2.5,
            0: 1.5, 4: 0.8, 8: -0.5,
            1: 0.5, 5: 1.2, 9: 0.2,
            2: -0.2, 6: 0.3, 10: 1.1,
            ease: "power2.out",
            onUpdate: () => {
                points.matrix.copy(currentMatrix);
                points.matrixAutoUpdate = false;
                updateHUDAndVectors();
            }
        });
    };

    window.triggerSingularity = () => {
        toggleButtons(true);
        const tl = gsap.timeline({ onComplete: () => toggleButtons(false) });
        
        tl.to(bloomPass, { strength: 6, duration: 0.15 });
        tl.to(bloomPass, { strength: 2.0, duration: 1.5 });

        tl.to(currentMatrix.elements, {
            duration: 3,
            0: 1, 4: 1, 8: 0, 
            1: 1, 5: 1, 9: 0,
            2: 0, 6: 0, 10: 0, 
            ease: "expo.inOut",
            onUpdate: () => {
                points.matrix.copy(currentMatrix);
                updateHUDAndVectors();
            }
        }, 0);
    };

    window.applyAdjoint = () => {
        const m = currentMatrix.elements;
        const adjElements = [
            (m[5]*m[10]-m[6]*m[9]), -(m[4]*m[10]-m[6]*m[8]), (m[4]*m[9]-m[5]*m[8]),
            -(m[1]*m[10]-m[2]*m[9]), (m[0]*m[10]-m[2]*m[8]), -(m[0]*m[9]-m[1]*m[8]),
            (m[1]*m[6]-m[2]*m[5]), -(m[0]*m[6]-m[2]*m[4]), (m[0]*m[5]-m[1]*m[4])
        ];

        const adjM4 = new THREE.Matrix4().set(
            adjElements[0], adjElements[3], adjElements[6], 0,
            adjElements[1], adjElements[4], adjElements[7], 0,
            adjElements[2], adjElements[5], adjElements[8], 0,
            0, 0, 0, 1
        );

        toggleButtons(true);
        gsap.to(bloomPass, { strength: 8, duration: 0.1, yoyo: true, repeat: 1 });

        gsap.to(points.scale, {
            duration: 2.5, x: 1, y: 1, z: 1, ease: "power2.out",
            onStart: () => {
                points.matrixAutoUpdate = true;
                points.applyMatrix4(adjM4);
                currentMatrix.multiply(adjM4);
            },
            onUpdate: () => updateHUDAndVectors(),
            onComplete: () => toggleButtons(false)
        });
    };

    window.playIdentitySnap = () => {
        toggleButtons(true);
        
        const tl = gsap.timeline({
            onComplete: () => {
                toggleButtons(false);
                updateHUDAndVectors(); 
            }
        });

        tl.to(currentMatrix.elements, {
            duration: 0.5,
            0: 1, 4: 0, 8: 0,
            1: 0, 5: 1, 9: 0,
            2: 0, 6: 0, 10: 1,
            onUpdate: () => { points.matrix.copy(currentMatrix); updateHUDAndVectors(); }
        });

        tl.to(currentMatrix.elements, {
            duration: 2.5, ease: "power2.inOut",
            0: 1.6, 4: 0.8, 8: -0.4,
            1: -0.5, 5: 1.3, 9: 0.6,
            2: 0.4, 6: -0.6, 10: 0.9,
            onUpdate: () => { points.matrix.copy(currentMatrix); updateHUDAndVectors(); }
        });

        tl.to('#math-overlay', { opacity: 1, duration: 0.8 });

        tl.add(() => {
            gsap.to(bloomPass, { strength: 8, duration: 0.15, yoyo: true, repeat: 1 });
            
            const m = currentMatrix.elements;
            const det = m[0]*(m[5]*m[10]-m[6]*m[9]) - m[4]*(m[1]*m[10]-m[2]*m[9]) + m[8]*(m[1]*m[6]-m[2]*m[5]);

            gsap.to(currentMatrix.elements, {
                duration: 3, ease: "elastic.out(1, 0.3)",
                0: det, 4: 0, 8: 0,
                1: 0, 5: det, 9: 0,
                2: 0, 6: 0, 10: det,
                onUpdate: () => { points.matrix.copy(currentMatrix); updateHUDAndVectors(); }
            });
        });

        tl.to('#math-overlay', { opacity: 0, duration: 1, delay: 3 });
    };

    const animate = () => {
        requestAnimationFrame(animate);
        if(sceneGroup) sceneGroup.rotation.y += 0.0015;
        if(particles) particles.rotation.y -= 0.0005;
        composer.render();
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
    updateHUDAndVectors();
</script>
</body>
</html>
