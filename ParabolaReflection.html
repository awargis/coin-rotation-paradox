<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola: The Reflection Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #111827; /* gray-900 */
        }
        .info-box {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen m-0 p-4 overflow-hidden">

    <div id="container" class="w-full h-full flex flex-col items-center justify-center bg-gray-800 rounded-2xl shadow-2xl relative border border-gray-700">
        <div id="canvas-container" class="w-full flex-grow relative rounded-t-2xl">
            <canvas id="reflectionCanvas"></canvas>
            <div id="infoBox" class="info-box absolute top-4 left-4 bg-black bg-opacity-40 p-4 rounded-lg border border-gray-600 max-w-sm">
                <h2 id="infoTitle" class="text-lg font-bold text-cyan-400">Satellite Dish Mode</h2>
                <p id="infoText" class="text-sm text-gray-200 mt-2">
                    Parallel rays (like signals from space) enter. Watch how the parabola reflects every single one to a central point—the Focus. This concentrates the signal!
                </p>
            </div>
        </div>
        
        <div class="w-full bg-gray-700 p-4 rounded-b-2xl flex flex-wrap items-center justify-center gap-4 z-20">
            <div class="flex items-center gap-4">
                <button id="satelliteBtn" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-lg transition-transform transform hover:scale-105 shadow-lg ring-2 ring-cyan-300">
                    Satellite Dish Mode
                </button>
                <button id="headlightBtn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg transition-transform transform hover:scale-105 shadow-lg">
                    Headlight Mode
                </button>
            </div>
            <button id="resetBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition-transform transform hover:scale-105 shadow-lg">
                Replay Animation
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('reflectionCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        const satelliteBtn = document.getElementById('satelliteBtn');
        const headlightBtn = document.getElementById('headlightBtn');
        const resetBtn = document.getElementById('resetBtn');

        const infoTitle = document.getElementById('infoTitle');
        const infoText = document.getElementById('infoText');

        let width, height, centerX, centerY;
        let scale = 30; // Pixels per unit
        let animationFrameId;
        let mode = 'satellite'; // 'satellite' or 'headlight'

        // Parabola properties
        const a = 0.03; // Controls the "wideness" of the parabola
        const focalLength = 1 / (4 * a);
        const focus = { x: 0, y: focalLength };

        let rays = [];

        // --- Coordinate Transformation ---
        const toCanvasX = x => centerX + x * scale;
        const toCanvasY = y => centerY - y * scale;

        // --- Setup and Resize ---
        function setup() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height * 0.8; // Position origin lower on the canvas
            resetAnimation();
        }

        // --- Drawing Functions ---
        function drawParabola() {
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            const rangeX = width / scale;
            for (let x = -rangeX / 2; x <= rangeX / 2; x += 0.1) {
                const y = a * x * x;
                if (x === -rangeX / 2) {
                    ctx.moveTo(toCanvasX(x), toCanvasY(y));
                } else {
                    ctx.lineTo(toCanvasX(x), toCanvasY(y));
                }
            }
            ctx.stroke();
        }

        function drawFocus() {
            ctx.beginPath();
            ctx.arc(toCanvasX(focus.x), toCanvasY(focus.y), 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; // red-500
            ctx.fill();
            ctx.font = '14px Inter';
            ctx.fillStyle = 'white';
            ctx.fillText('Focus', toCanvasX(focus.x) + 15, toCanvasY(focus.y) + 5);
        }

        function drawRays() {
            rays.forEach(ray => {
                ctx.beginPath();
                ctx.moveTo(toCanvasX(ray.origin.x), toCanvasY(ray.origin.y));
                ctx.lineTo(toCanvasX(ray.pos.x), toCanvasY(ray.pos.y));
                ctx.strokeStyle = ray.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                if (ray.isReflected) {
                    ctx.beginPath();
                    ctx.moveTo(toCanvasX(ray.reflectionOrigin.x), toCanvasY(ray.reflectionOrigin.y));
                    ctx.lineTo(toCanvasX(ray.reflectedPos.x), toCanvasY(ray.reflectedPos.y));
                    ctx.strokeStyle = ray.reflectedColor;
                    ctx.stroke();
                }
            });
        }
        
        // --- Ray Creation ---
        function createRays() {
            rays = [];
            const rangeX = width / scale;
            
            if (mode === 'satellite') {
                for (let i = 0; i < 20; i++) {
                    const x = (Math.random() - 0.5) * rangeX * 0.8;
                    const y = height / scale; // Start from top
                    rays.push({
                        origin: {x, y},
                        pos: {x, y},
                        dir: {x: 0, y: -1},
                        speed: 2 + Math.random() * 2,
                        color: '#38bdf8', // light blue
                        isReflected: false,
                        reflectionOrigin: null,
                        reflectedPos: null,
                        reflectedDir: null,
                        reflectedColor: '#fbbf24' // amber-400
                    });
                }
            } else { // headlight
                for (let i = 0; i < 30; i++) {
                     const angle = Math.random() * Math.PI * 0.8 + Math.PI * 0.1; // Emit upwards
                     const dir = { x: Math.cos(angle + Math.PI/2), y: Math.sin(angle+Math.PI/2)};
                     rays.push({
                        origin: {x: focus.x, y: focus.y},
                        pos: {x: focus.x, y: focus.y},
                        dir: dir,
                        speed: 3 + Math.random(),
                        color: '#fbbf24', // amber-400
                        isReflected: false,
                        reflectionOrigin: null,
                        reflectedPos: null,
                        reflectedDir: {x: 0, y: 1}, // Will reflect vertically
                        reflectedColor: '#38bdf8' // light blue
                    });
                }
            }
        }
        
        // --- Animation Logic ---
        function updateRays() {
            rays.forEach(ray => {
                if (!ray.isReflected) {
                    ray.pos.x += ray.dir.x * ray.speed;
                    ray.pos.y += ray.dir.y * ray.speed;

                    // Collision detection
                    const parabolaY = a * ray.pos.x * ray.pos.x;
                    if ((ray.dir.y < 0 && ray.pos.y <= parabolaY) || 
                        (ray.dir.y > 0 && ray.pos.y >= parabolaY && ray.origin.y < parabolaY)) {
                        ray.isReflected = true;
                        ray.pos.y = parabolaY; // Snap to parabola
                        ray.reflectionOrigin = { ...ray.pos };
                        ray.reflectedPos = { ...ray.pos };
                        
                        if (mode === 'satellite') {
                           // Reflect towards focus
                           const reflectVec = { x: focus.x - ray.pos.x, y: focus.y - ray.pos.y };
                           const mag = Math.hypot(reflectVec.x, reflectVec.y);
                           ray.reflectedDir = { x: reflectVec.x / mag, y: reflectVec.y / mag };
                        }
                    }
                } else {
                    ray.reflectedPos.x += ray.reflectedDir.x * ray.speed;
                    ray.reflectedPos.y += ray.reflectedDir.y * ray.speed;
                }
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawParabola();
            drawFocus();
            updateRays();
            drawRays();
            
            animationFrameId = requestAnimationFrame(animate);
        }

        function resetAnimation() {
            cancelAnimationFrame(animationFrameId);
            createRays();
            animate();
        }

        // --- Event Listeners ---
        function switchMode(newMode) {
            mode = newMode;
            if (mode === 'satellite') {
                satelliteBtn.classList.add('ring-2', 'ring-cyan-300');
                headlightBtn.classList.remove('ring-2', 'ring-amber-300');
                infoTitle.textContent = 'Satellite Dish Mode';
                infoTitle.style.color = '#22d3ee'; // cyan-400
                infoText.innerHTML = "Parallel rays (like signals from space) enter. Watch how the parabola reflects every single one to a central point—the <b>Focus</b>. This concentrates the signal!";
            } else {
                headlightBtn.classList.add('ring-2', 'ring-amber-300');
                satelliteBtn.classList.remove('ring-2', 'ring-cyan-300');
                infoTitle.textContent = 'Headlight Mode';
                infoTitle.style.color = '#f59e0b'; // amber-500
                infoText.innerHTML = "Rays are emitted from the <b>Focus</b> (like a light bulb). After hitting the parabola, they are reflected outwards into a perfectly parallel beam. This creates a strong, focused light!";
            }
            resetAnimation();
        }

        window.addEventListener('resize', setup);
        satelliteBtn.addEventListener('click', () => switchMode('satellite'));
        headlightBtn.addEventListener('click', () => switchMode('headlight'));
        resetBtn.addEventListener('click', resetAnimation);
        
        // --- Initialization ---
        setup();
    </script>
</body>
</html>
