<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflection & Image of a Point | Cinematic Math Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/stats.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            width: 320px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
        }
        
        h1 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #4af;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7);
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #aef;
            font-size: 0.9em;
        }
        
        select, button {
            width: 100%;
            padding: 10px;
            background: rgba(0, 30, 60, 0.7);
            color: #fff;
            border: 1px solid rgba(100, 150, 255, 0.5);
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        select:hover, button:hover {
            background: rgba(0, 50, 100, 0.8);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }
        
        .coordinates {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .coord-input {
            width: 45%;
            padding: 8px;
            background: rgba(0, 30, 60, 0.7);
            color: #fff;
            border: 1px solid rgba(100, 150, 255, 0.5);
            border-radius: 5px;
        }
        
        .formula {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 50, 100, 0.3);
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }
        
        .hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
            font-size: 0.9em;
        }
        
        .hud-item {
            margin-bottom: 8px;
        }
        
        .hud-item:last-child {
            margin-bottom: 0;
        }
        
        .highlight {
            color: #4af;
            font-weight: bold;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
            font-size: 0.9em;
            max-width: 300px;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <h1>Reflection & Image of a Point</h1>
        
        <div class="control-group">
            <label for="reflection-type">Reflection Type:</label>
            <select id="reflection-type">
                <option value="x-axis">Across X-Axis</option>
                <option value="y-axis">Across Y-Axis</option>
                <option value="origin">Across Origin</option>
                <option value="arbitrary">Across Arbitrary Line</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Point P Coordinates:</label>
            <div class="coordinates">
                <input type="number" id="p-x" class="coord-input" value="3" step="0.5">
                <input type="number" id="p-y" class="coord-input" value="2" step="0.5">
            </div>
        </div>
        
        <div id="line-controls" class="control-group" style="display: none;">
            <label>Line Parameters (ax + by + c = 0):</label>
            <div class="coordinates">
                <input type="number" id="line-a" class="coord-input" value="1" step="0.1">
                <input type="number" id="line-b" class="coord-input" value="-1" step="0.1">
            </div>
            <div class="coordinates">
                <input type="number" id="line-c" class="coord-input" value="0" step="0.1">
            </div>
        </div>
        
        <button id="reset-view">Reset View</button>
        
        <div class="formula">
            Reflection across X-axis:<br>
            Q = (α, -β)
        </div>
    </div>
    
    <div class="hud">
        <div class="hud-item">Point P: <span id="p-coords" class="highlight">(3, 2)</span></div>
        <div class="hud-item">Point Q: <span id="q-coords" class="highlight">(3, -2)</span></div>
        <div class="hud-item">Distance: <span id="distance" class="highlight">4.00</span></div>
        <div class="hud-item">Angle: <span id="angle" class="highlight">53.13°</span></div>
    </div>
    
    <div id="instructions">
        <p class="pulse">← Drag point P to move it</p>
        <p>Use dropdown to change reflection type</p>
        <p>Scroll to zoom, drag to rotate view</p>
    </div>

    <script>
        // Main Three.js implementation
        let scene, camera, renderer, controls;
        let pointP, pointQ, reflectionLine;
        let incidentRay, reflectedRay;
        let angleArc, perpendicularLine;
        let grid, axes;
        let isDragging = false;
        
        // Initialization
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020814);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;
            camera.position.y = 5;
            camera.lookAt(0, 0, 0);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x444466);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x4488ff, 1);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            // Create grid and axes
            createGrid();
            createAxes();
            
            // Create initial elements
            createPointP();
            createReflectionLine('x-axis');
            calculateReflection();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            
            document.getElementById('reflection-type').addEventListener('change', function() {
                const type = this.value;
                updateReflectionType(type);
                calculateReflection();
            });
            
            document.getElementById('reset-view').addEventListener('click', function() {
                camera.position.set(0, 5, 10);
                camera.lookAt(0, 0, 0);
                controls.reset();
            });
            
            // Add coordinate change listeners
            document.getElementById('p-x').addEventListener('change', updateFromUI);
            document.getElementById('p-y').addEventListener('change', updateFromUI);
            document.getElementById('line-a').addEventListener('change', updateFromUI);
            document.getElementById('line-b').addEventListener('change', updateFromUI);
            document.getElementById('line-c').addEventListener('change', updateFromUI);
            
            // Start animation
            animate();
        }
        
        function createGrid() {
            const gridHelper = new THREE.GridHelper(20, 20, 0x3366aa, 0x224477);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);
            grid = gridHelper;
        }
        
        function createAxes() {
            // X-axis (red)
            const xAxis = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(0, 0, 0),
                10,
                0xff4444,
                0.5,
                0.2
            );
            scene.add(xAxis);
            
            // Y-axis (green)
            const yAxis = new THREE.ArrowHelper(
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, 0, 0),
                10,
                0x44ff44,
                0.5,
                0.2
            );
            scene.add(yAxis);
            
            axes = { xAxis, yAxis };
        }
        
        function createPointP() {
            if (pointP) scene.remove(pointP);
            
            const geometry = new THREE.SphereGeometry(0.3, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: 0xff3366,
                emissive: 0xff3366,
                emissiveIntensity: 0.5,
                specular: 0xffffff
            });
            
            pointP = new THREE.Mesh(geometry, material);
            pointP.position.set(3, 2, 0);
            scene.add(pointP);
            
            // Add glow effect
            const glowGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xff3366,
                transparent: true,
                opacity: 0.3
            });
            
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            pointP.add(glow);
        }
        
        function createReflectionLine(type) {
            if (reflectionLine) scene.remove(reflectionLine);
            
            let geometry, material;
            
            switch(type) {
                case 'x-axis':
                    geometry = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(-10, 0, 0),
                        new THREE.Vector3(10, 0, 0)
                    ]);
                    break;
                case 'y-axis':
                    geometry = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, -10, 0),
                        new THREE.Vector3(0, 10, 0)
                    ]);
                    break;
                case 'origin':
                    // For origin, we'll show both axes
                    geometry = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(-10, 0, 0),
                        new THREE.Vector3(10, 0, 0),
                        new THREE.Vector3(0, -10, 0),
                        new THREE.Vector3(0, 10, 0)
                    ]);
                    break;
                case 'arbitrary':
                    const a = parseFloat(document.getElementById('line-a').value);
                    const b = parseFloat(document.getElementById('line-b').value);
                    const c = parseFloat(document.getElementById('line-c').value);
                    
                    // Calculate two points on the line
                    let x1 = -10, y1 = (-a*x1 - c)/b;
                    let x2 = 10, y2 = (-a*x2 - c)/b;
                    
                    geometry = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(x1, y1, 0),
                        new THREE.Vector3(x2, y2, 0)
                    ]);
                    break;
            }
            
            material = new THREE.LineBasicMaterial({
                color: 0x44ffcc,
                linewidth: 2
            });
            
            reflectionLine = new THREE.Line(geometry, material);
            scene.add(reflectionLine);
        }
        
        function calculateReflection() {
            const type = document.getElementById('reflection-type').value;
            const px = parseFloat(document.getElementById('p-x').value);
            const py = parseFloat(document.getElementById('p-y').value);
            
            let qx, qy;
            
            switch(type) {
                case 'x-axis':
                    qx = px;
                    qy = -py;
                    break;
                case 'y-axis':
                    qx = -px;
                    qy = py;
                    break;
                case 'origin':
                    qx = -px;
                    qy = -py;
                    break;
                case 'arbitrary':
                    const a = parseFloat(document.getElementById('line-a').value);
                    const b = parseFloat(document.getElementById('line-b').value);
                    const c = parseFloat(document.getElementById('line-c').value);
                    
                    // Reflection formula for line ax+by+c=0
                    const d = a*a + b*b;
                    qx = px - 2*a*(a*px + b*py + c)/d;
                    qy = py - 2*b*(a*px + b*py + c)/d;
                    break;
            }
            
            // Update point Q
            if (pointQ) scene.remove(pointQ);
            
            const geometry = new THREE.SphereGeometry(0.3, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: 0x3366ff,
                emissive: 0x3366ff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8,
                specular: 0xffffff
            });
            
            pointQ = new THREE.Mesh(geometry, material);
            pointQ.position.set(qx, qy, 0);
            scene.add(pointQ);
            
            // Add hologram effect
            const hologramGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const hologramMaterial = new THREE.MeshBasicMaterial({
                color: 0x3366ff,
                transparent: true,
                opacity: 0.2,
                wireframe: true
            });
            
            const hologram = new THREE.Mesh(hologramGeometry, hologramMaterial);
            pointQ.add(hologram);
            
            // Update rays
            updateRays(px, py, qx, qy, type);
            
            // Update HUD
            document.getElementById('p-coords').textContent = `(${px.toFixed(2)}, ${py.toFixed(2)})`;
            document.getElementById('q-coords').textContent = `(${qx.toFixed(2)}, ${qy.toFixed(2)})`;
            
            // Calculate and display distance
            const distance = Math.sqrt(Math.pow(px - qx, 2) + Math.pow(py - qy, 2));
            document.getElementById('distance').textContent = distance.toFixed(2);
            
            // Calculate and display angle
            const angle = Math.atan2(py - qy, px - qx) * 180 / Math.PI;
            document.getElementById('angle').textContent = Math.abs(angle).toFixed(2) + '°';
            
            // Update formula display
            updateFormula(type);
        }
        
        function updateRays(px, py, qx, qy, type) {
            // Remove old rays and arcs if they exist
            if (incidentRay) scene.remove(incidentRay);
            if (reflectedRay) scene.remove(reflectedRay);
            if (angleArc) scene.remove(angleArc);
            if (perpendicularLine) scene.remove(perpendicularLine);
            
            // Create incident ray (from P to reflection point)
            let reflectionX, reflectionY;
            
            if (type === 'x-axis') {
                reflectionX = px;
                reflectionY = 0;
            } else if (type === 'y-axis') {
                reflectionX = 0;
                reflectionY = py;
            } else if (type === 'origin') {
                reflectionX = 0;
                reflectionY = 0;
            } else {
                // For arbitrary line, we need to calculate the intersection
                const a = parseFloat(document.getElementById('line-a').value);
                const b = parseFloat(document.getElementById('line-b').value);
                const c = parseFloat(document.getElementById('line-c').value);
                
                // Calculate intersection point
                const d = a*a + b*b;
                reflectionX = (b*(b*px - a*py) - a*c) / d;
                reflectionY = (a*(-b*px + a*py) - b*c) / d;
            }
            
            const incidentGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(px, py, 0),
                new THREE.Vector3(reflectionX, reflectionY, 0)
            ]);
            
            const incidentMaterial = new THREE.LineBasicMaterial({
                color: 0xffaa33,
                linewidth: 2
            });
            
            incidentRay = new THREE.Line(incidentGeometry, incidentMaterial);
            scene.add(incidentRay);
            
            // Create reflected ray (from reflection point to Q)
            const reflectedGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(reflectionX, reflectionY, 0),
                new THREE.Vector3(qx, qy, 0)
            ]);
            
            const reflectedMaterial = new THREE.LineBasicMaterial({
                color: 0x33ffaa,
                linewidth: 2
            });
            
            reflectedRay = new THREE.Line(reflectedGeometry, reflectedMaterial);
            scene.add(reflectedRay);
            
            // Create perpendicular line for arbitrary reflection
            if (type === 'arbitrary') {
                const perpendicularGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3((px + qx) / 2, (py + qy) / 2, 0),
                    new THREE.Vector3(reflectionX, reflectionY, 0)
                ]);
                
                const perpendicularMaterial = new THREE.LineDashedMaterial({
                    color: 0xffffff,
                    dashSize: 0.2,
                    gapSize: 0.1
                });
                
                perpendicularLine = new THREE.Line(perpendicularGeometry, perpendicularMaterial);
                perpendicularLine.computeLineDistances();
                scene.add(perpendicularLine);
            }
            
            // Create angle arc for non-arbitrary reflections
            if (type !== 'arbitrary') {
                const arcPoints = [];
                const radius = 1;
                const startAngle = 0;
                const endAngle = Math.PI / 4;
                
                for (let i = 0; i <= 10; i++) {
                    const angle = startAngle + (endAngle - startAngle) * (i / 10);
                    arcPoints.push(new THREE.Vector3(
                        reflectionX + Math.cos(angle) * radius,
                        reflectionY + Math.sin(angle) * radius,
                        0
                    ));
                }
                
                const arcGeometry = new THREE.BufferGeometry().setFromPoints(arcPoints);
                const arcMaterial = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    linewidth: 1
                });
                
                angleArc = new THREE.Line(arcGeometry, arcMaterial);
                scene.add(angleArc);
            }
        }
        
        function updateFormula(type) {
            const formulaElement = document.querySelector('.formula');
            
            switch(type) {
                case 'x-axis':
                    formulaElement.innerHTML = 'Reflection across X-axis:<br>Q = (α, -β)';
                    break;
                case 'y-axis':
                    formulaElement.innerHTML = 'Reflection across Y-axis:<br>Q = (-α, β)';
                    break;
                case 'origin':
                    formulaElement.innerHTML = 'Reflection across Origin:<br>Q = (-α, -β)';
                    break;
                case 'arbitrary':
                    formulaElement.innerHTML = 'Reflection across line ax+by+c=0:<br>Q = (x - 2a(ax+by+c)/(a²+b²), y - 2b(ax+by+c)/(a²+b²))';
                    break;
            }
        }
        
        function updateReflectionType(type) {
            createReflectionLine(type);
            
            // Show/hide line controls
            const lineControls = document.getElementById('line-controls');
            lineControls.style.display = type === 'arbitrary' ? 'block' : 'none';
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onMouseDown(event) {
            // Check if we're clicking near point P
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(pointP);
            
            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
            }
        }
        
        function onMouseMove(event) {
            if (!isDragging) return;
            
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Find intersection with the ground plane (z=0)
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const intersectionPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(groundPlane, intersectionPoint);
            
            // Update point P position
            pointP.position.x = intersectionPoint.x;
            pointP.position.y = intersectionPoint.y;
            
            // Update UI coordinates
            document.getElementById('p-x').value = intersectionPoint.x.toFixed(2);
            document.getElementById('p-y').value = intersectionPoint.y.toFixed(2);
            
            // Recalculate reflection
            calculateReflection();
        }
        
        function onMouseUp() {
            isDragging = false;
            controls.enabled = true;
        }
        
        function updateFromUI() {
            const px = parseFloat(document.getElementById('p-x').value);
            const py = parseFloat(document.getElementById('p-y').value);
            
            pointP.position.set(px, py, 0);
            
            if (document.getElementById('reflection-type').value === 'arbitrary') {
                createReflectionLine('arbitrary');
            }
            
            calculateReflection();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            // Add subtle animation to the glow effects
            if (pointP && pointP.children[0]) {
                pointP.children[0].scale.x = 1 + 0.1 * Math.sin(Date.now() * 0.002);
                pointP.children[0].scale.y = 1 + 0.1 * Math.sin(Date.now() * 0.002);
                pointP.children[0].scale.z = 1 + 0.1 * Math.sin(Date.now() * 0.002);
            }
            
            if (pointQ && pointQ.children[0]) {
                pointQ.children[0].rotation.x += 0.01;
                pointQ.children[0].rotation.y += 0.01;
            }
            
            renderer.render(scene, camera);
        }
        
        // Initialize the application
        init();
    </script>
</body>
</html>
