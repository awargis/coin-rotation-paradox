<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Octants — The Glass Morphic Space</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:  #e9f0f8;
    --dim:  rgba(233,240,248,0.56);
    --faint:rgba(233,240,248,0.28);
    --line: rgba(255,255,255,0.09);
    --accent: #7fd4ff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    background:#000;
    color:var(--ink);
    font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }

  /* ---------- WebGL canvas ---------- */
  #gl{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    display:block;
    z-index:0;
  }

  /* ---------- Scroll driver ---------- */
  #scroll-space{
    position:relative;
    height:760vh;
    z-index:1;
    pointer-events:none;
  }

  /* ---------- UI layer ---------- */
  #ui{
    position:fixed; inset:0;
    z-index:2;
    pointer-events:none;
    user-select:none;
  }

  /* top bar */
  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: clamp(20px,3.2vw,38px) clamp(24px,5vw,74px);
    font-size:10px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--faint);
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    color:rgba(233,240,248,0.72);
    letter-spacing:.36em;
  }
  .brand .mark{
    width:9px; height:9px; border-radius:2px;
    background:linear-gradient(135deg,#7fd4ff,#b98cff);
    box-shadow:0 0 16px rgba(127,212,255,.8);
    transform:rotate(45deg);
  }
  .brand .sep{ color:rgba(233,240,248,0.22); letter-spacing:0; }

  /* top hairline */
  .hairline{
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(127,212,255,.35) 20%, rgba(185,140,255,.35) 55%, transparent);
    opacity:.6;
  }

  /* chapter text */
  #chapters{
    position:absolute; inset:0;
  }
  .chapter{
    position:absolute;
    left: clamp(24px,5vw,74px);
    bottom: clamp(30px,8vh,80px);
    max-width: min(430px, 42vw);
    opacity:0;
    will-change:opacity, transform;
  }
  .ch-idx{
    font-size:10px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(127,212,255,.8);
    margin-bottom:16px;
    display:flex; align-items:center; gap:12px;
  }
  .ch-idx::after{
    content:''; flex:1; height:1px; max-width:60px;
    background:linear-gradient(90deg, rgba(127,212,255,.5), transparent);
  }
  .ch-title{
    font-size: clamp(26px, 3.4vw, 46px);
    font-weight:300;
    letter-spacing:-.025em;
    line-height:1.04;
    margin-bottom:14px;
    background:linear-gradient(180deg,#ffffff 0%, rgba(255,255,255,.58) 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
  }
  .ch-body{
    font-size: clamp(12px, 1.05vw, 14.5px);
    line-height:1.7;
    font-weight:300;
    color:var(--dim);
    letter-spacing:.005em;
  }

  /* readout */
  .readout{
    position:absolute;
    right: clamp(24px,5vw,74px);
    bottom: clamp(30px,8vh,80px);
    text-align:right;
    font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    opacity:0;
    will-change:opacity;
  }
  .ro-label{
    font-size:9px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--faint); margin-bottom:7px;
    font-family:'Inter',sans-serif;
  }
  .ro-value{
    font-size: clamp(11px, 1vw, 14px);
    color:rgba(207,230,255,.92);
    letter-spacing:.05em;
    margin-bottom:20px;
    text-shadow:0 0 22px rgba(127,212,255,.45);
  }
  .ro-value.sign{ color:#b9e4ff; }

  /* progress rail */
  .rail{
    position:absolute;
    right: clamp(18px,2.6vw,34px);
    top:50%;
    transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .rail .tick{
    width:4px; height:4px; border-radius:50%;
    background:rgba(255,255,255,.14);
    transition:background .35s ease, box-shadow .35s ease, transform .35s ease;
  }
  .rail .tick.on{
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
    transform:scale(1.5);
  }
  .rail .line{
    width:1px; height:52px;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.02));
  }

  /* scroll hint */
  .hint{
    position:absolute;
    left:50%; bottom: clamp(22px,4vh,40px);
    transform:translateX(-50%);
    font-size:9.5px; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(233,240,248,.34);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition:opacity .8s ease;
  }
  .hint .stem{
    width:1px; height:34px;
    background:linear-gradient(180deg, rgba(127,212,255,.75), transparent);
    animation:stem 2.4s ease-in-out infinite;
    transform-origin:top;
  }
  @keyframes stem{
    0%,100%{ opacity:.25; transform:scaleY(.45); }
    50%    { opacity:1;   transform:scaleY(1); }
  }

  /* loader */
  #loader{
    position:fixed; inset:0; z-index:50;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.2s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  #loader .lm{
    width:7px;height:7px;border-radius:50%;
    background:#7fd4ff;
    box-shadow:0 0 24px 4px rgba(127,212,255,.85);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(.6); opacity:.35; }
    50%    { transform:scale(1.35); opacity:1; }
  }
  #loader.gone{ opacity:0; }

  /* subtle corner frame */
  .corner{
    position:absolute; width:14px; height:14px;
    border:1px solid rgba(255,255,255,.09);
  }
  .corner.tl{ top:clamp(20px,3.2vw,38px); left:clamp(24px,5vw,74px); border-right:0; border-bottom:0; }
  .corner.br{ bottom:clamp(20px,3.2vw,38px); right:clamp(24px,5vw,74px); border-left:0; border-top:0; }

  @media (max-width: 860px){
    .chapter{ max-width: 78vw; }
    .readout{ display:none; }
    .rail{ display:none; }
    .corner{ display:none; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">
  <div class="hairline"></div>

  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <span>OCTANT<span class="sep"> · </span>ENGINE</span>
    </div>
    <div>Spatial Systems Lab — Vol. III</div>
  </div>

  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div id="chapters"></div>

  <div class="readout" id="readout">
    <div class="ro-label">Position</div>
    <div class="ro-value" id="ro-coords">( 0.00, 0.00, 0.00 )</div>
    <div class="ro-label">Signature</div>
    <div class="ro-value sign" id="ro-sign">( +, +, + )</div>
  </div>

  <div class="rail" id="rail"></div>

  <div class="hint" id="hint">
    <span>Scroll</span>
    <span class="stem"></span>
  </div>
</div>

<div id="scroll-space"></div>

<div id="loader"><div class="lm"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';

/* ══════════════════════════════════════════════════════════════
   0 · MATH HELPERS
   ══════════════════════════════════════════════════════════════ */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x){
  const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1);
  return t * t * (3 - 2 * t);
}

/* ══════════════════════════════════════════════════════════════
   1 · CONSTANTS
   ══════════════════════════════════════════════════════════════ */
const HALF = 5;                 // half-extent of the glass cube
const PLANE_SIZE = HALF * 2;

const C_X = 0x49d8ff;
const C_Y = 0x5cffb1;
const C_Z = 0xb98cff;

const OCTANTS = [
  { s:[ 1, 1, 1], color:'#5ee7ff', label:'(+, +, +)' },
  { s:[ 1, 1,-1], color:'#6f8cff', label:'(+, +, −)' },
  { s:[ 1,-1, 1], color:'#a78bfa', label:'(+, −, +)' },
  { s:[ 1,-1,-1], color:'#f472b6', label:'(+, −, −)' },
  { s:[-1, 1, 1], color:'#34d399', label:'(−, +, +)' },
  { s:[-1, 1,-1], color:'#a3e635', label:'(−, +, −)' },
  { s:[-1,-1, 1], color:'#fbbf24', label:'(−, −, +)' },
  { s:[-1,-1,-1], color:'#fb7185', label:'(−, −, −)' }
];

/* ══════════════════════════════════════════════════════════════
   2 · RENDERER · SCENE · CAMERA
   ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  400
);
camera.position.set(0, 0.5, 14);

/* ══════════════════════════════════════════════════════════════
   3 · POST PROCESSING
   ══════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);

composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.62,   // strength
  0.85,   // radius
  0.18    // threshold
);
composer.addPass(bloom);

composer.addPass(new OutputPass());

/* --- chromatic aberration + vignette + grain ------------------ */
const CAPassDef = {
  uniforms: {
    tDiffuse: { value: null },
    uAmount:  { value: 1.0 },
    uTime:    { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float uAmount;
    uniform float uTime;
    varying vec2 vUv;

    void main(){
      vec2 d  = vUv - 0.5;
      float r2 = dot(d, d);
      vec2 off = d * r2 * uAmount * 0.0075;

      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;

      float vig = smoothstep(1.25, 0.18, length(d) * 1.55);
      col *= mix(0.68, 1.0, vig);

      float g = fract(sin(dot(vUv * (1.0 + fract(uTime)), vec2(12.9898, 78.233))) * 43758.5453);
      col += (g - 0.5) * 0.011;

      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const caPass = new ShaderPass(CAPassDef);
composer.addPass(caPass);

/* ══════════════════════════════════════════════════════════════
   4 · SHARED TEXTURES
   ══════════════════════════════════════════════════════════════ */
function makeGlowTexture(){
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.14, 'rgba(200,238,255,0.72)');
  g.addColorStop(0.36, 'rgba(120,190,255,0.22)');
  g.addColorStop(0.66, 'rgba(70,130,255,0.06)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.minFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  return t;
}
const GLOW_TEX = makeGlowTexture();

/* ══════════════════════════════════════════════════════════════
   5 · GLASS PLANE SHADER
   ══════════════════════════════════════════════════════════════ */
const GLASS_VERT = /* glsl */`
  varying vec2 vUv;
  varying vec3 vWorld;
  varying vec3 vNormalW;

  void main(){
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    vNormalW = mat3(modelMatrix) * normal;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const GLASS_FRAG = /* glsl */`
  precision highp float;

  uniform float uTime;
  uniform float uReveal;
  uniform float uOpacity;
  uniform float uGridOpacity;
  uniform float uGridScale;
  uniform vec3  uTint;

  varying vec2 vUv;
  varying vec3 vWorld;
  varying vec3 vNormalW;

  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  void main(){
    vec3 V = normalize(cameraPosition - vWorld);
    vec3 N = normalize(vNormalW);

    float fres = 1.0 - abs(dot(N, V));

    /* --- chromatic fringe: each channel peaks at a different angle --- */
    float cr = pow(fres, 2.35);
    float cg = pow(fres, 3.00);
    float cb = pow(fres, 3.85);
    vec3 fringe = vec3(cr, cg, cb);

    /* --- radial reveal sweep from origin --- */
    float d  = length(vUv - 0.5) * 2.0;
    float rv = smoothstep(0.0, 0.42, uReveal * 2.4 - d);

    /* --- coordinate grid --- */
    vec2 gc = vUv * uGridScale;
    vec2 gw = fwidth(gc);
    vec2 gf = abs(fract(gc - 0.5) - 0.5) / max(gw, vec2(1e-5));
    float grid = 1.0 - min(min(gf.x, gf.y), 1.0);

    /* --- frosted micro-grain --- */
    float frost = vnoise(vUv * 190.0) * 0.6
                + vnoise(vUv * 46.0 + uTime * 0.02) * 0.4;

    vec3 col  = uTint * fringe * 1.75;
    col += uTint * grid * uGridOpacity * (0.20 + 1.15 * fres);
    col += uTint * frost * 0.048;
    col += uTint * exp(-d * d * 7.0) * 0.30;

    col *= rv * uOpacity;

    gl_FragColor = vec4(col, 1.0);
  }
`;

function createGlassPlane(tint, rotX, rotY){
  const geo = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, 1, 1);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:        { value: 0 },
      uReveal:      { value: 0 },
      uOpacity:     { value: 1 },
      uGridOpacity: { value: 0.55 },
      uGridScale:   { value: 20.0 },
      uTint:        { value: new THREE.Color(tint) }
    },
    vertexShader:   GLASS_VERT,
    fragmentShader: GLASS_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.set(rotX, rotY, 0);
  mesh.renderOrder = 1;
  mesh.frustumCulled = false;
  return mesh;
}

const planeXY = createGlassPlane(0x4fa8ff, 0, 0);
const planeYZ = createGlassPlane(0x9a7bff, 0, Math.PI / 2);
const planeXZ = createGlassPlane(0x3fe0c8, -Math.PI / 2, 0);

scene.add(planeXY, planeYZ, planeXZ);

/* ══════════════════════════════════════════════════════════════
   6 · AXES
   ══════════════════════════════════════════════════════════════ */
function createAxis(colorHex){
  const group = new THREE.Group();

  const mat = new THREE.MeshBasicMaterial({
    color: colorHex,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, PLANE_SIZE, 12, 1, true),
    mat
  );
  rod.renderOrder = 2;

  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.062, 0.26, 18),
    mat
  );
  cone.renderOrder = 2;

  group.add(rod, cone);
  return { group, rod, cone, mat };
}

const axisX = createAxis(C_X);
axisX.group.rotation.z = -Math.PI / 2;   // local +Y → world +X

const axisY = createAxis(C_Y);           // local +Y → world +Y

const axisZ = createAxis(C_Z);
axisZ.group.rotation.x = Math.PI / 2;    // local +Y → world +Z

scene.add(axisX.group, axisY.group, axisZ.group);

/* ══════════════════════════════════════════════════════════════
   7 · TEXT SPRITES
   ══════════════════════════════════════════════════════════════ */
function makeLabel(text, colorHex, worldHeight, opts = {}){
  const dpr      = 2;
  const fontSize = opts.fontSize || 72;
  const weight   = opts.weight   || 400;
  const spacing  = opts.spacing  || '0.14em';
  const fontStr  = `${weight} ${fontSize}px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif`;

  // measure
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = fontStr;
  try { meas.letterSpacing = spacing; } catch(e){}
  const textW = meas.measureText(text).width;

  const padX = 64, padY = 44;
  const w = Math.ceil(textW) + padX * 2;
  const h = fontSize + padY * 2;

  const c = document.createElement('canvas');
  c.width  = w * dpr;
  c.height = h * dpr;

  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.font = fontStr;
  try { ctx.letterSpacing = spacing; } catch(e){}
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = colorHex;
  ctx.shadowColor  = colorHex;
  ctx.shadowBlur   = 26;
  ctx.fillText(text, w / 2, h / 2);
  ctx.shadowBlur   = 9;
  ctx.fillText(text, w / 2, h / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace    = THREE.SRGBColorSpace;
  tex.minFilter     = THREE.LinearFilter;
  tex.magFilter     = THREE.LinearFilter;
  tex.generateMipmaps = false;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  });

  const spr = new THREE.Sprite(mat);
  const aspect = w / h;
  spr.scale.set(worldHeight * aspect, worldHeight, 1);
  spr.renderOrder = 20;
  return spr;
}

/* --- axis labels --- */
const axisLabelX = makeLabel('x', '#8fe3ff', 0.66, { fontSize: 84, weight: 300 });
const axisLabelY = makeLabel('y', '#9dffd0', 0.66, { fontSize: 84, weight: 300 });
const axisLabelZ = makeLabel('z', '#d3b6ff', 0.66, { fontSize: 84, weight: 300 });
axisLabelX.position.y = HALF + 0.72;
axisLabelY.position.y = HALF + 0.72;
axisLabelZ.position.y = HALF + 0.72;
axisX.group.add(axisLabelX);
axisY.group.add(axisLabelY);
axisZ.group.add(axisLabelZ);

/* --- octant labels --- */
const octantLabels = [];
OCTANTS.forEach((o, i) => {
  const spr = makeLabel(o.label, o.color, 0.52, { fontSize: 60, weight: 400, spacing: '0.1em' });
  spr.position.set(o.s[0] * 4.0, o.s[1] * 4.0, o.s[2] * 4.0);
  scene.add(spr);
  octantLabels.push(spr);
});

/* --- origin label --- */
const originLabel = makeLabel('O', '#cfe6ff', 0.44, { fontSize: 60, weight: 400 });
originLabel.position.set(-0.42, -0.42, 0.42);
scene.add(originLabel);

/* ══════════════════════════════════════════════════════════════
   8 · NODE CLOUDS (one per octant)
   ══════════════════════════════════════════════════════════════ */
const NODE_VERT = /* glsl */`
  uniform float uTime;
  uniform float uAppear;
  uniform float uSize;
  uniform float uPixelRatio;

  attribute float aSeed;

  varying float vSeed;

  void main(){
    vSeed = aSeed;

    vec3 p = position;
    float s = aSeed * 6.2831;
    p.x += sin(uTime * 0.35 + s)        * 0.07;
    p.y += cos(uTime * 0.31 + s * 1.7)  * 0.07;
    p.z += sin(uTime * 0.27 + s * 2.3)  * 0.07;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;

    float sz = uSize * uPixelRatio / max(-mv.z, 0.001);
    gl_PointSize = clamp(sz * uAppear, 0.0, 64.0);
  }
`;

const NODE_FRAG = /* glsl */`
  precision highp float;

  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform float uOpacity;

  varying float vSeed;

  void main(){
    vec2 c = gl_PointCoord - 0.5;
    float r = length(c) * 2.0;
    if (r > 1.0) discard;

    float core = pow(1.0 - r, 2.6);
    float halo = pow(1.0 - r, 0.75) * 0.34;

    vec3 col = mix(uColorA, uColorB, vSeed);
    float a  = (core + halo) * uOpacity;

    gl_FragColor = vec4(col * a, 1.0);
  }
`;

const nodeClouds = [];

OCTANTS.forEach((o, idx) => {
  const COUNT = 18;
  const positions = new Float32Array(COUNT * 3);
  const seeds     = new Float32Array(COUNT);

  for (let k = 0; k < COUNT; k++){
    const r     = 1.15 + Math.pow(Math.random(), 0.68) * 3.05;

    let x = r * Math.sin(phi) * Math.cos(theta);
    let y = r * Math.cos(phi);
    let z = r * Math.sin(phi) * Math.sin(theta);

    x = Math.abs(x) * o.s[0];
    y = Math.abs(y) * o.s[1];
    z = Math.abs(z) * o.s[2];

    positions[k * 3 + 0] = x;
    positions[k * 3 + 1] = y;
    positions[k * 3 + 2] = z;
    seeds[k] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));

  const base = new THREE.Color(o.color);
  const alt  = base.clone().lerp(new THREE.Color(0xffffff), 0.55);

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:       { value: 0 },
      uAppear:     { value: 0 },
      uOpacity:    { value: 0 },
      uSize:       { value: 46.0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uColorA:     { value: base },
      uColorB:     { value: alt }
    },
    vertexShader:   NODE_VERT,
    fragmentShader: NODE_FRAG,

    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const pts = new THREE.Points(geo, mat);

function orientSegment(mesh, a, b){
  _dir.subVectors(b, a);
  const len = _dir.length();
  mesh.position.copy(a).addScaledVector(_dir, 0.5);
  if (len > 1e-5){
    mesh.quaternion.setFromUnitVectors(UP, _dir.clone().normalize());
  }
  mesh.scale.set(1, Math.max(len, 1e-4), 1);
}

let userScrolled = false;
let autoProgress = 0;
let targetProgress = 0;
let progress = 0;

function maxScroll(){
  return Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
}
function rawScroll(){
  return clamp(window.scrollY / maxScroll(), 0, 1);
}

function engageUser(){
  if (userScrolled) return;
  userScrolled = true;
  // seamless hand-off: line the document scroll up with the autoplay position
  window.scrollTo(0, autoProgress * maxScroll());
  hintEl.style.opacity = '0';
}

window.addEventListener('wheel',       engageUser, { passive: true });
window.addEventListener('touchstart',  engageUser, { passive: true });
window.addEventListener('keydown', (e) => {
  if (['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key)) engageUser();
}, { passive: true });

/* ══════════════════════════════════════════════════════════════
   15 · ANIMATION STATE
   ══════════════════════════════════════════════════════════════ */
let time = 0;
let lastTime = performance.now() / 1000;

const travelerState = { x: 0, y: 0, z: 0, visible: 0 };
const weights = new Float32Array(8);

/* ══════════════════════════════════════════════════════════════
   16 · MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function tick(){
  const now = performance.now() / 1000;
  const dt  = Math.min(now - lastTime, 0.05);
  lastTime  = now;
  time     += dt;

  /* ---------- progress ---------- */
  if (!userScrolled){
    autoProgress = Math.min(1, autoProgress + dt * 0.0125);
    targetProgress = autoProgress;
  } else {
    targetProgress = rawScroll();
  }

  // framerate-independent damping — guarantees fluid, cut-free motion
  const damp = 1 - Math.pow(0.02, dt);
  progress += (targetProgress - progress) * damp;
  const p = progress;

  /* ---------- pointer parallax ---------- */
  pointerSmoothX += (pointerX - pointerSmoothX) * (1 - Math.pow(0.05, dt));
  pointerSmoothY += (pointerY - pointerSmoothY) * (1 - Math.pow(0.05, dt));

  /* ---------- glass planes ---------- */
  const revXY = smoothstep(0.125, 0.300, p);
  const revYZ = smoothstep(0.265, 0.440, p);
  const revXZ = smoothstep(0.405, 0.580, p);
  const planeDim = 1.0 - 0.42 * smoothstep(0.62, 0.94, p);

  planeXY.material.uniforms.uReveal.value  = revXY;
  planeYZ.material.uniforms.uReveal.value  = revYZ;
  planeXZ.material.uniforms.uReveal.value  = revXZ;

  planeXY.material.uniforms.uOpacity.value = planeDim;
  planeYZ.material.uniforms.uOpacity.value = planeDim;
  planeXZ.material.uniforms.uOpacity.value = planeDim;

  planeXY.material.uniforms.uTime.value = time;
  planeYZ.material.uniforms.uTime.value = time;
  planeXZ.material.uniforms.uTime.value = time;

  /* ---------- axes ---------- */
  const axisRev = smoothstep(0.02, 0.185, p);
  const axisFade = 1.0 - 0.25 * smoothstep(0.65, 0.95, p);

  [axisX, axisY, axisZ].forEach((a, i) => {
    const r = Math.max(axisRev, 1e-4);
    a.rod.scale.y  = r;
    a.cone.scale.setScalar(r);
    a.cone.position.y = (HALF + 0.13) * axisRev;
    a.mat.opacity = (i === 1 ? 0.85 : 0.9) * axisFade;
  });

  const axisLabelOpacity = smoothstep(0.10, 0.22, p) * axisFade;
  const labelY = (HALF + 0.72) * Math.max(axisRev, 1e-4);
  axisLabelX.position.y = labelY;
  axisLabelY.position.y = labelY;
  axisLabelZ.position.y = labelY;
  axisLabelX.material.opacity = axisLabelOpacity;
  axisLabelY.material.opacity = axisLabelOpacity;
  axisLabelZ.material.opacity = axisLabelOpacity;

  /* ---------- origin ---------- */
  const originIn = smoothstep(0.0, 0.08, p);
  const originPulse = 1 + 0.14 * Math.sin(time * 1.6);
  originCore.material.opacity = originIn * (0.9 + 0.1 * Math.sin(time * 2.2));
  originGlow.material.opacity = originIn * (0.55 + 0.18 * Math.sin(time * 1.6));
  originGlow.scale.setScalar(2.4 * originPulse * lerp(0.6, 1.0, originIn));
  originLabel.material.opacity = smoothstep(0.05, 0.16, p) * (1 - smoothstep(0.62, 0.82, p)) * 0.8;

  /* ---------- traveler position (continuous Lissajous) ---------- */
  const w0 = 0.2;
  const tx = 3.65 * Math.sin(w0 * 4 * time);
  const ty = 3.15 * Math.sin(w0 * 6 * time + 1.0);
  const tz = 3.40 * Math.sin(w0 * 3 * time + 2.0);

  travelerState.x = tx;
  travelerState.y = ty;
  travelerState.z = tz;
  travelerState.visible = smoothstep(0.715, 0.855, p);

  const tv = travelerState.visible;

  travelerGroup.position.set(tx, ty, tz);
  travelerCore.material.opacity = tv;
  travelerGlow.material.opacity = tv * (0.75 + 0.2 * Math.sin(time * 3.1));
  travelerGlow.scale.setScalar(1.5 + 0.16 * Math.sin(time * 2.4));

  /* ---------- guide staircase ---------- */
  _vA.set(0, 0, 0);
  _vB.set(tx, 0, 0);
  orientSegment(guideSegs[0], _vA, _vB);

  _vA.set(tx, 0, 0);
  _vB.set(tx, ty, 0);
  orientSegment(guideSegs[1], _vA, _vB);

  _vA.set(tx, ty, 0);
  _vB.set(tx, ty, tz);
  orientSegment(guideSegs[2], _vA, _vB);

  guideMat.opacity = tv * 0.55;

  /* ---------- projection dots ---------- */
  projDots[0].position.set(tx, ty, 0);
  projDots[1].position.set(0, ty, tz);
  projDots[2].position.set(tx, 0, tz);
  projMat.opacity = tv * 0.8;

  /* ---------- octant highlight weights ---------- */
  const k = 0.62;
  let sumW = 0;
  for (let i = 0; i < 8; i++){
    const s = OCTANTS[i].s;
    const wx = 0.5 + 0.5 * s[0] * Math.tanh(tx / k);
    const wy = 0.5 + 0.5 * s[1] * Math.tanh(ty / k);
    const wz = 0.5 + 0.5 * s[2] * Math.tanh(tz / k);
    weights[i] = wx * wy * wz;
    sumW += weights[i];
  }

  /* ---------- octant labels ---------- */
  for (let i = 0; i < 8; i++){
    const appear = smoothstep(0.545 + i * 0.012, 0.545 + i * 0.012 + 0.11, p);
    const w = weights[i];

    // blend between "all equal" and "traveler-weighted"
    const focus = lerp(0.16, 0.16 + 1.9 * w, tv);
    const baseOpacity = 0.42 * appear;
    const opacity = appear * (baseOpacity + focus * 0.95);

    const spr = octantLabels[i];
    spr.material.opacity = clamp(opacity, 0, 1);
    const sc = 0.52 * (1 + 0.30 * w * tv) * lerp(0.75, 1.0, appear);
    spr.scale.set(sc * (spr.scale.x / (spr.scale.y || 1)) * (spr.scale.y / sc), sc, 1);
    // keep aspect ratio: recompute from stored aspect
    const asp = spr.userData.aspect || 2.9;
    spr.scale.set(sc * asp, sc, 1);
  }

  /* ---------- node clouds ---------- */
  for (let i = 0; i < 8; i++){
    const cloud = nodeClouds[i];
    const appear = smoothstep(0.60 + i * 0.015, 0.60 + i * 0.015 + 0.15, p);
    const w = weights[i];

    cloud.mat.uniforms.uAppear.value  = appear * (0.55 + 0.65 * w * tv + 0.45 * (1 - tv));
    cloud.mat.uniforms.uOpacity.value = appear * (0.55 + 1.05 * w * tv);
    cloud.mat.uniforms.uTime.value    = time;

    const pulse = 1 + 0.35 * w * tv;
    cloud.mat.uniforms.uColorA.value.copy(cloud.baseColor).multiplyScalar(pulse);
  }

  /* ---------- dust ---------- */
  dustMat.uniforms.uTime.value = time;
  dust.rotation.y = time * 0.008;

  /* ---------- camera ---------- */
  camCurve.getPoint(p, _camPos);
  tgtCurve.getPoint(p, _camTgt);

  // idle drift — never perfectly still, never jarring
  _camPos.x += Math.sin(time * 0.121) * 0.38;
  _camPos.y += Math.sin(time * 0.093 + 1.7) * 0.30;
  _camPos.z += Math.sin(time * 0.077 + 3.1) * 0.28;

  camera.position.copy(_camPos);

  // pointer parallax applied in camera space
  _parallax.set(pointerSmoothX * 0.9, -pointerSmoothY * 0.7, 0);
  _parallax.applyQuaternion(camera.quaternion);
  camera.position.add(_parallax);

  camera.lookAt(_camTgt);
  camera.rotation.z += Math.sin(time * 0.063) * 0.012;

  /* ---------- UI ---------- */
  updateUI(p, tx, ty, tz, tv);

  /* ---------- post ---------- */
  caPass.uniforms.uTime.value = time;

  composer.render();
}

/* ══════════════════════════════════════════════════════════════
   17 · UI UPDATE
   ══════════════════════════════════════════════════════════════ */
let lastActiveChapter = -1;

function updateUI(p, tx, ty, tz, tv){
  /* chapters — crossfading, stacked, absolutely positioned */
  for (let i = 0; i < CHAPTERS.length; i++){
    const c = CHAPTERS[i];
    const fade = 0.045;
    const a = smoothstep(c.a, c.a + fade, p) * (1 - smoothstep(c.b - fade, c.b, p));
    const el = chapterEls[i];
    el.style.opacity = a.toFixed(3);
    el.style.transform = `translateY(${((1 - a) * 16).toFixed(2)}px)`;
  }

  /* active chapter → rail */
  let active = 0;
  for (let i = 0; i < CHAPTERS.length; i++){
    if (p >= CHAPTERS[i].a) active = i;
  }
  if (active !== lastActiveChapter){
    lastActiveChapter = active;
    railTicks.forEach((t, i) => t.classList.toggle('on', i === active));
  }

  /* dynamic title for the signature chapter */
  const fmt = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const sgn = (v) => (v >= 0 ? '+' : '−');

  const sig = `( ${sgn(tx)}, ${sgn(ty)}, ${sgn(tz)} )`;
  const coords = `( ${fmt(tx)}, ${fmt(ty)}, ${fmt(tz)} )`;

  roCoords.textContent = coords;
  roSign.textContent   = sig;

  // chapter 06 title follows the traveler
  const c6 = CHAPTERS[5];
  const el6 = chapterEls[5];
  const title6 = el6.querySelector('.ch-title');
  if (title6) title6.textContent = sig;
  el6.querySelector('.ch-body').textContent =
    `Every point carries a signature: the signs of its three coordinates. The point you are watching lives in octant ${sig}.`;

  readoutEl.style.opacity = tv.toFixed(3);
}

/* ══════════════════════════════════════════════════════════════
   18 · ASPECT RATIO STORE FOR LABELS
   ══════════════════════════════════════════════════════════════ */
octantLabels.forEach((spr) => {
  spr.userData.aspect = spr.scale.x / spr.scale.y;
});

/* ══════════════════════════════════════════════════════════════
   19 · RESIZE
   ══════════════════════════════════════════════════════════════ */
function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);

  composer.setSize(w, h);
  bloom.setSize(w, h);

  const pr = renderer.getPixelRatio();
  dustMat.uniforms.uPixelRatio.value = pr;
  nodeClouds.forEach((c) => { c.mat.uniforms.uPixelRatio.value = pr; });
}
window.addEventListener('resize', onResize);
onResize();

/* ══════════════════════════════════════════════════════════════
   20 · BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  try { await document.fonts.ready; } catch(e){}
  // give the browser one paint cycle with fonts in place
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  // regenerate labels now that webfonts are available
  rebuildLabels();

  const loader = document.getElementById('loader');
  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 1400);

  renderer.setAnimationLoop(tick);
}

/* Re-create text sprites once Inter has loaded, for crisp typography. */
function rebuildLabels(){
  const specs = [
    { spr: axisLabelX, text: 'x', color: '#8fe3ff', h: 0.66, o: { fontSize: 84, weight: 300 } },
    { spr: axisLabelY, text: 'y', color: '#9dffd0', h: 0.66, o: { fontSize: 84, weight: 300 } },
    { spr: axisLabelZ, text: 'z', color: '#d3b6ff', h: 0.66, o: { fontSize: 84, weight: 300 } },
    { spr: originLabel, text: 'O', color: '#cfe6ff', h: 0.44, o: { fontSize: 60, weight: 400 } }
  ];

  specs.forEach((spec) => {
    const parent = spec.spr.parent;
    const pos = spec.spr.position.clone();
    const op = spec.spr.material.opacity;
    const fresh = makeLabel(spec.text, spec.color, spec.h, spec.o);
    fresh.position.copy(pos);
    fresh.material.opacity = op;
    parent.remove(spec.spr);
    spec.spr.material.map.dispose();
    spec.spr.material.dispose();
    parent.add(fresh);
    spec.spr = fresh;
  });

  // reassign references
  axisX.group.remove(axisX.group.children.find(c => c.isSprite));
  // simpler: rebuild by clearing and re-adding
  [axisX, axisY, axisZ].forEach((a) => {
    a.group.children.filter(c => c.isSprite).forEach(c => a.group.remove(c));
  });

  const lx = makeLabel('x', '#8fe3ff', 0.66, { fontSize: 84, weight: 300 });
  const ly = makeLabel('y', '#9dffd0', 0.66, { fontSize: 84, weight: 300 });
  const lz = makeLabel('z', '#d3b6ff', 0.66, { fontSize: 84, weight: 300 });
  lx.position.y = HALF + 0.72;
  ly.position.y = HALF + 0.72;
  lz.position.y = HALF + 0.72;
  axisX.group.add(lx);
  axisY.group.add(ly);
  axisZ.group.add(lz);

  // octant labels
  octantLabels.forEach((spr, i) => {
    const o = OCTANTS[i];
    const fresh = makeLabel(o.label, o.color, 0.52, { fontSize: 60, weight: 400, spacing: '0.1em' });
    fresh.position.copy(spr.position);
    fresh.material.opacity = spr.material.opacity;
    fresh.userData.aspect = fresh.scale.x / fresh.scale.y;
    scene.remove(spr);
    spr.material.map.dispose();
    spr.material.dispose();
    scene.add(fresh);
    octantLabels[i] = fresh;
  });
}

boot();
</script>
