<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Octants — The Glass Morphic Space</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:  #e8eef6;
    --dim:  rgba(232,238,246,0.52);
    --faint:rgba(232,238,246,0.26);
    --accent: #8ecbff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; background:#000; }
  body{
    color:var(--ink);
    font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
    position:fixed; inset:0;
  }

  #gl{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    display:block;
    z-index:0;
    touch-action:none;
  }

  #ui{
    position:fixed; inset:0;
    z-index:2;
    pointer-events:none;
    user-select:none;
  }

  .hairline{
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(142,203,255,.22) 25%, rgba(160,130,255,.22) 60%, transparent);
    opacity:.7;
  }

  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: clamp(18px,2.8vw,34px) clamp(22px,4.5vw,64px);
    font-size:10px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--faint);
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    color:rgba(232,238,246,0.7);
    letter-spacing:.34em;
  }
  .brand .mark{
    width:8px; height:8px; border-radius:2px;
    background:linear-gradient(135deg,#8ecbff,#b69bff);
    box-shadow:0 0 12px rgba(142,203,255,.55);
    transform:rotate(45deg);
  }
  .brand .sep{ color:rgba(232,238,246,0.2); letter-spacing:0; }

  .corner{
    position:absolute; width:12px; height:12px;
    border:1px solid rgba(255,255,255,.07);
    pointer-events:none;
  }
  .corner.tl{ top:clamp(18px,2.8vw,34px); left:clamp(22px,4.5vw,64px); border-right:0; border-bottom:0; }
  .corner.br{ bottom:clamp(18px,2.8vw,34px); right:clamp(22px,4.5vw,64px); border-left:0; border-top:0; }

  #chapters{ position:absolute; inset:0; }
  .chapter{
    position:absolute;
    left: clamp(22px,4.5vw,64px);
    bottom: clamp(120px,18vh,180px);
    max-width: min(420px, 42vw);
    opacity:0;
    will-change:opacity, transform;
  }
  .ch-idx{
    font-size:9.5px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(142,203,255,.72);
    margin-bottom:14px;
    display:flex; align-items:center; gap:12px;
  }
  .ch-idx::after{
    content:''; flex:1; height:1px; max-width:56px;
    background:linear-gradient(90deg, rgba(142,203,255,.4), transparent);
  }
  .ch-title{
    font-size: clamp(24px, 3.1vw, 40px);
    font-weight:300;
    letter-spacing:-.025em;
    line-height:1.06;
    margin-bottom:12px;
    background:linear-gradient(180deg,#ffffff 0%, rgba(255,255,255,.55) 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
  }
  .ch-body{
    font-size: clamp(11.5px, 1vw, 13.5px);
    line-height:1.72;
    font-weight:300;
    color:var(--dim);
    letter-spacing:.005em;
  }

  .readout{
    position:absolute;
    right: clamp(22px,4.5vw,64px);
    top: 50%;
    transform: translateY(-50%);
    text-align:right;
    font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    opacity:0;
    will-change:opacity;
  }
  .ro-label{
    font-size:9px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--faint); margin-bottom:6px;
    font-family:'Inter',sans-serif;
  }
  .ro-value{
    font-size: clamp(11px, 1vw, 13px);
    color:rgba(200,224,250,.85);
    letter-spacing:.05em;
    margin-bottom:18px;
  }
  .ro-value.sign{ color:#a8dbff; }

  .dock{
    position:absolute;
    left: 50%;
    bottom: clamp(24px, 4vh, 40px);
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap: 18px;
    pointer-events:auto;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.055);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 40px -12px rgba(0,0,0,0.9);
    min-width: min(560px, 84vw);
  }

  .play-btn{
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: #cfe6ff;
    display:grid; place-items:center;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .play-btn:hover{
    background: rgba(142,203,255,0.12);
    border-color: rgba(142,203,255,0.35);
  }
  .play-btn:active{ transform: scale(0.94); }
  .play-btn svg{ width:12px; height:12px; fill: currentColor; }

  .track-wrap{
    flex: 1 1 auto;
    position: relative;
    height: 26px;
    display:flex; align-items:center;
  }
  .track{
    position: relative;
    width:100%; height:2px;
    background: rgba(255,255,255,0.08);
    border-radius:2px;
    cursor: pointer;
  }
  .fill{
    position:absolute; left:0; top:0; bottom:0;
    width: 0%;
    background: linear-gradient(90deg, rgba(142,203,255,.7), rgba(180,150,255,.7));
    border-radius:2px;
    box-shadow: 0 0 12px rgba(142,203,255,.35);
  }
  .knob{
    position:absolute; top:50%;
    left: 0%;
    width:10px; height:10px;
    margin-left:-5px; margin-top:-5px;
    border-radius:50%;
    background: #cfe6ff;
    box-shadow: 0 0 0 3px rgba(142,203,255,.14), 0 0 16px rgba(142,203,255,.7);
    pointer-events: none;
    transition: transform .2s ease;
  }
  .track-wrap:hover .knob{ transform: scale(1.15); }

  .dots{
    position:absolute; left:0; right:0; top:50%; height:0;
    pointer-events: none;
  }
  .dot{
    position:absolute;
    top:-2px;
    width:4px; height:4px;
    border-radius:50%;
    background: rgba(255,255,255,0.14);
    transform: translate(-50%, 0);
    transition: background .3s ease, box-shadow .3s ease;
  }
  .dot.on{
    background: #cfe6ff;
    box-shadow: 0 0 8px rgba(142,203,255,.9);
  }

  .step-info{
    flex: 0 0 auto;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing:.14em;
    color: rgba(200,224,250,.5);
    min-width: 52px;
    text-align: right;
  }

  .hint{
    position:absolute;
    left: 50%;
    top: clamp(70px, 11vh, 108px);
    transform: translateX(-50%);
    font-size:9.5px; letter-spacing:.32em; text-transform:uppercase;
    color:rgba(232,238,246,.32);
    display:flex; align-items:center; gap:14px;
    transition: opacity .8s ease;
    white-space: nowrap;
  }
  .hint .sep{ width:3px; height:3px; border-radius:50%; background:rgba(232,238,246,.22); }

  #loader{
    position:fixed; inset:0; z-index:50;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.1s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  #loader .lm{
    width:6px;height:6px;border-radius:50%;
    background:#8ecbff;
    box-shadow:0 0 22px 4px rgba(142,203,255,.65);
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(.55); opacity:.3; }
    50%    { transform:scale(1.3); opacity:1; }
  }
  #loader.gone{ opacity:0; }

  @media (max-width: 860px){
    .chapter{ max-width: 84vw; bottom: clamp(120px,22vh,200px); }
    .readout{ display:none; }
    .corner{ display:none; }
    .dock{ gap: 12px; padding: 10px 14px; min-width: 90vw; }
    .step-info{ display:none; }
    .topbar{ font-size:9px; letter-spacing:.26em; }
    .brand{ letter-spacing:.28em; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">
  <div class="hairline"></div>

  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <span>OCTANT<span class="sep"> · </span>ENGINE</span>
    </div>
    <div>Spatial Systems Lab — Vol. III</div>
  </div>

  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="hint" id="hint">
    <span>Drag to orbit</span>
    <span class="sep"></span>
    <span>Scrub to navigate</span>
  </div>

  <div id="chapters"></div>

  <div class="readout" id="readout">
    <div class="ro-label">Position</div>
    <div class="ro-value" id="ro-coords">( 0.00, 0.00, 0.00 )</div>
    <div class="ro-label">Signature</div>
    <div class="ro-value sign" id="ro-sign">( +, +, + )</div>
  </div>

  <div class="dock">
    <button class="play-btn" id="playBtn" aria-label="Play / Pause">
      <svg id="playIcon" viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.4 6 2 1.2z"/></svg>
    </button>

    <div class="track-wrap">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="knob" id="knob"></div>
    </div>

    <div class="step-info" id="stepInfo">01 / 07</div>
  </div>
</div>

<div id="loader"><div class="lm"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x){
  const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1);
  return t * t * (3 - 2 * t);
}

/* ══════════════════════════════════════════════════════════════
   CONSTANTS
   ══════════════════════════════════════════════════════════════ */
const HALF = 5;
const PLANE_SIZE = HALF * 2;

const OCTANTS = [
  { s:[ 1, 1, 1], color:'#7fd8ff', label:'(+, +, +)' },
  { s:[ 1, 1,-1], color:'#8ca2ff', label:'(+, +, −)' },
  { s:[ 1,-1, 1], color:'#b79dff', label:'(+, −, +)' },
  { s:[ 1,-1,-1], color:'#f2a1c9', label:'(+, −, −)' },
  { s:[-1, 1, 1], color:'#62dfae', label:'(−, +, +)' },
  { s:[-1, 1,-1], color:'#b8e17a', label:'(−, +, −)' },
  { s:[-1,-1, 1], color:'#f0c47c', label:'(−, −, +)' },
  { s:[-1,-1,-1], color:'#f0949c', label:'(−, −, −)' }
];

/* ══════════════════════════════════════════════════════════════
   RENDERER · SCENE · CAMERA (Z-UP)
   ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  400
);
camera.up.set(0, 0, 1);
camera.position.set(8.2, -9.5, 7.6);

/* ══════════════════════════════════════════════════════════════
   ORBIT CONTROLS
   ══════════════════════════════════════════════════════════════ */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.68;
controls.zoomSpeed = 0;
controls.enableZoom = false;
controls.enablePan = false;
controls.minPolarAngle = 0.34;
controls.maxPolarAngle = Math.PI - 0.34;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.30;
controls.target.set(0, 0, 0);

let lastInteractionTime = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.addEventListener('end',   () => { lastInteractionTime = performance.now() / 1000; });

/* ══════════════════════════════════════════════════════════════
   POST PROCESSING
   ══════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.20,   // strength — restrained, premium
  0.60,   // radius
  0.68    // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const CAPassDef = {
  uniforms: {
    tDiffuse: { value: null },
    uAmount:  { value: 0.45 },
    uTime:    { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float uAmount;
    uniform float uTime;
    varying vec2 vUv;

    void main(){
      vec2 d  = vUv - 0.5;
      float r2 = dot(d, d);
      vec2 off = d * r2 * uAmount * 0.0050;

      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;

      float vig = smoothstep(1.32, 0.24, length(d) * 1.5);
      col *= mix(0.74, 1.0, vig);

      float g = fract(sin(dot(vUv * (1.0 + fract(uTime)), vec2(12.9898, 78.233))) * 43758.5453);
      col += (g - 0.5) * 0.007;

      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const caPass = new ShaderPass(CAPassDef);
composer.addPass(caPass);

/* ══════════════════════════════════════════════════════════════
   GLOW TEXTURE
   ══════════════════════════════════════════════════════════════ */
function makeGlowTexture(){
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.16, 'rgba(220,240,255,0.62)');
  g.addColorStop(0.40, 'rgba(140,195,255,0.19)');
  g.addColorStop(0.70, 'rgba(75,140,255,0.045)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.minFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  return t;
}
const GLOW_TEX = makeGlowTexture();

/* ══════════════════════════════════════════════════════════════
   PREMIUM GLASS PLANE SHADER
   ══════════════════════════════════════════════════════════════ */
const GLASS_VERT = /* glsl */`
  varying vec2 vUv;
  varying vec3 vWorld;
  varying vec3 vNormalW;

  void main(){
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    vNormalW = mat3(modelMatrix) * normal;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const GLASS_FRAG = /* glsl */`
  precision highp float;

  uniform float uTime;
  uniform float uReveal;
  uniform float uOpacity;
  uniform float uGridOpacity;
  uniform float uGridScale;
  uniform vec3  uTint;

  varying vec2 vUv;
  varying vec3 vWorld;
  varying vec3 vNormalW;

  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  void main(){
    vec3 V = normalize(cameraPosition - vWorld);
    vec3 N = normalize(vNormalW);

    float fres = 1.0 - abs(dot(N, V));
    float d    = length(vUv - 0.5) * 2.0;

    // radial reveal sweep
    float rv = smoothstep(0.0, 0.48, uReveal * 2.4 - d);

    // ─── layered fresnel edges ────────────────────────────────
    float edgeSoft  = pow(fres, 1.5);
    float edgeCrisp = pow(fres, 4.5);

    // chromatic fringe (each channel peaks at slightly different angle)
    float cr = pow(fres, 2.4);
    float cg = pow(fres, 3.1);
    float cb = pow(fres, 4.0);
    vec3 fringe = vec3(cr, cg, cb);

    // ─── dual grid (fine + major hairlines) ───────────────────
    vec2 gc = vUv * uGridScale;
    vec2 gw = fwidth(gc);
    vec2 gf = abs(fract(gc - 0.5) - 0.5) / max(gw, vec2(1e-5));
    float fineGrid = 1.0 - min(min(gf.x, gf.y), 1.0);

    vec2 gcm = vUv * (uGridScale * 0.2);
    vec2 gwm = fwidth(gcm);
    vec2 gfm = abs(fract(gcm - 0.5) - 0.5) / max(gwm, vec2(1e-5));
    float majorGrid = 1.0 - min(min(gfm.x, gfm.y), 1.0);

    // ─── crisp rim at the plane border ────────────────────────
    vec2 bd = min(vUv, 1.0 - vUv);
    float borderRim = 1.0 - smoothstep(0.0018, 0.0042, min(bd.x, bd.y));

    // ─── frosted micro-grain ──────────────────────────────────
    float frost = vnoise(vUv * 190.0) * 0.55
                + vnoise(vUv * 46.0 + uTime * 0.015) * 0.45;

    // ─── compose ──────────────────────────────────────────────
    vec3 col = vec3(0.0);

    // soft base fill — makes the plane gently visible
    col += uTint * 0.028;

    // soft central light pool
    col += uTint * exp(-d * d * 6.0) * 0.085;

    // layered fresnel
    col += uTint * edgeSoft  * 0.26;
    col += uTint * edgeCrisp * 0.55;

    // chromatic rim
    col += uTint       * fringe * 0.72;
    col += vec3(1.0)   * fringe * 0.08;

    // grids
    col += uTint * fineGrid  * uGridOpacity * 0.26;
    col += uTint * majorGrid * uGridOpacity * 0.62;

    // border rim — small white boost
    col += mix(uTint, vec3(1.0), 0.45) * borderRim * 0.24;

    // frost
    col += uTint * frost * 0.018;

    col *= rv * uOpacity;

    gl_FragColor = vec4(col, 1.0);
  }
`;

function createGlassPlane(tint, rotX, rotY){
  const geo = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, 1, 1);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:        { value: 0 },
      uReveal:      { value: 0 },
      uOpacity:     { value: 1 },
      uGridOpacity: { value: 0.55 },
      uGridScale:   { value: 20.0 },
      uTint:        { value: new THREE.Color(tint) }
    },
    vertexShader:   GLASS_VERT,
    fragmentShader: GLASS_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.set(rotX, rotY, 0);
  mesh.renderOrder = 1;
  mesh.frustumCulled = false;
  return mesh;
}

/* Z-up: XY = ground plane, YZ and XZ = vertical sheets */
const planeXY = createGlassPlane(0x5599e6, 0, 0);                 // horizontal
const planeYZ = createGlassPlane(0x8a76dd, 0, Math.PI / 2);       // vertical
const planeXZ = createGlassPlane(0x42c0af, -Math.PI / 2, 0);      // vertical

scene.add(planeXY, planeYZ, planeXZ);

/* ══════════════════════════════════════════════════════════════
   AXES

function createAxis(colorHex){
  const group = new THREE.Group();

  const mat = new THREE.MeshBasicMaterial({
    color: colorHex,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.011, 0.011, PLANE_SIZE, 10, 1, true),
    mat
  );
  rod.renderOrder = 2;

  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.052, 0.22, 18),
    mat
  );
  cone.renderOrder = 2;

  group.add(rod, cone);
  return { group, rod, cone, mat };
}

function makeLabel(text, colorHex, worldHeight, opts = {}){
  const dpr      = 2;
  const fontSize = opts.fontSize || 72;
  const weight   = opts.weight   || 400;
  const spacing  = opts.spacing  || '0.14em';
  const fontStr  = `${weight} ${fontSize}px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif`;

  const meas = document.createElement('canvas').getContext('2d');
  meas.font = fontStr;
  try { meas.letterSpacing = spacing; } catch(e){}
  const textW = meas.measureText(text).width;

  const padX = 64, padY = 44;
  const w = Math.ceil(textW) + padX * 2;
  const h = fontSize + padY * 2;

  const c = document.createElement('canvas');
  c.width  = w * dpr;
  c.height = h * dpr;

  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.font = fontStr;
  try { ctx.letterSpacing = spacing; } catch(e){}
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = colorHex;
  ctx.shadowColor  = colorHex;
  ctx.shadowBlur   = 18;
  ctx.fillText(text, w / 2, h / 2);
  ctx.shadowBlur   = 5;
  ctx.fillText(text, w / 2, h / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace    = THREE.SRGBColorSpace;
  tex.minFilter     = THREE.LinearFilter;
  tex.magFilter     = THREE.LinearFilter;
  tex.generateMipmaps = false;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  });

  const spr = new THREE.Sprite(mat);
  const aspect = w / h;
  spr.scale.set(worldHeight * aspect, worldHeight, 1);
  spr.renderOrder = 20;
  spr.userData.aspect = aspect;
  return spr;
}

/* ══════════════════════════════════════════════════════════════
   NODE CLOUDS (one per octant)
   ══════════════════════════════════════════════════════════════ */
const NODE_VERT = /* glsl */`
  uniform float uTime;
  uniform float uAppear;
  uniform float uSize;
  uniform float uPixelRatio;
  attribute float aSeed;
  varying float vSeed;

  void main(){
    vSeed = aSeed;
    vec3 p = position;
    float s = aSeed * 6.2831;
    p.x += sin(uTime * 0.35 + s)        * 0.055;
    p.y += cos(uTime * 0.31 + s * 1.7)  * 0.055;
    p.z += sin(uTime * 0.27 + s * 2.3)  * 0.055;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    float sz = uSize * uPixelRatio / max(-mv.z, 0.001);
    gl_PointSize = clamp(sz * uAppear, 0.0, 42.0);
  }
`;

const NODE_FRAG = /* glsl */`
  precision highp float;
  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform float uOpacity;
  varying float vSeed;

  void main(){
    vec2 c = gl_PointCoord - 0.5;
    float r = length(c) * 2.0;
    if (r > 1.0) discard;

    float core = pow(1.0 - r, 3.0);
    float halo = pow(1.0 - r, 0.9) * 0.20;

    vec3 col = mix(uColorA, uColorB, vSeed);
    float a  = (core + halo) * uOpacity;
    gl_FragColor = vec4(col * a, 1.0);
  }
`;

const nodeClouds = [];

OCTANTS.forEach((o) => {
  const COUNT = 18;
  const positions = new Float32Array(COUNT * 3);
  const seeds     = new Float32Array(COUNT);

  for (let k = 0; k < COUNT; k++){
    const r     = 1.2 + Math.pow(Math.random(), 0.7) * 2.9;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    let x = r * Math.sin(phi) * Math.cos(theta);
    let y = r * Math.cos(phi);
    let z = r * Math.sin(phi) * Math.sin(theta);

    x = Math.abs(x) * o.s[0];
    y = Math.abs(y) * o.s[1];
    z = Math.abs(z) * o.s[2];

    positions[k * 3 + 0] = x;
    positions[k * 3 + 1] = y;
    positions[k * 3 + 2] = z;
    seeds[k] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));

  const base = new THREE.Color(o.color);
  const alt  = base.clone().lerp(new THREE.Color(0xffffff), 0.5);

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:       { value: 0 },
      uAppear:     { value: 0 },
      uOpacity:    { value: 0 },
      uSize:       { value: 36.0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uColorA:     { value: base },
      uColorB:     { value: alt }
    },
    vertexShader:   NODE_VERT,
    fragmentShader: NODE_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const pts = new THREE.Points(geo, mat);
  pts.renderOrder = 5;
  scene.add(pts);

  nodeClouds.push({
    points: pts,
    mat,
    baseColor: base.clone()
  });
});

/* ── TRAVELER TRAIL — ring buffer of fading particles ─────── */
const TRAIL_LEN = 64;
const trailPosArr = new Float32Array(TRAIL_LEN * 3);
const trailIdxArr = new Float32Array(TRAIL_LEN);
for (let i = 0; i < TRAIL_LEN; i++) trailIdxArr[i] = i;

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPosArr, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('aIndex',   new THREE.BufferAttribute(trailIdxArr, 1));

const trailMat = new THREE.ShaderMaterial({
  uniforms: {
    uHead:       { value: 0 },
    uTrailLen:   { value: TRAIL_LEN },
    uOpacity:    { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uColor:      { value: new THREE.Color(0xbde2ff) }
  },
  vertexShader: /* glsl */`
    uniform float uHead;
    uniform float uTrailLen;
    uniform float uPixelRatio;
    attribute float aIndex;
    varying float vAge;

    void main(){
      float raw = mod(aIndex - uHead + uTrailLen, uTrailLen);
      float age = raw / uTrailLen;      // 0 = newest, 1 = oldest
      vAge = age;

      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      float sz = (1.0 - age) * 22.0 * uPixelRatio / max(-mv.z, 0.001);
      gl_PointSize = clamp(sz, 0.0, 22.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec3  uColor;
    uniform float uOpacity;
    varying float vAge;

    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = length(c) * 2.0;
      if (r > 1.0) discard;

      float fade = pow(1.0 - vAge, 2.2);
      float a = pow(1.0 - r, 2.6) * fade * uOpacity;
      gl_FragColor = vec4(uColor * a, 1.0);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const UP = new THREE.Vector3(0, 1, 0);
const _vA = new THREE.Vector3();
const _vB = new THREE.Vector3();
const _dir = new THREE.Vector3();

function orientSegment(mesh, a, b){
  _dir.subVectors(b, a);
  const len = _dir.length();
  mesh.position.copy(a).addScaledVector(_dir, 0.5);
  if (len > 1e-5){
    mesh.quaternion.setFromUnitVectors(UP, _dir.clone().normalize());
  }
  mesh.scale.set(1, Math.max(len, 1e-4), 1);
}

/* ══════════════════════════════════════════════════════════════
   VOID DUST
   ══════════════════════════════════════════════════════════════ */
const DUST_COUNT = 520;
const dustPos  = new Float32Array(DUST_COUNT * 3);
const dustSeed = new Float32Array(DUST_COUNT);

for (let i = 0; i < DUST_COUNT; i++){
  const r     = 10 + Math.random() * 44;
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  dustPos[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
  dustPos[i*3+1] = r * Math.cos(phi);
  dustPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  dustSeed[i]    = Math.random();
}

const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('aSeed',    new THREE.BufferAttribute(dustSeed, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:       { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() }
  },
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPixelRatio;
    attribute float aSeed;
    varying float vTwinkle;

    void main(){
      vec3 p = position;
      float s = aSeed * 6.2831;
      p.x += sin(uTime * 0.06 + s) * 0.8;
      p.y += cos(uTime * 0.05 + s * 1.3) * 0.8;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;

      float sz = (0.8 + aSeed * 1.3) * uPixelRatio * (22.0 / max(-mv.z, 0.001));
      gl_PointSize = clamp(sz, 0.4, 5.0);

      vTwinkle = 0.10 + 0.22 * (0.5 + 0.5 * sin(uTime * 0.5 + aSeed * 42.0));
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying float vTwinkle;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = length(c) * 2.0;
      if (r > 1.0) discard;
      float a = pow(1.0 - r, 2.2) * vTwinkle;
      gl_FragColor = vec4(vec3(0.72, 0.84, 1.0) * a, 1.0);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const PAUSE_SVG = 'M2.4 1.2v9.6h2.6V1.2H2.4zm4.6 0v9.6h2.6V1.2H7z';

function setPlaying(v){
  isPlaying = v;

  e.stopPropagation();

});

let scrubbing = false;

function progressFromEvent(clientX){
  const rect = trackEl.getBoundingClientRect();
  const x = clamp(clientX - rect.left, 0, rect.width);
  return x / rect.width;
}

function setProgressFromScrub(clientX){
  const p = progressFromEvent(clientX);
  autoProgress = p;
  autoDirection = 1;
  autoHold = 0.6;
  displayProgress = p;
  manualScrubUntil = performance.now() / 1000 + 0.6;
  updateDockUI(p);
  applyProgress(p, time, 0);
}

trackEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  scrubbing = true;
  trackEl.setPointerCapture(e.pointerId);
  setPlaying(false);
  setProgressFromScrub(e.clientX);
});

trackEl.addEventListener('pointermove', (e) => {
  if (!scrubbing) return;
  setProgressFromScrub(e.clientX);
});

trackEl.addEventListener('pointerup', (e) => {
  if (!scrubbing) return;
  scrubbing = false;
  try { trackEl.releasePointerCapture(e.pointerId); } catch(err){}
});

trackEl.addEventListener('pointercancel', () => { scrubbing = false; });

/* ══════════════════════════════════════════════════════════════
   UI UPDATER
   ══════════════════════════════════════════════════════════════ */
let lastActiveChapter = -1;

function updateDockUI(p){
  fillEl.style.width = (p * 100).toFixed(3) + '%';
  knobEl.style.left  = (p * 100).toFixed(3) + '%';

  let active = 0;
  for (let i = 0; i < CHAPTERS.length; i++){
    if (p >= CHAPTERS[i].a) active = i;
  }
  if (active !== lastActiveChapter){
    lastActiveChapter = active;
    chapterDots.forEach((d, i) => d.classList.toggle('on', i === active));
    stepInfo.textContent = String(active + 1).padStart(2, '0') + ' / ' + String(CHAPTERS.length).padStart(2, '0');
  }
}

function updateChapterText(p){
  for (let i = 0; i < CHAPTERS.length; i++){
    const c = CHAPTERS[i];
    const fade = 0.045;
    const a = smoothstep(c.a, c.a + fade, p) * (1 - smoothstep(c.b - fade, c.b, p));
    const el = chapterEls[i];
    el.style.opacity = a.toFixed(3);
    el.style.transform = `translateY(${((1 - a) * 14).toFixed(2)}px)`;
  }
}

function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);

  composer.setSize(w, h);
  bloom.setSize(w, h);

  const pr = renderer.getPixelRatio();
  dustMat.uniforms.uPixelRatio.value  = pr;
  trailMat.uniforms.uPixelRatio.value = pr;
  nodeClouds.forEach((c) => { c.mat.uniforms.uPixelRatio.value = pr; });
}
window.addEventListener('resize', onResize);

/* ══════════════════════════════════════════════════════════════
   APPLY PROGRESS TO SCENE
   ══════════════════════════════════════════════════════════════ */
const _weights = new Float32Array(8);

function applyProgress(p, time, dt){
  /* ---- glass planes ---- */
  const revXY = smoothstep(0.125, 0.300, p);
  const revYZ = smoothstep(0.265, 0.440, p);
  const revXZ = smoothstep(0.405, 0.580, p);
  const planeDim = 1.0 - 0.35 * smoothstep(0.62, 0.94, p);

  planeXY.material.uniforms.uReveal.value  = revXY;
  planeYZ.material.uniforms.uReveal.value  = revYZ;
  planeXZ.material.uniforms.uReveal.value  = revXZ;

  planeXY.material.uniforms.uOpacity.value = planeDim;
  planeYZ.material.uniforms.uOpacity.value = planeDim;
  planeXZ.material.uniforms.uOpacity.value = planeDim;

  planeXY.material.uniforms.uTime.value = time;
  planeYZ.material.uniforms.uTime.value = time;
  planeXZ.material.uniforms.uTime.value = time;

  /* ---- axes ---- */
  const axisRev  = smoothstep(0.02, 0.185, p);
  const axisFade = 1.0 - 0.18 * smoothstep(0.65, 0.95, p);

  [axisX, axisY, axisZ].forEach((a) => {
    const r = Math.max(axisRev, 1e-4);
    a.rod.scale.y = r;
    a.cone.scale.setScalar(r);
    a.cone.position.y = (HALF + 0.11) * axisRev;
    a.mat.opacity = 0.72 * axisFade;
  });

  if (axisLabelX){
    const op = smoothstep(0.10, 0.22, p) * axisFade * 0.88;
    const ly = (HALF + 0.68) * Math.max(axisRev, 1e-4);
    axisLabelX.position.y = ly;
    axisLabelY.position.y = ly;
    axisLabelZ.position.y = ly;
    axisLabelX.material.opacity = op;
    axisLabelY.material.opacity = op;
    axisLabelZ.material.opacity = op;
  }

  /* ---- origin ---- */
  const originIn = smoothstep(0.0, 0.08, p);
  const originPulse = 1 + 0.12 * Math.sin(time * 1.5);
  originCore.material.opacity = originIn * (0.88 + 0.10 * Math.sin(time * 2.0));
  originGlow.material.opacity = originIn * (0.38 + 0.12 * Math.sin(time * 1.5));
  originGlow.scale.setScalar(1.8 * originPulse * lerp(0.55, 1.0, originIn));

  if (originLabel){
    originLabel.material.opacity = smoothstep(0.05, 0.16, p) * (1 - smoothstep(0.62, 0.82, p)) * 0.72;
  }

  /* ---- traveler position (continuous Lissajous) ---- */
  const tx = 3.55 * Math.sin(0.215 * 4 * time);
  const ty = 3.05 * Math.sin(0.215 * 6 * time + 1.0);
  const tz = 3.30 * Math.sin(0.215 * 3 * time + 2.0);
  const tv = smoothstep(0.715, 0.855, p);

  travelerGroup.position.set(tx, ty, tz);
  travelerCore.material.opacity = tv;
  travelerGlow.material.opacity = tv * (0.58 + 0.15 * Math.sin(time * 3.0));
  travelerGlow.scale.setScalar(1.15 + 0.12 * Math.sin(time * 2.3));

  /* ---- trail ---- */
  if (tv > 0.01){
    if (!trailInitialized){
      for (let i = 0; i < TRAIL_LEN; i++){
        trailPosArr[i*3+0] = tx;
        trailPosArr[i*3+1] = ty;
        trailPosArr[i*3+2] = tz;
      }
      trailInitialized = true;
    }
    trailHead = (trailHead + 1) % TRAIL_LEN;
    const h = trailHead * 3;
    trailPosArr[h+0] = tx;
    trailPosArr[h+1] = ty;
    trailPosArr[h+2] = tz;
    trailGeo.attributes.position.needsUpdate = true;
    trailMat.uniforms.uHead.value = trailHead;
  }
  trailMat.uniforms.uOpacity.value = tv * 0.85;

  /* ---- guide staircase ---- */
  _vA.set(0, 0, 0);      _vB.set(tx, 0, 0);   orientSegment(guideSegs[0], _vA, _vB);
  _vA.set(tx, 0, 0);     _vB.set(tx, ty, 0);  orientSegment(guideSegs[1], _vA, _vB);
  _vA.set(tx, ty, 0);    _vB.set(tx, ty, tz); orientSegment(guideSegs[2], _vA, _vB);
  guideMat.opacity = tv * 0.34;

  /* ---- projection dots ---- */
  projDots[0].position.set(tx, ty, 0);
  projDots[1].position.set(0, ty, tz);
  projDots[2].position.set(tx, 0, tz);
  projMat.opacity = tv * 0.58;

  /* ---- octant weights ---- */
  const k = 0.62;
  for (let i = 0; i < 8; i++){
    const s = OCTANTS[i].s;
    const wx = 0.5 + 0.5 * s[0] * Math.tanh(tx / k);
    const wy = 0.5 + 0.5 * s[1] * Math.tanh(ty / k);
    const wz = 0.5 + 0.5 * s[2] * Math.tanh(tz / k);
    _weights[i] = wx * wy * wz;
  }

  /* ---- octant labels ---- */
  for (let i = 0; i < 8; i++){
    const spr = octantLabels[i];
    if (!spr) continue;

    const appear = smoothstep(0.545 + i * 0.012, 0.545 + i * 0.012 + 0.11, p);
    const w = _weights[i];
    const focus = lerp(0.13, 0.13 + 1.65 * w, tv);
    const opacity = appear * (0.26 + focus * 0.72);

    spr.material.opacity = clamp(opacity, 0, 0.95);

    const sc = 0.46 * (1 + 0.26 * w * tv) * lerp(0.82, 1.0, appear);
    spr.scale.set(sc * spr.userData.aspect, sc, 1);
  }

  /* ---- node clouds ---- */
  for (let i = 0; i < 8; i++){
    const cloud = nodeClouds[i];
    const appear = smoothstep(0.60 + i * 0.015, 0.60 + i * 0.015 + 0.15, p);
    const w = _weights[i];

    cloud.mat.uniforms.uAppear.value  = appear * (0.55 + 0.55 * w * tv + 0.4 * (1 - tv));
    cloud.mat.uniforms.uOpacity.value = appear * (0.42 + 0.72 * w * tv);
    cloud.mat.uniforms.uTime.value    = time;

    const pulse = 1 + 0.28 * w * tv;
    cloud.mat.uniforms.uColorA.value.copy(cloud.baseColor).multiplyScalar(pulse);
  }

  /* ---- readout & hint ---- */
  const fmt = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const sgn = (v) => (v >= 0 ? '+' : '−');

  roCoords.textContent = `( ${fmt(tx)}, ${fmt(ty)}, ${fmt(tz)} )`;
  roSign.textContent   = `( ${sgn(tx)}, ${sgn(ty)}, ${sgn(tz)} )`;
  readoutEl.style.opacity = tv.toFixed(3);

  const el6 = chapterEls[5];
  const title6 = el6.querySelector('.ch-title');
  if (title6) title6.textContent = `( ${sgn(tx)}, ${sgn(ty)}, ${sgn(tz)} )`;

  const op = smoothstep(0.05, 0.12, p) * (1 - smoothstep(0.55, 0.75, p));
  hintEl.style.opacity = (op * 0.7).toFixed(3);
}

/* ══════════════════════════════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let time = 0;
let lastTime = performance.now() / 1000;

function tick(){
  const now = performance.now() / 1000;
  const dt  = Math.min(now - lastTime, 0.05);
  lastTime  = now;
  time     += dt;

  const nowSec = performance.now() / 1000;
  const inManualWindow = nowSec < manualScrubUntil;

  if (isPlaying && !inManualWindow && !scrubbing){
    if (autoHold > 0){
      autoHold -= dt;
    } else {
      autoProgress += dt * 0.014 * autoDirection;
      if (autoProgress >= 1){
        autoProgress = 1;
        autoDirection = -1;
        autoHold = 3.5;
      } else if (autoProgress <= 0){
        autoProgress = 0;
        autoDirection = 1;
        autoHold = 2.0;
      }
    }
  }

  if (!scrubbing){
    const dmp = 1 - Math.pow(0.03, dt);
    displayProgress += (autoProgress - displayProgress) * dmp;
  } else {
    displayProgress = autoProgress;
  }

  const p = clamp(displayProgress, 0, 1);

  applyProgress(p, time, dt);

  updateChapterText(p);
  if (!scrubbing) updateDockUI(p);

  dustMat.uniforms.uTime.value = time;
  dust.rotation.z = time * 0.008;

  if (!controls.autoRotate && nowSec - lastInteractionTime > 3.2){
    controls.autoRotate = true;
  }
  controls.update();

  caPass.uniforms.uTime.value = time;

  composer.render();
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  try {
    await Promise.race([
      document.fonts.ready,
      new Promise(r => setTimeout(r, 1200))
    ]);
  } catch(e){}

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  buildLabels();
  onResize();

  updateDockUI(0);

  const loader = document.getElementById('loader');
  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 1400);

  renderer.setAnimationLoop(tick);
}

boot();
</script>
