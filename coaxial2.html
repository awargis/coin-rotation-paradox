<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interactive Coaxial System of Circles - JEE Advanced (Enhanced)</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0KOVEMeaMurLxyxbCCDYg8N4eAS3IMdkBII2fG1/ocAChl+fFLzYw" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary-glow: #FFD700;
            --radical-axis: #00FFFF;
            --centers-color: #FFA500;
            --tangent-color: #FFFFFF;
            --family-color: #FF69B4;
            --limiting-color: #00FF00;
            --ui-bg: rgba(25, 25, 35, 0.85);
            --font-color: #E0E0E0;
            --slider-track: #444;
            --slider-thumb: var(--primary-glow);
        }
        html,body { height:100%; margin:0; background:#050210; color:var(--font-color); font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
        #scene-container { position:fixed; inset:0; overflow:hidden; }
        #ui-container {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            background:var(--ui-bg); backdrop-filter: blur(8px);
            border-radius:12px; padding:12px 18px; display:flex; gap:14px; align-items:center; z-index:12;
            box-shadow:0 10px 30px rgba(0,0,0,0.4); max-width:92vw; flex-wrap:wrap;
        }
        .control-group { display:flex; flex-direction:column; gap:6px; font-size:12px; color:rgba(255,255,255,0.8); }
        input[type="range"] { width:130px; height:4px; background:var(--slider-track); border-radius:2px; -webkit-appearance:none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--slider-thumb); border:2px solid #111; }
        .toggle-switch { position:relative; width:40px; height:20px; }
        .toggle-switch input { display:none; }
        .slider { position:absolute; inset:0; border-radius:20px; background:var(--slider-track); }
        .slider:before { content:""; position:absolute; left:3px; bottom:3px; width:14px; height:14px; background:#fff; border-radius:50%; transition:0.25s; }
        input:checked + .slider { background:var(--radical-axis); }
        input:checked + .slider:before { transform:translateX(20px); }
        button { background:var(--primary-glow); color:#000; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:600; }
        #title-overlay { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:5vw; color:rgba(255,255,215,0.92); text-shadow:0 0 15px var(--primary-glow); z-index:20; pointer-events:none; opacity:0; transition:opacity 1s; }
        #annotation-overlay { position:fixed; top:10%; left:50%; transform:translateX(-50%); font-size:1.2rem; color:#fff; z-index:20; pointer-events:none; opacity:0; transition:opacity .5s; max-width:80%; text-align:center; }
        #math-overlay { position:fixed; left:20px; top:20px; background:var(--ui-bg); padding:12px; border-radius:8px; backdrop-filter: blur(8px); z-index:20; opacity:0; transition:opacity .25s; max-width:420px; }
        #step-buttons { position:fixed; right:20px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:18; }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <div id="title-overlay">Coaxial System of Circles</div>
    <div id="annotation-overlay"></div>
    <div id="math-overlay"></div>

    <div id="ui-container">
        <div class="control-group"><label>Radius A</label><input id="radiusA" type="range" min="0.5" max="6" step="0.1" value="2.5"></div>
        <div class="control-group"><label>Radius B</label><input id="radiusB" type="range" min="0.5" max="6" step="0.1" value="2.0"></div>
        <div class="control-group"><label>λ (Family)</label><input id="lambdaSlider" type="range" min="-5" max="5" step="0.1" value="0"></div>

        <div class="control-group"><label>Radical Axis</label>
            <label class="toggle-switch"><input id="radical-axis-toggle" type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="control-group"><label>Show Family</label>
            <label class="toggle-switch"><input id="family-toggle" type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="control-group"><label>Tangents</label>
            <label class="toggle-switch"><input id="tangents-toggle" type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="control-group"><label>Show Math</label>
            <label class="toggle-switch"><input id="math-toggle" type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="control-group"><label>High Quality</label>
            <label class="toggle-switch"><input id="quality-toggle" type="checkbox" checked><span class="slider"></span></label>
        </div>

        <button id="animateFamily">Animate Family</button>
        <button id="showRadicalCenter">Show Radical Center</button>
    </div>

    <div id="step-buttons">
        <button id="prev-step">← Prev</button>
        <button id="next-step">Next →</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

    // --- simple shaders (rim glow & dashed) ---
    const RimGlowVertexShader = `
        varying vec3 vNormal; varying vec3 vViewPosition;
        void main(){
            vec4 mvPosition = modelViewMatrix * vec4(position,1.0);
            vViewPosition = -mvPosition.xyz;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * mvPosition;
        }`;
    const RimGlowFragmentShader = `
        uniform vec3 uColor; uniform float uRimPower;
        varying vec3 vNormal; varying vec3 vViewPosition;
        void main(){
            vec3 viewDir = normalize(vViewPosition);
            float rim = 1.0 - dot(viewDir, vNormal);
            float rimAmount = smoothstep(0.0,1.0,pow(rim, uRimPower));
            gl_FragColor = vec4(uColor * rimAmount, rimAmount);
        }`;

    // --- scene, camera, renderer
    let scene, camera, renderer, composer, controls;
    let circleA, circleB, centerA, centerB, radicalAxisLine;
    let familyCircles = [], tangentLines = [], limitingPoints = [];
    let thirdCircle = null, radicalCenter = null;
    let isDragging=false, draggedObject=null, raycaster, pointer, plane;
    const qualitySettings = { high:true };
    const params = { lambda:0 };

    const circleData = {
        A: { center: new THREE.Vector3(-3, 0, 0), radius: 2.5 },
        B: { center: new THREE.Vector3(3, 0, 0), radius: 2.0 }
    };

    // colors from CSS variables
    function cssColor(name){ return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name) || '#fff'); }
    const COLORS = {
        circle: cssColor('--primary-glow'),
        family: cssColor('--family-color'),
        radicalAxis: cssColor('--radical-axis'),
        center: cssColor('--centers-color'),
        limiting: cssColor('--limiting-color'),
        tangent: cssColor('--tangent-color')
    };

    const steps = [
        { title: "Introduction", annotation: "Coaxial circles share a common radical axis. Drag centers or adjust radii to see it update in real-time." },
        { title: "Radical Axis", annotation: "The radical axis is locus of points with equal power w.r.t. both circles: S₁ - S₂ = 0." },
        { title: "Intersecting Family", annotation: "Circles passing through two fixed limiting points form an intersecting coaxial system.", action: ()=>setupIntersectingFamily() },
        { title: "Non-Intersecting Family", annotation: "Use λ slider for family: S₁ + λ S₂ = 0", action: ()=>setupNonIntersectingFamily() },
        { title: "Common Tangents", annotation: "External and internal common tangents of the two circles.", action: ()=>showTangents(true) },
        { title: "Radical Center", annotation: "Intersection of radical axes of three circles; equal power to all three.", action: ()=>showRadicalCenter(true) }
    ];
    let currentStep = 0;

    // ---------- init ----------
    function init(){
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050210);
        camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
        camera.position.set(0,0,20);
        renderer = new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(devicePixelRatio);
        document.getElementById('scene-container').appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.08;

        // post processing
        const renderPass = new RenderPass(scene, camera);
        const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.2, 0.4, 0.85);
        const film = new FilmPass(0.12, 0.025, 648, false);
        composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloom);
        composer.addPass(film);

        // lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.12));
        const dir = new THREE.DirectionalLight(0xffffff, 0.6);
        dir.position.set(5,8,6); scene.add(dir);

        // ray + plane for dragging
        raycaster = new THREE.Raycaster(); pointer = new THREE.Vector2();
        plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);

        createCircles();
        createRadicalAxis();
        createLimitingPoints();

        setupUI();
        setupSteps();

        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup', onPointerUp);

        cinematicIntro();
        updateAnnotation();
        animate();
    }

    // ---------- objects ----------
    function createCircles(){
        // torus for circle ring
        const torus = new THREE.TorusGeometry(1, 0.05, 16, 200);
        const centerGeo = new THREE.SphereGeometry(0.14, 16, 16);

        const circleMat = new THREE.ShaderMaterial({
            uniforms: { uColor:{ value: COLORS.circle }, uRimPower:{ value: 3.0 } },
            vertexShader: RimGlowVertexShader, fragmentShader: RimGlowFragmentShader,
            transparent:true, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
        });

        const centerMat = new THREE.MeshStandardMaterial({ color: COLORS.center, emissive: COLORS.center, emissiveIntensity: 0.7 });

        circleA = new THREE.Mesh(torus, circleMat.clone());
        circleA.scale.setScalar(circleData.A.radius);
        circleA.position.copy(circleData.A.center);
        scene.add(circleA);

        centerA = new THREE.Mesh(centerGeo, centerMat.clone());
        centerA.position.copy(circleData.A.center);
        centerA.name = 'centerA';
        scene.add(centerA);

        circleB = new THREE.Mesh(torus, circleMat.clone());
        circleB.scale.setScalar(circleData.B.radius);
        circleB.position.copy(circleData.B.center);
        scene.add(circleB);

        centerB = new THREE.Mesh(centerGeo, centerMat.clone());
        centerB.position.copy(circleData.B.center);
        centerB.name = 'centerB';
        scene.add(centerB);
    }

    // create family circle from S1 + λ S2 = 0
    // careful: standard circle eqn: x^2 + y^2 + 2g x + 2f y + c = 0, center = (-g,-f)
    function createFamilyCircle(lambda){
        // circle A: center (x1,y1), radius r1 -> coefficients: 2g1 = -2*x1 => g1 = -x1
        const x1 = circleData.A.center.x, y1 = circleData.A.center.y, r1 = circleData.A.radius;
        const x2 = circleData.B.center.x, y2 = circleData.B.center.y, r2 = circleData.B.radius;

        const g1 = -x1, f1 = -y1, c1 = x1*x1 + y1*y1 - r1*r1;
        const g2 = -x2, f2 = -y2, c2 = x2*x2 + y2*y2 - r2*r2;

        // linear combination S1 + λ S2 = 0 yields coefficients proportional to (g1 + λ g2), etc.
        const denom = (1 + lambda);
        if (Math.abs(denom) < 1e-8) return null; // degeneracy (infinite) - avoid
        const g = (g1 + lambda * g2) / denom;
        const f = (f1 + lambda * f2) / denom;
        const c = (c1 + lambda * c2) / denom;

        // center = (-g, -f), radius = sqrt(g^2 + f^2 - c)
        const radSq = g*g + f*f - c;
        if (radSq <= 1e-8) return null;
        const radius = Math.sqrt(Math.max(0, radSq));

        const torus = new THREE.TorusGeometry(1, 0.04, 12, 200);
        const mat = new THREE.ShaderMaterial({
            uniforms: { uColor:{ value: COLORS.family }, uRimPower:{ value: 3.0 } },
            vertexShader: RimGlowVertexShader, fragmentShader: RimGlowFragmentShader,
            transparent:true, blending:THREE.AdditiveBlending
        });
        const circ = new THREE.Mesh(torus, mat);
        circ.scale.setScalar(radius);
        circ.position.set(-g, -f, 0); // center is (-g,-f)
        return circ;
    }

    function updateFamily(){
        familyCircles.forEach(c=>scene.remove(c));
        familyCircles = [];
        if (!document.getElementById('family-toggle').checked) return;
        const num = 6;
        for (let i=0;i<num;i++){
            const offset = (i - (num-1)/2) * 0.8;
            const lambda = params.lambda + offset;
            const c = createFamilyCircle(lambda);
            if (c){ scene.add(c); familyCircles.push(c); }
        }
    }

    // limiting points: intersection points of circle A and B (if they intersect)
    function createLimitingPoints(){
        limitingPoints.forEach(p=>scene.remove(p));
        limitingPoints = [];

        const x1 = circleData.A.center.x, y1 = circleData.A.center.y, r1 = circleData.A.radius;
        const x2 = circleData.B.center.x, y2 = circleData.B.center.y, r2 = circleData.B.radius;
        const dx = x2-x1, dy = y2-y1;
        const d = Math.hypot(dx,dy);

        if (d < 1e-8) return; // coincident centers - skip
        if (d > r1 + r2 + 1e-8) return; // separate
        if (d < Math.abs(r1 - r2) - 1e-8) return; // contained

        // compute intersection points
        const a = (r1*r1 - r2*r2 + d*d) / (2*d);
        const h = Math.sqrt(Math.max(0, r1*r1 - a*a));
        const xm = x1 + a * (dx) / d;
        const ym = y1 + a * (dy) / d;
        const rx = -dy * (h/d);
        const ry = dx * (h/d);

        const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), new THREE.MeshBasicMaterial({ color: COLORS.limiting }));
        p1.position.set(xm + rx, ym + ry, 0); scene.add(p1); limitingPoints.push(p1);
        const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), new THREE.MeshBasicMaterial({ color: COLORS.limiting }));
        p2.position.set(xm - rx, ym - ry, 0); scene.add(p2); limitingPoints.push(p2);
    }

    // radical axis as line: from equation A x + B y + C = 0, where
    // A = 2(x2 - x1), B = 2(y2 - y1), C = (x1^2+y1^2-r1^2) - (x2^2+y2^2-r2^2)
    function createRadicalAxis(){
        const material = new THREE.LineBasicMaterial({ color: COLORS.radicalAxis, linewidth: 2 });
        const geom = new THREE.BufferGeometry();
        geom.setFromPoints([new THREE.Vector3(-10,0,0), new THREE.Vector3(10,0,0)]);
        radicalAxisLine = new THREE.Line(geom, material);
        scene.add(radicalAxisLine);
        updateRadicalAxis();
    }

    function updateRadicalAxis(){
        const x1 = circleData.A.center.x, y1 = circleData.A.center.y, r1 = circleData.A.radius;
        const x2 = circleData.B.center.x, y2 = circleData.B.center.y, r2 = circleData.B.radius;

        const A = 2*(x2 - x1);
        const B = 2*(y2 - y1);
        const C = (x1*x1 + y1*y1 - r1*r1) - (x2*x2 + y2*y2 - r2*r2);

        // if both A and B zero, hide line
        if (Math.abs(A) < 1e-9 && Math.abs(B) < 1e-9){
            radicalAxisLine.visible = false;
            return;
        }
        const L = 30;
        let p1, p2;
        if (Math.abs(B) > Math.abs(A)){
            const xL = -L, xR = L;
            const yL = (-C - A*xL)/B;
            const yR = (-C - A*xR)/B;
            p1 = new THREE.Vector3(xL, yL, 0); p2 = new THREE.Vector3(xR, yR, 0);
        } else {
            const yL = -L, yR = L;
            const xL = (-C - B*yL)/A;
            const xR = (-C - B*yR)/A;
            p1 = new THREE.Vector3(xL, yL, 0); p2 = new THREE.Vector3(xR, yR, 0);
        }
        radicalAxisLine.geometry.setFromPoints([p1,p2]);
        radicalAxisLine.visible = document.getElementById('radical-axis-toggle').checked;
        if (document.getElementById('math-toggle').checked) updateMathOverlay();
    }

    // ---------- Tangents ----------
    // Using known computational geometry formula to compute up to 4 common tangents.
    // Returns array of {p1,p2} where p1 is point on circle A, p2 on circle B.
    function computeCommonTangents(Acenter, r1, Bcenter, r2){
        const x1 = Acenter.x, y1 = Acenter.y, x2 = Bcenter.x, y2 = Bcenter.y;
        const dx = x2 - x1, dy = y2 - y1;
        const d2 = dx*dx + dy*dy;
        const d = Math.sqrt(d2);
        const results = [];
        if (d < 1e-9) return results;

        for (let sign of [1, -1]) {
            // for sign = 1 -> external tangents (r2 - r1)
            // for sign = -1 -> internal tangents (r2 + r1)
            const r = r2 * sign - r1;
            const rAbs = Math.abs(r);
            if (d < rAbs - 1e-9) continue; // no solution
            // compute base angle and angle offset
            const base = Math.atan2(dy, dx);
            const phi = Math.acos(Math.max(-1, Math.min(1, r / d)));
            for (let s of [1, -1]) {
                const ang = base + s * phi;
                // direction vector (unit)
                const ux = Math.cos(ang), uy = Math.sin(ang);
                // tangent point on circle A:
                const ta_x = x1 + r1 * ( -uy );
                const ta_y = y1 + r1 * ( ux );
                // tangent point on circle B:
                const tb_x = x2 + sign * r2 * ( -uy );
                const tb_y = y2 + sign * r2 * ( ux );
                // However the above rotates by 90 deg; better compute full vector using geometry:
                // Instead use closed-form formula (derived from similar triangles) below:
                const h = Math.sqrt(Math.max(0, d2 - r*r));
                // direction vector for the tangent line
                const vx = (dx * r + -sign * dy * h) / d2;
                const vy = (dy * r + sign * dx * h) / d2;
                // points on circles (alternative formula)
                const pA_x = x1 + r1 * vx;
                const pA_y = y1 + r1 * vy;
                const pB_x = x2 + sign * r2 * vx;
                const pB_y = y2 + sign * r2 * vy;
                results.push({ p1: new THREE.Vector3(pA_x, pA_y, 0), p2: new THREE.Vector3(pB_x, pB_y, 0) });
            }
        }
        return results;
    }

    function showTangents(visible){
        tangentLines.forEach(l=>scene.remove(l)); tangentLines = [];
        if (!visible) return;

        const tangs = computeCommonTangents(circleData.A.center, circleData.A.radius, circleData.B.center, circleData.B.radius);
        for (const t of tangs){
            // draw long line passing through p1->p2
            const dir = new THREE.Vector3().subVectors(t.p2, t.p1).normalize();
            const mid = new THREE.Vector3().addVectors(t.p1, t.p2).multiplyScalar(0.5);
            const L = 50;
            const s = new THREE.Vector3().addVectors(mid, dir.clone().multiplyScalar(L));
            const e = new THREE.Vector3().addVectors(mid, dir.clone().multiplyScalar(-L));
            const geo = new THREE.BufferGeometry().setFromPoints([s,e]);
            const mat = new THREE.LineDashedMaterial({ color: COLORS.tangent, dashSize: 0.6, gapSize: 0.3 });
            const ln = new THREE.Line(geo, mat);
            ln.computeLineDistances();
            scene.add(ln); tangentLines.push(ln);
        }
    }

    // ---------- Radical center ----------
    // For three circles compute intersection point of radical axes (AB) and (AC)
    function computeRadicalCenter(circle1, circle2, circle3){
        // each radical axis is linear: A x + B y + C = 0 (from updateRadicalAxis formula)
        function axisCoeffs(c1, c2){
            const x1=c1.center.x, y1=c1.center.y, r1=c1.radius;
            const x2=c2.center.x, y2=c2.center.y, r2=c2.radius;
            const A = 2*(x2 - x1), B = 2*(y2 - y1);
            const C = (x1*x1 + y1*y1 - r1*r1) - (x2*x2 + y2*y2 - r2*r2);
            return {A,B,C};
        }
        const ab = axisCoeffs(circle1, circle2);
        const ac = axisCoeffs(circle1, circle3);
        const D = ab.A * ac.B - ac.A * ab.B;
        if (Math.abs(D) < 1e-9) return null; // parallel or coincident axes
        const x = (ab.B * ac.C - ac.B * ab.C) / D;
        const y = (ac.A * ab.C - ab.A * ac.C) / D;
        return new THREE.Vector3(x, y, 0);
    }

    function showRadicalCenter(visible){
        if (!visible){
            if (thirdCircle) { scene.remove(thirdCircle); thirdCircle = null; }
            if (radicalCenter) { scene.remove(radicalCenter); radicalCenter = null; }
            return;
        }
        // ensure third circle exists at a sensible location
        if (!thirdCircle){
            const tor = new THREE.TorusGeometry(1,0.04,12,200);
            const mat = new THREE.ShaderMaterial({ uniforms:{uColor:{value:new THREE.Color(0xff00ff)}, uRimPower:{value:3.0}},
                vertexShader:RimGlowVertexShader, fragmentShader:RimGlowFragmentShader, transparent:true, blending:THREE.AdditiveBlending });
            thirdCircle = new THREE.Mesh(tor, mat);
            thirdCircle.scale.setScalar(1.6);
            thirdCircle.position.set(0, 4, 0);
            scene.add(thirdCircle);
        }
        // compute radical center between the (A,B) and (A,third)
        const c1 = { center: circleData.A.center.clone(), radius: circleData.A.radius };
        const c2 = { center: circleData.B.center.clone(), radius: circleData.B.radius };
        const c3 = { center: thirdCircle.position.clone(), radius: thirdCircle.scale.x };
        const pt = computeRadicalCenter(c1, c2, c3);
        if (pt){
            if (!radicalCenter){
                radicalCenter = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
                scene.add(radicalCenter);
            }
            radicalCenter.position.copy(pt);
        }
    }

    // ---------- update and UI ----------
    function updateCircles(){
        circleA.scale.setScalar(circleData.A.radius);
        circleA.position.copy(circleData.A.center);
        centerA.position.copy(circleData.A.center);
        circleB.scale.setScalar(circleData.B.radius);
        circleB.position.copy(circleData.B.center);
        centerB.position.copy(circleData.B.center);

        updateRadicalAxis();
        updateFamily();
        createLimitingPoints();
        if (document.getElementById('tangents-toggle').checked) showTangents(true);
        if (radicalCenter) showRadicalCenter(true);
    }

    function updateMathOverlay(){
        const x1 = circleData.A.center.x.toFixed(2), y1 = circleData.A.center.y.toFixed(2), r1 = circleData.A.radius.toFixed(2);
        const x2 = circleData.B.center.x.toFixed(2), y2 = circleData.B.center.y.toFixed(2), r2 = circleData.B.radius.toFixed(2);
        const A = (2*(circleData.B.center.x - circleData.A.center.x)).toFixed(2);
        const B = (2*(circleData.B.center.y - circleData.A.center.y)).toFixed(2);
        const C = ((circleData.A.center.x**2 + circleData.A.center.y**2 - circleData.A.radius**2)
                    - (circleData.B.center.x**2 + circleData.B.center.y**2 - circleData.B.radius**2)).toFixed(2);
        let latex = `\\displaystyle \\text{Circle }1:\\; (x - ${x1})^2 + (y - ${y1})^2 = ${r1}^2 \\\\`;
        latex += `\\text{Circle }2:\\; (x - ${x2})^2 + (y - ${y2})^2 = ${r2}^2 \\\\`;
        latex += `\\text{Radical axis: } ${A}x + ${B}y + ${C} = 0`;
        katex.render(latex, document.getElementById('math-overlay'), { throwOnError:false, displayMode:true });
    }

    function updateAnnotation(){
        const el = document.getElementById('annotation-overlay');
        el.textContent = steps[currentStep].annotation;
        el.style.opacity = 1;
        setTimeout(()=> el.style.opacity = 0, 4500);
    }

    function setupUI(){
        document.getElementById('radiusA').addEventListener('input', e => {
            circleData.A.radius = parseFloat(e.target.value); updateCircles();
        });
        document.getElementById('radiusB').addEventListener('input', e => {
            circleData.B.radius = parseFloat(e.target.value); updateCircles();
        });
        document.getElementById('lambdaSlider').addEventListener('input', e => {
            params.lambda = parseFloat(e.target.value); updateFamily();
        });
        document.getElementById('radical-axis-toggle').addEventListener('change', e => {
            radicalAxisLine.visible = e.target.checked;
        });
        document.getElementById('family-toggle').addEventListener('change', updateFamily);
        document.getElementById('tangents-toggle').addEventListener('change', e => {
            showTangents(e.target.checked);
        });
        document.getElementById('math-toggle').addEventListener('change', e => {
            document.getElementById('math-overlay').style.opacity = e.target.checked ? '1' : '0';
            if (e.target.checked) updateMathOverlay();
        });
        document.getElementById('quality-toggle').addEventListener('change', e => {
            qualitySettings.high = e.target.checked;
        });
        document.getElementById('animateFamily').addEventListener('click', () => {
            let t=0;
            const animate = ()=>{
                params.lambda = -5 + t*10;
                document.getElementById('lambdaSlider').value = params.lambda.toFixed(2);
                updateFamily();
                t += 0.01;
                if (t <= 1) requestAnimationFrame(animate);
            };
            animate();
        });
        document.getElementById('showRadicalCenter').addEventListener('click', ()=>showRadicalCenter(true));
    }

    function setupSteps(){
        document.getElementById('next-step').addEventListener('click', ()=>{
            if (currentStep < steps.length-1) currentStep++;
            steps[currentStep].action?.();
            updateCircles(); updateAnnotation();
        });
        document.getElementById('prev-step').addEventListener('click', ()=>{
            if (currentStep > 0) currentStep--;
            steps[currentStep].action?.();
            updateCircles(); updateAnnotation();
        });
    }

    // ---------- interaction (drag centers) ----------
    function onPointerDown(e){
        pointer.x = (e.clientX / innerWidth) * 2 - 1;
        pointer.y = - (e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects([centerA, centerB]);
        if (hits.length){
            isDragging = true;
            draggedObject = hits[0].object;
            controls.enabled = false;
        }
    }
    function onPointerMove(e){
        if (!isDragging) return;
        pointer.x = (e.clientX / innerWidth) * 2 - 1;
        pointer.y = - (e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const intersection = new THREE.Vector3();
        raycaster.ray.intersectPlane(plane, intersection);
        if (!intersection) return;
        if (draggedObject.name === 'centerA'){
            circleData.A.center.copy(intersection);
        } else {
            circleData.B.center.copy(intersection);
        }
        draggedObject.position.copy(intersection);
        // update the corresponding torus
        updateCircles();
    }
    function onPointerUp(){ isDragging=false; draggedObject=null; controls.enabled=true; }

    // ---------- cinematic intro ----------
    function cinematicIntro(){
        const title = document.getElementById('title-overlay');
        title.style.opacity = 1;
        const startPos = new THREE.Vector3(0, 15, 30), endPos = new THREE.Vector3(0,0,20);
        const duration = 1200;
        let start = performance.now();
        (function camAnim(now){
            const t = Math.min(1, (now - start)/duration);
            camera.position.lerpVectors(startPos, endPos, 0.5 - 0.5*Math.cos(t*Math.PI));
            controls.target.lerpVectors(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0), t);
            camera.lookAt(controls.target);
            if (t < 1) requestAnimationFrame(camAnim);
        })(start);
        setTimeout(()=> title.style.opacity = 0, 1400);
    }

    // ---------- render loop ----------
    const clock = new THREE.Clock();
    function animate(){
        requestAnimationFrame(animate);
        controls.update();
        if (document.getElementById('math-toggle')?.checked) updateMathOverlay();
        if (qualitySettings.high && composer) composer.render();
        else renderer.render(scene, camera);
    }

    function onWindowResize(){
        camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        if (composer) composer.setSize(innerWidth, innerHeight);
    }

    // ---------- start ----------
    init();
    </script>
</body>
</html>
