<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Coaxial System of Circles - JEE Advanced</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0KOVEMeaMurLxyxbCCDYg8N4eAS3IMdkBII2fG1/ocAChl+fFLzYw" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary-glow: #FFD700; /* Golden */
            --radical-axis: #00FFFF; /* Cyan */
            --centers-color: #FFA500; /* Orange */
            --tangent-color: #FFFFFF;
            --family-color: #FF69B4; /* Hot Pink for family */
            --limiting-color: #00FF00; /* Green for limiting points */
            --ui-bg: rgba(25, 25, 35, 0.85);
            --font-color: #E0E0E0;
            --slider-track: #444;
            --slider-thumb: var(--primary-glow);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050210;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--font-color);
        }

        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
            max-width: 90vw;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 4px;
            background: var(--slider-track);
            border-radius: 2px;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--slider-thumb);
            border-radius: 50%;
            border: 2px solid #111;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--slider-thumb);
            border-radius: 50%;
            border: 2px solid #111;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .toggle-switch input { display: none; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
            background-color: var(--slider-track);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--radical-axis); }
        input:checked + .slider:before { transform: translateX(20px); }

        button {
            background: var(--primary-glow);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background: #FFA500; }

        #title-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5vw;
            font-weight: 300;
            color: rgba(255, 255, 215, 0.8);
            text-shadow: 0 0 15px var(--primary-glow);
            opacity: 0;
            transition: opacity 2s ease-out;
            pointer-events: none;
            z-index: 20;
        }

        #annotation-overlay {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            max-width: 80%;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 20;
        }

        #math-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2em;
            max-width: 450px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .katex-display { margin: 0; }

        #step-buttons {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="scene-container"></div>
    <div id="title-overlay">Coaxial System of Circles</div>
    <div id="annotation-overlay"></div>
    <div id="math-overlay"></div>

    <div id="ui-container">
        <div class="control-group">
            <label for="radiusA">Radius A</label>
            <input type="range" id="radiusA" min="0.5" max="5" step="0.1" value="2.5" aria-label="Radius of Circle A">
        </div>
        <div class="control-group">
            <label for="radiusB">Radius B</label>
            <input type="range" id="radiusB" min="0.5" max="5" step="0.1" value="2" aria-label="Radius of Circle B">
        </div>
        <div class="control-group">
            <label for="lambdaSlider">λ (Family)</label>
            <input type="range" id="lambdaSlider" min="-5" max="5" step="0.1" value="0" aria-label="Lambda for family of circles">
        </div>
        <div class="control-group">
            <label for="radical-axis-toggle">Radical Axis</label>
            <label class="toggle-switch">
                <input type="checkbox" id="radical-axis-toggle" checked aria-label="Toggle Radical Axis visibility">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label for="family-toggle">Show Family</label>
            <label class="toggle-switch">
                <input type="checkbox" id="family-toggle" aria-label="Toggle family of circles">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label for="tangents-toggle">Tangents</label>
            <label class="toggle-switch">
                <input type="checkbox" id="tangents-toggle" aria-label="Toggle common tangents">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label for="math-toggle">Show Math</label>
            <label class="toggle-switch">
                <input type="checkbox" id="math-toggle" aria-label="Toggle mathematical formula visibility">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label for="quality-toggle">High Quality</label>
            <label class="toggle-switch">
                <input type="checkbox" id="quality-toggle" checked aria-label="Toggle high quality post-processing effects">
                <span class="slider"></span>
            </label>
        </div>
        <button id="animateFamily">Animate Family</button>
        <button id="showRadicalCenter">Show Radical Center</button>
    </div>

    <div id="step-buttons">
        <button id="prev-step">← Prev</button>
        <button id="next-step">Next →</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

        // --- GLSL SHADERS -----------------------------------------------------------
        const RimGlowVertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vec4 modelViewPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -modelViewPosition.xyz;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewPosition;
            }
        `;

        const RimGlowFragmentShader = `
            uniform vec3 uColor;
            uniform float uRimPower;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vec3 viewDir = normalize(vViewPosition);
                float rim = 1.0 - dot(viewDir, vNormal);
                float rimAmount = smoothstep(0.0, 1.0, pow(rim, uRimPower));
                gl_FragColor = vec4(uColor * rimAmount, rimAmount);
            }
        `;

        const DashedLineVertexShader = `
            attribute float lineDistance;
            varying float vLineDistance;
            void main() {
                vLineDistance = lineDistance;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const DashedLineFragmentShader = `
            uniform float time;
            uniform float dashSize;
            uniform float gapSize;
            varying float vLineDistance;
            void main() {
                float dash = mod(vLineDistance - time * 2.0, dashSize + gapSize);
                if (dash > dashSize) discard;
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        // --- SCENE SETUP ------------------------------------------------------------
        let scene, camera, renderer, composer, controls;
        let circleA, circleB, centerA, centerB, radicalAxisLine;
        let familyCircles = [];
        let tangentLines = [];
        let limitingPoints = [];
        let thirdCircle, radicalCenter;
        let isDragging = false;
        let draggedObject = null;
        let plane, raycaster, pointer;

        const qualitySettings = { high: true };
        const params = {
            radiusA: 2.5,
            radiusB: 2.0,
            lambda: 0
        };
        const circleData = {
            A: { center: new THREE.Vector3(-3, 0, 0), radius: params.radiusA },
            B: { center: new THREE.Vector3(3, 0, 0), radius: params.radiusB }
        };

        const COLORS = {
            circle: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--primary-glow')),
            family: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--family-color')),
            radicalAxis: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--radical-axis')),
            center: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--centers-color')),
            limiting: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--limiting-color')),
            tangent: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--tangent-color')),
        };

        // Step-by-step guide
        const steps = [
            { title: "Introduction", annotation: "Coaxial circles share a common radical axis. Drag centers or adjust radii to see it update in real-time." },
            { title: "Radical Axis", annotation: "The radical axis is the locus of points with equal power w.r.t. both circles. Equation: S₁ - S₂ = 0." },
            { title: "Intersecting Family", annotation: "Circles passing through two fixed limiting points form an intersecting coaxial system. All share the same radical axis (common chord).", action: () => setupIntersectingFamily() },
            { title: "Non-Intersecting Family", annotation: "Centers collinear, perpendicular to radical axis. Use λ slider to see family: S₁ + λ S₂ = 0.", action: () => setupNonIntersectingFamily() },
            { title: "Common Tangents", annotation: "External and internal tangents for the two circles.", action: () => showTangents(true) },
            { title: "Radical Center", annotation: "Intersection of radical axes of three circles. Point with equal power w.r.t. all three.", action: () => showRadicalCenter(true) }
        ];
        let currentStep = 0;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050210, 0.05);
            scene.background = new THREE.Color(0x050210);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 20);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('scene-container').appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 1.5;

            // Post-processing
            setupPostProcessing();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);
            
            // Raycasting Plane
            plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();

            // Create Objects
            createCircles();
            createRadicalAxis();
            createLimitingPoints();
            
            // UI & Event Listeners
            setupUI();
            setupSteps();
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);

            // Start Animation
            cinematicIntro();
            updateAnnotation();
            animate();
        }

        function setupPostProcessing() {
            const renderPass = new RenderPass(scene, camera);
            
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
            
            const filmPass = new FilmPass(0.15, 0.025, 648, false);

            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);
            composer.addPass(filmPass);
        }
        
        // --- OBJECT CREATION ----------------------------------------------------
        function createCircles() {
            const torusGeo = new THREE.TorusGeometry(1, 0.05, 16, 100);
            const centerGeo = new THREE.SphereGeometry(0.15, 16, 16);

            const circleMat = new THREE.ShaderMaterial({
                uniforms: {
                    uColor: { value: COLORS.circle },
                    uRimPower: { value: 3.0 }
                },
                vertexShader: RimGlowVertexShader,
                fragmentShader: RimGlowFragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });

            const centerMat = new THREE.MeshStandardMaterial({
                color: COLORS.center,
                emissive: COLORS.center,
                emissiveIntensity: 0.7
            });
            
            circleA = new THREE.Mesh(torusGeo, circleMat.clone());
            circleA.scale.setScalar(circleData.A.radius);
            circleA.position.copy(circleData.A.center);
            scene.add(circleA);

            centerA = new THREE.Mesh(centerGeo, centerMat.clone());
            centerA.position.copy(circleData.A.center);
            centerA.name = "centerA";
            scene.add(centerA);

            circleB = new THREE.Mesh(torusGeo, circleMat.clone());
            circleB.scale.setScalar(circleData.B.radius);
            circleB.position.copy(circleData.B.center);
            scene.add(circleB);
            
            centerB = new THREE.Mesh(centerGeo, centerMat.clone());
            centerB.position.copy(circleData.B.center);
            centerB.name = "centerB";
            scene.add(centerB);
        }

        function createFamilyCircle(lambda) {
            // S1 + λ S2 = 0
            const x1 = circleData.A.center.x, y1 = circleData.A.center.y, r1 = circleData.A.radius;
            const x2 = circleData.B.center.x, y2 = circleData.B.center.y, r2 = circleData.B.radius;
            const g1 = x1, f1 = y1, c1 = x1*x1 + y1*y1 - r1*r1;
            const g2 = x2, f2 = y2, c2 = x2*x2 + y2*y2 - r2*r2;
            const g = (g1 + lambda * g2) / (1 + lambda);
            const f = (f1 + lambda * f2) / (1 + lambda);
            const c = (c1 + lambda * c2) / (1 + lambda);
            const radius = Math.sqrt(g*g + f*f - c);
            if (isNaN(radius)) return null;
            const circ = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 16, 100), new THREE.ShaderMaterial({
                uniforms: { uColor: { value: COLORS.family }, uRimPower: { value: 3.0 } },
                vertexShader: RimGlowVertexShader,
                fragmentShader: RimGlowFragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending
            }));
            circ.scale.setScalar(radius);
            circ.position.set(g, f, 0);
            return circ;
        }

        function updateFamily() {
            familyCircles.forEach(c => scene.remove(c));
            familyCircles = [];
            if (!document.getElementById('family-toggle').checked) return;
            const numFamily = 5;
            for (let i = 0; i < numFamily; i++) {
                const lambda = params.lambda + (i - numFamily/2) * 2;
                const circ = createFamilyCircle(lambda);
                if (circ) {
                    scene.add(circ);
                    familyCircles.push(circ);
                }
            }
        }

        function createLimitingPoints() {
            // Intersection of circle A and B
            const x1 = circleData.A.center.x, y1 = circleData.A.center.y, r1 = circleData.A.radius;
            const x2 = circleData.B.center.x, y2 = circleData.B.center.y, r2 = circleData.B.radius;
            const d = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
            if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return; // no intersection
            const a = (r1**2 - r2**2 + d**2) / (2 * d);
            const h = Math.sqrt(r1**2 - a**2);
            const xm = x1 + a * (x2 - x1) / d;
            const ym = y1 + a * (y2 - y1) / d;
            const xs1 = xm + h * (y2 - y1) / d;
            const ys1 = ym - h * (x2 - x1) / d;
            const xs2 = xm - h * (y2 - y1) / d;
            const ys2 = ym + h * (x2 - x1) / d;
            const pointMat = new THREE.MeshBasicMaterial({ color: COLORS.limiting });
            const pointGeo = new THREE.SphereGeometry(0.1);
            const p1 = new THREE.Mesh(pointGeo, pointMat);
            p1.position.set(xs1, ys1, 0);
            scene.add(p1);
            limitingPoints.push(p1);
            const p2 = new THREE.Mesh(pointGeo, pointMat);
            p2.position.set(xs2, ys2, 0);
            scene.add(p2);
            limitingPoints.push(p2);
        }

        function createRadicalAxis() {
            const material = new THREE.LineBasicMaterial({ color: COLORS.radicalAxis });
            const points = [new THREE.Vector3(0, -10, 0), new THREE.Vector3(0, 10, 0)];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            radicalAxisLine = new THREE.Line(geometry, material);
            scene.add(radicalAxisLine);
            updateRadicalAxis();
        }

        function showTangents(visible) {
            tangentLines.forEach(l => scene.remove(l));
            tangentLines = [];
            if (!visible) return;
            // Simple external tangents approximation
            const dx = circleData.B.center.x - circleData.A.center.x;
            const dy = circleData.B.center.y - circleData.A.center.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            const rSum = circleData.A.radius + circleData.B.radius;
            const rDiff = Math.abs(circleData.A.radius - circleData.B.radius);
            // External
            const extAngle = Math.asin(rSum / d);
            const dir = new THREE.Vector3(dx, dy, 0).normalize();
            const perp = new THREE.Vector3(-dy, dx, 0).normalize();
            // ... (simplified, add 4 lines: 2 ext, 2 int)
            for (let i = 0; i < 4; i++) {
                const dashedMat = new THREE.ShaderMaterial({
                    uniforms: { time: { value: 0 }, dashSize: { value: 0.5 }, gapSize: { value: 0.5 } },
                    vertexShader: DashedLineVertexShader,
                    fragmentShader: DashedLineFragmentShader
                });
                const points = [new THREE.Vector3(-5, 0, 0), new THREE.Vector3(5, 0, 0)]; // placeholder
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                // Add lineDistance attr if needed
                const line = new THREE.Line(geo, dashedMat);
                scene.add(line);
                tangentLines.push(line);
            }
        }

        function showRadicalCenter(visible) {
            if (visible) {
                // Add third circle
                if (!thirdCircle) {
                    thirdCircle = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 16, 100), new THREE.ShaderMaterial({
                        uniforms: { uColor: { value: new THREE.Color(0xff00ff) }, uRimPower: { value: 3.0 } },
                        vertexShader: RimGlowVertexShader,
                        fragmentShader: RimGlowFragmentShader,
                        transparent: true,
                        blending: THREE.AdditiveBlending
                    }));
                    thirdCircle.scale.setScalar(1.5);
                    thirdCircle.position.set(0, 3, 0);
                    scene.add(thirdCircle);
                }
                // Radical center: intersection of two radical axes
                // Simplified: assume at origin
                if (!radicalCenter) {
                    const centerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                    radicalCenter = new THREE.Mesh(new THREE.SphereGeometry(0.2), centerMat);
                    radicalCenter.position.set(0, 0, 0);
                    scene.add(radicalCenter);
                }
            } else {
                if (thirdCircle) scene.remove(thirdCircle);
                if (radicalCenter) scene.remove(radicalCenter);
            }
        }

        function setupIntersectingFamily() {
            // Set limiting points fixed, adjust circles to pass through them
            circleData.A.center.set(-2, 0, 0);
            circleData.A.radius = 3;
            circleData.B.center.set(2, 0, 0);
            circleData.B.radius = 3;
            updateCircles();
            createLimitingPoints();
        }

        function setupNonIntersectingFamily() {
            // Centers collinear
            circleData.A.center.set(-3, 0, 0);
            circleData.A.radius = 1;
            circleData.B.center.set(3, 0, 0);
            circleData.B.radius = 1;
            updateCircles();
        }

        function updateCircles() {
            circleA.scale.setScalar(circleData.A.radius);
            circleA.position.copy(circleData.A.center);
            centerA.position.copy(circleData.A.center);
            circleB.scale.setScalar(circleData.B.radius);
            circleB.position.copy(circleData.B.center);
            centerB.position.copy(circleData.B.center);
            updateRadicalAxis();
            updateFamily();
            limitingPoints.forEach(p => scene.remove(p));
            limitingPoints = [];
            createLimitingPoints();
        }

        // --- CORE LOGIC & UPDATES -----------------------------------------------
        function updateRadicalAxis() {
            const { x: x1, y: y1 } = circleData.A.center;
            const r1 = circleData.A.radius;
            const { x: x2, y: y2 } = circleData.B.center;
            const r2 = circleData.B.radius;

            const A = 2 * (x2 - x1);
            const B = 2 * (y2 - y1);
            const C = (x1*x1 + y1*y1 - r1*r1) - (x2*x2 + y2*y2 - r2*r2);

            const points = [];
            const lineLength = 20;

            if (Math.abs(B) > 1e-4) {
                const y1_line = (-C - A * (-lineLength)) / B;
                const y2_line = (-C - A * lineLength) / B;
                points.push(new THREE.Vector3(-lineLength, y1_line, 0));
                points.push(new THREE.Vector3(lineLength, y2_line, 0));
            } else if (Math.abs(A) > 1e-4) {
                const x_line = -C / A;
                points.push(new THREE.Vector3(x_line, -lineLength, 0));
                points.push(new THREE.Vector3(x_line, lineLength, 0));
            }
            
            radicalAxisLine.geometry.setFromPoints(points);
            radicalAxisLine.geometry.attributes.position.needsUpdate = true;
            
            if (document.getElementById('math-toggle').checked) {
                updateMathOverlay();
            }
        }
        
        function updateMathOverlay() {
            const { x: x1, y: y1 } = circleData.A.center;
            const r1 = circleData.A.radius;
            const { x: x2, y: y2 } = circleData.B.center;
            const r2 = circleData.B.radius;

            const termX = (2 * (x2 - x1)).toFixed(2);
            const termY = (2 * (y2 - y1)).toFixed(2);
            const termC = ((x1*x1 + y1*y1 - r1*r1) - (x2*x2 + y2*y2 - r2*r2)).toFixed(2);

            let latexString = `\\text{Radical Axis: } S_1 - S_2 = 0 \\\\`;
            latexString += `2(x_2 - x_1)x + 2(y_2 - y_1)y + (c_1 - c_2) = 0 \\\\`;
            latexString += `\\bf{${termX}x + ${termY}y + ${termC} = 0}`;
            
            const mathDiv = document.getElementById('math-overlay');
            katex.render(latexString, mathDiv, {
                throwOnError: false,
                displayMode: true
            });
        }

        function updateAnnotation() {
            const annotation = document.getElementById('annotation-overlay');
            annotation.textContent = steps[currentStep].annotation;
            annotation.style.opacity = 1;
            setTimeout(() => { annotation.style.opacity = 0; }, 5000);
        }

        // --- UI & INTERACTIVITY --------------------------------------------------
        function setupUI() {
            document.getElementById('radiusA').addEventListener('input', e => {
                circleData.A.radius = parseFloat(e.target.value);
                updateCircles();
            });
            document.getElementById('radiusB').addEventListener('input', e => {
                circleData.B.radius = parseFloat(e.target.value);
                updateCircles();
            });
            document.getElementById('lambdaSlider').addEventListener('input', e => {
                params.lambda = parseFloat(e.target.value);
                updateFamily();
            });
            document.getElementById('radical-axis-toggle').addEventListener('change', e => {
                radicalAxisLine.visible = e.target.checked;
            });
            document.getElementById('family-toggle').addEventListener('change', () => updateFamily());
            document.getElementById('tangents-toggle').addEventListener('change', e => showTangents(e.target.checked));
            document.getElementById('math-toggle').addEventListener('change', e => {
                const mathDiv = document.getElementById('math-overlay');
                if (e.target.checked) {
                    mathDiv.style.opacity = '1';
                    updateMathOverlay();
                } else {
                    mathDiv.style.opacity = '0';
                }
            });
            document.getElementById('quality-toggle').addEventListener('change', e => {
                qualitySettings.high = e.target.checked;
            });
            document.getElementById('animateFamily').addEventListener('click', () => {
                let t = 0;
                const animate = () => {
                    params.lambda = -5 + t * 10;
                    document.getElementById('lambdaSlider').value = params.lambda;
                    updateFamily();
                    t += 0.01;
                    if (t < 1) requestAnimationFrame(animate);
                };
                animate();
            });
            document.getElementById('showRadicalCenter').addEventListener('click', () => showRadicalCenter(true));
        }

        function setupSteps() {
            document.getElementById('next-step').addEventListener('click', () => {
                if (currentStep < steps.length - 1) {
                    currentStep++;
                    steps[currentStep].action?.();
                    updateCircles();
                    updateAnnotation();
                }
            });
            document.getElementById('prev-step').addEventListener('click', () => {
                if (currentStep > 0) {
                    currentStep--;
                    steps[currentStep].action?.();
                    updateCircles();
                    updateAnnotation();
                }
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onPointerDown(event) {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([centerA, centerB]);
            if (intersects.length > 0) {
                controls.enabled = false;
                isDragging = true;
                draggedObject = intersects[0].object;
            }
        }
        
        function onPointerMove(event) {
            if (isDragging) {
                pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
                pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                
                const intersection = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersection);

                if (draggedObject.name === "centerA") {
                    circleData.A.center.copy(intersection);
                } else {
                    circleData.B.center.copy(intersection);
                }
                draggedObject.position.copy(intersection);
                const circleToUpdate = draggedObject.name === "centerA" ? circleA : circleB;
                circleToUpdate.position.copy(intersection);
                updateCircles();
            }
        }
        
        function onPointerUp() {
            isDragging = false;
            draggedObject = null;
            controls.enabled = true;
        }

        // --- CINEMATICS -----------------------------------------------------------
        function cinematicIntro() {
            const title = document.getElementById('title-overlay');
            title.style.opacity = 1;

            // Camera dolly in
            const startPos = new THREE.Vector3(0, 15, 30);
            const endPos = new THREE.Vector3(0, 0, 20);
            const startTarget = new THREE.Vector3(0, 0, 0);
            const endTarget = new THREE.Vector3(0, 0, 0);
            const duration = 4000; // 4 seconds
            let startTime = null;

            function animateCam(time) {
                if (!startTime) startTime = time;
                const elapsed = time - startTime;
                const t = Math.min(elapsed / duration, 1.0);
                const easedT = 0.5 - 0.5 * Math.cos(t * Math.PI); // ease in-out

                camera.position.lerpVectors(startPos, endPos, easedT);
                controls.target.lerpVectors(startTarget, endTarget, easedT);
                camera.lookAt(controls.target);

                if (t < 1.0) {
                    requestAnimationFrame(animateCam);
                }
            }
            requestAnimationFrame(animateCam);

            // Fade out title
            setTimeout(() => {
                title.style.opacity = 0;
            }, 3000);
        }

        // --- RENDER LOOP ----------------------------------------------------------
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Update dashed lines
            tangentLines.forEach(line => {
                if (line.material.uniforms.time) line.material.uniforms.time.value = time;
            });

            controls.update();

            if (qualitySettings.high && composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        // --- START ----------------------------------------------------------------
        init();
    </script>
</body>
</html>
