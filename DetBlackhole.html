<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Determinant Black Hole — Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background-color: black; }
        #info {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 0 0 20px cyan, 0 0 40px blue;
            z-index: 10;
            pointer-events: none;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 2s ease;
            mix-blend-mode: screen;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.2), transparent);
            padding: 20px;
        }
        #info span {
            display: inline-block;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 15px 40px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 50px rgba(0,255,255,0.5);
        }
        #overlay {
            position: absolute;
            top: 20px;
            right: 30px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: monospace;
            z-index: 20;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            border-left: 3px solid cyan;
            pointer-events: none;
        }
        #status {
            position: absolute;
            top: 20px;
            left: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            font-family: 'Courier New', monospace;
            z-index: 20;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid magenta;
            letter-spacing: 1px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .caption {
            position: absolute;
            bottom: 5%;
            left: 5%;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            font-style: italic;
            z-index: 15;
            max-width: 300px;
            text-shadow: 0 0 10px black;
        }
    </style>
</head>
<body>
    <div id="info"><span></span></div>
    <div id="status">det = 1.00</div>
    <div id="overlay">🧲 THE DETERMINANT BLACK HOLE • visual metaphor</div>
    <div class="caption">"A determinant measures how much space survives."</div>

    <!-- Import Three.js core and add-ons from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- INITIALIZATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.0025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 6, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.appendChild(renderer.domElement);

        // --- POST-PROCESSING BLOOM (for that cinematic glow) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- CONTROLS (disabled autoRotate to control manually, but we'll animate camera) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableRotate = false; // we'll animate rotation manually for cinematic feel

        // --- LIGHTS ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        
        const pointLight1 = new THREE.PointLight(0x4466ff, 1, 30);
        pointLight1.position.set(5, 10, 7);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0xffaa44, 0.8, 30);
        pointLight2.position.set(-5, -2, 5);
        scene.add(pointLight2);

        // --- STARS (distant particles) ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            const r = 60 + Math.random() * 40;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starsPos[i] = Math.sin(phi) * Math.cos(theta) * r;
            starsPos[i+1] = Math.sin(phi) * Math.sin(theta) * r;
            starsPos[i+2] = Math.cos(phi) * r;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // --- NEBULA CLOUDS (faint transparent spheres) ---
        const cloudMat = new THREE.MeshPhongMaterial({ 
            color: 0x335588, 
            emissive: 0x112233, 
            transparent: true, 
            opacity: 0.07, 
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const cloud1 = new THREE.Mesh(new THREE.SphereGeometry(25, 32, 16), cloudMat);
        cloud1.position.set(-10, 5, -15);
        scene.add(cloud1);
        const cloud2 = new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), cloudMat);
        cloud2.position.set(15, -8, 10);
        scene.add(cloud2);

        // --- MAIN GROUP: GRID & VECTORS & BLACK HOLE ---
        // We will animate scale.y of the grid group to simulate collapse
        
        // 1. THE GLOWING 3D GRID (custom lattice)
        const gridGroup = new THREE.Group();
        const range = 6;
        const step = 1.2; // slightly wider for dramatic effect
        const half = range;
        
        function createGridLines(color, opacity = 0.7) {
            const points = [];
            // lines along X
            for (let y = -half; y <= half; y += step) {
                for (let z = -half; z <= half; z += step) {
                    points.push(new THREE.Vector3(-half, y, z));
                    points.push(new THREE.Vector3(half, y, z));
                }
            }
            // lines along Y
            for (let x = -half; x <= half; x += step) {
                for (let z = -half; z <= half; z += step) {
                    points.push(new THREE.Vector3(x, -half, z));
                    points.push(new THREE.Vector3(x, half, z));
                }
            }
            // lines along Z
            for (let x = -half; x <= half; x += step) {
                for (let y = -half; y <= half; y += step) {
                    points.push(new THREE.Vector3(x, y, -half));
                    points.push(new THREE.Vector3(x, y, half));
                }
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
            return new THREE.LineSegments(geometry, material);
        }

        const mainGrid = createGridLines(0x44aaff, 0.5);
        const secondaryGrid = createGridLines(0x88ccff, 0.2);
        // add extra fine grid inside
        const fineGrid = createGridLines(0x3366aa, 0.15);
        
        gridGroup.add(mainGrid);
        gridGroup.add(secondaryGrid);
        gridGroup.add(fineGrid);
        scene.add(gridGroup);

        // 2. VECTORS (glowing arrows)
        const arrowLength = 3.2;
        const arrowHeadLength = 0.8;
        const arrowHeadWidth = 0.5;
        
        // v1 cyan
        const arrowV1 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), arrowLength, 0x00ffff, arrowHeadLength, arrowHeadWidth);
        // v2 magenta
        const arrowV2 = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), arrowLength, 0xff44ff, arrowHeadLength, arrowHeadWidth);
        // v3 gold
        const arrowV3 = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), arrowLength, 0xffaa00, arrowHeadLength, arrowHeadWidth);
        
        scene.add(arrowV1);
        scene.add(arrowV2);
        scene.add(arrowV3);

        // Add faint floating symbols (sprites)
        function createSymbolSprite(char, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 64, 64);
            ctx.font = '40px Arial';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, blending: THREE.AdditiveBlending, depthTest: true, depthWrite: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.8, 0.8, 0.8);
            return sprite;
        }

        const sym1 = createSymbolSprite('∇', '#ff66aa');
        sym1.position.set(2, 3, 2);
        scene.add(sym1);
        const sym2 = createSymbolSprite('∫', '#66ffcc');
        sym2.position.set(-3, -1, 4);
        scene.add(sym2);
        const sym3 = createSymbolSprite('∑', '#ffaa66');
        sym3.position.set(4, -2, -3);
        scene.add(sym3);

        // 3. BLACK HOLE
        const blackHoleGroup = new THREE.Group();
        // Event horizon (dark sphere)
        const horizonGeo = new THREE.SphereGeometry(1.6, 64, 32);
        const horizonMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            emissive: 0x220000, 
            roughness: 0.1, 
            metalness: 0.8,
            emissiveIntensity: 1.2
        });
        const horizon = new THREE.Mesh(horizonGeo, horizonMat);
        blackHoleGroup.add(horizon);

        // Accretion disc (glowing torus)
        const discGeo = new THREE.TorusGeometry(2.4, 0.2, 32, 64);
        const discMat = new THREE.MeshStandardMaterial({ 
            color: 0xff5500, 
            emissive: 0xaa3300, 
            transparent: true, 
            opacity: 0.6,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const disc = new THREE.Mesh(discGeo, discMat);
        disc.rotation.x = Math.PI / 2;
        blackHoleGroup.add(disc);

        // Inner hot ring
        const ringGeo = new THREE.TorusGeometry(1.9, 0.08, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, blending: THREE.AdditiveBlending });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.z = 0.3;
        blackHoleGroup.add(ring);

        // Swirling particles (accretion)
        const particleCount = 800;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2.0 + Math.random() * 1.5;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 1.0;
            particlePos[i*3] = Math.cos(angle) * radius;
            particlePos[i*3+1] = height;
            particlePos[i*3+2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.08, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeo, particleMat);
        blackHoleGroup.add(particles);

        blackHoleGroup.position.set(0, 0, 0);
        scene.add(blackHoleGroup);

        // Additional starfield near black hole
        const starFieldGeo = new THREE.BufferGeometry();
        const starFieldPos = new Float32Array(600 * 3);
        for (let i = 0; i < 600; i++) {
            const r = 5 + Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starFieldPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            starFieldPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            starFieldPos[i*3+2] = Math.cos(phi) * r;
        }
        starFieldGeo.setAttribute('position', new THREE.BufferAttribute(starFieldPos, 3));
        const starFieldMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.1, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starFieldGeo, starFieldMat);
        scene.add(starField);

        // --- ANIMATION VARIABLES & TIMELINE ---
        let clock = new THREE.Clock();
        const timeline = {
            phase: 0, // 0:stable, 1:transformation, 2:pull, 3:approach zero, 4:collapse, 5:aftermath
            det: 1.0,
            progress: 0
        };

        // Store initial directions
        const dirV1 = new THREE.Vector3(1, 0, 0);
        const dirV2 = new THREE.Vector3(0, 1, 0);
        const dirV3 = new THREE.Vector3(0, 0, 1);

        // UI elements
        const infoDiv = document.getElementById('info');
        const infoSpan = infoDiv.querySelector('span');
        const statusDiv = document.getElementById('status');
        const captionDiv = document.querySelector('.caption');

        // Shockwave ring
        const shockwaveGeo = new THREE.TorusGeometry(0.5, 0.1, 32, 64);
        const shockwaveMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x4488ff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
        const shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.rotation.x = Math.PI / 2;
        shockwave.visible = false;
        scene.add(shockwave);

        // Camera path variables
        let cameraBasePos = camera.position.clone();

        // --- ANIMATION LOOP ---
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000; // seconds

            // ---- PHASE DETERMINATION (simple timeline) ----
            let t = (elapsedTime % 30) / 30; // loop after 30 sec for demo, but we want continuous
            // For a linear 0-1 over 24 seconds, then reset? Let's make a 24s cycle.
            const cycleTime = 24;
            const phaseTime = elapsedTime % cycleTime;
            
            // Update phase and determinant
            if (phaseTime < 4) { // 0-4s stable
                timeline.phase = 0;
                timeline.det = 1.0;
            } else if (phaseTime < 8) { // 4-8s transformation begins
                timeline.phase = 1;
                timeline.det = 1.0 - (phaseTime-4)/4 * 0.4; // 1 -> 0.6
            } else if (phaseTime < 12) { // 8-12s black hole pull
                timeline.phase = 2;
                timeline.det = 0.6 - (phaseTime-8)/4 * 0.5; // 0.6 -> 0.1
            } else if (phaseTime < 16) { // 12-16s approaches zero
                timeline.phase = 3;
                timeline.det = 0.1 - (phaseTime-12)/4 * 0.099; // 0.1 -> 0.001
                if (timeline.det < 0) timeline.det = 0;
            } else if (phaseTime < 18) { // 16-18s collapse
                timeline.phase = 4;
                timeline.det = 0;
            } else { // 18-24s aftermath
                timeline.phase = 5;
                timeline.det = 0;
            }

            // Update status text
            statusDiv.innerHTML = `det = ${timeline.det.toFixed(2)}`;

            // --- UPDATE TRANSFORMATIONS BASED ON DETERMINANT ---
            
            // Scale grid along Y to simulate collapse (volume -> area)
            // det ~ scaleY (since we keep X and Z fixed) but for effect we make scaleY = det
            let scaleY = Math.max(timeline.det, 0.0);
            // Ease for dramatic effect
            gridGroup.scale.y = scaleY;
            
            // Vector rotations: make them coplanar (all in XZ) as det -> 0
            // v2 (magenta) rotates from Y to X direction
            // v3 (gold) rotates from Z to X direction? Actually to be coplanar, we bring both v2 and v3 into XZ plane, but keep v1 along X.
            // So v2: Y-axis rotates toward X (in XY plane), but to keep in XZ, we need to also rotate around? Simpler: rotate v2 toward X in XY, and v3 toward X in XZ? That makes them all near X axis (1D), but we want 2D collapse. Better: make v2 and v3 lie in XZ plane. So v2 should lose Y component and gain X/Z. Let's do: v2 -> (sin, 0, cos) style. But for simplicity, we rotate v2 around Z to lie in XZ, and v3 around Y to lie in XZ.
            
            // Interpolate directions
            const mixFactor = Math.min(1, (1 - scaleY) * 1.5); // when scaleY small, mixFactor ~1
            
            // v1 stays along X (cyan)
            // v2: from (0,1,0) to (0.7, 0, 0.7) (normalized)
            const targetV2 = new THREE.Vector3(0.707, 0, 0.707);
            const currentDirV2 = new THREE.Vector3(0, 1, 0).lerp(targetV2, mixFactor);
            currentDirV2.normalize();
            
            // v3: from (0,0,1) to (0.707, 0, -0.707) or something to be different? Let's do (0.707, 0, -0.707) so they are not parallel.
            const targetV3 = new THREE.Vector3(0.707, 0, -0.707);
            const currentDirV3 = new THREE.Vector3(0, 0, 1).lerp(targetV3, mixFactor);
            currentDirV3.normalize();
            
            // Apply to arrows
            arrowV2.setDirection(currentDirV2);
            arrowV3.setDirection(currentDirV3);
            
            // Also shorten arrows slightly to indicate shrinking volume? Optional
            arrowV1.setLength(arrowLength * (0.8 + 0.2 * scaleY), arrowHeadLength, arrowHeadWidth);
            arrowV2.setLength(arrowLength * (0.8 + 0.2 * scaleY), arrowHeadLength, arrowHeadWidth);
            arrowV3.setLength(arrowLength * (0.8 + 0.2 * scaleY), arrowHeadLength, arrowHeadWidth);

            // Black hole effects: spin disc and particles
            disc.rotation.y += 0.005;
            ring.rotation.y += 0.01;
            particles.rotation.y += 0.01;

            // Gravitational lensing effect: slight distortion of stars? We'll just move camera a bit.

            // Camera shake during phase 2 and 3
            if (timeline.phase === 2 || timeline.phase === 3) {
                const shakeIntensity = 0.2 * (timeline.phase === 2 ? 0.5 : 1.0);
                camera.position.x = cameraBasePos.x + (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = cameraBasePos.y + (Math.random() - 0.5) * shakeIntensity;
                camera.position.z = cameraBasePos.z + (Math.random() - 0.5) * shakeIntensity;
            } else {
                // Smooth camera path
                const radius = 18;
                const angle = elapsedTime * 0.1;
                camera.position.x = Math.sin(angle) * radius * 0.7;
                camera.position.y = 5 + Math.sin(angle * 0.5) * 2;
                camera.position.z = Math.cos(angle) * radius;
                cameraBasePos.copy(camera.position);
            }
            camera.lookAt(0, 0, 0);

            // Shockwave at collapse (phase 4 start)
            if (timeline.phase === 4 && phaseTime > 16 && phaseTime < 16.5) {
                shockwave.visible = true;
                shockwave.scale.setScalar(1 + (phaseTime-16)*10);
                shockwave.material.opacity = 0.8 - (phaseTime-16)*2;
            } else {
                shockwave.visible = false;
                shockwave.scale.set(1,1,1);
            }

            // --- TEXT OVERLAYS ---
            if (timeline.phase === 0) {
                infoSpan.innerText = "A determinant measures how much space survives.";
                infoDiv.style.opacity = 1;
                captionDiv.style.opacity = 0.3;
            } else if (timeline.phase === 1) {
                infoSpan.innerText = "When vectors lose independence...";
                infoDiv.style.opacity = 1;
            } else if (timeline.phase === 2) {
                infoSpan.innerText = "The black hole pulls space inward.";
                infoDiv.style.opacity = 1;
            } else if (timeline.phase === 3) {
                infoSpan.innerText = "Determinant approaches zero.";
                infoDiv.style.opacity = 1;
            } else if (timeline.phase === 4) {
                infoSpan.innerText = "Determinant = 0";
                infoDiv.style.opacity = 1;
                // add extra burst
            } else if (timeline.phase === 5) {
                infoSpan.innerText = "When rows become dependent, space loses a dimension.";
                infoDiv.style.opacity = 1;
            }

            // Update controls if needed
            controls.update();

            // Render via composer (bloom)
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start with a subtle intro
        setTimeout(() => {
            infoDiv.style.opacity = 1;
        }, 500);
    </script>
</body>
</html>
