<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Determinant Black Hole – Enhanced</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; font-family: 'Segoe UI', 'Arial', sans-serif; }
        #info {
            position: absolute;
            bottom: 12%;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 0 0 30px cyan, 0 0 60px #4a4aff;
            z-index: 20;
            pointer-events: none;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0;
            transition: opacity 2.5s cubic-bezier(0.23, 1, 0.32, 1);
            mix-blend-mode: screen;
            transform: translateY(20px);
        }
        #info.show {
            opacity: 1;
            transform: translateY(0);
        }
        #info span {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 18px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 80px rgba(0, 255, 255, 0.5);
            font-family: 'Trebuchet MS', sans-serif;
        }
        #status {
            position: absolute;
            top: 25px;
            left: 30px;
            color: rgba(255,255,255,0.9);
            font-size: 22px;
            font-family: 'Courier New', monospace;
            z-index: 30;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 40px;
            border-left: 6px solid #ff44ff;
            border-right: 1px solid cyan;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            letter-spacing: 2px;
            font-weight: 600;
        }
        #status span {
            color: #ffaa00;
            font-size: 28px;
            margin-left: 10px;
            text-shadow: 0 0 15px orange;
        }
        #overlay {
            position: absolute;
            top: 25px;
            right: 30px;
            color: rgba(200,220,255,0.7);
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
            z-index: 30;
            background: rgba(10,10,20,0.5);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #66ccff;
            backdrop-filter: blur(5px);
            letter-spacing: 1.5px;
        }
        .caption {
            position: absolute;
            bottom: 5%;
            left: 5%;
            color: rgba(220,240,255,0.6);
            font-size: 16px;
            font-style: italic;
            z-index: 15;
            max-width: 350px;
            text-shadow: 0 0 15px black;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border-left: 3px solid #ffaa00;
        }
        /* floating math symbols (canvas drawn) will be in 3d, not here */
    </style>
</head>
<body>
    <div id="info"><span></span></div>
    <div id="status">det = <span id="det-value">1.00</span></div>
    <div id="overlay">🌀 THE DETERMINANT BLACK HOLE • dimensional collapse</div>
    <div class="caption">"A determinant does not just give a number. It decides whether space survives... or collapses into nothing."</div>

    <!-- Three.js and post-processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js'; // for extra drama (optional)
        
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030311);
        scene.fog = new THREE.FogExp2(0x030311, 0.0022);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 5, 18);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.4;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING (bloom + optional glitch at collapse) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.4;
        bloomPass.radius = 0.6;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        
        // optional glitch pass for collapse moment (we'll toggle later)
        const glitchPass = new GlitchPass();
        glitchPass.goWild = false;
        glitchPass.enabled = false;
        composer.addPass(glitchPass);

        // --- CONTROLS (cinematic, auto-rotate disabled, we animate manually) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.autoRotate = false;
        controls.enableRotate = false; // manual camera path

        // --- LIGHTING ---
        const ambient = new THREE.AmbientLight(0x40406b);
        scene.add(ambient);
        
        const light1 = new THREE.PointLight(0x4466ff, 1.2, 40);
        light1.position.set(6, 8, 8);
        scene.add(light1);
        
        const light2 = new THREE.PointLight(0xff8844, 1.0, 40);
        light2.position.set(-7, 3, 6);
        scene.add(light2);
        
        // Fill light from below for drama
        const light3 = new THREE.PointLight(0xaa44ff, 0.6, 30);
        light3.position.set(2, -8, -5);
        scene.add(light3);

        // --- STARS + NEBULA BACKGROUND ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const r = 70 + Math.random() * 60;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starsPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            starsPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            starsPos[i*3+2] = Math.cos(phi) * r;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // Nebula clouds (transparent, glowing)
        const cloudMat = new THREE.MeshPhongMaterial({
            color: 0x3355aa,
            emissive: 0x112244,
            transparent: true,
            opacity: 0.05,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const cloud1 = new THREE.Mesh(new THREE.SphereGeometry(35, 32, 16), cloudMat);
        cloud1.position.set(-15, 10, -20);
        scene.add(cloud1);
        const cloud2 = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), cloudMat);
        cloud2.position.set(20, -12, 15);
        scene.add(cloud2);

        // --- MAIN VISUAL ELEMENTS ---

        // 1. Glowing 3D grid (will be scaled in Y to simulate collapse)
        const gridGroup = new THREE.Group();
        const size = 7.5; // half-extent
        const step = 1.2;
        
        function createGrid(color, opacity = 0.6, lineWidth = 1) {
            const points = [];
            // X lines
            for (let y = -size; y <= size; y += step) {
                for (let z = -size; z <= size; z += step) {
                    points.push(new THREE.Vector3(-size, y, z));
                    points.push(new THREE.Vector3(size, y, z));
                }
            }
            // Y lines
            for (let x = -size; x <= size; x += step) {
                for (let z = -size; z <= size; z += step) {
                    points.push(new THREE.Vector3(x, -size, z));
                    points.push(new THREE.Vector3(x, size, z));
                }
            }
            // Z lines
            for (let x = -size; x <= size; x += step) {
                for (let y = -size; y <= size; y += step) {
                    points.push(new THREE.Vector3(x, y, -size));
                    points.push(new THREE.Vector3(x, y, size));
                }
            }
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
            return new THREE.LineSegments(geom, mat);
        }

        const mainGrid = createGrid(0x44aaff, 0.55);
        const secondGrid = createGrid(0x88ccff, 0.25);
        const innerGrid = createGrid(0x3366cc, 0.15);
        gridGroup.add(mainGrid);
        gridGroup.add(secondGrid);
        gridGroup.add(innerGrid);
        scene.add(gridGroup);

        // 2. Vectors (neon arrows) with extra glow via bloom
        const arrowLength = 3.8;
        const headLength = 0.9;
        const headWidth = 0.5;
        
        // v1 cyan
        const arrowV1 = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), arrowLength, 0x00ffff, headLength, headWidth);
        // v2 magenta
        const arrowV2 = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), arrowLength, 0xff44ff, headLength, headWidth);
        // v3 gold
        const arrowV3 = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), arrowLength, 0xffaa00, headLength, headWidth);
        
        scene.add(arrowV1);
        scene.add(arrowV2);
        scene.add(arrowV3);

        // Add faint labels as sprites
        function createLabel(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.font = 'bold 70px "Segoe UI", "Arial"';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, depthTest: true, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(1.2, 1.2, 1);
            return sprite;
        }

        const labelV1 = createLabel('v₁', '#00ffff');
        labelV1.position.set(4.5, 0.2, 0.2);
        scene.add(labelV1);
        const labelV2 = createLabel('v₂', '#ff44ff');
        labelV2.position.set(0.2, 4.5, 0.2);
        scene.add(labelV2);
        const labelV3 = createLabel('v₃', '#ffaa00');
        labelV3.position.set(0.2, 0.2, 4.5);
        scene.add(labelV3);

        // Floating math symbols (more atmosphere)
        function createMathSprite(char, color, pos) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = '40px "Times New Roman", serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 32, 32);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(0.9, 0.9, 1);
            sprite.position.copy(pos);
            return sprite;
        }

        scene.add(createMathSprite('∇', '#66aaff', new THREE.Vector3(3, 2, 4)));
        scene.add(createMathSprite('∫', '#ff88cc', new THREE.Vector3(-4, 3, 3)));
        scene.add(createMathSprite('∑', '#ffaa66', new THREE.Vector3(5, -2, -3)));
        scene.add(createMathSprite('det', '#88ffaa', new THREE.Vector3(-3, -3, 4)));

        // 3. BLACK HOLE (with event horizon, accretion, and swirling particles)
        const blackHoleGroup = new THREE.Group();
        
        // Event horizon (dark sphere with faint glow)
        const horizonGeo = new THREE.SphereGeometry(1.8, 96, 48);
        const horizonMat = new THREE.MeshStandardMaterial({
            color: 0x080808,
            emissive: 0x330000,
            roughness: 0.2,
            metalness: 0.7,
            emissiveIntensity: 1.5
        });
        const horizon = new THREE.Mesh(horizonGeo, horizonMat);
        blackHoleGroup.add(horizon);

        // Accretion disc (inner hot ring)
        const discGeo = new THREE.TorusGeometry(2.6, 0.25, 32, 128);
        const discMat = new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0xaa3300,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const disc = new THREE.Mesh(discGeo, discMat);
        disc.rotation.x = Math.PI / 2;
        blackHoleGroup.add(disc);

        // Outer thin ring
        const ringGeo = new THREE.TorusGeometry(3.2, 0.1, 16, 128);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224488, blending: THREE.AdditiveBlending });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.z = 0.5;
        blackHoleGroup.add(ring);

        // Swarm of hot particles (accretion)
        const particleCount = 1500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2.0 + Math.random() * 2.0;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 1.5;
            particlePos[i*3] = Math.cos(angle) * radius;
            particlePos[i*3+1] = height;
            particlePos[i*3+2] = Math.sin(angle) * radius;
            
            const col = new THREE.Color().setHSL(0.05 + Math.random()*0.1, 1, 0.5);
            particleColors[i*3] = col.r;
            particleColors[i*3+1] = col.g;
            particleColors[i*3+2] = col.b;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const particles = new THREE.Points(particleGeo, particleMat);
        blackHoleGroup.add(particles);

        blackHoleGroup.position.set(0, 0, 0);
        scene.add(blackHoleGroup);

        // Extra star field near black hole (lensing)
        const nearStarsGeo = new THREE.BufferGeometry();
        const nearStarsPos = new Float32Array(800 * 3);
        for (let i = 0; i < 800; i++) {
            const r = 5 + Math.random() * 12;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            nearStarsPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            nearStarsPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            nearStarsPos[i*3+2] = Math.cos(phi) * r;
        }
        nearStarsGeo.setAttribute('position', new THREE.BufferAttribute(nearStarsPos, 3));
        const nearStarsMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.15, blending: THREE.AdditiveBlending });
        const nearStars = new THREE.Points(nearStarsGeo, nearStarsMat);
        scene.add(nearStars);

        // Shockwave ring (for collapse)
        const shockwaveGeo = new THREE.TorusGeometry(0.5, 0.15, 32, 128);
        const shockwaveMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x4488ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
        const shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.rotation.x = Math.PI / 2;
        shockwave.visible = false;
        scene.add(shockwave);

        // Second shockwave ring (outer)
        const shockwave2Geo = new THREE.TorusGeometry(0.8, 0.1, 32, 128);
        const shockwave2Mat = new THREE.MeshStandardMaterial({ color: 0xff88aa, emissive: 0xaa4488, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
        const shockwave2 = new THREE.Mesh(shockwave2Geo, shockwave2Mat);
        shockwave2.rotation.x = Math.PI / 2;
        shockwave2.visible = false;
        scene.add(shockwave2);

        // --- ANIMATION VARIABLES ---
        const clock = new THREE.Clock();
        const detValueElem = document.getElementById('det-value');
        const infoDiv = document.getElementById('info');
        const infoSpan = infoDiv.querySelector('span');
        
        // Timeline (24 second cycle, but we'll make it smooth and loop)
        let phase = 0;
        let det = 1.0;

        // Store original directions
        const origDirV2 = new THREE.Vector3(0, 1, 0);
        const origDirV3 = new THREE.Vector3(0, 0, 1);
        const targetDirV2 = new THREE.Vector3(0.707, 0, 0.707).normalize(); // coplanar
        const targetDirV3 = new THREE.Vector3(0.707, 0, -0.707).normalize();

        // Camera path: elegant Lissajous-like motion
        let cameraTime = 0;

        // --- HELPER FUNCTIONS ---
        function updateDet(value) {
            det = Math.max(0, Math.min(1, value));
            detValueElem.textContent = det.toFixed(2);
            // Color based on det: green (1) -> red (0)
            const hue = 0.3 * det; // 0.3 = green, 0 = red
            detValueElem.style.color = `hsl(${hue * 360}, 100%, 60%)`;
        }

        // --- ANIMATION LOOP ---
        function animate() {
            const delta = clock.getDelta();
            const elapsed = performance.now() / 1000; // seconds

            // Cycle of 28 seconds for more dramatic phases
            const cycleTime = 28;
            const t = (elapsed % cycleTime) / cycleTime; // 0..1 over cycle
            
            // Phase mapping:
            // 0-0.15: stable (det=1)
            // 0.15-0.3: transformation (det 1->0.6)
            // 0.3-0.45: black hole pull (det 0.6->0.1)
            // 0.45-0.6: approaches zero (det 0.1->0.0)
            // 0.6-0.7: collapse (det=0)
            // 0.7-1.0: aftermath (det=0)
            
            let detTarget = 1.0;
            let phaseIndex = 0;
            
            if (t < 0.15) {
                phaseIndex = 0;
                detTarget = 1.0;
            } else if (t < 0.3) {
                phaseIndex = 1;
                const p = (t - 0.15) / 0.15;
                detTarget = 1.0 - p * 0.4; // 1 -> 0.6
            } else if (t < 0.45) {
                phaseIndex = 2;
                const p = (t - 0.3) / 0.15;
                detTarget = 0.6 - p * 0.5; // 0.6 -> 0.1
            } else if (t < 0.6) {
                phaseIndex = 3;
                const p = (t - 0.45) / 0.15;
                detTarget = 0.1 - p * 0.1; // 0.1 -> 0.0
                if (detTarget < 0) detTarget = 0;
            } else if (t < 0.7) {
                phaseIndex = 4;
                detTarget = 0.0;
            } else {
                phaseIndex = 5;
                detTarget = 0.0;
            }
            
            updateDet(detTarget);

            // --- APPLY TRANSFORMATIONS ---
            
            // Grid scale Y simulates volume collapse
            gridGroup.scale.y = detTarget;
            
            // Vectors: rotate toward coplanar based on (1 - det) for dramatic effect
            const mix = Math.min(1, (1 - detTarget) * 1.3);
            
            const newDirV2 = origDirV2.clone().lerp(targetDirV2, mix).normalize();
            const newDirV3 = origDirV3.clone().lerp(targetDirV3, mix).normalize();
            
            arrowV2.setDirection(newDirV2);
            arrowV3.setDirection(newDirV3);
            
            // Also scale arrow length slightly with det (volume feeling)
            const lenScale = 0.7 + 0.3 * detTarget;
            arrowV1.setLength(arrowLength * lenScale, headLength, headWidth);
            arrowV2.setLength(arrowLength * lenScale, headLength, headWidth);
            arrowV3.setLength(arrowLength * lenScale, headLength, headWidth);

            // Rotate black hole elements
            disc.rotation.y += 0.008;
            ring.rotation.y += 0.012;
            particles.rotation.y += 0.01;
            
            // Camera motion: elegant orbital with vertical oscillation
            cameraTime += delta * 0.15;
            const radius = 19;
            const camX = Math.sin(cameraTime * 0.6) * radius * 0.9;
            const camY = 5 + Math.sin(cameraTime * 0.8) * 3.5;
            const camZ = Math.cos(cameraTime * 0.5) * radius;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            // Additional camera shake during pull and approach
            if (phaseIndex === 2 || phaseIndex === 3) {
                const shake = 0.15 * (phaseIndex === 3 ? 0.4 : 0.2);
                camera.position.x += (Math.random() - 0.5) * shake;
                camera.position.y += (Math.random() - 0.5) * shake;
                camera.position.z += (Math.random() - 0.5) * shake;
            }

            // Shockwave at collapse moment (phase 4)
            if (phaseIndex === 4 && t > 0.6 && t < 0.65) {
                const progress = (t - 0.6) / 0.05; // 0..1 over 0.05 cycle
                shockwave.visible = true;
                shockwave2.visible = true;
                const scale = 1 + progress * 12;
                shockwave.scale.set(scale, scale, scale);
                shockwave2.scale.set(scale * 1.4, scale * 1.4, scale * 1.4);
                shockwave.material.opacity = 0.9 - progress * 0.9;
                shockwave2.material.opacity = 0.7 - progress * 0.7;
                
                // Enable glitch for a few frames
                glitchPass.enabled = true;
                glitchPass.goWild = true;
            } else {
                shockwave.visible = false;
                shockwave2.visible = false;
                glitchPass.enabled = false;
            }

            // --- TEXT UPDATES ---
            if (phaseIndex === 0) {
                infoSpan.innerText = "A determinant measures how much space survives.";
                infoDiv.classList.add('show');
            } else if (phaseIndex === 1) {
                infoSpan.innerText = "When vectors lose independence...";
            } else if (phaseIndex === 2) {
                infoSpan.innerText = "The black hole pulls space inward.";
            } else if (phaseIndex === 3) {
                infoSpan.innerText = "Determinant approaches zero.";
            } else if (phaseIndex === 4) {
                infoSpan.innerText = "DETERMINANT = 0";
                // make text pulse
                infoDiv.style.transform = 'scale(1.1)';
                setTimeout(() => infoDiv.style.transform = 'scale(1)', 200);
            } else if (phaseIndex === 5) {
                infoSpan.innerText = "When rows become dependent, space loses a dimension.";
            }

            // Controls damping update
            controls.update();

            // Render via composer
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Small intro delay for text
        setTimeout(() => {
            infoDiv.classList.add('show');
        }, 800);
    </script>
</body>
</html>
