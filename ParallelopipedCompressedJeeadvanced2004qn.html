<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JEE Advanced 2004 · Locus of A″ · Premium 3D</title>

    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #06080f;
            color: #f0f4ff;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }
        #canvas-container {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* ── Premium Glass Mixin ── */
        .glass-panel {
            background: rgba(10, 14, 26, 0.55);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .glass-panel-light {
            background: rgba(16, 22, 40, 0.50);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* ── Top Bar ── */
        #top-bar {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 10;
            padding: 14px 26px 12px 26px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(8, 12, 24, 0.60);
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        }
        #top-bar .badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #8a9fc5;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
            margin-bottom: 4px;
        }
        #top-bar .title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(70, 130, 255, 0.15);
        }
        #top-bar .sub {
            font-size: 13px;
            font-weight: 400;
            color: #99b0d4;
            margin-top: 2px;
            opacity: 0.8;
        }

        /* ── Bottom Controls ── */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
            max-width: 96vw;
            background: rgba(8, 12, 26, 0.70);
            backdrop-filter: blur(28px) saturate(1.6);
            -webkit-backdrop-filter: blur(28px) saturate(1.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        #controls .group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #controls .group-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #7a8fb0;
            margin-right: 4px;
        }
        #controls button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 500;
            color: #c8d6ee;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(70, 130, 255, 0.15);
        }
        #controls button.active {
            background: rgba(70, 130, 255, 0.15);
            border-color: rgba(70, 130, 255, 0.30);
            color: #8bb4ff;
            box-shadow: 0 0 20px rgba(70, 130, 255, 0.05);
        }
        #controls button.primary {
            background: linear-gradient(135deg, rgba(70, 130, 255, 0.20), rgba(100, 80, 255, 0.15));
            border-color: rgba(70, 130, 255, 0.25);
            color: #aac0ff;
        }
        #controls button.primary:hover {
            background: linear-gradient(135deg, rgba(70, 130, 255, 0.30), rgba(100, 80, 255, 0.25));
            border-color: rgba(70, 130, 255, 0.40);
        }
        #controls input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.10), rgba(70, 130, 255, 0.40));
            border-radius: 4px;
            outline: none;
            transition: background 0.2s;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #6a9aff, #3a6aff);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 24px rgba(70, 130, 255, 0.5), 0 0 8px rgba(70, 130, 255, 0.3);
            transition: all 0.15s;
        }
        #controls input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        #controls input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #6a9aff, #3a6aff);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 24px rgba(70, 130, 255, 0.5);
        }
        #controls .value-display {
            font-size: 13px;
            font-weight: 600;
            color: #d0dcf5;
            min-width: 42px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ── Right Equation Panel ── */
        #eq-panel {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            padding: 20px 26px;
            min-width: 200px;
            max-width: 270px;
            pointer-events: none;
            background: rgba(8, 12, 26, 0.65);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1), transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #eq-panel.hidden {
            opacity: 0;
            transform: translateY(-50%) translateX(40px);
            pointer-events: none;
        }
        #eq-panel .eq-line {
            font-size: 15px;
            font-weight: 400;
            color: #c8d6f0;
            padding: 4px 0;
            font-family: 'Times New Roman', 'CMU Serif', serif;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.5s ease 0.1s, transform 0.4s ease;
            transform: translateX(10px);
        }
        #eq-panel .eq-line.visible {
            opacity: 1;
            transform: translateX(0);
        }
        #eq-panel .eq-line.highlight {
            color: #8bbaff;
            font-weight: 500;
            text-shadow: 0 0 30px rgba(70, 130, 255, 0.15);
        }
        #eq-panel .eq-line.result {
            color: #f5b85b;
            font-weight: 600;
            font-size: 18px;
            text-shadow: 0 0 40px rgba(245, 184, 91, 0.15);
        }
        #eq-panel .eq-divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
            margin: 8px 0;
            opacity: 0.6;
        }

        /* ── Step Indicator ── */
        #step-indicator {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            font-size: 13px;
            font-weight: 400;
            color: #8a9fc5;
            letter-spacing: 0.6px;
            background: rgba(0, 0, 0, 0.50);
            padding: 6px 22px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        #step-indicator.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        /* ── Custom Scrollbar Hide ── */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        * {
            scrollbar-width: none;
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            #top-bar {
                top: 16px;
                left: 16px;
                padding: 10px 16px;
            }
            #top-bar .title {
                font-size: 17px;
            }
            #top-bar .sub {
                font-size: 11px;
            }
            #controls {
                bottom: 16px;
                padding: 12px 16px;
                gap: 12px;
                border-radius: 18px;
                max-width: 98vw;
                flex-wrap: wrap;
            }
            #controls .group {
                gap: 6px;
            }
            #controls button {
                font-size: 10px;
                padding: 5px 10px;
                border-radius: 8px;
            }
            #controls input[type="range"] {
                width: 80px;
            }
            #eq-panel {
                right: 12px;
                padding: 14px 16px;
                min-width: 140px;
                max-width: 180px;
                top: auto;
                bottom: 90px;
                transform: none;
                border-radius: 14px;
            }
            #eq-panel .eq-line {
                font-size: 12px;
            }
            #step-indicator {
                bottom: 80px;
                font-size: 11px;
                padding: 4px 14px;
            }
        }
        @media (max-width: 480px) {
            #top-bar .title {
                font-size: 14px;
            }
            #controls {
                padding: 8px 10px;
                gap: 6px;
                border-radius: 14px;
            }
            #controls .group-label {
                font-size: 8px;
            }
            #controls button {
                font-size: 9px;
                padding: 3px 8px;
                border-radius: 6px;
            }
            #controls input[type="range"] {
                width: 50px;
            }
            #eq-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== THREE.JS CONTAINER ===== -->
    <div id="canvas-container"></div>

    <!-- ===== TOP BAR ===== -->
    <div id="top-bar">
        <div class="badge">JEE Advanced 2004 · 3D Geometry</div>
        <div class="title">Locus of A″</div>
        <div class="sub">Parallelepiped Compression · Volume 90%</div>
    </div>

    <!-- ===== EQUATION PANEL ===== -->
    <div id="eq-panel">
        <div class="eq-line" data-idx="0">V<sub>S</sub> = B · h</div>
        <div class="eq-line" data-idx="1">V<sub>T</sub> = B · h′</div>
        <div class="eq-divider" data-idx="2"></div>
        <div class="eq-line" data-idx="3">V<sub>T</sub> = 0.90 V<sub>S</sub></div>
        <div class="eq-line" data-idx="4">B h′ = 0.90 B h</div>
        <div class="eq-line highlight" data-idx="5">h′ = 0.90 h</div>
        <div class="eq-divider" data-idx="6"></div>
        <div class="eq-line" data-idx="7">A″ has fixed ⊥ distance</div>
        <div class="eq-line result" data-idx="8">Locus of A″ = Plane</div>
    </div>

    <!-- ===== STEP INDICATOR ===== -->
    <div id="step-indicator" class="hidden">Step 1 / 12</div>

    <!-- ===== BOTTOM CONTROLS ===== -->
    <div id="controls">
        <div class="group">
            <button id="btn-teacher" class="primary">▶ Teacher</button>
            <button id="btn-prev" disabled>◀</button>
            <button id="btn-next">▶</button>
            <button id="btn-reset">⟲</button>
        </div>

        <div style="width:1px;height:32px;background:rgba(255,255,255,0.06);"></div>

        <div class="group">
            <span class="group-label">Compress</span>
            <input type="range" id="compress-slider" min="70" max="100" value="100" step="0.5" />
            <span class="value-display" id="compress-val">100%</span>
        </div>

        <div style="width:1px;height:32px;background:rgba(255,255,255,0.06);"></div>

        <div class="group">
            <button id="toggle-height" class="active">H</button>
            <button id="toggle-locus" class="active">Locus</button>
            <button id="toggle-vector" class="">Vector</button>
            <button id="toggle-explore" class="">Explore</button>
        </div>
    </div>

    <!-- ===== THREE.JS IMPORTS ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  IMPORTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GEOMETRY DEFINITION (General Parallelepiped)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const A = new THREE.Vector3(0, 0, 0);
        const B = new THREE.Vector3(3.4, 0, 0);
        const D = new THREE.Vector3(1.2, 2.6, 0);
        const C = new THREE.Vector3().copy(B).add(D);
        const tVec = new THREE.Vector3(0.8, 1.0, 3.8);
        const h_orig = tVec.z;
        const h_new = 0.90 * h_orig;

        const A_p = new THREE.Vector3().copy(A).add(tVec);
        const B_p = new THREE.Vector3().copy(B).add(tVec);
        const C_p = new THREE.Vector3().copy(C).add(tVec);
        const D_p = new THREE.Vector3().copy(D).add(tVec);
        const normal = new THREE.Vector3(0, 0, 1);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  THREE.JS SETUP · CINEMATIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050712);

        // ── Camera ──
        const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(8.0, 5.8, 9.0);
        camera.lookAt(1.8, 1.2, 1.8);

        // ── Renderers ──
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '1';
        container.appendChild(labelRenderer.domElement);

        // ── Controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(1.8, 1.2, 1.8);
        controls.minDistance = 4;
        controls.maxDistance = 22;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.8;
        controls.update();

        // ── Environment & Lighting ──
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environment = envTexture;
        pmremGenerator.dispose();

        // Additional lights for dramatic effect
        const keyLight = new THREE.DirectionalLight(0xffeedd, 2.8);
        keyLight.position.set(4, 10, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.1;
        keyLight.shadow.camera.far = 30;
        keyLight.shadow.camera.left = -8;
        keyLight.shadow.camera.right = 8;
        keyLight.shadow.camera.top = 8;
        keyLight.shadow.camera.bottom = -8;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 1.2);
        fillLight.position.set(-5, 4, -8);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
        rimLight.position.set(-2, 1, 10);
        scene.add(rimLight);

        const ambientLight = new THREE.HemisphereLight(0x334477, 0x221133, 0.8);
        scene.add(ambientLight);

        // ── Post Processing (Bloom) ──
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.5, // strength
            0.4, // radius
            0.15 // threshold
        );
        composer.addPass(bloomPass);
        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // ── Particle System (Starfield) ──
        const starCount = 800;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 80;
            starPos[i] *= (i % 3 === 2) ? 0.4 : 1.0; // flatten z a bit
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0x99ccff,
            size: 0.04,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starGeo, starMat);
        stars.position.set(0, 0, 0);
        scene.add(stars);

        // ── Glowing Grid (Custom Radial) ──
        const gridHelper = new THREE.GridHelper(16, 24, 0x4466aa, 0x224488);
        gridHelper.position.y = -0.01;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.blending = THREE.AdditiveBlending;
        scene.add(gridHelper);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {
            compression: 1.0,
            showHeight: true,
            showLocus: true,
            showVector: false,
            exploreMode: false,
            teacherMode: false,
            teacherStep: 0,
            totalSteps: 12,
            isPlaying: false,
            a2Offset: new THREE.Vector2(0, 0),
            targetA2Offset: new THREE.Vector2(0, 0),
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BUILD THE SCENE · PREMIUM MATERIALS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // Helper to dispose groups and clean up CSS2D labels
        function disposeGroup(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isMesh) {
                    child.geometry?.dispose();
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material?.dispose();
                } else if (child.isLine || child.isLineSegments) {
                    child.geometry?.dispose();
                    child.material?.dispose();
                } else if (child.isCSS2DObject) {
                    // Remove the DOM element to prevent ghost labels
                    if (child.element && child.element.parentNode) {
                        child.element.parentNode.removeChild(child.element);
                    }
                }
            });
            // No need to remove from parent here; caller does scene.remove
        }

        function makeLabel(text, color = '#e0eaff', size = '14px', offset = new THREE.Vector3(0, 0, 0)) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontFamily = 'Inter, sans-serif';
            div.style.fontSize = size;
            div.style.fontWeight = '500';
            div.style.textShadow = '0 0 30px rgba(0,20,40,0.9), 0 0 60px rgba(0,0,0,0.8)';
            div.style.letterSpacing = '0.4px';
            div.style.pointerEvents = 'none';
            div.style.background = 'rgba(0,0,0,0.2)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '8px';
            div.style.backdropFilter = 'blur(4px)';
            div.style.border = '1px solid rgba(255,255,255,0.04)';
            const label = new CSS2DObject(div);
            label.userData.offset = offset.clone();
            return label;
        }

        function makePointMesh(pos, color = 0x4a7aff, size = 0.2) {
            const geo = new THREE.SphereGeometry(size, 28, 28);
            const mat = new THREE.MeshPhysicalMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.6,
                metalness: 0.1,
                roughness: 0.05,
                transparent: true,
                opacity: 0.95,
                clearcoat: 0.4,
                clearcoatRoughness: 0.2,
                envMapIntensity: 1.5,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            return mesh;
        }

        // ── Premium Materials ──
        const matBase = new THREE.MeshPhysicalMaterial({
            color: 0x3a7abd,
            metalness: 0.05,
            roughness: 0.08,
            transparent: true,
            opacity: 0.30,
            envMapIntensity: 1.8,
            clearcoat: 0.2,
            clearcoatRoughness: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const matBaseEdge = new THREE.LineBasicMaterial({
            color: 0x6a9af0,
            transparent: true,
            opacity: 0.5,
        });

        const matUpperOrig = new THREE.MeshPhysicalMaterial({
            color: 0x5a8ac0,
            metalness: 0.05,
            roughness: 0.1,
            transparent: true,
            opacity: 0.25,
            envMapIntensity: 1.5,
            clearcoat: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const matUpperOrigEdge = new THREE.LineBasicMaterial({
            color: 0x7aaae0,
            transparent: true,
            opacity: 0.6,
        });

        const matUpperNew = new THREE.MeshPhysicalMaterial({
            color: 0xffaa44,
            metalness: 0.1,
            roughness: 0.05,
            transparent: true,
            opacity: 0.45,
            envMapIntensity: 2.2,
            emissive: 0xffaa44,
            emissiveIntensity: 0.08,
            clearcoat: 0.4,
            clearcoatRoughness: 0.15,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const matUpperNewEdge = new THREE.LineBasicMaterial({
            color: 0xffbb55,
            transparent: true,
            opacity: 0.9,
        });

        const matSide = new THREE.MeshPhysicalMaterial({
            color: 0x4a6a9a,
            metalness: 0.0,
            roughness: 0.3,
            transparent: true,
            opacity: 0.08,
            side: THREE.DoubleSide,
            depthWrite: false,
        });

        const matLocus = new THREE.MeshPhysicalMaterial({
            color: 0x70a0ff,
            transparent: true,
            opacity: 0.04,
            metalness: 0.0,
            roughness: 0.3,
            side: THREE.DoubleSide,

        });
        const matLocusGrid = new THREE.LineBasicMaterial({
            color: 0x4a7aff,
            transparent: true,
            opacity: 0.15,
        });

        const matHeightLine = new THREE.LineBasicMaterial({

            opacity: 0.8,
        });
        const matHeightDash = new THREE.LineDashedMaterial({
            color: 0xff8844,

            gapSize: 0.06,

            opacity: 0.4,
        });

        // ── Build Parallelepiped ──
        function buildParallelepiped(verts, faceMat, edgeMat, labelColor = '#7aaae0') {
            const group = new THREE.Group();
            const indices = [
                0, 1, 2, 0, 2, 3,
                4, 6, 5, 4, 7, 6,
                0, 1, 5, 0, 5, 4,
                1, 2, 6, 1, 6, 5,
                2, 3, 7, 2, 7, 6,
                3, 0, 4, 3, 4, 7,
            ];
            const positions = [];
            for (const v of verts) positions.push(v.x, v.y, v.z);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();

            const mesh = new THREE.Mesh(geo, faceMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            const edgePairs = [
                [0, 1],
                [1, 2],
                [2, 3],
                [3, 0],
                [4, 5],
                [5, 6],
                [6, 7],
                [7, 4],
                [0, 4],
                [1, 5],
                [2, 6],
                [3, 7]
            ];
            const edgePos = [];
            for (const [i, j] of edgePairs) {
                const a = verts[i],
                    b = verts[j];
                edgePos.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
            const edgeGeo = new THREE.BufferGeometry();
            edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
            const line = new THREE.LineSegments(edgeGeo, edgeMat);
            group.add(line);

            const labels = ['A', 'B', 'C', 'D', "A'", "B'", "C'", "D'"];
            const offsets = [
                new THREE.Vector3(-0.35, -0.35, 0),
                new THREE.Vector3(0.35, -0.35, 0),
                new THREE.Vector3(0.35, 0.35, 0),
                new THREE.Vector3(-0.35, 0.35, 0),
                new THREE.Vector3(-0.35, -0.35, 0.2),
                new THREE.Vector3(0.35, -0.35, 0.2),
                new THREE.Vector3(0.35, 0.35, 0.2),
                new THREE.Vector3(-0.35, 0.35, 0.2),
            ];
            for (let i = 0; i < 8; i++) {
                const label = makeLabel(labels[i], labelColor, '13px', offsets[i]);
                label.position.copy(verts[i]).add(offsets[i]);
                group.add(label);
            }
            return group;
        }

        // ── Scene Build ──
        let currentVerts = [A, B, C, D, A_p, B_p, C_p, D_p];
        let paraGroup = null,
            paraGroupNew = null,
            locusGroup = null,
            heightGroup = null,
            vectorGroup = null;
        let a2Point = null,
            a2Label = null;
        let locusPoints = [];

        function buildScene(compression) {
            // Clean up all old groups and labels
            if (paraGroup) { scene.remove(paraGroup);
                disposeGroup(paraGroup);
                paraGroup = null; }
            if (paraGroupNew) { scene.remove(paraGroupNew);
                disposeGroup(paraGroupNew);
                paraGroupNew = null; }
            if (locusGroup) { scene.remove(locusGroup);
                disposeGroup(locusGroup);
                locusGroup = null; }
            if (heightGroup) { scene.remove(heightGroup);
                disposeGroup(heightGroup);
                heightGroup = null; }
            if (vectorGroup) { scene.remove(vectorGroup);
                disposeGroup(vectorGroup);
                vectorGroup = null; }
            if (a2Point) { scene.remove(a2Point);
                a2Point = null; }
            if (a2Label) { scene.remove(a2Label);
                a2Label = null; }
            for (const p of locusPoints) { scene.remove(p);
                disposeGroup(p); } // p is a mesh, but disposeGroup handles meshes
            locusPoints = [];

            const h_cur = h_orig * compression;
            const t_cur = new THREE.Vector3(tVec.x, tVec.y, h_cur);
            const A_cur = new THREE.Vector3().copy(A).add(t_cur);
            const B_cur = new THREE.Vector3().copy(B).add(t_cur);
            const C_cur = new THREE.Vector3().copy(C).add(t_cur);
            const D_cur = new THREE.Vector3().copy(D).add(t_cur);
            const verts_cur = [A, B, C, D, A_cur, B_cur, C_cur, D_cur];

            const isCompressed = compression < 0.995;

            // Original solid (with labels for all vertices)
            const matFace = isCompressed ? matSide : matBase;
            const matEdge = isCompressed ? matBaseEdge : matBaseEdge;
            const labelCol = isCompressed ? '#7a8aac' : '#7aaae0';
            paraGroup = buildParallelepiped(verts_cur, matFace, matEdge, labelCol);
            scene.add(paraGroup);

            if (isCompressed) {
                // New upper face (A'', B'', C'', D'')
                const gNew = new THREE.Group();
                const topPos = [];
                for (const i of [4, 6, 5, 4, 7, 6]) {
                    const v = verts_cur[i];
                    topPos.push(v.x, v.y, v.z);
                }
                const topGeo = new THREE.BufferGeometry();
                topGeo.setAttribute('position', new THREE.Float32BufferAttribute(topPos, 3));
                topGeo.computeVertexNormals();
                const topMesh = new THREE.Mesh(topGeo, matUpperNew);
                topMesh.castShadow = true;
                gNew.add(topMesh);

                const edgePairsNew = [
                    [4, 5],
                    [5, 6],
                    [6, 7],
                    [7, 4]
                ];
                const edgePosNew = [];
                for (const [i, j] of edgePairsNew) {
                    const a = verts_cur[i],
                        b = verts_cur[j];
                    edgePosNew.push(a.x, a.y, a.z, b.x, b.y, b.z);
                }
                const edgeGeoNew = new THREE.BufferGeometry();
                edgeGeoNew.setAttribute('position', new THREE.Float32BufferAttribute(edgePosNew, 3));
                const lineNew = new THREE.LineSegments(edgeGeoNew, matUpperNewEdge);
                gNew.add(lineNew);

                const labs = ["A''", "B''", "C''", "D''"];
                const offs = [
                    new THREE.Vector3(-0.35, -0.35, 0.2),
                    new THREE.Vector3(0.35, -0.35, 0.2),
                    new THREE.Vector3(0.35, 0.35, 0.2),
                    new THREE.Vector3(-0.35, 0.35, 0.2),
                ];
                for (let i = 0; i < 4; i++) {
                    const idx = i + 4;
                    const lbl = makeLabel(labs[i], '#f0c070', '14px', offs[i]);
                    lbl.position.copy(verts_cur[idx]).add(offs[i]);
                    gNew.add(lbl);
                }
                scene.add(gNew);
                paraGroupNew = gNew;

                // A'' Point
                const a2Pos = new THREE.Vector3().copy(A_cur);
                a2Point = makePointMesh(a2Pos, 0xff8844, 0.24);
                scene.add(a2Point);

                const a2LblDiv = document.createElement('div');
                a2LblDiv.textContent = 'A″';
                a2LblDiv.style.color = '#ff8844';
                a2LblDiv.style.fontFamily = 'Inter, sans-serif';
                a2LblDiv.style.fontSize = '17px';
                a2LblDiv.style.fontWeight = '600';
                a2LblDiv.style.textShadow = '0 0 40px rgba(255,136,68,0.5), 0 0 80px rgba(255,136,68,0.2)';
                a2LblDiv.style.background = 'rgba(0,0,0,0.2)';
                a2LblDiv.style.padding = '2px 10px';
                a2LblDiv.style.borderRadius = '12px';
                a2LblDiv.style.backdropFilter = 'blur(8px)';
                a2LblDiv.style.border = '1px solid rgba(255,136,68,0.15)';
                a2Label = new CSS2DObject(a2LblDiv);
                a2Label.position.copy(a2Pos).add(new THREE.Vector3(0.4, 0.4, 0.3));
                scene.add(a2Label);

                // Locus Plane
                if (state.showLocus) {
                    const locusZ = h_cur;
                    const planeGeo = new THREE.PlaneGeometry(14, 14);
                    const planeMesh = new THREE.Mesh(planeGeo, matLocus);
                    planeMesh.position.set(1.8, 1.2, locusZ);
                    planeMesh.rotation.x = -Math.PI / 2;
                    scene.add(planeMesh);

                    const gridSize = 12,
                        gridDiv = 24,
                        half = gridSize / 2;
                    const gridPts = [];
                    for (let i = 0; i <= gridDiv; i++) {
                        const t = -half + (i / gridDiv) * gridSize;
                        gridPts.push(new THREE.Vector3(t, -half, locusZ), new THREE.Vector3(t, half, locusZ));
                        gridPts.push(new THREE.Vector3(-half, t, locusZ), new THREE.Vector3(half, t, locusZ));
                    }
                    const gridGeo2 = new THREE.BufferGeometry();
                    const gridPos2 = [];
                    for (const p of gridPts) {
                        gridPos2.push(p.x + 1.8, p.y + 1.2, p.z);
                    }
                    gridGeo2.setAttribute('position', new THREE.Float32BufferAttribute(gridPos2, 3));
                    const gridLine = new THREE.LineSegments(gridGeo2, matLocusGrid);
                    scene.add(gridLine);

                    locusGroup = new THREE.Group();
                    locusGroup.add(planeMesh);
                    locusGroup.add(gridLine);
                    scene.add(locusGroup);

                    // Sample points
                    const samplePositions = [
                        [-1.0, -0.8],
                        [1.2, -1.2],
                        [-0.5, 1.5],
                        [1.8, 0.9],
                        [-1.5, 0.6],
                        [0.2, -1.6],
                        [2.2, -0.7],
                        [-1.8, 1.2],
                        [0.8, 1.8],
                        [-1.2, -1.4],
                        [0.0, 0.0]
                    ];
                    for (const [dx, dy] of samplePositions) {
                        const p = new THREE.Vector3(A.x + tVec.x + dx, A.y + tVec.y + dy, locusZ);
                        const dot = makePointMesh(p, 0x4a7aff, 0.05);
                        dot.material.transparent = true;
                        dot.material.opacity = 0.2;
                        scene.add(dot);
                        locusPoints.push(dot);
                    }
                }

                // Height
                if (state.showHeight) {
                    heightGroup = new THREE.Group();
                    const foot = new THREE.Vector3(A_cur.x, A_cur.y, 0);
                    const top = new THREE.Vector3(A_cur.x, A_cur.y, A_cur.z);

                    const hGeo = new THREE.BufferGeometry();
                    const hPos = [foot.x, foot.y, foot.z, top.x, top.y, top.z];
                    hGeo.setAttribute('position', new THREE.Float32BufferAttribute(hPos, 3));
                    const hLine = new THREE.Line(hGeo, matHeightLine);
                    heightGroup.add(hLine);

                    const dashGeo = new THREE.BufferGeometry();
                    const dashPos = [top.x, top.y, top.z, top.x, top.y, h_orig];
                    dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(dashPos, 3));
                    const dashLine = new THREE.Line(dashGeo, matHeightDash);
                    dashLine.computeLineDistances();
                    heightGroup.add(dashLine);

                    const rSize = 0.15;
                    const rPts = [
                        new THREE.Vector3(foot.x + rSize, foot.y, foot.z),
                        new THREE.Vector3(foot.x + rSize, foot.y + rSize, foot.z),
                        new THREE.Vector3(foot.x, foot.y + rSize, foot.z),
                    ];
                    const rGeo = new THREE.BufferGeometry();
                    const rPos = [];
                    for (const p of rPts) rPos.push(p.x, p.y, p.z);
                    rGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPos, 3));
                    const rLine = new THREE.Line(rGeo, matHeightLine);
                    heightGroup.add(rLine);

                    const hLabel = makeLabel(`h′ = ${(compression * 100).toFixed(0)}% of h`, '#ff8844', '15px');
                    const mid = new THREE.Vector3().copy(foot).add(top).multiplyScalar(0.5);
                    hLabel.position.copy(mid).add(new THREE.Vector3(0.45, 0, 0));
                    heightGroup.add(hLabel);

                    const hLabel2 = makeLabel(`h = ${h_orig.toFixed(1)}`, '#ff8844', '12px');
                    const mid2 = new THREE.Vector3(top.x, top.y, (top.z + h_orig) / 2);
                    hLabel2.position.copy(mid2).add(new THREE.Vector3(0.45, 0, 0));
                    heightGroup.add(hLabel2);

                    scene.add(heightGroup);
                }

                // Vector mode
                if (state.showVector) {
                    vectorGroup = new THREE.Group();
                    const nVec = new THREE.Vector3(0, 0, 1);
                    const nStart = new THREE.Vector3(1.8, 1.2, 0);
                    const nEnd = new THREE.Vector3(1.8, 1.2, 1.8);
                    const arrow = makeArrow(nStart, nEnd, 0x66aaff, 0.35, 0.18);
                    if (arrow) vectorGroup.add(arrow);

                    const nLabel = makeLabel('n = AB × AD', '#66aaff', '14px');
                    nLabel.position.copy(nEnd).add(new THREE.Vector3(0.4, 0, 0.3));
                    vectorGroup.add(nLabel);

                    const aToA2 = new THREE.Vector3().copy(A_cur).sub(A);
                    const vStart = new THREE.Vector3().copy(A);
                    const vEnd = new THREE.Vector3().copy(A_cur);
                    const arrow2 = makeArrow(vStart, vEnd, 0xffaa66, 0.3, 0.14);
                    if (arrow2) vectorGroup.add(arrow2);

                    const vLabel = makeLabel('AA″', '#ffaa66', '13px');
                    const midV = new THREE.Vector3().copy(vStart).add(vEnd).multiplyScalar(0.5);
                    vLabel.position.copy(midV).add(new THREE.Vector3(0.4, 0.4, 0));
                    vectorGroup.add(vLabel);

                    const projLabel = makeLabel('n · AA″ = const', '#88ddff', '14px');
                    projLabel.position.set(1.8 + 2.8, 1.2 + 1.6, 0.6);
                    vectorGroup.add(projLabel);

                    scene.add(vectorGroup);
                }
            } else {
                // Not compressed: show original height
                if (state.showHeight) {
                    heightGroup = new THREE.Group();
                    const foot = new THREE.Vector3(A_p.x, A_p.y, 0);
                    const top = new THREE.Vector3(A_p.x, A_p.y, A_p.z);

                    const hGeo = new THREE.BufferGeometry();
                    const hPos = [foot.x, foot.y, foot.z, top.x, top.y, top.z];
                    hGeo.setAttribute('position', new THREE.Float32BufferAttribute(hPos, 3));
                    const hLine = new THREE.Line(hGeo, matHeightLine);
                    heightGroup.add(hLine);

                    const hLabel = makeLabel(`h = ${h_orig.toFixed(1)}`, '#ff8844', '15px');
                    const mid = new THREE.Vector3().copy(foot).add(top).multiplyScalar(0.5);
                    hLabel.position.copy(mid).add(new THREE.Vector3(0.45, 0, 0));
                    heightGroup.add(hLabel);

                    const rSize = 0.15;
                    const rPts = [
                        new THREE.Vector3(foot.x + rSize, foot.y, foot.z),
                        new THREE.Vector3(foot.x + rSize, foot.y + rSize, foot.z),
                        new THREE.Vector3(foot.x, foot.y + rSize, foot.z),
                    ];
                    const rGeo = new THREE.BufferGeometry();
                    const rPos = [];
                    for (const p of rPts) rPos.push(p.x, p.y, p.z);
                    rGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPos, 3));
                    const rLine = new THREE.Line(rGeo, matHeightLine);
                    heightGroup.add(rLine);

                    scene.add(heightGroup);
                }
            }
            updateEquations(compression);
        }

        function makeArrow(from, to, color = 0xff6644, headLength = 0.3, headWidth = 0.16) {
            const dir = new THREE.Vector3().copy(to).sub(from);
            const len = dir.length();
            if (len < 0.001) return null;
            dir.normalize();
            const arrow = new THREE.ArrowHelper(dir, from, len, color, headLength, headWidth);
            arrow.line.material.linewidth = 2;
            arrow.line.material.transparent = true;
            arrow.line.material.opacity = 0.9;
            return arrow;
        }

        // ── Equation panel update ──
        function updateEquations(compression) {
            const lines = document.querySelectorAll('#eq-panel .eq-line');
            const showAll = compression < 0.995;
            const showIdx = [0];
            if (showAll) showIdx.push(1, 3, 4, 5, 7, 8);

            lines.forEach((el, i) => {
                const idx = parseInt(el.dataset.idx);
                if (showIdx.includes(idx)) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
                if (idx === 1) {
                    el.innerHTML = `V<sub>T</sub> = B · h′ = B · ${(compression * h_orig).toFixed(2)}`;
                }
                if (idx === 4) {
                    el.innerHTML = `B · ${(compression * h_orig).toFixed(2)} = 0.90 B · ${h_orig.toFixed(2)}`;
                }
                if (idx === 5) {
                    el.innerHTML = `h′ = ${(compression * 100).toFixed(0)}% h`;
                }
                if (idx === 7) {
                    el.innerHTML = `A″ has fixed ⊥ distance = ${(compression * h_orig).toFixed(2)}`;
                }
            });
            document.querySelectorAll('#eq-panel .eq-divider').forEach((el) => {
                el.style.opacity = showAll ? '0.6' : '0';
            });
        }

        // ── Update compression ──
        function updateCompression(value) {
            const clamped = Math.max(0.70, Math.min(1.00, value));
            state.compression = clamped;
            document.getElementById('compress-val').textContent = `${Math.round(clamped * 100)}%`;
            document.getElementById('compress-slider').value = clamped * 100;
            buildScene(clamped);
        }

        let currentOffsetX = 0,
            currentOffsetY = 0;

        function rebuildWithOffset(dx, dy) {
            currentOffsetX = dx;
            currentOffsetY = dy;
            const h_cur = h_orig * state.compression;
            const t_cur = new THREE.Vector3(tVec.x + dx, tVec.y + dy, h_cur);
            const A_cur = new THREE.Vector3().copy(A).add(t_cur);
            const B_cur = new THREE.Vector3().copy(B).add(t_cur);
            const C_cur = new THREE.Vector3().copy(C).add(t_cur);
            const D_cur = new THREE.Vector3().copy(D).add(t_cur);
            const verts_cur = [A, B, C, D, A_cur, B_cur, C_cur, D_cur];

            if (paraGroupNew) { scene.remove(paraGroupNew);
                disposeGroup(paraGroupNew);
                paraGroupNew = null; }
            if (a2Point) { scene.remove(a2Point);
                a2Point = null; }
            if (a2Label) { scene.remove(a2Label);
                a2Label = null; }

            const gNew = new THREE.Group();
            const topPos = [];
            for (const i of [4, 6, 5, 4, 7, 6]) {
                const v = verts_cur[i];
                topPos.push(v.x, v.y, v.z);
            }
            const topGeo = new THREE.BufferGeometry();
            topGeo.setAttribute('position', new THREE.Float32BufferAttribute(topPos, 3));
            topGeo.computeVertexNormals();
            const topMesh = new THREE.Mesh(topGeo, matUpperNew);
            topMesh.castShadow = true;
            gNew.add(topMesh);

            const edgePairsNew = [
                [4, 5],
                [5, 6],
                [6, 7],
                [7, 4]
            ];
            const edgePosNew = [];
            for (const [i, j] of edgePairsNew) {
                const a = verts_cur[i],
                    b = verts_cur[j];
                edgePosNew.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
            const edgeGeoNew = new THREE.BufferGeometry();
            edgeGeoNew.setAttribute('position', new THREE.Float32BufferAttribute(edgePosNew, 3));
            const lineNew = new THREE.LineSegments(edgeGeoNew, matUpperNewEdge);
            gNew.add(lineNew);

            const labs = ["A''", "B''", "C''", "D''"];
            const offs = [
                new THREE.Vector3(-0.35, -0.35, 0.2),
                new THREE.Vector3(0.35, -0.35, 0.2),
                new THREE.Vector3(0.35, 0.35, 0.2),
                new THREE.Vector3(-0.35, 0.35, 0.2),
            ];
            for (let i = 0; i < 4; i++) {
                const idx = i + 4;
                const lbl = makeLabel(labs[i], '#f0c070', '14px', offs[i]);
                lbl.position.copy(verts_cur[idx]).add(offs[i]);
                gNew.add(lbl);
            }
            scene.add(gNew);
            paraGroupNew = gNew;

            const a2Pos = new THREE.Vector3().copy(A_cur);
            a2Point = makePointMesh(a2Pos, 0xff8844, 0.24);
            scene.add(a2Point);

            const a2LblDiv = document.createElement('div');
            a2LblDiv.textContent = 'A″';
            a2LblDiv.style.color = '#ff8844';
            a2LblDiv.style.fontFamily = 'Inter, sans-serif';
            a2LblDiv.style.fontSize = '17px';
            a2LblDiv.style.fontWeight = '600';
            a2LblDiv.style.textShadow = '0 0 40px rgba(255,136,68,0.5), 0 0 80px rgba(255,136,68,0.2)';
            a2LblDiv.style.background = 'rgba(0,0,0,0.2)';
            a2LblDiv.style.padding = '2px 10px';
            a2LblDiv.style.borderRadius = '12px';
            a2LblDiv.style.backdropFilter = 'blur(8px)';
            a2LblDiv.style.border = '1px solid rgba(255,136,68,0.15)';
            a2Label = new CSS2DObject(a2LblDiv);
            a2Label.position.copy(a2Pos).add(new THREE.Vector3(0.4, 0.4, 0.3));
            scene.add(a2Label);

            // Update height group
            if (heightGroup) {
                scene.remove(heightGroup);
                disposeGroup(heightGroup);
                heightGroup = null;
                if (state.showHeight) {
                    heightGroup = new THREE.Group();
                    const foot = new THREE.Vector3(A_cur.x, A_cur.y, 0);
                    const top = new THREE.Vector3(A_cur.x, A_cur.y, A_cur.z);
                    const hGeo = new THREE.BufferGeometry();
                    const hPos = [foot.x, foot.y, foot.z, top.x, top.y, top.z];
                    hGeo.setAttribute('position', new THREE.Float32BufferAttribute(hPos, 3));
                    const hLine = new THREE.Line(hGeo, matHeightLine);
                    heightGroup.add(hLine);
                    const dashGeo = new THREE.BufferGeometry();
                    const dashPos = [top.x, top.y, top.z, top.x, top.y, h_orig];
                    dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(dashPos, 3));
                    const dashLine = new THREE.Line(dashGeo, matHeightDash);
                    dashLine.computeLineDistances();
                    heightGroup.add(dashLine);
                    const rSize = 0.15;
                    const rPts = [
                        new THREE.Vector3(foot.x + rSize, foot.y, foot.z),
                        new THREE.Vector3(foot.x + rSize, foot.y + rSize, foot.z),
                        new THREE.Vector3(foot.x, foot.y + rSize, foot.z),
                    ];
                    const rGeo = new THREE.BufferGeometry();
                    const rPos = [];
                    for (const p of rPts) rPos.push(p.x, p.y, p.z);
                    rGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPos, 3));
                    const rLine = new THREE.Line(rGeo, matHeightLine);
                    heightGroup.add(rLine);
                    const hLabel = makeLabel(`h′ = ${(state.compression * 100).toFixed(0)}% of h`, '#ff8844', '15px');
                    const mid = new THREE.Vector3().copy(foot).add(top).multiplyScalar(0.5);
                    hLabel.position.copy(mid).add(new THREE.Vector3(0.45, 0, 0));
                    heightGroup.add(hLabel);
                    scene.add(heightGroup);
                }
            }

            // Update locus group
            if (locusGroup) {
                scene.remove(locusGroup);
                disposeGroup(locusGroup);
                locusGroup = null;
                if (state.showLocus) {
                    const locusZ = h_cur;
                    const planeGeo = new THREE.PlaneGeometry(14, 14);
                    const planeMesh = new THREE.Mesh(planeGeo, matLocus);
                    planeMesh.position.set(1.8 + dx, 1.2 + dy, locusZ);
                    planeMesh.rotation.x = -Math.PI / 2;
                    scene.add(planeMesh);

                    const gridSize = 12,
                        gridDiv = 24,
                        half = gridSize / 2;
                    const gridPts = [];
                    for (let i = 0; i <= gridDiv; i++) {
                        const t = -half + (i / gridDiv) * gridSize;
                        gridPts.push(new THREE.Vector3(t, -half, locusZ), new THREE.Vector3(t, half, locusZ));
                        gridPts.push(new THREE.Vector3(-half, t, locusZ), new THREE.Vector3(half, t, locusZ));
                    }
                    const gridGeo2 = new THREE.BufferGeometry();
                    const gridPos2 = [];
                    for (const p of gridPts) {
                        gridPos2.push(p.x + 1.8 + dx, p.y + 1.2 + dy, p.z);
                    }
                    gridGeo2.setAttribute('position', new THREE.Float32BufferAttribute(gridPos2, 3));
                    const gridLine = new THREE.LineSegments(gridGeo2, matLocusGrid);
                    scene.add(gridLine);

                    locusGroup = new THREE.Group();
                    locusGroup.add(planeMesh);
                    locusGroup.add(gridLine);
                    scene.add(locusGroup);

                    for (const p of locusPoints) { scene.remove(p);
                        disposeGroup(p); }
                    locusPoints = [];
                    const samplePositions = [
                        [-1.0, -0.8],
                        [1.2, -1.2],
                        [-0.5, 1.5],
                        [1.8, 0.9],
                        [-1.5, 0.6],
                        [0.2, -1.6],
                        [2.2, -0.7],
                        [-1.8, 1.2],
                        [0.8, 1.8],
                        [-1.2, -1.4],
                        [0.0, 0.0]
                    ];
                    for (const [sx, sy] of samplePositions) {
                        const p = new THREE.Vector3(A.x + tVec.x + sx + dx, A.y + tVec.y + sy + dy, locusZ);
                        const dot = makePointMesh(p, 0x4a7aff, 0.05);
                        dot.material.transparent = true;
                        dot.material.opacity = 0.2;
                        scene.add(dot);
                        locusPoints.push(dot);
                    }
                }
            }
        }

        // ── Teacher Mode ──
        const teacherSteps = [
            { label: 'Original Parallelepiped S', desc: 'Base ABCD · Upper A′B′C′D′' },
            { label: 'Base & Height', desc: 'Base area B · Perpendicular height h' },
            { label: 'Volume Vₛ = B·h', desc: 'Original volume' },
            { label: 'Compression begins', desc: 'Upper face moves toward base' },
            { label: 'V_T = 90% Vₛ', desc: 'Volume reduced to 90%' },
            { label: 'Same base, new height', desc: 'B·h′ = 0.90·B·h' },
            { label: 'h′ = 0.90 h', desc: 'Perpendicular height reduced to 90%' },
            { label: 'New parallelepiped T', desc: 'A″B″C″D″ at fixed height' },
            { label: 'Fixed distance', desc: 'A″ has fixed ⊥ distance from base' },
            { label: 'A″ moves on plane', desc: 'Two degrees of freedom' },
            { label: 'Locus = Plane', desc: 'All possible positions of A″' },
            { label: 'Proof complete', desc: 'Locus of A″ is a plane ∥ to ABCD' },
        ];

        let teacherStepIndex = 0,
            teacherPlaying = false,
            teacherInterval = null;

        function goToTeacherStep(idx) {
            idx = Math.max(0, Math.min(teacherSteps.length - 1, idx));
            teacherStepIndex = idx;
            const step = teacherSteps[idx];
            document.getElementById('step-indicator').textContent =
                `Step ${idx+1}/${teacherSteps.length} · ${step.label}`;
            document.getElementById('step-indicator').classList.remove('hidden');

            let compression = 1.0;
            if (idx >= 3 && idx <= 6) {
                const t = (idx - 3) / 3;
                compression = 1.0 - t * 0.10;
            } else if (idx >= 7) {
                compression = 0.90;
            }
            if (idx <= 2) compression = 1.0;

            const showLocus = idx >= 8;
            const showHeight = idx >= 1;
            const showVector = idx >= 10;

            state.showLocus = showLocus;
            state.showHeight = showHeight;
            state.showVector = showVector;

            document.getElementById('toggle-locus').classList.toggle('active', showLocus);
            document.getElementById('toggle-height').classList.toggle('active', showHeight);
            document.getElementById('toggle-vector').classList.toggle('active', showVector);

            if (idx >= 9) {
                const angle = idx * 0.8;
                const rad = 0.6;
                currentOffsetX = Math.cos(angle) * rad;
                currentOffsetY = Math.sin(angle * 0.7) * rad;
            } else {
                currentOffsetX = 0;
                currentOffsetY = 0;
            }

            updateCompression(compression);
            if (compression < 0.995) {
                rebuildWithOffset(currentOffsetX, currentOffsetY);
            } else {
                buildScene(compression);
            }

            document.getElementById('btn-prev').disabled = idx === 0;
            document.getElementById('btn-next').disabled = idx === teacherSteps.length - 1;
        }

        function teacherPlayPause() {
            teacherPlaying = !teacherPlaying;
            if (teacherPlaying) {
                teacherInterval = setInterval(() => {
                    if (teacherStepIndex < teacherSteps.length - 1) {
                        goToTeacherStep(teacherStepIndex + 1);
                    } else {
                        teacherPlaying = false;
                        clearInterval(teacherInterval);
                        document.getElementById('btn-teacher').textContent = '▶ Teacher';
                    }
                }, 2200);
                document.getElementById('btn-teacher').textContent = '⏸ Pause';
            } else {
                clearInterval(teacherInterval);
                document.getElementById('btn-teacher').textContent = '▶ Teacher';
            }
        }

        // ── Explore Mode ──
        let isExploring = false,
            isDraggingA2 = false;

        function enableExploreMode(enabled) {
            isExploring = enabled;
            document.getElementById('toggle-explore').classList.toggle('active', enabled);
            if (enabled) {
                state.showLocus = true;
                document.getElementById('toggle-locus').classList.add('active');
                updateCompression(0.90);
                renderer.domElement.style.cursor = 'grab';
            } else {
                renderer.domElement.style.cursor = 'default';
                currentOffsetX = 0;
                currentOffsetY = 0;
                if (state.compression < 0.995) rebuildWithOffset(0, 0);
            }
        }

        // ── Drag Handling ──
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function getIntersectOnLocus(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const h_cur = h_orig * state.compression;
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -h_cur);
            const target = new THREE.Vector3();
            const intersect = raycaster.ray.intersectPlane(plane, target);
            return intersect || null;
        }

        function onPointerDown(event) {
            if (!isExploring || state.compression > 0.995) return;
            const pt = getIntersectOnLocus(event);
            if (pt && a2Point) {
                if (pt.distanceTo(a2Point.position) < 0.9) {
                    isDraggingA2 = true;
                    renderer.domElement.style.cursor = 'grabbing';
                }
            }
        }

        function onPointerMove(event) {
            if (!isExploring) return;
            if (isDraggingA2) {
                const pt = getIntersectOnLocus(event);
                if (pt) {
                    const dx = pt.x - (A.x + tVec.x);
                    const dy = pt.y - (A.y + tVec.y);
                    const clampedDx = Math.max(-2.5, Math.min(2.5, dx));
                    const clampedDy = Math.max(-2.5, Math.min(2.5, dy));
                    currentOffsetX = clampedDx;
                    currentOffsetY = clampedDy;
                    rebuildWithOffset(clampedDx, clampedDy);
                }
            } else {
                const pt = getIntersectOnLocus(event);
                if (pt && a2Point && state.compression < 0.995) {
                    if (pt.distanceTo(a2Point.position) < 0.9) {
                        renderer.domElement.style.cursor = 'grab';
                    } else {
                        renderer.domElement.style.cursor = 'default';
                    }
                } else {
                    renderer.domElement.style.cursor = 'default';
                }
            }
        }

        function onPointerUp() { isDraggingA2 = false;
            renderer.domElement.style.cursor = 'grab'; }

        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup', onPointerUp);
        renderer.domElement.addEventListener('pointerleave', onPointerUp);

        // ── UI Bindings ──
        document.getElementById('compress-slider').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) / 100;
            if (state.teacherMode) {
                state.teacherMode = false;
                document.getElementById('btn-teacher').textContent = '▶ Teacher';
                if (teacherInterval) { clearInterval(teacherInterval);
                    teacherInterval = null;
                    teacherPlaying = false; }
            }
            currentOffsetX = 0;
            currentOffsetY = 0;
            updateCompression(val);
        });

        document.getElementById('toggle-height').addEventListener('click', () => {
            state.showHeight = !state.showHeight;
            document.getElementById('toggle-height').classList.toggle('active', state.showHeight);
            buildScene(state.compression);
        });
        document.getElementById('toggle-locus').addEventListener('click', () => {
            state.showLocus = !state.showLocus;
            document.getElementById('toggle-locus').classList.toggle('active', state.showLocus);
            buildScene(state.compression);
        });
        document.getElementById('toggle-vector').addEventListener('click', () => {
            state.showVector = !state.showVector;
            document.getElementById('toggle-vector').classList.toggle('active', state.showVector);
            buildScene(state.compression);
        });
        document.getElementById('toggle-explore').addEventListener('click', () => {
            const enabled = !isExploring;
            enableExploreMode(enabled);
            if (enabled) {
                state.teacherMode = false;
                document.getElementById('btn-teacher').textContent = '▶ Teacher';
                if (teacherInterval) { clearInterval(teacherInterval);
                    teacherInterval = null;
                    teacherPlaying = false; }
                document.getElementById('step-indicator').classList.add('hidden');
            }
        });

        document.getElementById('btn-teacher').addEventListener('click', () => {
            if (state.teacherMode) {
                if (teacherPlaying) { teacherPlayPause(); return; }
                if (teacherStepIndex === teacherSteps.length - 1) goToTeacherStep(0);
                teacherPlayPause();
                return;
            }
            state.teacherMode = true;
            state.exploreMode = false;
            document.getElementById('toggle-explore').classList.remove('active');
            isExploring = false;
            renderer.domElement.style.cursor = 'default';
            currentOffsetX = 0;
            currentOffsetY = 0;
            goToTeacherStep(0);
            teacherPlayPause();
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (state.teacherMode) {
                if (teacherPlaying) teacherPlayPause();
                goToTeacherStep(teacherStepIndex - 1);
            }
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if (state.teacherMode) {
                if (teacherPlaying) teacherPlayPause();
                goToTeacherStep(teacherStepIndex + 1);
            }
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            if (teacherInterval) { clearInterval(teacherInterval);
                teacherInterval = null;
                teacherPlaying = false; }
            state.teacherMode = false;
            state.exploreMode = false;
            isExploring = false;
            document.getElementById('btn-teacher').textContent = '▶ Teacher';
            document.getElementById('toggle-explore').classList.remove('active');
            renderer.domElement.style.cursor = 'default';
            currentOffsetX = 0;
            currentOffsetY = 0;
            document.getElementById('step-indicator').classList.add('hidden');
            state.showHeight = true;
            state.showLocus = true;
            state.showVector = false;
            document.getElementById('toggle-height').classList.add('active');
            document.getElementById('toggle-locus').classList.add('active');
            document.getElementById('toggle-vector').classList.remove('active');
            updateCompression(1.0);
            camera.position.set(8.0, 5.8, 9.0);
            controls.target.set(1.8, 1.2, 1.8);
            controls.update();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); if (state.teacherMode) teacherPlayPause(); }
            if (e.key === 'ArrowRight' && state.teacherMode) { if (teacherPlaying) teacherPlayPause();
                goToTeacherStep(teacherStepIndex + 1); }
            if (e.key === 'ArrowLeft' && state.teacherMode) { if (teacherPlaying) teacherPlayPause();
                goToTeacherStep(teacherStepIndex - 1); }
            if (e.key === 'r' || e.key === 'R') document.getElementById('btn-reset').click();
        });

        // ── Resize ──
        function onResize() {
            const w = window.innerWidth,
                h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
            composer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // ── Init ──
        updateCompression(1.0);
        document.getElementById('step-indicator').classList.add('hidden');

        // ── Animation Loop ──
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            composer.render();
            labelRenderer.render(scene, camera);
        }
        animate();

        console.log('✅ JEE Advanced 2004 — Premium Locus of A″ visualization loaded.');
        console.log('🔧 Fixed label duplication by properly disposing CSS2D elements.');
    </script>
</body>
</html>
