<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secant → Tangent — Hyper-realistic Animation (Enhanced)</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    :root {
      --bg: #070812;
      --panel: #0d1724;
      --accent1: #43d9ff; /* Q color (Cyan) */
      --accent2: #a86bff; /* P color (Purple) */
      --gold: #ffc46b;
      --text-light: #eaf2ff;
      --text-dim: #9fb9d6;
    }
    html,body {
      height: 100%; margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(67,217,255,0.06), transparent), radial-gradient(900px 500px at 90% 80%, rgba(168,107,255,0.05), transparent), var(--bg);
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      width: 1150px; height: 740px; border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 12px 80px rgba(2,6,23,0.7);
      position: relative; overflow: hidden; padding: 22px;
    }
    .canvas-wrap { width: 100%; height: 100%; position: relative; border-radius: 14px; display: flex; }
    svg { flex: 1; border-radius: 12px; }

    /* HUD */
    .hud { position: absolute; left: 28px; top: 28px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12)); padding: 14px; border-radius: 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 40px rgba(168,107,255,0.08); z-index: 10; }
    .hud h1 { margin: 0; font-size: 16px; color: #fff; }
    .hud small { color: #bfeaff; }

    .controls { position: absolute; right: 28px; top: 28px; background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.12)); padding: 12px; border-radius: 12px; backdrop-filter: blur(6px); width: 250px; z-index: 10; }
    label { display: block; font-size: 13px; color: #d9e8ff; margin: 8px 0 6px; }
    select, input[type=range] { width: 100%; }
    .btns { display: flex; gap: 8px; margin-top: 10px; }
    button { background: linear-gradient(90deg, var(--accent1), var(--accent2)); border: none; color: #021018; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s; }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(67,217,255,0.2); }
    .secondary { background: transparent; border: 1px solid rgba(255,255,255,0.06); color: #dbefff; }
    .secondary:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); box-shadow: none; }

    .info { position: absolute; left: 28px; bottom: 28px; background: rgba(0,0,0,0.28); padding: 12px; border-radius: 12px; font-size: 13px; backdrop-filter: blur(4px); z-index: 10; }
    footer { position: absolute; right: 28px; bottom: 28px; color: var(--text-dim); font-size: 12px; }

    /* Visual elements */
    .curve { fill: none; stroke: url(#curveGrad); stroke-width: 3; filter: drop-shadow(0 18px 40px rgba(100,70,255,0.08)); }
    
    /* --- ENHANCEMENT: The "Limit Line" --- */
    /* This is the *only* line. It morphs from secant to tangent. */
    #limit-line {
      fill: none;
      stroke: #bfe7ff; /* Secant color */
      stroke-width: 2.4;
      stroke-dasharray: 6 6;
      stroke-linecap: round;
      mix-blend-mode: screen;
      opacity: 0.9;
      /* The magic: transition all properties smoothly */
      transition: stroke 0.6s ease-in-out,
                  stroke-width 0.6s ease-in-out,
                  stroke-dasharray 0.6s ease-in-out,
                  opacity 0.6s ease-in-out,
                  filter 0.6s ease-in-out;
    }
    
    /* The "Tangent" state for the *same* line */
    #limit-line.is-tangent {
      stroke: var(--gold);
      stroke-width: 3;
      stroke-dasharray: none;
      opacity: 1;
      filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 16px var(--gold));
    }
    
    /* --- ENHANCEMENT: Points & Interactivity --- */
    .point {
      stroke: rgba(255,255,255,0.5);
      stroke-width: 1.5;
      cursor: grab;
      transition: r 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .point:hover { r: 10; }
    .point:active { cursor: grabbing; }

    #P {
      fill: var(--accent2);
      r: 8;
      filter: drop-shadow(0 0 8px var(--accent2));
    }
    #Q {
      fill: var(--accent1);
      r: 7;
      filter: drop-shadow(0 0 8px var(--accent1));
    }

    .label { font-size: 13px; fill: #dff6ff; pointer-events: none; text-shadow: 0 0 5px #000; }

    /* particles */
    .particles circle { fill: rgba(200,230,255,0.06); }
    #emitters circle { mix-blend-mode: screen; } /* Particles from Q */
    
    /* captions */
    .caption { position: absolute; left: 120px; top: 92px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12)); padding: 8px; border-radius: 8px; color: #e8f8ff; font-size: 13px; box-shadow: 0 8px 30px rgba(67,217,255,0.03); width: 360px; z-index: 10; }
    .caption .step { font-weight: 700; }

    /* KaTeX box */
    .kbox { position: absolute; left: 420px; top: 28px; background: rgba(0,0,0,0.28); padding: 10px; border-radius: 8px; color: #dff6ff; z-index: 10; }

    /* subtle glow overlay */
    .glowLayer { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(600px 300px at 15% 15%, rgba(67,217,255,0.03), transparent), radial-gradient(400px 200px at 85% 80%, rgba(168,107,255,0.03), transparent); }

    /* trail */
    .trail { stroke: var(--accent1); stroke-width: 2.5; fill: none; stroke-linecap: round; opacity: 0.15; filter: blur(1.5px); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas-wrap">
      <svg id="svg" viewBox="-600 -380 1200 760" xmlns="http://www.w.w3.org/2000/svg">
        <defs>
          <linearGradient id="curveGrad" x1="0" x2="1">
            <stop offset="0" stop-color="var(--accent1)"/>
            <stop offset="1" stop-color="var(--accent2)"/>
          </linearGradient>
        </defs>

        <g class="particles" id="particles"></g>
        <g id="grid" opacity="0.06"></g>

        <path id="curve" class="curve" d="" />

        <path id="trail" class="trail" d="" />
        
        <path id="limit-line" d="M 0 0 L 1 1" />

        <g id="emitters"></g>

        <g id="points">
          <circle id="P" class="point" cx="0" cy="0" />
          <circle id="Q" class="point" cx="40" cy="-40" />
        </g>

        <text id="labelP" class="label" x="12" y="-8">P</text>
        <text id="labelQ" class="label" x="48" y="-48">Q</text>
      </svg>

      <div class="glowLayer"></div>

      <div class="caption" id="caption">
        <div class="step">Secant Line</div>
        <div class="desc">A secant intersects the curve at two points P and Q. Drag Q toward P to see the limit.</div>
      </div>

      <div class="kbox" id="kbox"></div>
    </div>

    <div class="hud">
      <h1>Secant → Tangent</h1>
      <small>Interactive intuition for instantaneous slope</small>
    </div>

    <div class="controls">
      <label>Curve</label>
      <select id="curveSelect">
        <option value="circle">Circle</option>
        <option value="parabola" selected>Parabola</option>
        <option value="ellipse">Ellipse</option>
      </select>

      <label>Distance (start Q offset)</label>
      <input id="distRange" type="range" min="0.05" max="0.6" step="0.001" value="0.5">

      <label>Animation Speed</label>
      <input id="speedRange" type="range" min="0.4" max="2" step="0.01" value="1">

      <label><input id="showMath" type="checkbox" checked/> Show math</label>

      <div class="btns">
        <button id="play">Play</button>
        <button id="slow" class="secondary">Slow-mo</button>
        <button id="reset" class="secondary">Reset</button>
      </div>
    </div>

    <div class="info" id="infoBox">
      <div style="font-weight:700">Math</div>
      <div class="small">Tangent slope = limit of secant slopes as Q → P</div>
    </div>

    <footer>Made for teaching — cinematic demo</footer>
  </div>

  <script>
    // DOM
    const svg = document.getElementById('svg');
    const curve = document.getElementById('curve');
    const trail = document.getElementById('trail');
    const Pdot = document.getElementById('P');
    const Qdot = document.getElementById('Q');
    const limitLine = document.getElementById('limit-line'); // Replaces secant/tangent
    const emitters = document.getElementById('emitters');
    const labelP = document.getElementById('labelP');
    const labelQ = document.getElementById('labelQ');
    const particlesG = document.getElementById('particles');
    const gridG = document.getElementById('grid');
    const caption = document.getElementById('caption');
    const kbox = document.getElementById('kbox');

    // controls
    const curveSelect = document.getElementById('curveSelect');
    const distRange = document.getElementById('distRange');
    const speedRange = document.getElementById('speedRange');
    const showMath = document.getElementById('showMath');
    const playBtn = document.getElementById('play');
    const slowBtn = document.getElementById('slow');
    const resetBtn = document.getElementById('reset');

    // state
    let mode = 'parabola';
    let tP = 0.25;
    let tQ = 0.75;
    let anim;
    let trailPts = [];
    let isEmitting = false;
    
    // --- ENHANCEMENT: Analytical Derivatives ---
    // We pre-define constants for our curves
    const C = {
        circle: { R: 180 },
        parabola: { w: 520, a: 0.0045, x0: -260, y0: -80 },
        ellipse: { a: 290, b: 160 }
    };
    
    // Parametric functions for x, y
    function getPointOnCurve(t) {
        let x, y, a;
        switch (mode) {
            case 'circle':
                a = -Math.PI + t * 2 * Math.PI;
                x = C.circle.R * Math.cos(a);
                y = C.circle.R * Math.sin(a);
                break;
            case 'parabola':
                x = C.parabola.x0 + t * C.parabola.w;
                y = C.parabola.a * (x - (C.parabola.x0 + C.parabola.w/2))**2 + C.parabola.y0;
                // Re-centering parabola for better visuals
                x = C.parabola.x0 + t * C.parabola.w;
                y = C.parabola.a * (x * x) - 120;
                break;
            case 'ellipse':
                a = -Math.PI + t * 2 * Math.PI;
                x = C.ellipse.a * Math.cos(a);
                y = C.ellipse.b * Math.sin(a);
                break;
        }
        return { x, y };
    }

    // Get *exact* slope (dy/dx) at t
    function getSlopeAtT(t) {
        let slope, a, x, y;
        const PI2 = Math.PI * 2;

        switch (mode) {
            case 'circle':
                a = -Math.PI + t * PI2;
                if (Math.abs(Math.sin(a)) < 1e-6) return Infinity; // Vertical tangent
                return -1 / Math.tan(a); // dy/dx = -cot(a)
            case 'parabola':
                x = C.parabola.x0 + t * C.parabola.w;
                return 2 * C.parabola.a * x; // dy/dx = 2*a*x
            case 'ellipse':
                a = -Math.PI + t * PI2;
                if (Math.abs(Math.sin(a)) < 1e-6) return Infinity; // Vertical tangent
                return -(C.ellipse.b / C.ellipse.a) * (1 / Math.tan(a)); // dy/dx = -(b/a)cot(a)
        }
    }

    // --- ENHANCEMENT: True Secant-to-Tangent Merge Logic ---
    // This function draws an "infinite" line. It *always* calculates the
    // line based on P and Q. When Q gets close to P, the line's position
    // will *naturally* become the tangent.
    function updateLimitLine(P, Q) {
        const dparam = Math.abs(tQ - tP);
        let slope, x1, y1, x2, y2, midX, midY;
        const L = 1500; // Length of the line
        
        // Check if Q is (almost) on P
        if (dparam < 0.001) {
            slope = getSlopeAtT(tP); // Use exact derivative
            if (!isFinite(slope)) { // Vertical Tangent
                x1 = P.x; y1 = -L; x2 = P.x; y2 = L;
            } else {
                const ang = Math.atan(slope);
                x1 = P.x - Math.cos(ang) * L; y1 = P.y - Math.sin(ang) * L;
                x2 = P.x + Math.cos(ang) * L; y2 = P.y + Math.sin(ang) * L;
            }
        } else {
            // Standard secant calculation
            const dx = Q.x - P.x;
            const dy = Q.y - P.y;

            if (Math.abs(dx) < 1e-4) { // Vertical Secant
                x1 = P.x; y1 = -L; x2 = P.x; y2 = L;
            } else {
                slope = dy / dx;
                const ang = Math.atan(slope);
                // Center line on midpoint for stability during animation
                midX = (P.x + Q.x) / 2;
                midY = (P.y + Q.y) / 2;
                x1 = midX - Math.cos(ang) * L; y1 = midY - Math.sin(ang) * L;
                x2 = midX + Math.cos(ang) * L; y2 = midY + Math.sin(ang) * L;
            }
        }
        
        // Use GSAP.set for performance. We update the 'd' attribute of the path.
        gsap.set(limitLine, { attr: { d: `M ${x1} ${y1} L ${x2} ${y2}` } });
        
        // Toggle the class for CSS styling morph
        if (dparam < 0.03) {
            limitLine.classList.add('is-tangent');
        } else {
            limitLine.classList.remove('is-tangent');
        }
    }
    
    // --- ENHANCEMENT: Particle Emitter ---
    function createParticleBurst(x, y) {
        if (!isEmitting) return; // Only emit during animation
        
        const numParticles = 3; // Emit 3 particles per frame
        for (let i = 0; i < numParticles; i++) {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            emitters.appendChild(c);
            
            gsap.fromTo(c, {
                attr: { cx: x, cy: y, r: 1.5 },
                opacity: 0.8,
                fill: 'var(--accent1)'
            }, {
                attr: {
                    r: gsap.utils.random(4, 12),
                    cx: `+=${gsap.utils.random(-35, 35)}`,
                    cy: `+=${gsap.utils.random(-35, 35)}`
                },
                opacity: 0,
                duration: gsap.utils.random(0.5, 0.9),
                ease: "power1.out",
                onComplete: () => c.remove() // Cleanup
            });
        }
    }

    // --- Core Scene & Math Functions ---
    function buildCurvePath() {
      const steps = 800; let d = '';
      for (let i = 0; i <= steps; i++) {
        const t = i / steps; const p = getPointOnCurve(t);
        d += (i === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`);
      }
      curve.setAttribute('d', d);
    }
    
    function makeParticles(n = 120) {
      particlesG.innerHTML = ''; const vb = svg.viewBox.baseVal;
      for (let i = 0; i < n; i++) {
        const cx = (Math.random() * vb.width - vb.width / 2);
        const cy = (Math.random() * vb.height - vb.height / 2);
        const r = Math.random() * 2.2 + 0.6;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
        c.setAttribute('opacity', 0.06 + Math.random() * 0.06);
        particlesG.appendChild(c);
      }
    }

    function makeGrid() {
      gridG.innerHTML = '';
      for (let x = -500; x <= 500; x += 80) {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', x); l.setAttribute('y1', -380); l.setAttribute('x2', x); l.setAttribute('y2', 380);
        l.setAttribute('stroke', 'var(--text-dim)'); l.setAttribute('stroke-width', 0.4);
        gridG.appendChild(l);
      }
      for (let y = -320; y <= 320; y += 80) {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', -600); l.setAttribute('y1', y); l.setAttribute('x2', 600); l.setAttribute('y2', y);
        l.setAttribute('stroke', 'var(--text-dim)'); l.setAttribute('stroke-width', 0.4);
        gridG.appendChild(l);
      }
    }

    function renderMath(stage = 0) {
      if (!showMath.checked) { kbox.innerHTML = ''; return; }
      if (typeof katex === 'undefined') {
        kbox.innerHTML = 'Loading math...';
        setTimeout(() => { if (typeof katex !== 'undefined') renderMath(stage); }, 250);
        return;
      }
      try {
        if (stage === 0) katex.render(String.raw`m_{\text{sec}}=\frac{y_Q-y_P}{x_Q-x_P}`, kbox, { throwOnError: false });
        else if (stage === 1) katex.render(String.raw`m_{\text{tan}}=\lim_{Q\to P}m_{\text{sec}}`, kbox, { throwOnError: false });
        else katex.render(String.raw`\displaystyle m_{\text{tan}}=\frac{dy}{dx}\bigg|_{P}`, kbox, { throwOnError: false });
      } catch (e) { kbox.textContent = 'slope expression'; }
    }

    // Update all visuals, called every frame by GSAP or dragging
    function updateVisuals(isMoving = false) {
      const P = getPointOnCurve(tP);
      const Q = getPointOnCurve(tQ);

      gsap.set(Pdot, { attr: { cx: P.x, cy: P.y } });
      gsap.set(Qdot, { attr: { cx: Q.x, cy: Q.y } });
      gsap.set(labelP, { attr: { x: P.x + 12, y: P.y - 12 } });
      gsap.set(labelQ, { attr: { x: Q.x + 12, y: Q.y - 12 } });
      
      // Update the one and only line
      updateLimitLine(P, Q);

      // update trail
      if (isMoving) {
          trailPts.push({ x: Q.x, y: Q.y });
          if (trailPts.length > 220) trailPts.shift();
          // Emit particles while moving
          createParticleBurst(Q.x, Q.y);
      }
      if (trailPts.length > 1) {
          const pts = trailPts.map(p => `${p.x} ${p.y}`).join(' L ');
          trail.setAttribute('d', `M ${pts}`);
      } else {
          trail.setAttribute('d', '');
      }

      // caption steps and math box
      const dparam = Math.abs(tQ - tP);
      if (dparam > 0.25) {
        caption.querySelector('.step').textContent = 'Secant Line';
        caption.querySelector('.desc').textContent = 'A secant intersects the curve at two points P and Q. It represents an average rate of change.';
        renderMath(0);
      } else if (dparam > 0.03) {
        caption.querySelector('.step').textContent = 'Approaching Limit';
        caption.querySelector('.desc').textContent = 'As Q moves toward P, the secant slope approaches the true slope at P.';
        renderMath(1);
      } else {
        caption.querySelector('.step').textContent = 'Tangent Formed';
        caption.querySelector('.desc').textContent = 'When Q coincides with P, the secant line *becomes* the tangent — the instantaneous rate of change.';
        renderMath(2);
      }
    }

    // initialize scene
    function init() {
      mode = curveSelect.value;
      buildCurvePath();
      makeParticles(140);
      makeGrid();
      tQ = Math.max(0, Math.min(1, tP + Number(distRange.value)));
      trailPts = [];
      updateVisuals();
    }
    init();

    // animation helpers
    function playAnim(duration = 3.6) {
      if (anim) anim.kill();
      trailPts = [];
      isEmitting = true; // Turn on particle emitter
      
      const startT = Math.max(0, Math.min(1, tP + Number(distRange.value)));
      tQ = startT;
      
      // --- ENHANCEMENT: Use a proxy object for tweening ---
      let animProps = { t: startT };
      
      anim = gsap.to(animProps, {
        duration: duration * (1 / Number(speedRange.value)),
        ease: 'power2.inOut',
        t: tP, // Animate 't' property of animProps down to tP
        onUpdate: () => {
          tQ = animProps.t; // Update the main tQ state variable
          updateVisuals(true); // Pass 'true' to indicate movement
        },
        onComplete: () => {
          isEmitting = false; // Turn off emitter
          updateVisuals(); // Final update
        }
      });
    }

    function resetAnim() {
        if (anim) anim.kill();
        isEmitting = false;
        tQ = Math.max(0, Math.min(1, tP + Number(distRange.value)));
        trailPts = [];
        updateVisuals();
    }

    playBtn.addEventListener('click', () => { playAnim(3.6); });
    slowBtn.addEventListener('click', () => { playAnim(8.5); });
    resetBtn.addEventListener('click', resetAnim);

    curveSelect.addEventListener('change', () => { mode = curveSelect.value; buildCurvePath(); resetAnim(); });
    distRange.addEventListener('input', () => { if (!anim || !anim.isActive()) { resetAnim(); } });
    speedRange.addEventListener('input', () => {/* handled in play */});
    showMath.addEventListener('change', () => { updateVisuals(); }); // Re-render math

    // dragging P and Q
    let dragging = null;
    function toSVGCoords(clientX, clientY) {
      const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
      const ctm = svg.getScreenCTM().inverse();
      return pt.matrixTransform(ctm);
    }

    svg.addEventListener('pointerdown', (e) => {
      if (anim && anim.isActive()) anim.kill(); // Stop animation on drag
      isEmitting = true; // Emit particles on drag
      
      const pt = toSVGCoords(e.clientX, e.clientY);
      const pP = getPointOnCurve(tP); const pQ = getPointOnCurve(tQ);
      const dP = Math.hypot(pt.x - pP.x, pt.y - pP.y);
      const dQ = Math.hypot(pt.x - pQ.x, pt.y - pQ.y);
      
      if (dP < 20) { dragging = 'P'; svg.setPointerCapture(e.pointerId); } // Increased hit area
      else if (dQ < 20) { dragging = 'Q'; svg.setPointerCapture(e.pointerId); }
    });
    
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const pt = toSVGCoords(e.clientX, e.clientY);
      
      // find nearest t along curve by sampling
      let bestT = (dragging === 'P') ? tP : tQ;
      let bestD = Infinity;
      const steps = 800;
      for (let i = 0; i <= steps; i += 4) {
        const tt = i / steps;
        const p = getPointOnCurve(tt);
        const d = (p.x - pt.x) ** 2 + (p.y - pt.y) ** 2;
        if (d < bestD) { bestD = d; bestT = tt; }
      }
      
      if (dragging === 'P') {
        tP = Math.max(0.02, Math.min(0.98, bestT)); // keep P away from edges
      } else {
        tQ = bestT;
      }
      updateVisuals(true); // Pass 'true' to indicate movement
    });
    
    svg.addEventListener('pointerup', (e) => {
      dragging = null;
      isEmitting = false; // Stop emitting on release
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    // subtle camera drift
    gsap.to(svg, { duration: 12, ease: 'sine.inOut', attr: { viewBox: `-610 -390 1220 780` }, repeat: -1, yoyo: true });

    // move particles slowly
    function driftParticles() {
      const nodes = Array.from(particlesG.querySelectorAll('circle'));
      const t = Date.now();
      nodes.forEach((c, i) => {
        const dx = (Math.sin(i * 0.13 + t / 8000) * 6);
        const dy = (Math.cos(i * 0.11 + t / 7000) * 6);
        gsap.set(c, { x: `+=${dx * 0.002}`, y: `+=${dy * 0.002}`});
      });
      requestAnimationFrame(driftParticles);
    }
    requestAnimationFrame(driftParticles);

    // initial animations
    gsap.from('.stage', { duration: 1.1, opacity: 0, y: 18, ease: 'power3.out' });
    gsap.from('#curve', { duration: 1.5, opacity: 0, y: 8, ease: 'power3.out' });

    // start state
    resetAnim();
  </script>
</body>
</html>
