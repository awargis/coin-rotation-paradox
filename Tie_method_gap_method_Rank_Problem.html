<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C Mechanical Intuition Studio — Pro Smartboard Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-obsidian: #05070B;
    --bg-panel: rgba(13, 19, 32, 0.86);
    --bg-card: rgba(20, 29, 48, 0.92);
    --cyan: #00F0FF;
    --cyan-glow: rgba(0, 240, 255, 0.35);
    --gold: #FFB800;
    --gold-glow: rgba(255, 184, 0, 0.35);
    --rose: #FF2A6D;
    --rose-glow: rgba(255, 42, 109, 0.35);
    --emerald: #05FFA1;
    --emerald-glow: rgba(5, 255, 161, 0.35);
    --purple: #B967FF;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border-subtle: rgba(255, 255, 255, 0.11);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-obsidian);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255, 184, 0, 0.07) 0%, transparent 45%),
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOP NAVIGATION BAR */
  header {
    height: 70px;
    padding: 0 24px;
    background: rgba(8, 12, 20, 0.94);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
    flex-shrink: 0;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-badge {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--cyan), #0051FF);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 900; font-size: 18px;
    color: #000;
    box-shadow: 0 0 22px var(--cyan-glow);
  }
  .brand-title h1 { font-size: 19px; font-weight: 800; letter-spacing: 0.4px; }
  .brand-title p { font-size: 11px; color: var(--cyan); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 1.5px; }

  .module-tabs {
    display: flex; gap: 8px;
    background: rgba(15, 23, 42, 0.85);
    padding: 5px; border-radius: 14px;
    border: 1px solid var(--border-subtle);
  }
  .tab-btn {
    padding: 9px 18px; border-radius: 10px; border: none;
    background: transparent; color: var(--text-muted);
    font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.25s ease;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05));
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.45);
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.2);
  }

  .header-utilities { display: flex; align-items: center; gap: 10px; }
  .util-btn {
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.75);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .util-btn:hover { border-color: var(--cyan); }
  .util-btn.active-mode { border-color: var(--emerald); color: var(--emerald); background: rgba(5, 255, 161, 0.12); }
  .util-btn.quiz-active { border-color: var(--gold); color: var(--gold); background: rgba(255, 184, 0, 0.12); }

  /* MAIN LAYOUT */
  main {
    flex: 1; display: grid;
    grid-template-columns: 380px 1fr;
    gap: 18px; padding: 18px 24px;
    overflow: hidden; position: relative;
  }

  /* LEFT PANEL: TEACHER GUIDE */
  .mentor-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    overflow-y: auto; z-index: 20;
  }
  .preset-selector { display: flex; flex-direction: column; gap: 6px; }
  .preset-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .preset-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .preset-pill {
    padding: 7px 12px; border-radius: 9px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
    color: var(--text-main); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: 0.2s;
  }
  .preset-pill:hover { background: rgba(255,255,255,0.1); }
  .preset-pill.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }

  .question-card {
    background: rgba(15, 23, 42, 0.92);
    border-left: 4px solid var(--gold);
    padding: 13px 15px; border-radius: 10px;
    font-size: 14.5px; line-height: 1.45; color: #E2E8F0;
  }
  .question-card .q-tag {
    display: inline-block; font-size: 10.5px; font-family: 'JetBrains Mono', monospace;
    background: rgba(255, 184, 0, 0.2); color: var(--gold);
    padding: 2px 7px; border-radius: 4px; margin-bottom: 5px; font-weight: 700;
  }

  .step-progress-bar { display: flex; gap: 6px; margin-top: 2px; }
  .step-dot {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.12); cursor: pointer; transition: 0.3s;
  }
  .step-dot.completed { background: rgba(0, 240, 255, 0.45); }
  .step-dot.current { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

  .explanation-box {
    flex: 1;
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.8));
    border: 1px solid rgba(0, 240, 255, 0.22);
    border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .step-badge { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .step-title { font-size: 20px; font-weight: 800; color: #FFF; margin-bottom: 10px; line-height: 1.25; }
  .step-desc { font-size: 15.5px; line-height: 1.55; color: #CBD5E1; }
  .step-desc strong { color: #FFF; }
  .step-desc .hl-cyan { color: var(--cyan); font-weight: 700; }
  .step-desc .hl-gold { color: var(--gold); font-weight: 700; }
  .step-desc .hl-rose { color: var(--rose); font-weight: 700; }
  .step-desc .hl-emerald { color: var(--emerald); font-weight: 700; }

  .teacher-tip {
    margin-top: 12px; padding: 11px 13px;
    background: rgba(5, 255, 161, 0.08);
    border: 1px dashed rgba(5, 255, 161, 0.4);
    border-radius: 10px; font-size: 13px; color: #A7F3D0; line-height: 1.4;
  }
  .teacher-tip strong { color: var(--emerald); }

  .step-controls { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  .ctrl-btn {
    padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border-subtle);
    font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .ctrl-prev { background: rgba(255,255,255,0.06); color: var(--text-main); }
  .ctrl-prev:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .ctrl-next {
    background: linear-gradient(135deg, var(--cyan), #0077FF);
    color: #000; border: none; box-shadow: 0 0 24px var(--cyan-glow);
  }
  .ctrl-next:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 32px rgba(0, 240, 255, 0.6); }
  .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* RIGHT PANEL: STAGE + FORMULA DOCK */
  .stage-container { display: flex; flex-direction: column; gap: 14px; height: 100%; overflow: hidden; }

  .visual-stage {
    flex: 1; background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 22px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
    box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.75);
    perspective: 1200px;
  }

  /* STAGE HUD BAR */
  .stage-hud-top {
    position: absolute; top: 16px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 25;
  }
  .hud-pill {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid var(--border-subtle);
    padding: 7px 15px; border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(8px);
  }
  .hud-pill span { color: #FFF; font-weight: 700; }

  .action-btn-bar { pointer-events: auto; display: flex; gap: 8px; }
  .stage-action-btn {
    padding: 8px 15px; border-radius: 10px;
    background: rgba(0, 240, 255, 0.14);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13.5px;
    cursor: pointer; transition: 0.2s;
  }
  .stage-action-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 18px var(--cyan-glow); }
  .stage-action-btn.gold { background: rgba(255, 184, 0, 0.14); border-color: var(--gold); color: var(--gold); }
  .stage-action-btn.gold:hover { background: var(--gold); color: #000; box-shadow: 0 0 18px var(--gold-glow); }

  /* 3D TILES & OPTICAL DEPTH-OF-FIELD */
  .tile-row {
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: center;
    margin: 18px 0; position: relative;
    transform-style: preserve-3d;
    transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .char-tile {
    width: 68px; height: 82px; border-radius: 15px;
    background: var(--bg-card); border: 2px solid rgba(255,255,255,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 12px 26px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.5s ease, opacity 0.5s ease, border-color 0.3s;
    cursor: pointer;
  }
  .char-tile:hover { transform: translateY(-4px) scale(1.04); }
  .char-tile .letter { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 800; color: #FFF; }
  .char-tile .sub-tag { font-size: 10px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 3px; opacity: 0.85; }

  /* OPTICAL DEPTH OF FIELD (MACRO vs MICRO FOCUS) */
  .dof-recede {
    filter: blur(6px) brightness(0.38) !important;
    transform: scale(0.84) translateY(12px) !important;
    pointer-events: none;
  }
  .dof-spotlight {
    transform: scale(1.16) translateY(-6px) !important;
    z-index: 30 !important;
    box-shadow: 0 25px 60px rgba(0, 240, 255, 0.35), inset 0 0 28px rgba(0, 240, 255, 0.25) !important;
  }

  /* PARABOLIC SWAP ARCS */
  @keyframes arcOver {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-42px) scale(1.12); box-shadow: 0 22px 35px rgba(0,240,255,0.45); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes arcUnder {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(38px) scale(0.92); box-shadow: 0 10px 25px rgba(255,184,0,0.45); }
    100% { transform: translateY(0) scale(1); }
  }
  .swap-over { animation: arcOver 0.52s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .swap-under { animation: arcUnder 0.52s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .char-tile.vowel {
    border-color: var(--cyan);
    background: linear-gradient(160deg, rgba(0, 240, 255, 0.22), rgba(15, 23, 42, 0.94));
    box-shadow: 0 10px 26px rgba(0, 240, 255, 0.25);
  }
  .char-tile.vowel .sub-tag { color: var(--cyan); }

  .char-tile.consonant {
    border-color: var(--gold);
    background: linear-gradient(160deg, rgba(255, 184, 0, 0.2), rgba(15, 23, 42, 0.94));
    box-shadow: 0 10px 26px rgba(255, 184, 0, 0.2);
  }
  .char-tile.consonant .sub-tag { color: var(--gold); }

  .char-tile.danger {
    border-color: var(--rose);
    background: linear-gradient(160deg, rgba(255, 42, 109, 0.28), rgba(15, 23, 42, 0.94));
    box-shadow: 0 0 30px var(--rose-glow);
  }
  .char-tile.danger .sub-tag { color: var(--rose); }

  /* MAGNETIC TIE CAPSULE */
  .tie-capsule {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 22px; border-radius: 24px;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.16), rgba(0, 119, 255, 0.08));
    border: 2.5px solid var(--cyan);
    box-shadow: 0 0 38px rgba(0, 240, 255, 0.3), inset 0 0 22px rgba(0, 240, 255, 0.16);
    position: relative;
    transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .capsule-badge {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: var(--cyan); color: #000;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 900;
    padding: 3px 12px; border-radius: 99px; white-space: nowrap;
    box-shadow: 0 0 15px var(--cyan);
  }
  .unit-index-badge {
    position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800;
    color: var(--gold); background: rgba(255, 184, 0, 0.14);
    border: 1px solid rgba(255, 184, 0, 0.4);
    padding: 2px 9px; border-radius: 6px; white-space: nowrap;
  }
  .dup-dot {
    position: absolute; top: 6px; right: 6px;
    width: 11px; height: 11px; border-radius: 50%;
  }

  /* GAP LASER BAYS */
  .gap-bay {
    width: 58px; height: 82px; border-radius: 13px;
    border: 2px dashed rgba(5, 255, 161, 0.55);
    background: rgba(5, 255, 161, 0.07);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; transition: all 0.35s ease; cursor: pointer;
  }
  .gap-bay:hover { border-color: var(--emerald); transform: scale(1.06); }
  .gap-bay .bay-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--emerald); opacity: 0.85; }
  .gap-bay.occupied {
    border-style: solid; border-color: var(--emerald);
    background: linear-gradient(160deg, rgba(5, 255, 161, 0.25), rgba(15, 23, 42, 0.94));
    box-shadow: 0 0 26px var(--emerald-glow);
  }

  /* RANK ODOMETER + LASER SHORTCUT GRID */
  .rank-workspace { width: 100%; display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: center; padding-top: 26px; }
  .rank-card {
    background: rgba(11, 17, 29, 0.88);
    border: 1px solid var(--border-subtle);
    border-radius: 18px; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    position: relative;
  }
  .rank-card-title {
    font-size: 12.5px; font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--cyan); display: flex; justify-content: space-between; align-items: center;
  }
  .slots-row { display: flex; gap: 8px; justify-content: center; margin: 6px 0; }
  .odo-slot {
    width: 54px; height: 68px; border-radius: 11px;
    background: rgba(20, 29, 48, 0.95);
    border: 2px solid rgba(255,255,255,0.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 800;
    position: relative; transition: 0.3s;
  }
  .odo-slot.locked {
    border-color: var(--emerald);
    background: rgba(5, 255, 161, 0.16); color: var(--emerald);
    box-shadow: 0 0 18px var(--emerald-glow);
  }
  .odo-slot.testing {
    border-color: var(--gold);
    background: rgba(255, 184, 0, 0.2); color: var(--gold);
    box-shadow: 0 0 22px var(--gold-glow);
    transform: translateY(-4px);
  }
  .odo-slot.spinning {
    border-color: var(--cyan); color: var(--cyan);
    background: rgba(0, 240, 255, 0.1);
    animation: pulseSpin 0.35s infinite alternate;
  }
  @keyframes pulseSpin { from { opacity: 0.6; transform: scale(0.96); } to { opacity: 1; transform: scale(1.03); } }

  /* SHORTCUT TABLE WITH INTERACTIVE COLUMN SCANNER */
  .shortcut-table {
    width: 100%; border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace; text-align: center;
  }
  .shortcut-table th, .shortcut-table td {
    padding: 8px 5px; border: 1px solid rgba(255,255,255,0.08); font-size: 14px;
    transition: all 0.25s ease;
  }
  .shortcut-table th { color: var(--text-muted); font-size: 11px; text-align: left; padding-left: 8px; background: rgba(255,255,255,0.02); }
  .sc-col-active { background: rgba(255, 184, 0, 0.22) !important; color: var(--gold) !important; font-weight: 800; border-color: var(--gold) !important; }
  .sc-col-scan-smaller { background: rgba(5, 255, 161, 0.28) !important; color: var(--emerald) !important; box-shadow: inset 0 0 12px var(--emerald); transform: scale(1.08); }
  .sc-col-scan-larger { background: rgba(255, 255, 255, 0.04) !important; opacity: 0.45; }

  .log-list {
    max-height: 115px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 4px;
  }
  .log-item {
    display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 7px;
    background: rgba(255,255,255,0.04); font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .log-item.skip { border-left: 3px solid var(--cyan); }
  .log-item.match { border-left: 3px solid var(--emerald); background: rgba(5, 255, 161, 0.1); color: var(--emerald); }

  /* FORMULA DOCK */
  .formula-dock {
    height: 104px; background: rgba(10, 15, 26, 0.96);
    border: 1px solid var(--border-subtle); border-radius: 18px;
    padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .formula-blocks { display: flex; align-items: center; gap: 12px; overflow-x: auto; }
  .f-card {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
    padding: 8px 15px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; min-width: 105px;
  }
  .f-card.active-cyan { border-color: var(--cyan); background: rgba(0, 240, 255, 0.1); }
  .f-card.active-gold { border-color: var(--gold); background: rgba(255, 184, 0, 0.1); }
  .f-card.active-emerald { border-color: var(--emerald); background: rgba(5, 255, 161, 0.1); }
  .f-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 3px; }
  .f-math { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: #FFF; }
  .f-op { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; color: var(--text-muted); }

  .final-result-box {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, rgba(255, 184, 0, 0.18), rgba(255, 42, 109, 0.12));
    border: 2px solid var(--gold); padding: 10px 22px; border-radius: 15px;
    box-shadow: 0 0 26px var(--gold-glow); cursor: pointer;
  }
  .final-result-box .res-label { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--gold); text-transform: uppercase; }
  .final-result-box .res-val { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 900; color: #FFF; }
  .quiz-blurred { filter: blur(11px); user-select: none; }

  /* SMARTBOARD INK ANNOTATION OVERLAY */
  #inkCanvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 40; pointer-events: none;
  }
  #inkCanvas.drawing-enabled { pointer-events: auto; cursor: crosshair; }

  .ink-toolbar {
    position: fixed; bottom: 26px; right: 34px; z-index: 60;
    background: rgba(10, 15, 28, 0.94); border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.65);
  }
  .color-swatch {

<script>
/* ============================================================================
   WEB AUDIO SYNTHESIZER (Zero external dependencies, crisp classroom SFX)
   ============================================================================ */
let soundEnabled = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSFX(type) {
  if (!soundEnabled) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'step') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'clamp') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.start(now); osc.stop(now + 0.24);
    } else if (type === 'shuffle') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.11);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.28);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'success') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.055);
        g.gain.setValueAtTime(0.09, now + idx * 0.055);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.35);
        o.start(now + idx * 0.055);
        o.stop(now + idx * 0.055 + 0.36);
      });
    }
  } catch (e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggleBtn');
  btn.textContent = soundEnabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
  btn.classList.toggle('active-mode', soundEnabled);
}

/* ============================================================================
   SMARTBOARD INK CANVAS ENGINE
   ============================================================================ */
const inkCanvas = document.getElementById('inkCanvas');
const inkCtx = inkCanvas.getContext('2d');
let inkEnabled = false;
let isDrawing = false;
let inkColor = '#00F0FF';

function resizeInkCanvas() {
  inkCanvas.width = window.innerWidth;
  inkCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeInkCanvas);
resizeInkCanvas();

function toggleInkMode() {
  inkEnabled = !inkEnabled;
  inkCanvas.classList.toggle('drawing-enabled', inkEnabled);
  const btn = document.getElementById('inkToggleBtn');
  btn.textContent = inkEnabled ? '✏️ Board Pen: ON' : '✏️ Board Pen: OFF';
  btn.classList.toggle('active-mode', inkEnabled);
}

function setInkColor(color, el) {
  inkColor = color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  if (!inkEnabled) toggleInkMode();
}

function clearInkCanvas() {
  inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
}

inkCanvas.addEventListener('pointerdown', (e) => {
  if (!inkEnabled) return;
  isDrawing = true;
  inkCtx.beginPath();
  inkCtx.moveTo(e.clientX, e.clientY);
});
inkCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing || !inkEnabled) return;
  inkCtx.lineTo(e.clientX, e.clientY);
  inkCtx.strokeStyle = inkColor;
  inkCtx.lineWidth = 4;
  inkCtx.lineCap = 'round';
  inkCtx.shadowBlur = 10;
  inkCtx.shadowColor = inkColor;
  inkCtx.stroke();
});
window.addEventListener('pointerup', () => { isDrawing = false; });

/* ============================================================================
   MATH UTILITIES & APPLICATION STATE
   ============================================================================ */
function fact(n) {
  if (n <= 1) return 1;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function nCr(n, r) {
  if (r < 0 || r > n) return 0;
  return Math.round(fact(n) / (fact(r) * fact(n - r)));
}
function isVowel(ch) { return ['A', 'E', 'I', 'O', 'U'].includes(ch.toUpperCase()); }
function countFreq(arr) {
  const m = {};
  arr.forEach(x => m[x] = (m[x] || 0) + 1);
  return m;
}
function shuffleArray(a) {
  const copy = [...a];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

let currentModule = 'tie';
let currentStep = 0;
let quizMode = false;

const tiePresets = [
  {
    id: 'DAUGHTER',
    label: 'Level 1: DAUGHTER',
    tag: 'CONCEPT BUILDER • ALL DISTINCT',
    question: 'Find the number of arrangements of the letters of the word <strong>DAUGHTER</strong> so that all vowels (<strong>A, U, E</strong>) always occur together.',
    word: 'DAUGHTER'
  },
  {
    id: 'INDEPENDENCE',
    label: 'Level 2: INDEPENDENCE (JEE PYQ)',
    tag: 'JEE MAIN PYQ • IDENTICAL LETTERS',
    question: 'Find the number of arrangements of the word <strong>INDEPENDENCE</strong> in which all the vowels (<strong>I, E, E, E, E</strong>) always stay together.',
    word: 'INDEPENDENCE'
  }
];
let activeTiePreset = tiePresets[0];
let tieExternalOrder = [];
let tieInternalOrder = [];

const gapPresets = [
  {
    id: 'BOYS_GIRLS_6_4',
    label: 'Level 1: 6 Boys & 4 Girls',
    tag: 'CONCEPT BUILDER • NO TWO GIRLS TOGETHER',
    question: 'In how many ways can <strong>6 Boys</strong> and <strong>4 Girls</strong> be seated in a row so that <strong>NO TWO GIRLS</strong> sit together?',
    pillars: ['B1', 'B2', 'B3', 'B4', 'B5', 'B6'],
    guests: ['G1', 'G2', 'G3', 'G4'],
    pName: 'Boys', gName: 'Girls'
  },
  {
    id: 'EQUATION_VOWELS',
    label: 'Level 2: 5 Boys & 5 Girls (JEE PYQ)',
    tag: 'JEE MAIN PYQ • EXTREME BOUNDARY SLOTS',
    question: 'Find the number of ways in which <strong>5 Boys</strong> and <strong>5 Girls</strong> can be seated in a row such that no two girls are adjacent.',
    pillars: ['B1', 'B2', 'B3', 'B4', 'B5'],
    guests: ['G1', 'G2', 'G3', 'G4', 'G5'],
    pName: 'Boys', gName: 'Girls'
  }
];
let activeGapPreset = gapPresets[0];
let selectedBays = [];

const rankPresets = [
  {
    id: 'MOTHER',
    label: 'MOTHER (JEE Classic)',
    tag: 'JEE MAIN PYQ • DISTINCT LETTERS',
    question: 'If all permutations of the word <strong>MOTHER</strong> are arranged in dictionary order, find the rank of the word <strong>MOTHER</strong>.',
    word: 'MOTHER'
  },
  {
    id: 'COCHIN',
    label: 'COCHIN (JEE Advanced)',
    tag: 'JEE ADVANCED PYQ • REPEATED C',
    question: 'Arrange the letters of <strong>COCHIN</strong> in alphabetical order and find the dictionary rank of the word <strong>COCHIN</strong>.',
    word: 'COCHIN'
  },
  {
    id: 'INDIA',
    label: 'INDIA (Repetition Test)',
    tag: 'JEE MAIN PATTERN • REPEATED I',
    question: 'Find the dictionary rank of the word <strong>INDIA</strong> when all its permutations are arranged alphabetically.',
    word: 'INDIA'
  }
];
let activeRankPreset = rankPresets[0];
let rankFrames = [];
let rankFrameIdx = 0;
let activeScanCol = -1; // For interactive laser scan on the shortcut table

/* ============================================================================
   MODULE INITIALIZATION & NAVIGATION
   ============================================================================ */
function initTieData() {
  const chars = activeTiePreset.word.split('');
  const vowels = chars.filter(c => isVowel(c));
  const consonants = chars.filter(c => !isVowel(c));
  tieInternalOrder = [...vowels];
  tieExternalOrder = [...consonants.map((c, idx) => ({ type: 'char', val: c, id: 'c' + idx })), { type: 'capsule' }];
}

function initGapData() {
  const totalBays = activeGapPreset.pillars.length + 1;
  const gCount = activeGapPreset.guests.length;
  selectedBays = [];
  for (let i = 0; i < gCount; i++) selectedBays.push(i * 2 < totalBays ? i * 2 : i);
}

function buildRankFrames(word) {
  const target = word.toUpperCase().split('');
  const n = target.length;
  let remaining = [...target].sort();
  const frames = [];
  let runningTotal = 0;
  const locked = [];
  const logs = [];

  frames.push({
    phase: 'init', locked: [], testingChar: null, slotIdx: 0,
    remaining: [...remaining], runningTotal: 0, currentBatch: 0, batchFormula: '',
    logs: [],
    desc: `First, list all letters of <span class="hl-cyan">${word}</span> in alphabetical order: <strong>${remaining.join(', ')}</strong>. Our mechanical odometer will hunt for <strong>${word}</strong> from left to right.`,
    tip: `<strong>Smartboard Tip:</strong> Tap any column in the Right-Side Shortcut Table to fire the <strong>Laser Right-Scanner</strong>!`
  });

  for (let i = 0; i < n; i++) {
    const targetChar = target[i];
    const uniqueCandidates = [...new Set(remaining)];
    for (let c of uniqueCandidates) {
      if (c < targetChar) {
        const tempRem = [...remaining];
        tempRem.splice(tempRem.indexOf(c), 1);
        const remCount = tempRem.length;
        const freq = countFreq(tempRem);
        let denom = 1;
        let denomStr = [];
        Object.entries(freq).forEach(([k, v]) => {
          if (v > 1) { denom *= fact(v); denomStr.push(`${v}!`); }
        });
        const ways = Math.round(fact(remCount) / denom);
        runningTotal += ways;
        const formulaStr = denomStr.length ? `${remCount}! / (${denomStr.join('·')})` : `${remCount}!`;
        const newLog = { type: 'skip', prefix: [...locked, c].join('') + '•'.repeat(remCount), formula: formulaStr, ways };
        logs.push(newLog);

        frames.push({
          phase: 'skip', locked: [...locked], testingChar: c, slotIdx: i,
          remaining: [...remaining], runningTotal, currentBatch: ways, batchFormula: formulaStr,
          logs: [...logs],
          desc: `Slot ${i + 1}: Try <span class="hl-gold">${c}</span> before <strong>${targetChar}</strong>. Since <span class="hl-gold">${c}</span> is NOT our letter, the remaining <strong>${remCount} slots spin</strong> through all <strong>${formulaStr} = ${ways}</strong> words!`,
          tip: `Notice how the odometer jumps by <strong>+${ways}</strong> at once without writing every word.`
        });
      } else if (c === targetChar) {
        locked.push(c);
        remaining.splice(remaining.indexOf(c), 1);
        const newLog = { type: 'match', prefix: [...locked].join(''), formula: 'LOCKED', ways: 0 };
        logs.push(newLog);

        frames.push({
          phase: 'match', locked: [...locked], testingChar: c, slotIdx: i,
          remaining: [...remaining], runningTotal, currentBatch: 0, batchFormula: 'MATCH',
          logs: [...logs],
          desc: `Slot ${i + 1}: Target <span class="hl-emerald">${c}</span> matched! Clamp <span class="hl-emerald">${c}</span> into Slot ${i + 1}, remove it from our letter pool, and advance to Slot ${i + 2}.`,
          tip: `When a letter locks in, we do NOT add factorial skips—we step inside that dictionary branch.`
        });
        break;
      }
    }
  }

  frames.push({
    phase: 'done', locked: [...target], testingChar: null, slotIdx: n,
    remaining: [], runningTotal: runningTotal + 1, currentBatch: 1, batchFormula: '+1 (Target Word)',
    logs: [...logs],
    desc: `All ${n} slots locked! Exactly <strong>${runningTotal}</strong> words come before <span class="hl-cyan">${word}</span>. Therefore, <span class="hl-gold">${word}</span> sits at Rank <strong>${runningTotal} + 1 = ${runningTotal + 1}</strong>!`,
    tip: `Now click any column on the Right-Side <strong>JEE Shortcut Matrix</strong> to show the 10-second exam method!`
  });

  return frames;
}

function switchModule(mod) {
  currentModule = mod;
  currentStep = 0;
  clearInkCanvas();
  playSFX('step');
  ['tie', 'gap', 'rank'].forEach(m => document.getElementById('tab-' + m).classList.toggle('active', m === mod));
  if (mod === 'tie') initTieData();
  if (mod === 'gap') initGapData();
  if (mod === 'rank') {
    rankFrames = buildRankFrames(activeRankPreset.word);
    rankFrameIdx = 0;
    activeScanCol = -1;
  }
  renderPresets();
  renderAll();
}

function renderPresets() {
  const container = document.getElementById('presetContainer');
  container.innerHTML = '';
  let list = currentModule === 'tie' ? tiePresets : (currentModule === 'gap' ? gapPresets : rankPresets);
  let activeObj = currentModule === 'tie' ? activeTiePreset : (currentModule === 'gap' ? activeGapPreset : activeRankPreset);

  list.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-pill' + (p.id === activeObj.id ? ' active' : '');
    btn.textContent = p.label;
    btn.onclick = () => {
      playSFX('step');
      if (currentModule === 'tie') { activeTiePreset = p; initTieData(); }
      if (currentModule === 'gap') { activeGapPreset = p; initGapData(); }
      if (currentModule === 'rank') { activeRankPreset = p; rankFrames = buildRankFrames(p.word); rankFrameIdx = 0; activeScanCol = -1; }
      currentStep = 0;
      renderPresets();
      renderAll();
    };
    container.appendChild(btn);
  });

  if (currentModule === 'rank') {
    const customBtn = document.createElement('button');
    customBtn.className = 'preset-pill';
    customBtn.innerHTML = '⚡ Type Word...';
    customBtn.onclick = () => {
      const w = prompt('Enter any word (3 to 7 letters) for live Rank analysis:', 'SMALL');
      if (w && w.trim().length >= 2 && w.trim().length <= 8) {
        const clean = w.trim().toUpperCase().replace(/[^A-Z]/g, '');
        activeRankPreset = {
          id: 'CUSTOM', label: clean, tag: 'LIVE CLASSROOM INPUT',
          question: `Find the dictionary rank of the word <strong>${clean}</strong> when all its permutations are arranged alphabetically.`,
          word: clean
        };
        rankFrames = buildRankFrames(clean);
        rankFrameIdx = 0;
        activeScanCol = -1;
        renderPresets();
        renderAll();
      }
    };
    container.appendChild(customBtn);
  }
}

function changeStep(delta) {
  if (currentModule === 'rank') {
    const nextIdx = rankFrameIdx + delta;
    if (nextIdx >= 0 && nextIdx < rankFrames.length) {
      rankFrameIdx = nextIdx;
      playSFX(rankFrames[rankFrameIdx].phase === 'done' ? 'success' : 'step');
      renderAll();
    }
    return;
  }
  const maxSteps = 5;
  const next = currentStep + delta;
  if (next >= 0 && next < maxSteps) {
    currentStep = next;
    if (currentModule === 'tie' && currentStep === 1) playSFX('clamp');
    else if (currentModule === 'gap' && currentStep === 0) playSFX('error');
    else if (currentStep === 4) playSFX('success');
    else playSFX('step');
    renderAll();
  }
}

function toggleQuizMode() {
  quizMode = !quizMode;
  const btn = document.getElementById('quizToggleBtn');
  btn.textContent = quizMode ? '🙈 Answer: Hidden' : '👁️ Answer: Visible';
  btn.classList.toggle('quiz-active', quizMode);
  document.getElementById('finalAnswerValue').classList.toggle('quiz-blurred', quizMode);
}

function revealQuizAnswer() { toggleQuizMode(); }

function renderAll() {
  if (currentModule === 'tie') renderTieModule();
  if (currentModule === 'gap') renderGapModule();
  if (currentModule === 'rank') renderRankModule();
}

/* ============================================================================
   MODULE 1: TIE METHOD WITH OPTICAL DEPTH-OF-FIELD & PARABOLIC ARCS
   ============================================================================ */
function renderTieModule() {
  const p = activeTiePreset;
  const chars = p.word.split('');
  const vowels = chars.filter(c => isVowel(c));
  const consonants = chars.filter(c => !isVowel(c));
  const vCount = vowels.length;
  const cCount = consonants.length;
  const macroUnits = cCount + 1;

  const cFreq = countFreq(consonants);
  const vFreq = countFreq(vowels);
  let cDenom = 1, cDenomStr = [];
  Object.entries(cFreq).forEach(([k, v]) => { if (v > 1) { cDenom *= fact(v); cDenomStr.push(`${v}!`); } });
  let vDenom = 1, vDenomStr = [];
  Object.entries(vFreq).forEach(([k, v]) => { if (v > 1) { vDenom *= fact(v); vDenomStr.push(`${v}!`); } });

  const extWays = Math.round(fact(macroUnits) / cDenom);
  const intWays = Math.round(fact(vCount) / vDenom);
  const totalWays = extWays * intWays;

  document.getElementById('questionBox').innerHTML = `<div class="q-tag">${p.tag}</div><div>${p.question}</div>`;

  const stepsMeta = [
    {
      title: 'Step 1: Separate Vowels & Consonants',
      desc: `Count the raw letters in <span class="hl-cyan">${p.word}</span> (${chars.length} total). We color the <strong>${vCount} Vowels (${vowels.join(', ')})</strong> in <span class="hl-cyan">Electric Cyan</span> and the <strong>${cCount} Consonants (${consonants.join(', ')})</strong> in <span class="hl-gold">Amber Gold</span>.`,
      tip: `<strong>First-Time Intuition:</strong> Before applying any formula, physically separate the items that want to stay together from the rest.`,
      status: `RAW TILES: ${chars.length} LETTERS (${vCount} VOWELS, ${cCount} CONSONANTS)`
    },
    {
      title: 'Step 2: Clamp the Magnetic Tie Capsule',
      desc: `Since all ${vCount} vowels must <strong>always occur together</strong>, we lock them inside a single <span class="hl-cyan">Magnetic Glass Capsule</span>. Now count the movable blocks on the board: <strong>${cCount} Consonants + 1 Capsule = ${macroUnits} Macro-Units</strong>!`,
      tip: `<strong>Classic Mistake Alert:</strong> Ask the class: "Are there ${chars.length} objects now, or ${macroUnits}?" They see the giant #${macroUnits} badge and never say ${chars.length} again.`,
      status: `MACRO UNITS: ${cCount} CONSONANTS + 1 CAPSULE = ${macroUnits} UNITS`
    },
    {
      title: 'Step 3: Permute the External Units',
      desc: `Shuffle the <strong>${macroUnits} Macro-Units</strong> on the track in <strong>${macroUnits}!</strong> ways. ${cDenom > 1 ? `Because identical consonants (<span class="hl-gold">${Object.entries(cFreq).filter(x=>x[1]>1).map(x=>x[1]+' '+x[0]+'s').join(', ')}</span>) look the same when swapped, divide by <strong>${cDenomStr.join('·')}</strong>.` : `All ${macroUnits} external units are distinct, giving <strong>${macroUnits}! = ${extWays.toLocaleString()}</strong> ways.`}`,

      tip: `Tap <strong>[⚡ Shuffle Both]</strong> to show external and internal permutations happening simultaneously.`,

function renderTieStageDOM(animateExt, animateInt) {
  const stage = document.getElementById('stageContent');
  const chars = activeTiePreset.word.split('');
  const dupColors = { N: '#FF2A6D', D: '#B967FF', E: '#05FFA1' };

  if (currentStep === 0) {
    stage.innerHTML = `
      <div style="text-align:center; margin-bottom:10px; color:var(--text-muted); font-size:14px;">

      return `

          ${tieInternalOrder.map((v, vIdx) => `
            <div class="char-tile vowel ${animateInt ? (vIdx % 2 === 0 ? 'swap-over' : 'swap-under') : ''}" style="width:58px; height:72px;">
              ${dupColors[v] ? `<div class="dup-dot" style="background:${dupColors[v]}"></div>` : ''}

      ${isMicroFocus
        ? '🔍 OPTICAL MICRO-ZOOM ACTIVE: External consonants blurred out so you only count internal vowel swaps!'
        : '📦 MACRO VIEW: The entire Cyan Capsule acts as ONE single movable block alongside the consonants.'}
    </div>
    <div class="tile-row">${rowHTML}</div>
  `;
}

/* ============================================================================
   MODULE 2: GAP METHOD (COLLISION TRAP + INTERACTIVE LASER BAYS)
   ============================================================================ */

  const n = p.pillars.length;
  const r = p.guests.length;
  const bays = n + 1;

  const guestWays = fact(r);
  const totalWays = pillarWays * chooseWays * guestWays;

  document.getElementById('questionBox').innerHTML = `<div class="q-tag">${p.tag}</div><div>${p.question}</div>`;

  const stepsMeta = [
    {
      title: 'Step 1: Why "Total − All Together" FAILS!',
      desc: `Wait! Many students calculate <em>Total − (All ${r} ${p.gName} Together)</em>. Look at the stage: only <strong>G1 & G2</strong> are touching (<span class="hl-rose">COLLISION!</span>) while G3 & G4 sit apart. "All Together" fails to subtract partial clusters when ${r} ≥ 3!`,
      tip: `<strong>Lifetime Lesson:</strong> Whenever ${r} ≥ 3 objects cannot sit together, NEVER use <em>Total − Together</em>. Always use the <strong>Gap Method</strong>.`,
      status: `FATAL TRAP DETECTED: PARTIAL CLUSTER (G1-G2 TOUCHING)`
    },
    {
      title: `Step 2: Plant the ${n} Unrestricted Pillars First`,
      desc: `Seat the unrestricted group (<strong>${n} ${p.pName}</strong>) first as heavy <span class="hl-gold">Lead Shield Pillars</span>. These ${n} ${p.pName} can permute among themselves in <strong>${n}! = ${pillarWays.toLocaleString()}</strong> ways.`,
      tip: `Think of ${p.pName} as blast-shield walls that will physically block ${p.gName} from touching.`,
      status: `PILLARS LOCKED: ${n}! = ${pillarWays.toLocaleString()} WAYS`
    },
    {
      title: `Step 3: Project the (n + 1) = ${bays} Laser Bays`,
      desc: `Once ${n} ${p.pName} are seated, they automatically project <strong>${n} + 1 = ${bays} Safe Laser Docking Bays</strong> (<span class="hl-emerald">1 to ${bays}</span>)—one between each pillar, plus <strong>two at the extreme ends</strong>!`,
      tip: `<strong>Smartboard Interaction:</strong> Tap any green bay on the board right now to toggle a Girl in or out of that bay!`,
      status: `${n} PILLARS CREATE ${bays} SAFE LASER BAYS`
    },
    {
      title: `Step 4: Select ${r} Bays out of ${bays} — C(${bays}, ${r})`,
      desc: `We have <strong>${bays} safe bays</strong> and need to park <strong>${r} ${p.gName}</strong>. Choose ${r} bays out of ${bays} in <strong>C(${bays}, ${r}) = ${chooseWays}</strong> ways. Even if you pick two neighboring bays, a ${p.pName.slice(0,-1)} pillar stands between them!`,
      tip: `Tap <strong>[⚡ Pick Random Safe Bays]</strong> or tap individual bays with your finger on the Smartboard.`,
      status: `BAY SELECTION: C(${bays}, ${r}) = ${chooseWays} COMBINATIONS`
    },
    {
      title: `Step 5: Permute the ${r} ${p.gName} Inside Chosen Bays`,
      desc: `Finally, the <strong>${r} distinct ${p.gName}</strong> swap places inside the ${r} chosen bays in <strong>${r}! = ${guestWays}</strong> ways. Multiply all three stages: <span class="hl-gold">${n}! × C(${bays},${r}) × ${r}! = ${totalWays.toLocaleString()}</span>!`,
      tip: `Point to the Formula Dock: 1. Seat Pillars (${n}!) → 2. Choose Bays (C(${bays},${r})) → 3. Arrange Guests (${r}!).`,
      status: `COMPLETE: ${pillarWays} × ${chooseWays} × ${guestWays} = ${totalWays.toLocaleString()}`
    }
  ];

  updateLeftMentorUI(stepsMeta, 5);
  document.getElementById('stageStatusPill').innerHTML = `STATUS: <span>${stepsMeta[currentStep].status}</span>`;

  const actionBar = document.getElementById('stageActionButtons');
  actionBar.innerHTML = '';
  if (currentStep >= 3) {
    const btnPick = document.createElement('button');
    btnPick.className = 'stage-action-btn';
    btnPick.innerHTML = '⚡ Pick Random Safe Bays';
    btnPick.onclick = () => {
      playSFX('shuffle');
      const allIndices = Array.from({ length: bays }, (_, i) => i);
      selectedBays = shuffleArray(allIndices).slice(0, r).sort((a, b) => a - b);
      renderGapStageDOM();
    };
    actionBar.appendChild(btnPick);
  }

  renderGapStageDOM();

  const fBlocks = document.getElementById('formulaBlocks');
  fBlocks.innerHTML = `
    <div class="f-card ${currentStep >= 1 ? 'active-gold' : ''}">
      <div class="f-label">1. Seat ${p.pName}</div>
      <div class="f-math">${currentStep >= 1 ? `${n}! = ${pillarWays}` : '?'}</div>
    </div>
    <div class="f-op">×</div>
    <div class="f-card ${currentStep >= 3 ? 'active-emerald' : ''}">
      <div class="f-label">2. Pick ${r} of ${bays} Bays</div>

function toggleBaySelection(bayIdx) {
  if (currentStep < 2) return;
  const idx = selectedBays.indexOf(bayIdx);
  if (idx !== -1) {
    selectedBays.splice(idx, 1);
    playSFX('step');
  } else {
    if (selectedBays.length >= activeGapPreset.guests.length) selectedBays.shift();
    selectedBays.push(bayIdx);
    selectedBays.sort((a, b) => a - b);
    playSFX('clamp');
  }
  renderGapStageDOM();
}

function renderGapStageDOM() {
  const stage = document.getElementById('stageContent');
  const p = activeGapPreset;

  if (currentStep === 0) {
    stage.innerHTML = `
      <div style="background:rgba(255,42,109,0.15); border:1px solid var(--rose); color:var(--rose); padding:8px 18px; border-radius:99px; font-family:'JetBrains Mono',monospace; font-size:13px; margin-bottom:16px;">
        ⚠️ CONSTRAINT VIOLATION: G1 &amp; G2 ARE ADJACENT (EVEN THOUGH ALL 4 GIRLS ARE NOT TOGETHER!)
      </div>
      <div class="tile-row">
        <div class="char-tile consonant"><div class="letter">B1</div><div class="sub-tag">PILLAR</div></div>
        <div class="char-tile danger swap-over"><div class="letter">G1</div><div class="sub-tag">TOUCH!</div></div>
        <div class="char-tile danger swap-over"><div class="letter">G2</div><div class="sub-tag">TOUCH!</div></div>

      </div>

  }

  const sequence = [];
  const totalBays = p.pillars.length + 1;
  let guestCursor = 0;

  for (let b = 0; b < totalBays; b++) {
    if (currentStep >= 2) {
      const isChosen = currentStep >= 3 && selectedBays.includes(b);
      const gLabel = isChosen ? p.guests[guestCursor++ % p.guests.length] : '';
      sequence.push(`
        <div class="gap-bay ${isChosen ? 'occupied swap-over' : ''}" onclick="toggleBaySelection(${b})" title="Tap to toggle bay #${b + 1}">
          ${isChosen
            ? `<div style="font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:800; color:#FFF;">${gLabel}</div>
               <div class="bay-num" style="color:#FFF;">BAY #${b + 1}</div>`
            : `<div class="bay-num">BAY</div>
               <div style="font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:800; color:var(--emerald);">#${b + 1}</div>`
          }
        </div>
      `);
    }
    if (b < p.pillars.length) {
      sequence.push(`
        <div class="char-tile consonant" style="width:62px; height:82px;">
          <div class="letter" style="font-size:25px;">${p.pillars[b]}</div>
          <div class="sub-tag">SHIELD</div>
        </div>
      `);
    }
  }

  stage.innerHTML = `
    <div style="text-align:center; margin-bottom:12px; color:var(--text-muted); font-size:14px;">
      ${currentStep >= 3
        ? `Tap any green bay to test! Notice how every occupied <span style="color:var(--emerald); font-weight:700;">Green Bay</span> has at least one <span style="color:var(--gold); font-weight:700;">Gold Shield Pillar</span> between them.`
        : `${p.pillars.length} Shield Pillars project ${totalBays} Safe Laser Bays.`}
    </div>
    <div class="tile-row" style="gap:9px;">${sequence.join('')}</div>
  `;
}

/* ============================================================================
   MODULE 3: RANK ODOMETER + INTERACTIVE LASER SHORTCUT SCANNER
   ============================================================================ */
function triggerColumnLaserScan(colIdx) {
  activeScanCol = (activeScanCol === colIdx) ? -1 : colIdx;
  playSFX('shuffle');
  renderRankModule();
}

function renderRankModule() {
  const p = activeRankPreset;
  const frame = rankFrames[rankFrameIdx];
  const word = p.word.toUpperCase();
  const chars = word.split('');
  const n = chars.length;

  document.getElementById('questionBox').innerHTML = `<div class="q-tag">${p.tag}</div><div>${p.question}</div>`;

  // Progress bar
  const dotsContainer = document.getElementById('stepDotsContainer');
  dotsContainer.innerHTML = rankFrames.map((_, idx) =>
    `<div class="step-dot ${idx < rankFrameIdx ? 'completed' : ''} ${idx === rankFrameIdx ? 'current' : ''}" onclick="rankFrameIdx=${idx}; playSFX('step'); renderRankModule();"></div>`
  ).join('');

  document.getElementById('stepBadge').textContent = `ODOMETER STEP ${rankFrameIdx + 1} OF ${rankFrames.length}`;
  document.getElementById('stepTitle').textContent =
    frame.phase === 'init' ? `Initialize Alphabetical Pool` :
    frame.phase === 'skip' ? `Slot ${frame.slotIdx + 1}: Fast-Forward "${frame.testingChar}"` :
    frame.phase === 'match' ? `Slot ${frame.slotIdx + 1}: Lock Target "${frame.testingChar}"!` :
    `Target Word Reached!`;
  document.getElementById('stepDesc').innerHTML = frame.desc;
  document.getElementById('teacherTip').innerHTML = frame.tip;

  document.getElementById('prevStepBtn').disabled = (rankFrameIdx === 0);
  document.getElementById('nextStepBtn').disabled = (rankFrameIdx === rankFrames.length - 1);
  document.getElementById('stageStatusPill').innerHTML = `ODOMETER COUNT: <span>${frame.runningTotal} WORDS</span>`;

  const actionBar = document.getElementById('stageActionButtons');
  actionBar.innerHTML = `
    <button class="stage-action-btn" onclick="rankFrameIdx=0; activeScanCol=-1; playSFX('step'); renderRankModule();">⏮ Reset</button>
    <button class="stage-action-btn gold" onclick="rankFrameIdx=rankFrames.length-1; playSFX('success'); renderRankModule();">⏭ Jump to Final Rank</button>
  `;

  // Compute 10-Second JEE Shortcut Data
  const uniqueSorted = [...new Set([...chars].sort())];
  const alphaRanks = chars.map(c => uniqueSorted.indexOf(c) + 1);
  const smallerRight = [];
  const dupDivisors = [];
  const factorials = [];
  const colContribs = [];
  let shortcutSum = 0;

  for (let i = 0; i < n; i++) {
    let sm = 0;
    for (let j = i + 1; j < n; j++) {
      if (chars[j] < chars[i]) sm++;
    }
    smallerRight.push(sm);

    const subSlice = chars.slice(i);
    const freq = countFreq(subSlice);
    let denom = 1;
    Object.values(freq).forEach(v => { if (v > 1) denom *= fact(v); });
    dupDivisors.push(denom);

    const fVal = fact(n - 1 - i);
    factorials.push(`${n - 1 - i}!`);
    const contrib = Math.round((sm * fVal) / denom);
    colContribs.push(contrib);
    shortcutSum += contrib;
  }
  const finalRank = shortcutSum + 1;

  // Build Odometer Slots
  const slotsHTML = chars.map((targetCh, idx) => {
    if (idx < frame.locked.length) {
      return `<div class="odo-slot locked">${frame.locked[idx]}</div>`;
    } else if (idx === frame.slotIdx && frame.phase === 'skip') {
      return `<div class="odo-slot testing">${frame.testingChar}</div>`;
    } else if (idx > frame.slotIdx && frame.phase === 'skip') {
      return `<div class="odo-slot spinning">✱</div>`;
    } else {
      return `<div class="odo-slot" style="color:var(--text-muted);">?</div>`;
    }
  }).join('');

  const hasDups = dupDivisors.some(d => d > 1);
  const activeCol = activeScanCol !== -1 ? activeScanCol : frame.slotIdx;

  // Helper to style cells during right-side laser scan
  function getScanClass(colIdx) {
    if (activeScanCol === -1) return colIdx === frame.slotIdx ? 'sc-col-active' : '';
    if (colIdx === activeScanCol) return 'sc-col-active';
    if (colIdx > activeScanCol) {
      return chars[colIdx] < chars[activeScanCol] ? 'sc-col-scan-smaller' : 'sc-col-scan-larger';
    }
    return '';
  }

  const stage = document.getElementById('stageContent');
  stage.innerHTML = `
    <div class="rank-workspace">
      <!-- LEFT CARD: 3D MECHANICAL ODOMETER -->
      <div class="rank-card">
        <div class="rank-card-title">
          <span>⚙️ 3D Mechanical Dictionary Odometer</span>
          <span style="color:var(--gold);">Pool: [${frame.remaining.join(', ') || 'EMPTY'}]</span>
        </div>
        <div class="slots-row">${slotsHTML}</div>
        <div style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cyan);">
          ${frame.phase === 'skip'
            ? `⚡ Fast-Forwarding <strong>${frame.batchFormula} = +${frame.currentBatch}</strong> words starting with "${[...frame.locked, frame.testingChar].join('')}"`
            : frame.phase === 'match'
            ? `✅ Locked "${frame.testingChar}" in Slot ${frame.slotIdx + 1}! Moving to next slot...`
            : frame.phase === 'done'
            ? `🏆 Target Word "${word}" Reached at Rank ${finalRank}!`
            : `Ready to scan Slot 1...`}
        </div>
        <div class="log-list">
          ${frame.logs.slice().reverse().map(l => `
            <div class="log-item ${l.type}">
              <span>${l.type === 'skip' ? `⏭ ${l.prefix}` : `🔒 ${l.prefix} (MATCH)`}</span>
              <span>${l.type === 'skip' ? `${l.formula} = +${l.ways}` : `0 skipped`}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- RIGHT CARD: 10-SECOND JEE SHORTCUT MATRIX WITH LASER SCANNER -->
      <div class="rank-card">
        <div class="rank-card-title">
          <span>⚡ 10-Sec JEE Shortcut (Tap Any Letter!)</span>
          <span style="color:var(--emerald);">${activeScanCol !== -1 ? `🔍 Scanning Right of "${chars[activeScanCol]}"` : 'Click Column to Scan'}</span>
        </div>
        <table class="shortcut-table">
          <tr>
            <th>Word Letters</th>
            ${chars.map((c, i) => `<td class="${getScanClass(i)}" style="font-weight:800; font-size:17px; cursor:pointer;" onclick="triggerColumnLaserScan(${i})">${c}</td>`).join('')}
          </tr>
          <tr>
            <th>1. Alpha Order</th>
            ${alphaRanks.map((r, i) => `<td class="${getScanClass(i)}" style="color:var(--cyan); cursor:pointer;" onclick="triggerColumnLaserScan(${i})">${r}</td>`).join('')}
          </tr>
          <tr>
            <th>2. Smaller Right</th>
            ${smallerRight.map((s, i) => `<td class="${i === activeCol ? 'sc-col-active' : ''}" style="color:var(--emerald); font-weight:700;">${s}</td>`).join('')}
          </tr>
          ${hasDups ? `
          <tr>
            <th>3. Dup Divider</th>
            ${dupDivisors.map(d => `<td style="color:var(--rose);">÷${d}</td>`).join('')}
          </tr>` : ''}
          <tr>
            <th>${hasDups ? '4.' : '3.'} Multiplier</th>
            ${factorials.map(f => `<td style="color:var(--gold);">${f}</td>`).join('')}
          </tr>
          <tr>
            <th>Column Total</th>
            ${colContribs.map((c, i) => `<td class="${i === activeCol ? 'sc-col-active' : ''}" style="font-weight:800; color:#FFF;">${c}</td>`).join('')}
          </tr>
        </table>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); text-align:center;">
          ${activeScanCol !== -1
            ? `Laser Scan from <strong style="color:var(--gold);">${chars[activeScanCol]} (${alphaRanks[activeScanCol]})</strong>: Green cells to its right are smaller (<strong style="color:var(--emerald);">${smallerRight[activeScanCol]} matches</strong>)!`
            : `Rank = (${colContribs.join(' + ')}) + 1 = <strong style="color:var(--gold);">${finalRank}</strong>`}
        </div>
      </div>
    </div>
  `;

  const fBlocks = document.getElementById('formulaBlocks');
  fBlocks.innerHTML = `
    <div class="f-card active-cyan">
      <div class="f-label">Words Before ${word}</div>
      <div class="f-math">${colContribs.join(' + ')} = ${shortcutSum}</div>
    </div>
    <div class="f-op">+</div>
    <div class="f-card active-emerald">
      <div class="f-label">Target Word Itself</div>
      <div class="f-math">1</div>
    </div>
  `;
  const ansEl = document.getElementById('finalAnswerValue');
  ansEl.textContent = finalRank;
  ansEl.classList.toggle('quiz-blurred', quizMode);
}

/* ============================================================================
   SHARED MENTOR PANEL & KEYBOARD SHORTCUTS
   ============================================================================ */
function updateLeftMentorUI(stepsMeta, total) {
  const dotsContainer = document.getElementById('stepDotsContainer');
  dotsContainer.innerHTML = stepsMeta.map((_, idx) =>
    `<div class="step-dot ${idx < currentStep ? 'completed' : ''} ${idx === currentStep ? 'current' : ''}" onclick="currentStep=${idx}; playSFX('step'); renderAll();"></div>`
  ).join('');

  const meta = stepsMeta[currentStep];
  document.getElementById('stepBadge').textContent = `STEP ${currentStep + 1} OF ${total}`;
  document.getElementById('stepTitle').textContent = meta.title;
  document.getElementById('stepDesc').innerHTML = meta.desc;
  document.getElementById('teacherTip').innerHTML = meta.tip;

  document.getElementById('prevStepBtn').disabled = (currentStep === 0);
  document.getElementById('nextStepBtn').disabled = (currentStep === total - 1);
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') changeStep(1);
  if (e.key === 'ArrowLeft') changeStep(-1);
  if (e.key === ' ') {
    e.preventDefault();
    const btns = document.querySelectorAll('.stage-action-btn');
    if (btns.length > 0) btns[0].click();
  }
});

// Boot Studio
initTieData();
initGapData();
rankFrames = buildRankFrames(activeRankPreset.word);
renderPresets();
renderAll();
</script>
