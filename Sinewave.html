<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Geometry of Waves</title>
    <style>
        :root {
            --bg-color: #050814;
            --grid-color: rgba(255, 255, 255, 0.04);
            --axis-color: rgba(255, 255, 255, 0.15);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.5);
            --color-cyan: #00e5ff;
            --color-amber: #ffaa00;
            --color-magenta: #ff007f;
            --color-glass: rgba(15, 20, 35, 0.6);
            --color-glass-border: rgba(255, 255, 255, 0.1);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas by default */
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 2rem;
        }

        .interactive-panel {
            pointer-events: auto;
            background: var(--color-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--color-glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Cinematic Narrative Text Overlay */
        #cinematic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(5, 8, 20, 0.8);
            z-index: 20;
            transition: opacity 1s ease;
        }

        .narrative-text {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            position: absolute;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .narrative-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Top Bar Controls */
        #top-bar {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            opacity: 0; /* Hidden during intro */
        }

        /* Guided Lesson Panel */
        #teacher-panel {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            max-width: 600px;
            text-align: center;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        #teacher-text {
            font-size: 1.25rem;
            line-height: 1.5;
            font-weight: 400;
        }

        /* Explorer Sidebar */
        #explorer-panel {
            position: absolute;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            opacity: 0;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--color-cyan);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--axis-color);
            border-radius: 2px;
        }

        button {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-main);
        }

        button.active-btn {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* Checkbox styling */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .toggle-row input {
            accent-color: var(--color-cyan);
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .visible { opacity: 1 !important; pointer-events: auto !important; }

        /* Real-time Math Data Panel */
        #data-panel {
            position: absolute;
            top: 2rem;
            left: 2rem;
            min-width: 200px;
            opacity: 0;
        }

        .math-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .math-color-sine { color: var(--color-amber); font-weight: bold; }
        .math-color-cos { color: var(--color-magenta); font-weight: bold; }
        .math-color-angle { color: var(--color-cyan); }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            #explorer-panel { top: auto; bottom: 2rem; right: 50%; transform: translateX(50%); width: 90%; flex-direction: row; flex-wrap: wrap; }
            .control-group { flex: 1; min-width: 120px; }
            #teacher-panel { bottom: 12rem; }
        }
        @media (max-width: 768px) {
            #top-bar { top: 1rem; flex-wrap: wrap; justify-content: center; width: 90%; }
            #data-panel { display: none; } /* Hide complex data on small mobile */
            #teacher-panel { bottom: 1rem; width: 90%; padding: 1rem; }
            #teacher-text { font-size: 1rem; }
            .narrative-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="math-canvas"></canvas>
    </div>

    <!-- Cinematic Intro Overlay -->
    <div id="cinematic-overlay">
        <div class="narrative-text" id="text-1">Where does the <span style="color: var(--color-amber)">SINE WAVE</span> come from?</div>
        <div class="narrative-text" id="text-2">Is it just an abstract formula?</div>
        <div class="narrative-text" id="text-3">Or is there a hidden motion behind it?</div>
        <div class="narrative-text" id="text-4">Let's uncover the geometry.</div>
    </div>

    <div class="ui-layer">
        
        <!-- Live Data Panel -->
        <div id="data-panel" class="interactive-panel">
            <div class="math-row">
                <span>θ =</span>
                <span class="math-color-angle" id="val-theta">0.00 rad</span>
            </div>
            <div class="math-row">
                <span>P =</span>
                <span>(<span id="val-x">1.00</span>, <span id="val-y">0.00</span>)</span>
            </div>
            <hr style="border:0; border-top: 1px solid var(--color-glass-border); margin: 8px 0;">
            <div class="math-row">
                <span>sin(θ) =</span>
                <span class="math-color-sine" id="val-sin">0.00</span>
            </div>
            <div class="math-row">
                <span>cos(θ) =</span>
                <span class="math-color-cos" id="val-cos">1.00</span>
            </div>
        </div>

        <!-- Top Navigation -->
        <div id="top-bar" class="interactive-panel">
            <button id="btn-play">Pause</button>
            <button id="btn-restart">↻ Reset</button>
            <div style="width: 1px; background: var(--color-glass-border); margin: 0 10px;"></div>
            <button id="btn-mode-guided" class="active-btn">Guided Story</button>
            <button id="btn-mode-explore">Free Explore</button>
        </div>

        <!-- Teacher / Narrative Panel -->
        <div id="teacher-panel" class="interactive-panel">
            <div id="teacher-text">Welcome to the laboratory.</div>
            <button id="btn-next-scene" style="margin-top: 10px; background: var(--color-cyan); color: black; border: none; font-weight: bold;">Next Step →</button>
        </div>

        <!-- Explorer Controls (Hidden initially) -->
        <div id="explorer-panel" class="interactive-panel">
            <div style="font-weight: bold; margin-bottom: 0.5rem; text-align: center;">Wave Parameters</div>
            <div class="control-group">
                <div class="control-label"><span>Amplitude (A)</span> <span id="lbl-amp">1.0</span></div>
                <input type="range" id="sl-amp" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Speed (ω)</span> <span id="lbl-freq">1.0</span></div>
                <input type="range" id="sl-freq" min="0" max="3" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Phase (φ)</span> <span id="lbl-phase">0.0</span></div>
                <input type="range" id="sl-phase" min="-3.14" max="3.14" step="0.1" value="0">
            </div>
            
            <hr style="border:0; border-top: 1px solid var(--color-glass-border); margin: 10px 0;">
            
            <div style="font-weight: bold; margin-bottom: 0.5rem; font-size: 0.85rem;">Display Toggles</div>
            <label class="toggle-row"><input type="checkbox" id="chk-sine" checked> Show Sine (Vertical)</label>
            <label class="toggle-row"><input type="checkbox" id="chk-cos"> Show Cosine (Horizontal)</label>
            <label class="toggle-row"><input type="checkbox" id="chk-beam" checked> Show Connection Beam</label>
            <label class="toggle-row"><input type="checkbox" id="chk-degrees"> Use Degrees</label>
        </div>
    </div>

    <script>
        /**
         * The Geometry of Waves - Core Engine
         */
        const canvas = document.getElementById('math-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize performance

        // DOM Elements
        const overlay = document.getElementById('cinematic-overlay');
        const topBar = document.getElementById('top-bar');
        const dataPanel = document.getElementById('data-panel');
        const teacherPanel = document.getElementById('teacher-panel');
        const explorerPanel = document.getElementById('explorer-panel');
        const teacherText = document.getElementById('teacher-text');
        
        // --- Application State ---
        const state = {
            width: 0,
            height: 0,
            dpr: 1,
            time: 0,            // Internal time driver
            angle: 0,           // Current θ in radians
            speed: 0.015,       // Base angular velocity
            isPlaying: true,
            mode: 'guided',     // 'guided' or 'explore'
            currentScene: -1,   // -1 is intro
            isDragging: false,
            dragTarget: null,   // 'circle' or 'graph'
            
            // Mathematical Parameters
            A: 1.0,             // Amplitude
            w: 1.0,             // Frequency (omega)
            phi: 0.0,           // Phase shift
            
            // Layout (Calculated dynamically)
            layout: {
                cx: 0, cy: 0, R: 0,   // Circle center and radius
                gx: 0, gy: 0, gW: 0   // Graph origin and width
            },

            // Display Toggles (driven by scene or user)
            showGrid: false,
            showAxes: false,
            showCircle: false,
            showPoint: true,    // Intro point
            showAngle: false,
            showSineProj: false,
            showCosProj: false,
            showSineGraph: false,
            showCosGraph: false,
            showBeam: false,
            useDegrees: false,
            
            history: [], // Stores {theta, y_sin, y_cos} for trails
            maxHistory: 300
        };

        // --- Colors ---
        const colors = {
            bg: '#050814',
            grid: 'rgba(255, 255, 255, 0.05)',
            axis: 'rgba(255, 255, 255, 0.2)',
            text: '#ffffff',
            cyan: '#00e5ff',
            amber: '#ffaa00',
            magenta: '#ff007f',
            beam: 'rgba(255, 255, 255, 0.3)'
        };

        // --- Resize & Setup ---
        function resize() {
            state.dpr = window.devicePixelRatio || 1;
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            
            canvas.width = state.width * state.dpr;
            canvas.height = state.height * state.dpr;
            canvas.style.width = `${state.width}px`;
            canvas.style.height = `${state.height}px`;
            
            ctx.scale(state.dpr, state.dpr);
            
            // Calculate layout architecture based on screen aspect ratio
            const isMobile = state.width < 768;
            
            if (isMobile) {
                // Stacked layout for mobile
                state.layout.R = Math.min(state.width * 0.3, state.height * 0.15);
                state.layout.cx = state.width * 0.5;
                state.layout.cy = state.height * 0.3; // Circle at top
                
                state.layout.gx = state.width * 0.1;
                state.layout.gy = state.height * 0.7; // Graph at bottom
                state.layout.gW = state.width * 0.8;
            } else {
                // Side-by-side layout for desktop/tablet
                state.layout.R = Math.min(state.width * 0.15, state.height * 0.25);
                state.layout.cx = state.width * 0.25;
                state.layout.cy = state.height * 0.5; // Circle on left
                
                state.layout.gx = state.width * 0.55;
                state.layout.gy = state.height * 0.5; // Graph on right
                state.layout.gW = state.width * 0.4;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const storyScenes = [
            {
                id: 0,
                text: "Here is a perfect circle. A point moves along its edge. This is simple circular motion.",
                setup: () => {
                    state.showGrid = true; state.showAxes = true; state.showCircle = true; state.showPoint = true;
                    state.showAngle = true; state.showSineProj = false; state.showSineGraph = false;
                    state.showBeam = false; state.showCosProj = false; state.showCosGraph = false;
                    state.A = 1; state.w = 1; state.phi = 0; state.speed = 0.01;
                    document.getElementById('chk-sine').checked = true;
                    document.getElementById('chk-cos').checked = false;
                }
            },
            {
                id: 1,
                text: "Now, let's track only its VERTICAL height. Imagine a light shining from the side, casting a shadow on the y-axis.",
                setup: () => {
                    state.showSineProj = true;
                }
            },
            {
                id: 2,
                text: "As the angle (θ) increases, we record this vertical height over time. Watch the graph emerge.",
                setup: () => {
                    state.showSineGraph = true; state.showBeam = true; state.history = [];
                    // Slow down slightly for observation
                    state.speed = 0.015;
                }
            },
            {
                id: 3,
                text: "This shape is the Sine Wave. It is nothing more than the vertical shadow of circular motion unrolled over time.",
                setup: () => { }
            },
            {
                id: 4,
                text: "What if we track the HORIZONTAL position instead? Let's cast the shadow down to the x-axis.",
                setup: () => {
                    state.showSineProj = false; state.showSineGraph = false; state.showBeam = false;
                    state.showCosProj = true; state.history = [];
                }
            },
            {
                id: 5,
                text: "Let's record this horizontal position. This generates the Cosine Wave.",
                setup: () => {
                    state.showCosGraph = true; state.showBeam = true; state.history = [];
                }
            },
            {
                id: 6,
                text: "Notice that Sine and Cosine are the EXACT SAME WAVE, just starting at different points. They are mathematical twins.",
                setup: () => {
                    state.showSineProj = true; state.showSineGraph = true;
                    document.getElementById('chk-sine').checked = true;
                    document.getElementById('chk-cos').checked = true;
                }
            },
            {
                id: 7,
                text: "You can even drag the graph backwards. Notice how changing the wave's position perfectly moves the point on the circle.",
                setup: () => {
                    state.isPlaying = false; // Pause to encourage interaction
                    document.getElementById('btn-play').innerText = "Play";
                }
            },
            {
                id: 8,
                text: "The laboratory is yours. Switch to 'Free Explore' mode to adjust amplitude, speed, and phase.",
                setup: () => {
                    state.isPlaying = true;
                    document.getElementById('btn-play').innerText = "Pause";
                }
            }
        ];

        function nextScene() {
            state.currentScene++;
            if (state.currentScene >= storyScenes.length) {
                // End of guided tour, switch to explore mode
                setMode('explore');
                return;
            }
            
            const scene = storyScenes[state.currentScene];
            teacherText.innerText = scene.text;
            scene.setup();
            
            // Animation for panel
            teacherPanel.style.transform = 'translate(-50%, 10px)';
            setTimeout(() => teacherPanel.style.transform = 'translate(-50%, 0)', 50);
        }

        
        // Utility for formatting math
        const fmt = (val) => (val >= 0 ? "+" : "") + val.toFixed(2);
        const formatAngle = (rad) => {
            if (state.useDegrees) return Math.round(rad * (180/Math.PI)) + "°";
            // Rough mapping to pi fractions for display
            const piFrac = rad / Math.PI;
            if (Math.abs(piFrac) < 0.01) return "0";
            if (Math.abs(piFrac - 0.5) < 0.01) return "π/2";
            if (Math.abs(piFrac - 1.0) < 0.01) return "π";
            if (Math.abs(piFrac - 1.5) < 0.01) return "3π/2";
            if (Math.abs(piFrac - 2.0) < 0.01) return "2π";
            return rad.toFixed(2) + " rad";
        };

        function drawGrid() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!state.showGrid) return;

            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            
            const R = state.layout.R;
            // Draw circle grid
            ctx.beginPath();
            for(let i = -2; i <= 2; i++) {
                ctx.moveTo(state.layout.cx - 2.5*R, state.layout.cy + i*R);
                ctx.lineTo(state.layout.cx + 2.5*R, state.layout.cy + i*R);
                ctx.moveTo(state.layout.cx + i*R, state.layout.cy - 2.5*R);
                ctx.lineTo(state.layout.cx + i*R, state.layout.cy + 2.5*R);
            }
            ctx.stroke();

            // Draw graph grid (horizontal lines for +1, 0, -1)
            ctx.beginPath();
            for(let i = -2; i <= 2; i++) {
                ctx.moveTo(state.layout.gx, state.layout.gy + i*R);
                ctx.lineTo(state.layout.gx + state.layout.gW, state.layout.gy + i*R);
            }
            // Vertical divisions for pi/2, pi, 3pi/2, 2pi
            for(let i=0; i<=4; i++) {
                const x = state.layout.gx + (i/4) * state.layout.gW;
                ctx.moveTo(x, state.layout.gy - 2*R);
                ctx.lineTo(x, state.layout.gy + 2*R);
            }
            ctx.stroke();
        }

        function drawAxes() {
            if (!state.showAxes) return;
            const {cx, cy, gx, gy, gW, R} = state.layout;
            
            ctx.strokeStyle = colors.axis;
            ctx.lineWidth = 2;
            
            // Circle Axes
            ctx.beginPath();
            ctx.moveTo(cx - 1.5*R, cy); ctx.lineTo(cx + 1.5*R, cy);
            ctx.moveTo(cx, cy - 1.5*R); ctx.lineTo(cx, cy + 1.5*R);
            ctx.stroke();
            
            // Graph Axes
            ctx.beginPath();
            ctx.moveTo(gx - 20, gy); ctx.lineTo(gx + gW + 20, gy); // X
            ctx.moveTo(gx, gy - 1.5*R); ctx.lineTo(gx, gy + 1.5*R); // Y
            ctx.stroke();
            
            // Axis Labels
            ctx.fillStyle = colors.text;
            ctx.font = '12px ' + state.fontFamily;
            ctx.fillText("x", cx + 1.5*R + 5, cy + 15);
            ctx.fillText("y", cx - 15, cy - 1.5*R - 5);
            
            ctx.fillText("θ (angle / time)", gx + gW + 5, gy + 20);
            ctx.fillText("+1", gx - 20, gy - R + 4);
            ctx.fillText("-1", gx - 20, gy + R + 4);
            
            // Pi markers on graph x-axis
            const labels = ["0", "π/2", "π", "3π/2", "2π"];
            for(let i=1; i<=4; i++) {
                const x = gx + (i/4) * gW;
                ctx.fillText(labels[i], x - 8, gy + 20);
            }
        }

        function renderMath() {
            const {cx, cy, R, gx, gy, gW} = state.layout;
            
            // Normalizing angle for calculations (0 to 2pi)
            let normAngle = state.angle % (Math.PI * 2);
            if (normAngle < 0) normAngle += Math.PI * 2;
            
            // Core Math
            const actualAngle = state.w * state.angle + state.phi;
            const mathX = state.A * Math.cos(actualAngle);
            const mathY = state.A * Math.sin(actualAngle); // Mathematical Y (up is positive)
            
            // Screen coordinates (Y is inverted on canvas)
            const px = cx + mathX * R;
            const py = cy - mathY * R;
            
            // Update UI Data
            if (state.currentScene > -1) {
                document.getElementById('val-theta').innerText = formatAngle(normAngle);
                document.getElementById('val-x').innerText = fmt(mathX);
                document.getElementById('val-y').innerText = fmt(mathY);
                document.getElementById('val-sin').innerText = fmt(Math.sin(actualAngle));
                document.getElementById('val-cos').innerText = fmt(Math.cos(actualAngle));
            }

            // 1. Draw Unit Circle
            if (state.showCircle) {
                ctx.beginPath();
                ctx.arc(cx, cy, R * state.A, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 2. Draw Angle Arc
            if (state.showAngle) {
                ctx.beginPath();
                // Draw arc counter-clockwise from 0 to -angle (because Y is down)
                ctx.arc(cx, cy, R * 0.3, 0, -actualAngle, actualAngle > 0);
                ctx.lineTo(cx, cy);
                ctx.fillStyle = 'rgba(0, 229, 255, 0.2)';
                ctx.fill();
                ctx.strokeStyle = colors.cyan;
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Radius line
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py);
                ctx.strokeStyle = colors.text;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 3. Draw Projections
            if (state.showSineProj) {
                // Vertical line to x-axis
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px, cy);
                ctx.strokeStyle = colors.amber;
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Highlight on Y axis
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx, py);
                ctx.strokeStyle = colors.amber;
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            if (state.showCosProj) {
                // Horizontal line to y-axis
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(cx, py);
                ctx.strokeStyle = colors.magenta;
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Highlight on X axis
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, cy);
                ctx.strokeStyle = colors.magenta;
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // 4. Draw Graph Points & Beams
            const graphProgress = (normAngle / (Math.PI * 2)); // 0 to 1
            const currentGraphX = gx + graphProgress * gW;
            const currentGraphYSin = gy - mathY * R;
            const currentGraphYCos = gy - mathX * R; // x value plotted on y axis

            if (state.showBeam) {
                ctx.setLineDash([4, 8]);
                ctx.lineWidth = 1;
                
                if (state.showSineGraph) {
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(currentGraphX, currentGraphYSin);
                    ctx.strokeStyle = colors.amber;
                    ctx.globalAlpha = 0.5;
                    ctx.stroke();
                }
                
                if (state.showCosGraph) {
                    ctx.beginPath();
                    // Draw beam from X projection point to graph
                    ctx.moveTo(px, cy); 
                    // Route it cleanly: go down/up, then across
                    ctx.lineTo(px, currentGraphYCos);
                    ctx.lineTo(currentGraphX, currentGraphYCos);
                    ctx.strokeStyle = colors.magenta;
                    ctx.globalAlpha = 0.5;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
                ctx.setLineDash([]);
            }

            // Save history
            if (state.isPlaying || state.isDragging) {
                state.history.unshift({ a: normAngle, sy: currentGraphYSin, cy: currentGraphYCos });
                if (state.history.length > state.maxHistory) state.history.pop();
                
                // Sort history by angle to draw a continuous line properly
                state.history.sort((a, b) => a.a - b.a);
            }

            // Draw Sine Graph
            if (state.showSineGraph && state.history.length > 0) {
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < state.history.length; i++) {
                    const h = state.history[i];
                    const hx = gx + (h.a / (Math.PI*2)) * gW;
                    if (!started) { ctx.moveTo(hx, h.sy); started = true; }
                    else { ctx.lineTo(hx, h.sy); }
                }
                ctx.strokeStyle = colors.amber;
                ctx.lineWidth = 3;
                
                // Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = colors.amber;
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Current Point on graph
                ctx.beginPath();
                ctx.arc(currentGraphX, currentGraphYSin, 6, 0, Math.PI*2);
                ctx.fillStyle = colors.amber;
                ctx.fill();
            }

            // Draw Cosine Graph
            if (state.showCosGraph && state.history.length > 0) {
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < state.history.length; i++) {
                    const h = state.history[i];
                    const hx = gx + (h.a / (Math.PI*2)) * gW;
                    if (!started) { ctx.moveTo(hx, h.cy); started = true; }
                    else { ctx.lineTo(hx, h.cy); }
                }
                ctx.strokeStyle = colors.magenta;
                ctx.lineWidth = 3;
                
                // Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = colors.magenta;
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Current Point on graph
                ctx.beginPath();
                ctx.arc(currentGraphX, currentGraphYCos, 6, 0, Math.PI*2);
                ctx.fillStyle = colors.magenta;
                ctx.fill();
            }

            // 5. Draw the Rotating Point (Hero element)
            if (state.showPoint) {
                ctx.beginPath();
                ctx.arc(px, py, 8, 0, Math.PI * 2);
                ctx.fillStyle = colors.cyan;
                ctx.shadowBlur = 20;
                ctx.shadowColor = colors.cyan;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Interactive affordance (pulse if paused)
                if (!state.isPlaying && state.mode === 'guided') {
                    ctx.beginPath();
                    ctx.arc(px, py, 8 + Math.sin(Date.now() / 150) * 4, 0, Math.PI * 2);
                    ctx.strokeStyle = colors.cyan;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        function animate() {
            if (state.isPlaying && !state.isDragging) {
                state.angle += state.speed;
                // Keep angle growing indefinitely so trails loop continuously if needed
                // But for standard visualization, wrapping is cleaner
            }
            
            drawGrid();
            drawAxes();
            renderMath();
            
            requestAnimationFrame(animate);
        }

        // --- Cinematic Intro Sequence ---
        async function runIntro() {
            const t1 = document.getElementById('text-1');
            const t2 = document.getElementById('text-2');
            const t3 = document.getElementById('text-3');
            const t4 = document.getElementById('text-4');
            
            const wait = (ms) => new Promise(r => setTimeout(r, ms));
            
            state.showPoint = true;
            state.A = 1.5; // Big circle initially
            state.speed = 0.02;
            
            await wait(1000);
            t1.classList.add('active');
            await wait(3500);
            t1.classList.remove('active');
            
            await wait(1000);
            t2.classList.add('active');
            await wait(3000);
            t2.classList.remove('active');
            
            await wait(1000);
            t3.classList.add('active');
            await wait(3500);
            t3.classList.remove('active');
            
            await wait(1000);
            t4.classList.add('active');
            await wait(2000);
            
            // Fade out overlay
            overlay.style.opacity = 0;
            setTimeout(() => {
                overlay.style.display = 'none';
                
                // Smoothly transition math parameters to normal
                let shrinkInt = setInterval(() => {
                    state.A -= 0.01;
                    if (state.A <= 1.0) {
                        state.A = 1.0;
                        clearInterval(shrinkInt);
                        // Start Scene 0
                        topBar.style.opacity = 1;
                        dataPanel.style.opacity = 1;
                        teacherPanel.style.opacity = 1;
                        nextScene();
                    }
                }, 20);

            }, 1000);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerDown(e) {
            if (state.currentScene < 0) return; // Prevent during intro
            const pos = getPointerPos(e);
            const {cx, cy, R, gx, gy, gW} = state.layout;
            
            // Check if clicked near the rotating point on the circle
            const actualAngle = state.w * state.angle + state.phi;
            const px = cx + state.A * Math.cos(actualAngle) * R;
            const py = cy - state.A * Math.sin(actualAngle) * R;
            
            const distToCircle = Math.hypot(pos.x - px, pos.y - py);
            
            // Check if clicked inside the graph area
            const inGraphArea = pos.x >= gx && pos.x <= gx + gW && pos.y >= gy - 1.5*R && pos.y <= gy + 1.5*R;

            if (distToCircle < 30) {
                state.isDragging = true;
                state.dragTarget = 'circle';
                state.wasPlaying = state.isPlaying;
                state.isPlaying = false; // Pause while dragging
            } else if (inGraphArea) {
                state.isDragging = true;
                state.dragTarget = 'graph';
                state.wasPlaying = state.isPlaying;
                state.isPlaying = false;
                // Move immediately to where clicked
                handlePointerMove(e);
            }
        }

        function handlePointerMove(e) {
            if (!state.isDragging) return;
            const pos = getPointerPos(e);
            const {cx, cy, gx, gW} = state.layout;
            
            if (state.dragTarget === 'circle') {
                // Calculate angle from center
                let dragAngle = Math.atan2(cy - pos.y, pos.x - cx); // Note: cy - y because canvas Y is down
                if (dragAngle < 0) dragAngle += Math.PI * 2;
                
                // Adjust for parameters (reverse map)
                // actual = w*angle + phi => angle = (actual - phi)/w
                state.angle = (dragAngle - state.phi) / state.w;
                
            } else if (state.dragTarget === 'graph') {
                // Map X coordinate on graph back to angle
                // pos.x = gx + (normAngle / 2PI) * gW
                let progress = (pos.x - gx) / gW;
                progress = Math.max(0, Math.min(1, progress)); // Clamp 0 to 1
                
                // We map graph X directly to the internal angle to keep it synchronized across multiple rotations
                const targetNormAngle = progress * (Math.PI * 2);
                
                // Logic to handle continuous rotation without jumping back to 0
                const currentRotations = Math.floor(state.angle / (Math.PI * 2));
                state.angle = (currentRotations * Math.PI * 2) + targetNormAngle;
            }
            
            // Clear history when dragging to prevent wild streaks
            state.history = [];
        }

        function handlePointerUp() {
            if (state.isDragging) {
                state.isDragging = false;
                state.dragTarget = null;
                // Only resume if it was playing and we are in explore mode or it was playing before
                if (state.wasPlaying && document.getElementById('btn-play').innerText === "Pause") {
                    state.isPlaying = true;
                }
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        
        function setMode(mode) {
            state.mode = mode;
            if (mode === 'explore') {
                document.getElementById('btn-mode-explore').classList.add('active-btn');
                document.getElementById('btn-mode-guided').classList.remove('active-btn');
                teacherPanel.classList.add('hidden');
                explorerPanel.classList.remove('hidden');
                explorerPanel.classList.add('visible');
                
                // Ensure all elements are visible for exploration
                state.showGrid = true; state.showAxes = true; state.showCircle = true;
                state.showPoint = true; state.showAngle = true;
                
                // Sync toggles with current state
                state.showSineGraph = document.getElementById('chk-sine').checked;
                state.showSineProj = state.showSineGraph;
                state.showCosGraph = document.getElementById('chk-cos').checked;
                state.showCosProj = state.showCosGraph;
                state.showBeam = document.getElementById('chk-beam').checked;
                state.useDegrees = document.getElementById('chk-degrees').checked;
                
            } else {
                document.getElementById('btn-mode-guided').classList.add('active-btn');
                document.getElementById('btn-mode-explore').classList.remove('active-btn');
                teacherPanel.classList.remove('hidden');
                explorerPanel.classList.add('hidden');
                explorerPanel.classList.remove('visible');
                
                // Restart story
                state.currentScene = -1;
                state.history = [];
                nextScene();
            }
        }

        // Top Bar
        document.getElementById('btn-play').addEventListener('click', (e) => {
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? "Pause" : "Play";
        });
        
        document.getElementById('btn-restart').addEventListener('click', () => {
            state.angle = 0;
            state.history = [];
        });

        document.getElementById('btn-mode-guided').addEventListener('click', () => setMode('guided'));
        document.getElementById('btn-mode-explore').addEventListener('click', () => setMode('explore'));
        
        // Guided Tour Next
        document.getElementById('btn-next-scene').addEventListener('click', nextScene);

        // Explorer Sliders
        const slAmp = document.getElementById('sl-amp');
        const slFreq = document.getElementById('sl-freq');
        const slPhase = document.getElementById('sl-phase');

        slAmp.addEventListener('input', (e) => {
            state.A = parseFloat(e.target.value);
            document.getElementById('lbl-amp').innerText = state.A.toFixed(1);
            state.history = []; // Clear trail on parameter change
        });
        
        slFreq.addEventListener('input', (e) => {
            state.w = parseFloat(e.target.value);
            document.getElementById('lbl-freq').innerText = state.w.toFixed(1);
            state.history = [];
        });
        
        slPhase.addEventListener('input', (e) => {
            state.phi = parseFloat(e.target.value);
            // Format phase as multiple of pi
            const p = (state.phi / Math.PI).toFixed(2);
            document.getElementById('lbl-phase').innerText = `${p}π`;
            state.history = [];
        });

        // Display Toggles
        document.getElementById('chk-sine').addEventListener('change', (e) => {
            state.showSineGraph = e.target.checked;
            state.showSineProj = e.target.checked;
        });
        document.getElementById('chk-cos').addEventListener('change', (e) => {
            state.showCosGraph = e.target.checked;
            state.showCosProj = e.target.checked;
        });
        document.getElementById('chk-beam').addEventListener('change', (e) => {
            state.showBeam = e.target.checked;
        });
        document.getElementById('chk-degrees').addEventListener('change', (e) => {
            state.useDegrees = e.target.checked;
        });

        // Initialize and Start
        requestAnimationFrame(animate);
        runIntro();

    </script>
</body>
</html>
