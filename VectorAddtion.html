<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Addition Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            color: white;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .panel {
            position: absolute;
            background: rgba(0, 10, 30, 0.8);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }
        
        #title-panel {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 15px 30px;
        }
        
        #title-panel h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }
        
        #title-panel p {
            font-size: 16px;
            color: #aaccff;
        }
        
        #controls-panel {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        
        .control-btn {
            background: rgba(0, 50, 100, 0.7);
            color: #00ccff;
            border: 1px solid #00ccff;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .control-btn:hover {
            background: rgba(0, 100, 200, 0.7);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.7);
        }
        
        .control-btn.active {
            background: rgba(0, 150, 255, 0.7);
            box-shadow: 0 0 15px rgba(0, 200, 255, 1);
        }
        
        #formula-panel {
            top: 100px;
            right: 20px;
            text-align: center;
            min-width: 200px;
        }
        
        #formula-panel h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00ffcc;
        }
        
        #formula {
            font-size: 24px;
            color: #ffcc00;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        #vector-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaccff;
        }
        
        .vector-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }
        
        #loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #00ccff;
        }
        
        .progress-bar {
            width: 300px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            width: 0%;
            transition: width 0.3s;
        }
        
        #instructions {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #aaccff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
        }
        
        .draggable-point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: auto;
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="panel" id="title-panel">
            <h1>CINEMATIC VECTOR ADDITION</h1>
            <p>Triangle Law & Parallelogram Law Visualization</p>
        </div>
        
        <div class="panel" id="controls-panel">
            <button class="control-btn active" id="triangle-btn">Triangle Law</button>
            <button class="control-btn" id="parallelogram-btn">Parallelogram Law</button>
            <button class="control-btn" id="reset-btn">Reset Vectors</button>
        </div>
        
        <div class="panel" id="formula-panel">
            <h2>VECTOR ADDITION</h2>
            <div id="formula">R = A + B</div>
            <div id="vector-info">
                <p><span class="vector-color" style="background: #0088ff;"></span> Vector A: <span id="vector-a">5 units</span></p>
                <p><span class="vector-color" style="background: #00ff88;"></span> Vector B: <span id="vector-b">5 units</span></p>
                <p><span class="vector-color" style="background: #ffcc00;"></span> Resultant R: <span id="vector-r">7.07 units</span></p>
            </div>
        </div>
        
        <div id="instructions">
            Drag the endpoints of vectors to change their magnitude and direction
        </div>
        
        <div class="draggable-point" id="point-a" style="left: 50px; top: 300px;"></div>
        <div class="draggable-point" id="point-b" style="left: 350px; top: 300px;"></div>
    </div>
    
    <div id="loading">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div id="loading-text">Loading 3D Models and Assets...</div>
    </div>

    <script>
        // Main Three.js implementation
        let scene, camera, renderer, controls;
        let vectorA, vectorB, resultant;
        let isTriangleLaw = true;
        let carA, carB;
        
        // Vector colors
        const COLOR_A = 0x0088ff;
        const COLOR_B = 0x00ff88;
        const COLOR_R = 0xffcc00;
        
        // Vector endpoints
        let vectorAStart = new THREE.Vector3(0, 0, 0);
        let vectorAEnd = new THREE.Vector3(5, 0, 0);
        let vectorBStart = new THREE.Vector3(5, 0, 0);
        let vectorBEnd = new THREE.Vector3(5, 0, 5);
        
        // Initialize the application
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.Fog(0x000510, 10, 30);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 8, 10);
            camera.lookAt(0, 0, 0);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            // Create grid floor
            const gridHelper = new THREE.GridHelper(20, 20, 0x0088ff, 0x004477);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);
            
            // Create vectors
            createVectors();
            
            // Create cars (simplified with basic geometries for this demo)
            createCars();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Setup UI event listeners
            document.getElementById('triangle-btn').addEventListener('click', () => setLawMode(true));
            document.getElementById('parallelogram-btn').addEventListener('click', () => setLawMode(false));
            document.getElementById('reset-btn').addEventListener('click', resetVectors);
            
            // Setup draggable points
            setupDraggablePoints();
            
            // Simulate loading progress
            simulateLoading();
            
            // Start animation loop
            animate();
        }
        
        function simulateLoading() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                document.getElementById('progress').style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 500);
                }
            }, 100);
        }
        
        function createVectors() {
            // Remove existing vectors if any
            if (vectorA) scene.remove(vectorA);
            if (vectorB) scene.remove(vectorB);
            if (resultant) scene.remove(resultant);
            
            // Create vector A
            const directionA = new THREE.Vector3().subVectors(vectorAEnd, vectorAStart);
            const lengthA = directionA.length();
            const arrowHelperA = new THREE.ArrowHelper(
                directionA.normalize(),
                vectorAStart,
                lengthA,
                COLOR_A,
                1,
                0.5
            );
            scene.add(arrowHelperA);
            vectorA = arrowHelperA;
            
            // Create vector B
            const directionB = new THREE.Vector3().subVectors(vectorBEnd, vectorBStart);
            const lengthB = directionB.length();
            const arrowHelperB = new THREE.ArrowHelper(
                directionB.normalize(),
                isTriangleLaw ? vectorAEnd : vectorAStart,
                lengthB,
                COLOR_B,
                1,
                0.5
            );
            scene.add(arrowHelperB);
            vectorB = arrowHelperB;
            
            // Create resultant vector
            updateResultant();
            
            // Add glowing effects to vectors (simulated with point lights)
            const lightA = new THREE.PointLight(COLOR_A, 1, 10);
            lightA.position.copy(vectorAStart);
            scene.add(lightA);
            
            const lightB = new THREE.PointLight(COLOR_B, 1, 10);
            lightB.position.copy(isTriangleLaw ? vectorAEnd : vectorAStart);
            scene.add(lightB);
            
            const lightR = new THREE.PointLight(COLOR_R, 1, 10);
            lightR.position.copy(vectorAStart);
            scene.add(lightR);
        }
        
        function createCars() {
            // Remove existing cars if any
            if (carA) scene.remove(carA);
            if (carB) scene.remove(carB);
            
            // Simplified car models using basic geometries
            const carGeometry = new THREE.BoxGeometry(1, 0.5, 0.8);
            
            // Car A material
            const carAMaterial = new THREE.MeshPhongMaterial({
                color: COLOR_A,
                emissive: COLOR_A,
                emissiveIntensity: 0.2
            });
            
            // Car B material
            const carBMaterial = new THREE.MeshPhongMaterial({
                color: COLOR_B,
                emissive: COLOR_B,
                emissiveIntensity: 0.2
            });
            
            // Create car meshes
            carA = new THREE.Mesh(carGeometry, carAMaterial);
            carA.position.copy(vectorAStart);
            carA.position.y = 0.25;
            scene.add(carA);
            
            carB = new THREE.Mesh(carGeometry, carBMaterial);
            carB.position.copy(isTriangleLaw ? vectorAEnd : vectorAStart);
            carB.position.y = 0.25;
            scene.add(carB);
            
            // Add underglow
            const underglowA = new THREE.PointLight(COLOR_A, 0.5, 3);
            underglowA.position.set(0, -0.2, 0);
            carA.add(underglowA);
            
            const underglowB = new THREE.PointLight(COLOR_B, 0.5, 3);
            underglowB.position.set(0, -0.2, 0);
            carB.add(underglowB);
        }
        
        function setLawMode(triangleMode) {
            isTriangleLaw = triangleMode;
            
            // Update UI
            document.getElementById('triangle-btn').classList.toggle('active', triangleMode);
            document.getElementById('parallelogram-btn').classList.toggle('active', !triangleMode);
            
            // Update vector positions
            updateVectorPositions();
            
            // Update cars
            createCars();
        }
        
        function resetVectors() {
            // Reset vector endpoints
            vectorAStart.set(0, 0, 0);
            vectorAEnd.set(5, 0, 0);
            vectorBStart.set(5, 0, 0);
            vectorBEnd.set(5, 0, 5);
            
            // Update vector positions
            updateVectorPositions();
            
            // Update cars
            createCars();
            
            // Update draggable points position
            updateDraggablePoints();
        }
        
        function updateVectorPositions() {
            // Recreate vectors with updated positions
            createVectors();
        }
        
        function updateResultant() {
            // Remove existing resultant if any
            if (resultant) scene.remove(resultant);
            
            // Calculate resultant vector
            const vecA = new THREE.Vector3().subVectors(vectorAEnd, vectorAStart);
            const vecB = new THREE.Vector3().subVectors(vectorBEnd, vectorBStart);
            const resultantVec = new THREE.Vector3().addVectors(vecA, vecB);
            const resultantLength = resultantVec.length();
            
            // Create resultant vector
            const arrowHelperR = new THREE.ArrowHelper(
                resultantVec.normalize(),
                vectorAStart,
                resultantLength,
                COLOR_R,
                1,
                0.5
            );
            scene.add(arrowHelperR);
            resultant = arrowHelperR;
            
            // Update UI
            document.getElementById('vector-a').textContent = `${vecA.length().toFixed(2)} units`;
            document.getElementById('vector-b').textContent = `${vecB.length().toFixed(2)} units`;
            document.getElementById('vector-r').textContent = `${resultantLength.toFixed(2)} units`;
        }
        
        function setupDraggablePoints() {
            const pointA = document.getElementById('point-a');
            const pointB = document.getElementById('point-b');
            
            let isDragging = false;
            let currentPoint = null;
            
            const onMouseDown = (e, point) => {
                isDragging = true;
                currentPoint = point;
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };
            
            const onMouseMove = (e) => {
                if (!isDragging) return;
                
                // Calculate new position based on mouse movement
                const rect = renderer.domElement.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                
                // Convert to world coordinates
                const mouseVector = new THREE.Vector3(x, y, 0.5);
                mouseVector.unproject(camera);
                
                const dir = mouseVector.sub(camera.position).normalize();
                const distance = -camera.position.y / dir.y;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                // Update point position
                currentPoint.style.left = `${e.clientX}px`;
                currentPoint.style.top = `${e.clientY}px`;
                
                // Update vector endpoints
                if (currentPoint === pointA) {
                    vectorAEnd.set(pos.x, 0, pos.z);
                } else {
                    vectorBEnd.set(pos.x, 0, pos.z);
                    if (isTriangleLaw) {
                        vectorBStart.copy(vectorAEnd);
                    } else {
                        vectorBStart.copy(vectorAStart);
                    }
                }
                
                // Update vectors and cars
                updateVectorPositions();
                createCars();
            };
            
            const onMouseUp = () => {
                isDragging = false;
                currentPoint = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };
            
            pointA.addEventListener('mousedown', (e) => onMouseDown(e, pointA));
            pointB.addEventListener('mousedown', (e) => onMouseDown(e, pointB));
            
            // Set initial positions
            updateDraggablePoints();
        }
        
        function updateDraggablePoints() {
            // Convert 3D coordinates to screen coordinates
            const vectorAEndPos = vectorAEnd.clone().project(camera);
            const vectorBEndPos = vectorBEnd.clone().project(camera);
            
            const pointA = document.getElementById('point-a');
            const pointB = document.getElementById('point-b');
            
            pointA.style.left = `${(vectorAEndPos.x * 0.5 + 0.5) * window.innerWidth}px`;
            pointA.style.top = `${(-vectorAEndPos.y * 0.5 + 0.5) * window.innerHeight}px`;
            
            pointB.style.left = `${(vectorBEndPos.x * 0.5 + 0.5) * window.innerWidth}px`;
            pointB.style.top = `${(-vectorBEndPos.y * 0.5 + 0.5) * window.innerHeight}px`;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateDraggablePoints();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Add some subtle animation to the vectors
            const time = Date.now() * 0.001;
            
            // Pulse the vector lights slightly
            const pulseIntensity = 0.5 + 0.5 * Math.sin(time * 2);
            scene.children.forEach(child => {
                if (child instanceof THREE.PointLight) {
                    child.intensity = pulseIntensity;
                }
            });
            
            // Update draggable points position
            updateDraggablePoints();
            
            // Render the scene
            renderer.render(scene, camera);
        }
        
        // Start the application
        init();
    </script>
</body>
</html>
