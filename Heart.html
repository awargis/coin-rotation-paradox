<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3.1: The Function Test</title>
    <style>
        :root {
            --bg-teal: #041b2d;
            --bg-purple: #1a0b2e;
            --neon-blue: #00f3ff;
            --gold-glow: #ffd700;
            --alert-red: #ff3333;
            --text-main: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--bg-teal), var(--bg-purple));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Holographic Display Container */
        .hologram-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 85vh; /* Slightly increased to give more breathing room */
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        /* Typography & Headers */
        header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 1rem;
            margin-top: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Canvas Area */
        #graphCanvas {
            flex-grow: 1;
            width: 100%;
            display: block;
        }

        /* Floating UI Elements */
        .ui-element {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            z-index: 10;
        }

        .equation-box {
            top: 110px;
            left: 30px;
            font-size: 1.2rem;
            color: var(--gold-glow);
            text-shadow: 0 0 8px var(--gold-glow);
            border-left: 4px solid var(--gold-glow);
        }

        .logic-indicator {
            bottom: 100px;
            right: 30px;
            font-size: 1.1rem;
            color: var(--alert-red);
            border-left: 4px solid var(--alert-red);
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .logic-indicator.visible {
            opacity: 1;
        }

        /* Brand Identity */
        .brand {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }
        
        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            h1 { font-size: 1.2rem; }
            .equation-box { font-size: 1rem; top: 100px; left: 15px; }
            .logic-indicator { font-size: 0.9rem; bottom: 80px; right: 15px; }
            .brand { font-size: 1.2rem; bottom: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <div class="hologram-container">
        <header>
            <h1>PHASE 3.1: THE FUNCTION TEST - RELATIONS VS. FUNCTIONS</h1>
            <div class="subtitle">Relation vs. Function: DOES THIS RULE PASS THE 'FUNCTION TEST'?</div>
        </header>

        <div class="ui-element equation-box">
            (x² + y² - 1)² = x²y³
        </div>

        <div class="ui-element logic-indicator" id="failAlert">
            ⚠️ NOT FUNCTIONAL: One X yields two Y values! (Fail VLT)
        </div>

        <canvas id="graphCanvas"></canvas>

        <div class="brand">By Aditya Wargis</div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const failAlert = document.getElementById('failAlert');

        // Setup Canvas Size
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            // Subtract header height to prevent overflow
            canvas.height = canvas.parentElement.clientHeight - document.querySelector('header').clientHeight; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scanLineX = 0;
        let direction = 1;
        const scanSpeed = 3;

        function drawGrid(centerX, centerY) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            for(let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.stroke();
        }

        function drawHeart(centerX, centerY, scale) {
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                if (t === 0) ctx.moveTo(centerX + x * scale, centerY + y * scale);
                else ctx.lineTo(centerX + x * scale, centerY + y * scale);
            }
            
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffd700';
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function getIntersections(currentX, centerX, scale) {
            const relX = (currentX - centerX) / scale;
            const bounds = 16; 
            
            // Check if the scan line is intersecting the mathematical bounds of our shape
            if (relX > -bounds + 0.5 && relX < bounds - 0.5) {
                const offset = Math.sqrt(bounds*bounds - relX*relX) * 0.8; 
                return [offset, -offset];
            }
            return [];
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // DYNAMIC SCALE FIX:
            // Calculate scale based on the smaller dimension of the canvas so it always fits
            const paddingDivisor = 40; // Higher number = smaller graph. 40 gives a nice margin.
            const scale = Math.min(canvas.width, canvas.height) / paddingDivisor; 

            drawGrid(centerX, centerY);
            drawHeart(centerX, centerY, scale);

            scanLineX += scanSpeed * direction;
            
            // Dynamic scan line boundaries to keep it near the graph
            const scanBounds = 18 * scale; 
            if (scanLineX > centerX + scanBounds || scanLineX < centerX - scanBounds) {
                direction *= -1;
            }

            // Draw Scanning Blade
            ctx.beginPath();
            ctx.moveTo(scanLineX, 0);
            ctx.lineTo(scanLineX, canvas.height);
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f3ff';
            ctx.stroke();
            ctx.shadowBlur = 0;

            const intersections = getIntersections(scanLineX, centerX, scale);
            
            if (intersections.length >= 2) {
                failAlert.classList.add('visible');
                
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3333';

                intersections.forEach(y => {
                    const absY = centerY + y * scale;
                    const size = 10;
                    ctx.beginPath();
                    ctx.moveTo(scanLineX - size, absY - size);
                    ctx.lineTo(scanLineX + size, absY + size);
                    ctx.moveTo(scanLineX + size, absY - size);
                    ctx.lineTo(scanLineX - size, absY + size);
                    ctx.stroke();
                });
                ctx.shadowBlur = 0;
            } else {
                failAlert.classList.remove('visible');
            }

            requestAnimationFrame(animate);
        }

        // Initialize scan line starting position
        setTimeout(() => {
             scanLineX = canvas.width / 2 - (18 * (Math.min(canvas.width, canvas.height) / 40)); 
        }, 100);
       
        animate();
    </script>
</body>
</html>
