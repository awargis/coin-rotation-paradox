      const isIn = !isOn && S1 < 0;

      drawCircle(s.h, s.k, s.r, OPT.cyan, 2.7, false, 0.05);

      // Equation of T = 0: (px - h)(x - h) + (py - k)(y - k) - r^2 = 0
      const A = s.px - s.h, B = s.py - s.k;
      const C = -(A * s.h + B * s.k + s.r * s.r);

      let meaning = '', badgeColor = 'magenta', speech = '', mood = 'happy';

      if (d > 0.12) {
        drawInfLine(A, B, C, OPT.magenta, 2.6, false, 14);
      } else {
        drawCanvasBadge(s.h, s.k + 0.9, 'P → Center ⇒ Polar recedes to ∞', OPT.cyan);
      }

      if (isOut) {
        meaning = 'CHORD OF CONTACT';
        badgeColor = 'magenta';
        const tans = getTangentsFromPoint(s.h, s.k, s.r, s.px, s.py);
        tans.forEach((t, idx) => {
          drawLine(s.px, s.py, t.x, t.y, OPT.magenta, 2.2, true, 8);
          drawPoint(t.x, t.y, OPT.gold, 5, idx === 0 ? 'T₁' : 'T₂');
        });
        speech = 'Outside (S₁>0): T=0 is Chord of Contact!';
      } else if (isOn) {
        meaning = 'TANGENT AT P';
        badgeColor = 'gold';
        drawLine(s.h, s.k, s.px, s.py, OPT.emerald, 2, true);
        drawRightAngle(s.px, s.py, s.h, s.k, s.px - B, s.py + A, OPT.emerald, 0.3);
        triggerSnapPulse('m4_on', s.px, s.py, '★ SNAP: S₁ = 0 ⇒ T = 0 IS TANGENT!', OPT.gold);
        speech = 'On Circle (S₁=0): T=0 becomes the Tangent!';
        mood = 'excited';
      } else {
        meaning = 'POLAR OF P';
        badgeColor = 'cyan';
        // Show Pole-Polar reciprocity visual: pick a point Q on the Polar & draw tangents from Q
        if (d > 0.35) {
          const norm = Math.hypot(A, B);
          const footX = s.h + (s.r * s.r * A) / (d * d);
          const footY = s.k + (s.r * s.r * B) / (d * d);
          const ux = -B / norm, uy = A / norm;
          const qx = footX + ux * 1.4, qy = footY + uy * 1.4;
          const qTans = getTangentsFromPoint(s.h, s.k, s.r, qx, qy);
          if (qTans.length === 2) {
            drawLine(qx, qy, qTans[0].x, qTans[0].y, OPT.slate, 1.4, true, 0);
            drawLine(qx, qy, qTans[1].x, qTans[1].y, OPT.slate, 1.4, true, 0);
            drawLine(qTans[0].x, qTans[0].y, qTans[1].x, qTans[1].y, OPT.slate, 1.3, true, 0);
            drawPoint(qx, qy, OPT.slate, 4, 'Q on Polar');
          }
          drawLine(s.h, s.k, footX, footY, OPT.emerald, 1.5, true, 0);
          drawRightAngle(footX, footY, s.h, s.k, qx, qy, OPT.emerald, 0.25);
        }
        // Optional Chord Bisected at P (T = S1)
        if (s.showBisected && d > 0.08) {
          const C_bis = -(A * s.px + B * s.py);
          const pts = getLineCircleIntersections(s.h, s.k, s.r, A, B, C_bis);
          if (pts.length === 2) {
            drawLine(pts[0].x, pts[0].y, pts[1].x, pts[1].y, OPT.gold, 3.2, false, 12);
            drawPoint(pts[0].x, pts[0].y, OPT.gold, 4.5);
            drawPoint(pts[1].x, pts[1].y, OPT.gold, 4.5);
            drawRightAngle(s.px, s.py, s.h, s.k, pts[0].x, pts[0].y, OPT.emerald, 0.24);
          }
        }
        speech = 'Inside (S₁<0): T=0 is Polar & T=S₁ bisects chord!';
      }

      drawPoint(s.h, s.k, OPT.cyan, 4.8, 'C');
      drawHandle('m4_p', s.px, s.py, OPT.gold, `P(${fmt(s.px, 1)},${fmt(s.py, 1)})`, (wx, wy) => {
        let nx = clamp(wx, -6.5, 6.5), ny = clamp(wy, -4.8, 4.8);
        const nd = dist(s.h, s.k, nx, ny);
        if (Math.abs(nd - s.r) < 0.16 && nd > 0.1) {
          const ang = Math.atan2(ny - s.k, nx - s.h);
          nx = s.h + s.r * Math.cos(ang);
          ny = s.k + s.r * Math.sin(ang);
        }
        s.px = nx; s.py = ny;
      });
      drawLocusMonkey(s.px, s.py, { mode: 'idle', mood, speech });

      return {
        latex: `T = 0: \\; (${fmt(s.px, 1)})x + (${fmt(s.py, 1)})y = ${fmt(s.r * s.r)} \\; \\Rightarrow \\text{${meaning}}`,
        badge: { text: meaning, color: badgeColor },
        stats: [
          { label: 'Power S₁', val: `${fmt(S1)} (${isOn ? '= 0' : isOut ? '> 0' : '< 0'})`, cls: isOn ? 'text-optGold' : isOut ? 'text-optMagenta' : 'text-optCyan' },
          { label: 'T = 0 Meaning', val: meaning, cls: 'text-white font-bold' },
          { label: 'Chord T = S₁', val: isIn && s.showBisected ? 'Bisected at P ✓' : 'Drag P inside', cls: 'text-optGold' }
        ]
      };
    }

    // ---------- MODULE 5: Tangents, Normals & Director Circle ----------
    function renderM5(dt) {
      const s = STATE.m5;
      const dirR = s.r * Math.SQRT2;
      if (s.lockDirector) {
        if (APP.playing) s.dirAngle += dt * 0.65;
        s.px = s.h + dirR * Math.cos(s.dirAngle);
        s.py = s.k + dirR * Math.sin(s.dirAngle);
        s.trail.push({ x: s.px, y: s.py });
        if (s.trail.length > 120) s.trail.shift();
      }

      drawCircle(s.h, s.k, dirR, OPT.gold, 1.6, true, 0.03, 8);
      drawGoldTrail(s.trail, OPT.gold);
      drawCircle(s.h, s.k, s.r, OPT.cyan, 2.7, false, 0.05);

      const d = dist(s.h, s.k, s.px, s.py);
      const S1 = d * d - s.r * s.r;
      let thetaDeg = 0, isDir = false, speech = 'Drag P to trace a gold locus trail!', mood = 'happy';

      if (S1 > 0.05) {
        const tans = getTangentsFromPoint(s.h, s.k, s.r, s.px, s.py);
        thetaDeg = (2 * Math.asin(clamp(s.r / d, 0, 1)) * 180) / Math.PI;
        isDir = Math.abs(thetaDeg - 90) < 1.5;

        if (tans.length === 2) {
          tans.forEach((t, i) => {
            drawLine(s.px, s.py, t.x, t.y, OPT.magenta, 2.5, false, 12);
            // Normals through C
            drawLine(s.h, s.k, t.x, t.y, OPT.emerald, 1.8, true, 6);
            drawRightAngle(t.x, t.y, s.h, s.k, s.px, s.py, OPT.emerald, 0.26);
            drawPoint(t.x, t.y, OPT.emerald, 4.5, i === 0 ? 'T₁' : 'T₂');
          });
          if (isDir) {
            drawRightAngle(s.px, s.py, tans[0].x, tans[0].y, tans[1].x, tans[1].y, OPT.emerald, 0.42);
            triggerSnapPulse('m5_dir', s.px, s.py, '★ DIRECTOR CIRCLE: θ = 90° (R = r√2)', OPT.gold);
            speech = '90° Tangents! I am on the Director Circle!';
            mood = 'excited';
          }
        }
      } else {
        mood = 'confused';
        speech = 'Inside circle! Drag P outside!';
      }

      drawPoint(s.h, s.k, OPT.cyan, 5, 'C');
      drawHandle('m5_p', s.px, s.py, OPT.gold, `P(${fmt(s.px, 1)},${fmt(s.py, 1)})`, (wx, wy) => {
        s.lockDirector = false;
        let nx = clamp(wx, -6.5, 6.5), ny = clamp(wy, -4.8, 4.8);
        const nd = dist(s.h, s.k, nx, ny);
        if (Math.abs(nd - dirR) < 0.18) {
          const ang = Math.atan2(ny - s.k, nx - s.h);
          nx = s.h + dirR * Math.cos(ang);
          ny = s.k + dirR * Math.sin(ang);
        }
        s.px = nx; s.py = ny;
        s.trail.push({ x: nx, y: ny });
        if (s.trail.length > 140) s.trail.shift();
      });
      drawLocusMonkey(s.px, s.py, { mode: 'idle', mood, speech });

      return {
        latex: `\\theta = ${fmt(thetaDeg, 1)}^\\circ, \\quad R_{\\text{dir}} = r\\sqrt{2} = ${fmt(dirR)}`,
        badge: { text: isDir ? 'DIRECTOR CIRCLE 90° ★' : `Angle θ = ${fmt(thetaDeg, 1)}°`, color: isDir ? 'emerald' : 'magenta' },
        stats: [
          { label: 'Angle θ', val: `${fmt(thetaDeg, 1)}°`, cls: isDir ? 'text-optEmerald font-bold' : 'text-optMagenta' },
          { label: 'Tangent √S₁', val: S1 > 0 ? fmt(Math.sqrt(S1)) : 'N/A', cls: 'text-optCyan' },
          { label: 'Director R=r√2', val: fmt(dirR), cls: 'text-optGold' }
        ]
      };
    }

    // ---------- MODULE 6: Family of Circles (S + λL = 0 & S1 + λS2 = 0) ----------
    function renderM6(dt) {
      const s = STATE.m6;
      if (APP.playing) {
        s.lambda += dt * 0.85 * s.dir;
        if (s.lambda > 3.6) { s.lambda = 3.6; s.dir = -1; }
        if (s.lambda < -3.6) { s.lambda = -3.6; s.dir = 1; }
        syncSliders();
      }

      if (s.mode === 'circleLine') {
        const c1 = { x: 0, y: 0, r: 2.6 };
        const A = s.lineA, B = s.lineB, C = s.lineC;
        drawCircle(c1.x, c1.y, c1.r, OPT.cyan, 2.3, false, 0.04);
        drawInfLine(A, B, C, OPT.magenta, 2.2, true);

        // S + λL = x^2 + y^2 - r^2 + λ(Ax + By + C) = 0
        // g = λA/2, f = λB/2, c = -r^2 + λC
        const g = (s.lambda * A) / 2, f = (s.lambda * B) / 2, cConst = -c1.r * c1.r + s.lambda * C;
        const rSq = g * g + f * f - cConst;
        if (rSq > 0.01) {
          drawCircle(-g, -f, Math.sqrt(rSq), OPT.gold, 2.8, false, 0.06, 16);
          drawPoint(-g, -f, OPT.gold, 4.5, 'Family Center');
        }
        const pts = getLineCircleIntersections(c1.x, c1.y, c1.r, A, B, C);
        pts.forEach((pt, i) => drawPoint(pt.x, pt.y, OPT.emerald, 6, i === 0 ? 'P' : 'Q'));
        drawLocusMonkey(-g, -f, { mode: 'idle', speech: `S + (${fmt(s.lambda, 1)})L = 0 passes through P, Q!` });

        return {
          latex: `S + \\lambda L = 0 \\quad (\\lambda = ${fmt(s.lambda)})`,
          badge: { text: 'Family S + λL = 0', color: 'gold' },
          stats: [
            { label: 'Parameter λ', val: fmt(s.lambda), cls: 'text-optGold' },
            { label: 'Family Radius', val: rSq > 0 ? fmt(Math.sqrt(rSq)) : 'Imaginary', cls: 'text-optCyan' }
          ]
        };
      }

      // Two Circles: S1 + λ S2 = 0
      const { s1, s2 } = s;
      drawCircle(s1.x, s1.y, s1.r, OPT.cyan, 2.2, false, 0.04);
      drawCircle(s2.x, s2.y, s2.r, OPT.slate, 2.0, true, 0.03, 0);
      drawHandle('m6_s1', s1.x, s1.y, OPT.cyan, 'S₁', (wx, wy) => { s1.x = clamp(wx, -5.5, 5.5); s1.y = clamp(wy, -4, 4); });
      drawHandle('m6_s2', s2.x, s2.y, OPT.slate, 'S₂', (wx, wy) => { s2.x = clamp(wx, -5.5, 5.5); s2.y = clamp(wy, -4, 4); });

      const pts = getCircleIntersections(s1.x, s1.y, s1.r, s2.x, s2.y, s2.r);
      const isRadical = Math.abs(s.lambda + 1) < 0.07;

      let famLabel = 'Breathing Family Circle', badgeColor = 'gold', speech = `λ = ${fmt(s.lambda)}: Always passes through P & Q!`, mood = 'happy';

      if (isRadical) {
        famLabel = 'λ = -1 ⇒ RADICAL AXIS!';
        badgeColor = 'magenta';
        const L = getRadicalAxis(s1, s2);
        drawInfLine(L.A, L.B, L.C, OPT.magenta, 3.8, false, 22);
        if (pts.length) triggerSnapPulse('m6_rad', (pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2, '⚡ λ = -1: CIRCLE COLLAPSED TO RADICAL AXIS!', OPT.magenta);
        speech = 'BOOM! At λ = -1, x²+y² cancels → Radical Axis!';
        mood = 'excited';
      } else {
        const denom = 1 + s.lambda;
        const cx = (s1.x + s.lambda * s2.x) / denom;
        const cy = (s1.y + s.lambda * s2.y) / denom;
        const c1Const = s1.x * s1.x + s1.y * s1.y - s1.r * s1.r;
        const c2Const = s2.x * s2.x + s2.y * s2.y - s2.r * s2.r;
        const cMix = (c1Const + s.lambda * c2Const) / denom;
        const rSq = cx * cx + cy * cy - cMix;
        if (rSq > 0.01 && rSq < 400) {
          drawCircle(cx, cy, Math.sqrt(rSq), OPT.gold, 2.8, false, 0.05, 16);
          drawPoint(cx, cy, OPT.gold, 4.5, 'C_λ');
        }
      }

      pts.forEach((pt, i) => drawPoint(pt.x, pt.y, OPT.emerald, 6, i === 0 ? 'P' : 'Q'));
      drawLocusMonkey(pts[0] ? pts[0].x : 0, pts[0] ? pts[0].y : 0, { mode: 'idle', mood, speech });

      return {
        latex: isRadical ? `S_1 - S_2 = 0 \\; (\\lambda = -1 \\implies \\text{Radical Axis})` : `S_1 + (${fmt(s.lambda)})S_2 = 0`,
        badge: { text: famLabel, color: badgeColor },
        stats: [
          { label: 'Parameter λ', val: fmt(s.lambda), cls: isRadical ? 'text-optMagenta font-bold' : 'text-optGold' },
          { label: 'Fixed Points', val: pts.length === 2 ? 'P & Q Locked ✓' : 'No Real Intersect', cls: 'text-optEmerald' }
        ]
      };
    }

    // ---------- MODULE 7: Two Circles & Common Tangents ----------
    function renderM7(dt) {
      const s = STATE.m7;
      if (APP.playing) s.monkeyT = (s.monkeyT + dt * 0.45) % 1;

      const { dct, tct, d } = getCommonTangents(s.x1, s.y1, s.r1, s.x2, s.y2, s.r2);
      const sumR = s.r1 + s.r2, diffR = Math.abs(s.r1 - s.r2);
      const orthoD = Math.hypot(s.r1, s.r2);
      const isOrtho = Math.abs(d - orthoD) < 0.09;

      drawCircle(s.x1, s.y1, s.r1, OPT.cyan, 2.6, false, 0.05);
      drawCircle(s.x2, s.y2, s.r2, OPT.gold, 2.6, false, 0.05);
      drawLine(s.x1, s.y1, s.x2, s.y2, OPT.slate, 1.5, true, 0);

      dct.forEach((seg) => drawLine(seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y, OPT.magenta, 2.4, false, 12));
      tct.forEach((seg) => drawLine(seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y, OPT.emerald, 2.2, false, 10));

      const pts = getCircleIntersections(s.x1, s.y1, s.r1, s.x2, s.y2, s.r2);
      if (isOrtho && pts.length) {
        drawLine(s.x1, s.y1, pts[0].x, pts[0].y, OPT.emerald, 2, true);
        drawLine(s.x2, s.y2, pts[0].x, pts[0].y, OPT.emerald, 2, true);
        drawRightAngle(pts[0].x, pts[0].y, s.x1, s.y1, s.x2, s.y2, OPT.emerald, 0.35);
        triggerSnapPulse('m7_ortho', pts[0].x, pts[0].y, '★ ORTHOGONAL CIRCLES: d² = r₁² + r₂²', OPT.emerald);
      }

      const snapC2 = (wx, wy) => {
        let nx = clamp(wx, -6.2, 6.2), ny = clamp(wy, -4.4, 4.4);
        const nd = dist(s.x1, s.y1, nx, ny);
        if (Math.abs(nd - orthoD) < 0.16 && nd > 0.1) {
          const ang = Math.atan2(ny - s.y1, nx - s.x1);
          nx = s.x1 + orthoD * Math.cos(ang); ny = s.y1 + orthoD * Math.sin(ang);
        }
        s.x2 = nx; s.y2 = ny;
      };

      drawHandle('m7_c1', s.x1, s.y1, OPT.cyan, `S₁`, (wx, wy) => { s.x1 = clamp(wx, -6.2, 6.2); s.y1 = clamp(wy, -4.4, 4.4); });
      drawHandle('m7_c2', s.x2, s.y2, OPT.gold, `S₂`, snapC2);

      const totalT = dct.length + tct.length;
      let mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
      if (dct[0] && !dct[0].isTouch) {
        const t = 0.5 - 0.5 * Math.cos(s.monkeyT * Math.PI * 2);
        mx = dct[0].p1.x + (dct[0].p2.x - dct[0].p1.x) * t;
        my = dct[0].p1.y + (dct[0].p2.y - dct[0].p1.y) * t;
      }
      drawLocusMonkey(mx, my, {
        mode: dct.length ? 'walk' : 'idle',
        mood: isOrtho ? 'excited' : 'happy',
        speech: isOrtho ? 'Orthogonal 90°! 2g₁g₂+2f₁f₂ = c₁+c₂!' : `${totalT} Common Tangent${totalT === 1 ? '' : 's'}!`
      });

      const lDct = d >= diffR ? Math.sqrt(Math.max(0, d * d - (s.r1 - s.r2) ** 2)) : null;
      const lTct = d >= sumR ? Math.sqrt(Math.max(0, d * d - (s.r1 + s.r2) ** 2)) : null;

      return {
        latex: `d = ${fmt(d)}, \\; L_{DCT} = ${lDct !== null ? fmt(lDct) : '\\text{N/A}'}, \\; L_{TCT} = ${lTct !== null ? fmt(lTct) : '\\text{N/A}'}`,
        badge: { text: isOrtho ? 'ORTHOGONAL 90° ★' : `${totalT} Common Tangents`, color: isOrtho ? 'emerald' : 'magenta' },
        stats: [
          { label: 'Center Dist d', val: fmt(d), cls: 'text-optCyan' },
          { label: 'r₁+r₂ | |r₁-r₂|', val: `${fmt(sumR)} | ${fmt(diffR)}`, cls: 'text-slate-300' },
          { label: 'DCT (Magenta)', val: lDct !== null ? fmt(lDct) : 'None', cls: 'text-optMagenta' },
          { label: 'TCT (Emerald)', val: lTct !== null ? fmt(lTct) : 'None', cls: 'text-optEmerald' }
        ]
      };
    }

    // ---------- MODULE 8: Radical Axis & Radical Center ----------
    function renderM8(dt) {
      const s = STATE.m8;
      if (APP.playing) s.monkeySlide += dt * 0.85;
      const { c1, c2, c3 } = s;

      drawCircle(c1.x, c1.y, c1.r, OPT.cyan, 2.5, false, 0.05);
      drawCircle(c2.x, c2.y, c2.r, OPT.gold, 2.5, false, 0.05);
      drawCircle(c3.x, c3.y, c3.r, OPT.slate, 2.3, false, 0.05, 8);

      const L12 = getRadicalAxis(c1, c2), L23 = getRadicalAxis(c2, c3), L31 = getRadicalAxis(c3, c1);
      drawInfLine(L12.A, L12.B, L12.C, OPT.magenta, 2.3, false, 12);
      drawInfLine(L23.A, L23.B, L23.C, hexRgba(OPT.magenta, 0.65), 1.6, true, 6);
      drawInfLine(L31.A, L31.B, L31.C, hexRgba(OPT.magenta, 0.65), 1.6, true, 6);

      const R = intersectLines(L12, L23);
      let orthoR = null;
      if (R && Math.abs(R.x) < 25 && Math.abs(R.y) < 25) {
        const pSq = dist(R.x, R.y, c1.x, c1.y) ** 2 - c1.r * c1.r;
        if (pSq > 0.05) {
          orthoR = Math.sqrt(pSq);
          if (s.showOrthoCircle) {
            drawCircle(R.x, R.y, orthoR, OPT.emerald, 2.3, true, 0.04, 14);
          }
          // Equal tangent segments from R to all 3 circles + 90° markers
          [c1, c2, c3].forEach((ci) => {
            const tans = getTangentsFromPoint(ci.x, ci.y, ci.r, R.x, R.y);
            if (tans[0]) {
              drawLine(R.x, R.y, tans[0].x, tans[0].y, OPT.emerald, 1.8, false, 8);
              drawRightAngle(tans[0].x, tans[0].y, R.x, R.y, ci.x, ci.y, OPT.emerald, 0.24);
            }
          });
        }
        drawPoint(R.x, R.y, OPT.magenta, 7, `Radical Center R`);
      }

      drawHandle('m8_1', c1.x, c1.y, OPT.cyan, 'S₁', (wx, wy) => { c1.x = clamp(wx, -6, 6); c1.y = clamp(wy, -4.4, 4.4); });
      drawHandle('m8_2', c2.x, c2.y, OPT.gold, 'S₂', (wx, wy) => { c2.x = clamp(wx, -6, 6); c2.y = clamp(wy, -4.4, 4.4); });
      drawHandle('m8_3', c3.x, c3.y, OPT.white, 'S₃', (wx, wy) => { c3.x = clamp(wx, -6, 6); c3.y = clamp(wy, -4.4, 4.4); });

      if (R) {
        drawLocusMonkey(R.x, R.y, {
          mode: 'idle', mood: 'excited',
          speech: orthoR ? `Equal tangents = ${fmt(orthoR)} to ALL 3 circles!` : 'R is inside a circle (no orthogonal circle)!'
        });
      } else {
        drawLocusMonkey(c2.x, c2.y + c2.r, {
          mode: 'idle', mood: 'confused',
          speech: 'Collinear centers ⇒ Parallel Radical Axes!'
        });
      }

      return {
        latex: `S_1 - S_2 = 0, \\; S_2 - S_3 = 0 \\implies R(${R ? fmt(R.x, 1) : '?'}, ${R ? fmt(R.y, 1) : '?'})`,
        badge: { text: orthoR ? 'Orthogonal Circle ✓' : 'Radical Center R', color: orthoR ? 'emerald' : 'magenta' },
        stats: [
          { label: 'Radical Center R', val: R ? `(${fmt(R.x)}, ${fmt(R.y)})` : '∞ (Collinear)', cls: 'text-optMagenta' },
          { label: 'Equal Tangent L', val: orthoR ? fmt(orthoR) : 'Interior', cls: 'text-optEmerald' }
        ]
      };
    }

    // ---------- MODULE 9: JEE Advanced Masterclass (4-Stage Chalkboard Reveal) ----------
    const M9_PROBLEMS = [
      {
        title: 'P1 (Black Book): Shortest & Longest Distance',
        stages: [
          { tag: '1. Setup', text: 'Given external point P(x₁, y₁) and circle (x-h)²+(y-k)²=r², find the minimum and maximum distance PQ for Q on the circle.', tex: 'P(x_1, y_1), \\quad C(h, k), \\quad r' },
          { tag: '2. Geometric Insight', text: 'Join P to the center C. By the triangle inequality on ΔCPQ, |PC - r| ≤ PQ ≤ PC + r. Extrema occur strictly along the normal line PC!', tex: 'PC - r \\le PQ \\le PC + r' },
          { tag: '3. Algebraic Shortcut', text: 'Compute d = √((x₁-h)² + (y₁-k)²). Both nearest point A and farthest point B lie on the normal passing through C and P.', tex: 'd = \\sqrt{(x_1-h)^2 + (y_1-k)^2}' },
          { tag: '4. Final Answer', text: 'Shortest distance PA = d - r and Longest distance PB = d + r. Drag P on the board to see PA and PB update live!', tex: 'PQ_{\\min} = d - r, \\quad PQ_{\\max} = d + r' }
        ]
      },
      {
        title: 'P2 (Cengage): Midpoint of 90° Chords',
        stages: [
          { tag: '1. Setup', text: 'A variable chord AB of circle x² + y² = r² subtends a right angle (90°) at the center O. Find the locus of its midpoint M(h, k).', tex: 'x^2 + y^2 = r^2, \\quad \\angle AOB = 90^\\circ' },
          { tag: '2. Geometric Insight', text: 'Since M is the midpoint of chord AB, OM ⊥ AB (emerald 90° marker) and OM bisects ∠AOB into two 45° angles!', tex: '\\angle AOM = 45^\\circ, \\quad OM \\perp AB' },
          { tag: '3. Algebraic Shortcut', text: 'In right ΔOMA, cos 45° = OM / OA ⇒ OM = r / √2. Thus the distance of M(h, k) from origin is constant!', tex: 'OM = r\\cos 45^\\circ = \\frac{r}{\\sqrt{2}}' },
          { tag: '4. Final Answer', text: 'Squaring both sides gives the glowing gold concentric circle: x² + y² = r²/2.', tex: 'x^2 + y^2 = \\frac{r^2}{2}' }
        ]
      },
      {
        title: 'P3 (JEE Adv): Orthogonal Variable Circle',
        stages: [
          { tag: '1. Setup', text: 'A variable circle cuts two fixed circles S₁ = 0 and S₂ = 0 orthogonally. Find the locus of its center P(h, k).', tex: 'S \\perp S_1 \\; \\text{and} \\; S \\perp S_2' },
          { tag: '2. Geometric Insight', text: 'When a variable circle of radius R cuts S₁ orthogonally, R equals the tangent length √S₁(P) from P to S₁. Same for S₂!', tex: 'R = \\sqrt{S_1(P)} = \\sqrt{S_2(P)}' },
          { tag: '3. Algebraic Shortcut', text: 'Squaring gives S₁(h, k) = S₂(h, k) ⇒ S₁ - S₂ = 0. Notice x² + y² cancels out completely!', tex: 'S_1(h, k) - S_2(h, k) = 0' },
          { tag: '4. Final Answer', text: 'The locus of center P is strictly the Radical Axis (magenta line) of S₁ and S₂!', tex: '\\text{Locus: Radical Axis } S_1 - S_2 = 0' }
        ]
      },
      {
        title: 'P4 (JEE Adv): 90° Tangents from Line L',
        stages: [
          { tag: '1. Setup', text: 'Find the points P on a given line L = 0 from which tangents drawn to circle x² + y² = r² are mutually perpendicular (90°).', tex: 'L: y = mx + c, \\quad \\theta = 90^\\circ' },
          { tag: '2. Geometric Insight', text: 'The locus of ALL points from which perpendicular tangents can be drawn is the Director Circle of radius R = r√2!', tex: 'x^2 + y^2 = 2r^2 \\; (\\text{Director Circle})' },
          { tag: '3. Algebraic Shortcut', text: 'Required points P are simply the intersections of Line L with the Director Circle! Real points exist iff p ≤ r√2.', tex: 'L \\cap (x^2 + y^2 = 2r^2)' },
          { tag: '4. Final Answer', text: 'Solve y = mx + c with x² + y² = 2r². Watch the glowing emerald 90° tangents snap at both intersection points!', tex: 'p = \\frac{|c|}{\\sqrt{1+m^2}} \\le r\\sqrt{2}' }
        ]
      },
      {
        title: 'P5 (Black Book): Circumcircle & Area of ΔPAB',
        stages: [
          { tag: '1. Setup', text: 'From an external point P(x₁, y₁), tangents PA and PB are drawn to a circle with center C and radius r. Find the circumcircle of ΔPAB and its area.', tex: 'L = PA = PB = \\sqrt{S_1}' },
          { tag: '2. Geometric Insight', text: 'Since ∠CAP = ∠CBP = 90°, quadrilateral CAPB is cyclic! Therefore, the circumcircle of ΔPAB ALWAYS passes through center C with CP as diameter.', tex: '\\angle CAP = \\angle CBP = 90^\\circ \\implies \\text{Diam} = CP' },
          { tag: '3. Algebraic Shortcut', text: 'Let ∠APC = α. Then tan α = r/L, sin 2α = 2rL/(r²+L²). Area(ΔPAB) = ½ L² sin 2α, while Area(Quad CAPB) = rL.', tex: '\\sin 2\\alpha = \\frac{2rL}{r^2 + L^2}' },
          { tag: '4. Final Answer', text: 'Circumcircle: (x-h)(x-x₁)+(y-k)(y-y₁)=0. Area(ΔPAB) = rL³/(r²+L²). Drag P to verify live!', tex: '\\Delta_{PAB} = \\frac{r L^3}{r^2 + L^2}, \\; \\text{Quad} = rL' }
        ]
      },
      {
        title: 'P6 (Cengage): 3 Kissing Circles on Tangent',
        stages: [
          { tag: '1. Setup', text: 'Two circles of radii r₁ and r₂ touch each other externally and both touch the x-axis. A third circle of radius r₃ fits snugly touching both circles and the x-axis. Find r₃.', tex: 'r_1, r_2 \\text{ given} \\implies \\text{Find } r_3' },
          { tag: '2. Geometric Insight', text: 'For any two externally touching circles of radii a and b resting on a common tangent, the horizontal span between their contact points is √((a+b)² - (a-b)²) = 2√(ab)!', tex: 'T_1 T_2 = 2\\sqrt{r_1 r_2}' },
          { tag: '3. Algebraic Shortcut', text: 'Since T₃ lies between T₁ and T₂ on the x-axis, add the two sub-spans: T₁T₃ + T₃T₂ = T₁T₂ ⇒ 2√(r₁r₃) + 2√(r₂r₃) = 2√(r₁r₂).', tex: '2\\sqrt{r_1 r_3} + 2\\sqrt{r_2 r_3} = 2\\sqrt{r_1 r_2}' },
          { tag: '4. Final Answer', text: 'Divide both sides by 2√(r₁r₂r₃) to get the iconic JEE identity: 1/√r₃ = 1/√r₁ + 1/√r₂! Adjust r₁, r₂ sliders to watch r₃ fit perfectly.', tex: '\\frac{1}{\\sqrt{r_3}} = \\frac{1}{\\sqrt{r_1}} + \\frac{1}{\\sqrt{r_2}}' }
        ]
      },
      {
        title: 'P7 (JEE Adv): Mirror Image of a Circle',
        stages: [
          { tag: '1. Setup', text: 'Find the mirror image of circle (x-h)² + (y-k)² = r² in the line Ax + By + C = 0, and the shortest distance between the original circle and its image.', tex: 'S: (x-h)^2+(y-k)^2=r^2, \\; L: Ax+By+C=0' },
          { tag: '2. Geometric Insight', text: 'Reflection is an isometry: the radius r stays unchanged! We only need to reflect the center C(h, k) perpendicularly across L to get C′(h′, k′).', tex: 'r\' = r, \\quad CC\' \\perp L' },
          { tag: '3. Algebraic Shortcut', text: 'Use the classic JEE mirror image formula for point C(h, k) across Ax + By + C = 0. The center distance is CC′ = 2p.', tex: '\\frac{h\'-h}{A} = \\frac{k\'-k}{B} = \\frac{-2(Ah+Bk+C)}{A^2+B^2}' },
          { tag: '4. Final Answer', text: 'Image circle is (x-h′)² + (y-k′)² = r². If p > r, shortest distance between the two circles is 2(p - r). Drag C to test!', tex: 'd_{\\min} = 2(p - r) \\; (\\text{for } p > r)' }
        ]
      }
    ];

    function renderM9(dt) {
      const s = STATE.m9;
      const prob = M9_PROBLEMS[s.problem];
      const stg = s.stage;

      if (s.problem === 0) {
        // P1: Black Book Shortest & Longest Distance
        const p = s.p1;
        if (APP.playing) p.qAng += dt * 1.1;
        const d = dist(p.h, p.k, p.px, p.py);
        const ang = Math.atan2(p.py - p.k, p.px - p.h);
        const ax = p.h + p.r * Math.cos(ang), ay = p.k + p.r * Math.sin(ang);
        const bx = p.h - p.r * Math.cos(ang), by = p.k - p.r * Math.sin(ang);
        const qx = p.h + p.r * Math.cos(p.qAng), qy = p.k + p.r * Math.sin(p.qAng);

        drawCircle(p.h, p.k, p.r, OPT.cyan, 2.6, false, 0.05);
        if (stg >= 1) {
          drawLine(bx, by, p.px, p.py, OPT.emerald, 2.2, true);
          drawPoint(ax, ay, OPT.emerald, 6, 'A (Min)');
          drawPoint(bx, by, OPT.magenta, 6, 'B (Max)');
        }
        drawLine(p.px, p.py, qx, qy, OPT.gold, 2.4);
        drawPoint(qx, qy, OPT.gold, 5, 'Q');
        drawPoint(p.h, p.k, OPT.cyan, 5, 'C');
        drawHandle('m9_p1', p.px, p.py, OPT.gold, 'P (Drag)', (wx, wy) => { p.px = clamp(wx, -6, 6); p.py = clamp(wy, -4.4, 4.4); });
        drawLocusMonkey(p.px, p.py, { mode: 'idle', speech: `Min = ${fmt(Math.max(0, d - p.r))}, Max = ${fmt(d + p.r)}!` });

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `Stage ${stg + 1}/4`, color: 'gold' },
          stats: [
            { label: 'Live PQ', val: fmt(dist(p.px, p.py, qx, qy)), cls: 'text-optGold' },
            { label: 'Min PA (d-r)', val: fmt(Math.max(0, d - p.r)), cls: 'text-optEmerald' },
            { label: 'Max PB (d+r)', val: fmt(d + p.r), cls: 'text-optMagenta' }
          ]
        };
      }

      if (s.problem === 1) {
        // P2: Cengage Locus of Midpoints of 90° Chords
        const p = s.p2;
        if (APP.playing) p.rot += dt * 0.95;
        const a1 = p.rot - Math.PI / 4, a2 = p.rot + Math.PI / 4;
        const ax = p.r * Math.cos(a1), ay = p.r * Math.sin(a1);
        const bx = p.r * Math.cos(a2), by = p.r * Math.sin(a2);
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        const locR = p.r / Math.SQRT2;

        p.trail.push({ x: mx, y: my });
        if (p.trail.length > 110) p.trail.shift();

        drawCircle(0, 0, p.r, OPT.cyan, 2.5, false, 0.04);
        if (stg >= 2) drawCircle(0, 0, locR, OPT.gold, 2.2, true, 0.05);
        drawGoldTrail(p.trail, OPT.gold);

        drawLine(0, 0, ax, ay, OPT.slate, 1.5, true, 0);
        drawLine(0, 0, bx, by, OPT.slate, 1.5, true, 0);
        drawRightAngle(0, 0, ax, ay, bx, by, OPT.emerald, 0.34);
        drawLine(ax, ay, bx, by, OPT.magenta, 2.6);
        if (stg >= 1) {
          drawLine(0, 0, mx, my, OPT.emerald, 2.2);
          drawRightAngle(mx, my, 0, 0, ax, ay, OPT.emerald, 0.28);
        }
        drawPoint(0, 0, OPT.cyan, 5, 'O');
        drawPoint(mx, my, OPT.gold, 5.5, 'M(h,k)');
        drawLocusMonkey(mx, my, { mode: APP.playing ? 'walk' : 'idle', speech: `OM = r/√2 = ${fmt(locR)}!` });

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `Stage ${stg + 1}/4`, color: 'gold' },
          stats: [
            { label: 'Circle r', val: fmt(p.r), cls: 'text-optCyan' },
            { label: 'Locus Radius r/√2', val: fmt(locR), cls: 'text-optGold' }
          ]
        };
      }

      if (s.problem === 2) {
        // P3: JEE Adv Orthogonal Variable Circle Locus
        const p = s.p3;
        if (APP.playing) p.py = Math.sin(APP.time * 0.9) * 3.3;
        const L = getRadicalAxis(p.s1, p.s2);
        const radX = Math.abs(L.A) > 1e-5 ? -L.C / L.A : 0;
        const rVarSq = dist(radX, p.py, p.s1.x, p.s1.y) ** 2 - p.s1.r * p.s1.r;
        const rVar = rVarSq > 0 ? Math.sqrt(rVarSq) : 0;

        p.trail.push({ x: radX, y: p.py });
        if (p.trail.length > 80) p.trail.shift();

        drawCircle(p.s1.x, p.s1.y, p.s1.r, OPT.cyan, 2.4, false, 0.05);
        drawCircle(p.s2.x, p.s2.y, p.s2.r, OPT.gold, 2.4, false, 0.05);
        if (stg >= 2) drawInfLine(L.A, L.B, L.C, OPT.magenta, 2.4, true);
        drawGoldTrail(p.trail, OPT.gold);

        if (rVar > 0.1) {
          drawCircle(radX, p.py, rVar, OPT.emerald, 2.5, false, 0.04);
          const i1 = getCircleIntersections(radX, p.py, rVar, p.s1.x, p.s1.y, p.s1.r);
          const i2 = getCircleIntersections(radX, p.py, rVar, p.s2.x, p.s2.y, p.s2.r);
          if (i1[0]) drawRightAngle(i1[0].x, i1[0].y, radX, p.py, p.s1.x, p.s1.y, OPT.emerald, 0.32);
          if (i2[0]) drawRightAngle(i2[0].x, i2[0].y, radX, p.py, p.s2.x, p.s2.y, OPT.emerald, 0.32);
        }
        drawHandle('m9_p3', radX, p.py, OPT.emerald, 'P (Drag)', (wx, wy) => { p.py = clamp(wy, -4.2, 4.2); });
        drawLocusMonkey(radX, p.py, { mode: APP.playing ? 'walk' : 'idle', mood: 'excited', speech: 'Gliding on Radical Axis S₁-S₂=0!' });

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `Stage ${stg + 1}/4`, color: 'emerald' },
          stats: [
            { label: 'Radical Axis', val: `x = ${fmt(radX)}`, cls: 'text-optMagenta' },
            { label: 'Variable R', val: fmt(rVar), cls: 'text-optEmerald' }
          ]
        };
      }

      // P4: JEE Adv 90° Tangents from Line L (Line ∩ Director Circle)
      if (s.problem === 3) {
        const p = s.p4;
        const dirR = p.r * Math.SQRT2;
        const A = p.lineM, B = -1, C = p.lineC;
        drawCircle(p.h, p.k, p.r, OPT.cyan, 2.6, false, 0.05);
        if (stg >= 1) drawCircle(p.h, p.k, dirR, OPT.gold, 2.2, true, 0.04);
        drawInfLine(A, B, C, OPT.magenta, 2.4);

        const hits = getLineCircleIntersections(p.h, p.k, dirR, A, B, C);
        hits.forEach((pt, idx) => {
          const tans = getTangentsFromPoint(p.h, p.k, p.r, pt.x, pt.y);
          if (tans.length === 2 && stg >= 2) {
            drawLine(pt.x, pt.y, tans[0].x, tans[0].y, OPT.emerald, 2.2);
            drawLine(pt.x, pt.y, tans[1].x, tans[1].y, OPT.emerald, 2.2);
            drawRightAngle(pt.x, pt.y, tans[0].x, tans[0].y, tans[1].x, tans[1].y, OPT.emerald, 0.36);
          }
          drawPoint(pt.x, pt.y, OPT.emerald, 6.5, `P${idx + 1} (90°)`);
        });

        if (hits[0]) {
          drawLocusMonkey(hits[0].x, hits[0].y, { mode: 'balance', mood: 'excited', speech: 'Found L ∩ Director Circle (90°)!' });
        } else {
          drawLocusMonkey(0, p.lineC, { mode: 'idle', mood: 'confused', speech: 'Line misses Director Circle! Lower c!' });
        }

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `${hits.length} Solution${hits.length === 1 ? '' : 's'}`, color: hits.length ? 'emerald' : 'magenta' },
          stats: [
            { label: 'Director r√2', val: fmt(dirR), cls: 'text-optGold' },
            { label: 'Valid Points', val: `${hits.length} intersection(s)`, cls: 'text-optEmerald' }
          ]
        };
      }

      // P5: Black Book Circumcircle & Area of ΔPAB
      if (s.problem === 4) {
        const p = s.p5;
        drawCircle(p.h, p.k, p.r, OPT.cyan, 2.6, false, 0.05);
        const d = dist(p.h, p.k, p.px, p.py);
        const S1 = d * d - p.r * p.r;
        const L = S1 > 0 ? Math.sqrt(S1) : 0;
        const tans = getTangentsFromPoint(p.h, p.k, p.r, p.px, p.py);

        let areaTri = 0, areaQuad = 0;
        if (tans.length === 2) {
          areaTri = (p.r * Math.pow(L, 3)) / (p.r * p.r + L * L);
          areaQuad = p.r * L;

          // Fill ΔPAB softly when stage >= 2
          if (stg >= 2) {
            const sp = w2s(p.px, p.py), sa = w2s(tans[0].x, tans[0].y), sb = w2s(tans[1].x, tans[1].y);
            ctx.save();
            ctx.fillStyle = hexRgba(OPT.gold, 0.14);
            ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y); ctx.closePath(); ctx.fill();
            ctx.restore();
          }

          // Circumcircle on diameter CP when stage >= 1
          if (stg >= 1) {
            const mx = (p.h + p.px) / 2, my = (p.k + p.py) / 2;
            drawCircle(mx, my, d / 2, OPT.gold, 2.1, true, 0.04, 12);
            drawLine(p.h, p.k, p.px, p.py, OPT.slate, 1.5, true, 0);
            drawPoint(mx, my, OPT.gold, 4, 'Mid(CP)');
          }

          drawLine(p.px, p.py, tans[0].x, tans[0].y, OPT.magenta, 2.4);
          drawLine(p.px, p.py, tans[1].x, tans[1].y, OPT.magenta, 2.4);
          drawLine(tans[0].x, tans[0].y, tans[1].x, tans[1].y, OPT.gold, 2.3);
          drawLine(p.h, p.k, tans[0].x, tans[0].y, OPT.emerald, 1.8, true);
          drawLine(p.h, p.k, tans[1].x, tans[1].y, OPT.emerald, 1.8, true);
          drawRightAngle(tans[0].x, tans[0].y, p.h, p.k, p.px, p.py, OPT.emerald, 0.28);
          drawRightAngle(tans[1].x, tans[1].y, p.h, p.k, p.px, p.py, OPT.emerald, 0.28);
          drawPoint(tans[0].x, tans[0].y, OPT.emerald, 5, 'A');
          drawPoint(tans[1].x, tans[1].y, OPT.emerald, 5, 'B');
        }

        drawPoint(p.h, p.k, OPT.cyan, 5.5, 'C');
        drawHandle('m9_p5', p.px, p.py, OPT.gold, 'P (Drag)', (wx, wy) => {
          p.px = clamp(wx, -6, 6); p.py = clamp(wy, -4.4, 4.4);
        });
        drawLocusMonkey(p.px, p.py, {
          mode: 'idle', mood: tans.length === 2 ? 'excited' : 'confused',
          speech: tans.length === 2 ? `Cyclic CAPB! Area ΔPAB = ${fmt(areaTri)}` : 'Move P outside the circle!'
        });

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `Stage ${stg + 1}/4`, color: 'gold' },
          stats: [
            { label: 'Tangent L = √S₁', val: fmt(L), cls: 'text-optMagenta' },
            { label: 'Area(ΔPAB)', val: fmt(areaTri), cls: 'text-optGold' },
            { label: 'Area(Quad CAPB)', val: fmt(areaQuad), cls: 'text-optCyan' },
            { label: 'Circumradius', val: fmt(d / 2), cls: 'text-optEmerald' }
          ]
        };
      }

      // P6: Cengage 3 Kissing Circles on Common Tangent (y = -2.2)
      if (s.problem === 5) {
        const p = s.p6;
        const baseY = -2.2;
        const span12 = 2 * Math.sqrt(p.r1 * p.r2);
        const r3 = (p.r1 * p.r2) / Math.pow(Math.sqrt(p.r1) + Math.sqrt(p.r2), 2);
        const span13 = 2 * Math.sqrt(p.r1 * r3);

        const x1 = -span12 * 0.5;
        const x2 = span12 * 0.5;
        const x3 = x1 + span13;

        // Common tangent line y = baseY
        drawInfLine(0, 1, -baseY, OPT.magenta, 2.5, false, 12);
        drawCircle(x1, baseY + p.r1, p.r1, OPT.cyan, 2.6, false, 0.06);
        drawCircle(x2, baseY + p.r2, p.r2, OPT.gold, 2.6, false, 0.06);
        drawCircle(x3, baseY + r3, r3, OPT.emerald, 2.6, false, 0.14, 16);

        // Contact points on x-axis
        drawPoint(x1, baseY, OPT.cyan, 5, 'T₁');
        drawPoint(x2, baseY, OPT.gold, 5, 'T₂');
        drawPoint(x3, baseY, OPT.emerald, 5, 'T₃');

        if (stg >= 1) {
          // Right-triangle proof for 2√(r1 r2)
          drawLine(x1, baseY + p.r1, x2, baseY + p.r2, OPT.slate, 1.8, true);
          drawLine(x1, baseY + p.r2, x2, baseY + p.r2, OPT.slate, 1.5, true);
          drawLine(x1, baseY + p.r1, x1, baseY + p.r2, OPT.slate, 1.5, true);
          drawRightAngle(x1, baseY + p.r2, x1, baseY + p.r1, x2, baseY + p.r2, OPT.emerald, 0.28);
          drawCanvasBadge((x1 + x2) / 2, baseY - 0.5, `T₁T₂ = 2√(r₁r₂) = ${fmt(span12)}`, OPT.magenta);
        }

        drawPoint(x1, baseY + p.r1, OPT.cyan, 4.5, `r₁=${fmt(p.r1, 1)}`);
        drawPoint(x2, baseY + p.r2, OPT.gold, 4.5, `r₂=${fmt(p.r2, 1)}`);
        drawLocusMonkey(x3, baseY + 2 * r3, {
          mode: 'balance', mood: 'excited', scale: 0.85,
          speech: `1/√r₃ = 1/√r₁ + 1/√r₂ ⇒ r₃ = ${fmt(r3)}!`
        });

        return {
          latex: prob.stages[stg].tex,
          badge: { text: `r₃ = ${fmt(r3)}`, color: 'emerald' },
          stats: [
            { label: 'r₁ (Cyan) | r₂ (Gold)', val: `${fmt(p.r1, 1)} | ${fmt(p.r2, 1)}`, cls: 'text-optCyan' },
            { label: 'Exact r₃ (Emerald)', val: fmt(r3, 3), cls: 'text-optEmerald font-bold' },
            { label: 'Span 2√(r₁r₂)', val: fmt(span12), cls: 'text-optMagenta' },
            { label: '1/√r₁ + 1/√r₂', val: fmt(1 / Math.sqrt(p.r1) + 1 / Math.sqrt(p.r2), 3), cls: 'text-optGold' }
          ]
        };
      }

      // P7: JEE Adv Mirror Image of a Circle in Line L
      const p = s.p7;
      const rad = (p.lineAng * Math.PI) / 180;
      const A = Math.cos(rad), B = Math.sin(rad), C = -p.lineOffset;
      const signed = A * p.h + B * p.k + C; // since A²+B² = 1
      const distP = Math.abs(signed);
      const mx = p.h - A * signed, my = p.k - B * signed;
      const hx = p.h - 2 * A * signed, hy = p.k - 2 * B * signed;

      drawInfLine(A, B, C, OPT.magenta, 2.6, false, 14);
      drawCircle(p.h, p.k, p.r, OPT.cyan, 2.6, false, 0.06);

      if (stg >= 1) {
        drawLine(p.h, p.k, hx, hy, OPT.emerald, 2.0, true);
        drawRightAngle(mx, my, p.h, p.k, mx - B, my + A, OPT.emerald, 0.28);
        drawPoint(mx, my, OPT.emerald, 5, 'Foot M');
      }
      if (stg >= 2) {
        drawCircle(hx, hy, p.r, OPT.gold, 2.6, false, 0.06);
        drawPoint(hx, hy, OPT.gold, 5.5, `C'(${fmt(hx, 1)},${fmt(hy, 1)})`);
      }

      const minGap = Math.max(0, 2 * (distP - p.r));
      drawHandle('m9_p7', p.h, p.k, OPT.cyan, `C(${fmt(p.h, 1)},${fmt(p.k, 1)})`, (wx, wy) => {
        p.h = clamp(wx, -5.8, 5.8); p.k = clamp(wy, -4.2, 4.2);
      });
      drawLocusMonkey(p.h, p.k + p.r, {
        mode: 'idle', mood: 'happy', scale: 0.85,
        speech: stg >= 2 ? `Same radius r=${fmt(p.r, 1)}! Gap = ${fmt(minGap)}` : 'Drag C to reflect across Mirror L!'
      });
      if (stg >= 2) {
        drawLocusMonkey(hx, hy + p.r, { mode: 'idle', facing: -1, mood: 'excited', scale: 0.85, speech: 'I am the Mirror Image!' });
      }

      return {
        latex: prob.stages[stg].tex,
        badge: { text: distP > p.r ? `Gap = ${fmt(minGap)}` : 'Intersecting Mirror', color: distP > p.r ? 'emerald' : 'magenta' },
        stats: [
          { label: 'Original C', val: `(${fmt(p.h, 1)}, ${fmt(p.k, 1)})`, cls: 'text-optCyan' },
          { label: 'Image C′', val: `(${fmt(hx, 1)}, ${fmt(hy, 1)})`, cls: 'text-optGold' },
          { label: 'Dist p to Mirror', val: fmt(distP), cls: 'text-optMagenta' },
          { label: 'Shortest Gap 2(p-r)', val: distP > p.r ? fmt(minGap) : '0 (Overlaps)', cls: 'text-optEmerald' }
        ]
      };
    }

    // ---------- MODULE 10: Real-World Applications ----------
    function renderM10(dt) {
      const s = STATE.m10;
      if (s.sim === 'belt') {
        if (APP.playing) s.gearAng += dt * s.speed * 1.4;
        const x1 = -2.7, x2 = 2.7, { dct, tct, d } = getCommonTangents(x1, 0, s.r1, x2, 0, s.r2);
        const w2 = s.beltType === 'open' ? s.gearAng * (s.r1 / s.r2) : -s.gearAng * (s.r1 / s.r2);
        drawPulley(x1, 0, s.r1, s.gearAng, OPT.cyan, 14);
        drawPulley(x2, 0, s.r2, w2, OPT.gold, 10);

        const segs = s.beltType === 'open' ? dct : tct;
        segs.forEach((seg) => {
          drawLine(seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y, OPT.magenta, 4, false, 14);
          const p1 = w2s(seg.p1.x, seg.p1.y), p2 = w2s(seg.p2.x, seg.p2.y);
          ctx.save();
          ctx.strokeStyle = '#05070E'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
          ctx.lineDashOffset = -s.gearAng * s.r1 * getScale();
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          ctx.restore();
        });
        if (segs[0]) {
          const t = (APP.time * 0.4 * s.speed) % 1;
          drawLocusMonkey(segs[0].p1.x + (segs[0].p2.x - segs[0].p1.x) * t, segs[0].p1.y + (segs[0].p2.y - segs[0].p1.y) * t, {
            mode: 'walk', mood: 'excited', speech: s.beltType === 'open' ? 'Open Belt = DCT!' : 'Crossed Belt = TCT!'
          });
        }
        const span = s.beltType === 'open' ? Math.sqrt(Math.max(0, d * d - (s.r1 - s.r2) ** 2)) : Math.sqrt(Math.max(0, d * d - (s.r1 + s.r2) ** 2));
        return {
          latex: s.beltType === 'open' ? `L_{DCT} = \\sqrt{d^2 - (r_1 - r_2)^2} = ${fmt(span)}` : `L_{TCT} = \\sqrt{d^2 - (r_1 + r_2)^2} = ${fmt(span)}`,
          badge: { text: s.beltType === 'open' ? 'Open Belt (DCT)' : 'Crossed Belt (TCT)', color: 'magenta' },
          stats: [
            { label: 'Belt Span', val: `${fmt(span)} m`, cls: 'text-optMagenta' },
            { label: 'Gear Ratio', val: `${s.beltType === 'open' ? '+' : '-'}${fmt(s.r1 / s.r2)}x`, cls: 'text-optCyan' }
          ]
        };
      }

      if (s.sim === 'satellite') {
        if (APP.playing) s.satAng += dt * 0.32;
        const Rkm = 6371, R = 2.3, orbR = R * (1 + s.satAlt / Rkm);
        const sx = orbR * Math.cos(s.satAng), sy = orbR * Math.sin(s.satAng);

        const ep = w2s(0, 0), er = R * getScale();
        ctx.save();
        const atmo = ctx.createRadialGradient(ep.x, ep.y, er * 0.85, ep.x, ep.y, er * 1.3);
        atmo.addColorStop(0, 'rgba(0,240,255,0.34)'); atmo.addColorStop(1, 'rgba(0,240,255,0)');
        ctx.fillStyle = atmo; ctx.beginPath(); ctx.arc(ep.x, ep.y, er * 1.3, 0, Math.PI * 2); ctx.fill();
        const eg = ctx.createRadialGradient(ep.x - er * 0.3, ep.y - er * 0.3, er * 0.1, ep.x, ep.y, er);
        eg.addColorStop(0, '#2563EB'); eg.addColorStop(0.7, '#1E3A8A'); eg.addColorStop(1, '#081433');
        ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ep.x, ep.y, er, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = OPT.cyan; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();

        drawCircle(0, 0, orbR, OPT.slate, 1.2, true, 0, 0);
        const tans = getTangentsFromPoint(0, 0, R, sx, sy);
        tans.forEach((t) => {
          drawLine(sx, sy, t.x, t.y, OPT.magenta, 2.4);
          drawLine(0, 0, t.x, t.y, OPT.emerald, 1.5, true, 0);
          drawRightAngle(t.x, t.y, 0, 0, sx, sy, OPT.emerald, 0.24);
          drawPoint(t.x, t.y, OPT.gold, 4.5);
        });

        drawHandle('m10_sat', sx, sy, OPT.gold, '🛰 Satellite (Drag)', (wx, wy) => {
          s.satAng = Math.atan2(wy, wx);
          const nr = clamp(Math.hypot(wx, wy), R * 1.08, R * 2.45);
          s.satAlt = Math.round(((nr / R) - 1) * Rkm);
          syncSliders();
        });

        const horizon = Math.sqrt(s.satAlt * (2 * Rkm + s.satAlt));
        const covDeg = (2 * Math.acos(Rkm / (Rkm + s.satAlt)) * 180) / Math.PI;
        drawLocusMonkey(sx, sy, { mode: 'idle', scale: 0.8, speech: `Horizon = ${Math.round(horizon)} km!` });
        return {
          latex: `d_{\\text{horizon}} = \\sqrt{h(2R+h)} = ${Math.round(horizon)}\\text{ km}`,
          badge: { text: 'Satellite Tangent Horizon', color: 'cyan' },
          stats: [
            { label: 'Altitude h', val: `${s.satAlt} km`, cls: 'text-optCyan' },
            { label: 'Horizon Tangent', val: `${Math.round(horizon)} km`, cls: 'text-optMagenta' },
            { label: 'Earth Arc 2α', val: `${fmt(covDeg, 1)}°`, cls: 'text-optGold' },
            { label: 'Tangent Angle', val: '90.0° ⊥', cls: 'text-optEmerald' }
          ]
        };
      }

      // Circular Laser Chamber
      const R = 3.7;
      if (APP.playing) s.laserProg = (s.laserProg + dt * 0.6) % 1;
      drawCircle(0, 0, R, OPT.cyan, 3, false, 0.04);
      drawPoint(0, 0, OPT.emerald, 5, 'Center C');

      const inc = (s.laserDeg * Math.PI) / 180;
      const dTheta = Math.PI - 2 * inc;
      const pts = [];
      for (let i = 0; i <= s.laserBounces; i++) pts.push({ x: R * Math.cos(Math.PI + i * dTheta), y: R * Math.sin(Math.PI + i * dTheta) });
      for (let i = 0; i < pts.length - 1; i++) {
        drawLine(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, OPT.magenta, 2.4, false, 14);
        if (i > 0) {
          drawLine(0, 0, pts[i].x, pts[i].y, OPT.emerald, 1.5, true, 6);
          drawPoint(pts[i].x, pts[i].y, OPT.gold, 4.5);
        }
      }
      const total = pts.length - 1, segF = s.laserProg * total, idx = Math.min(total - 1, Math.floor(segF)), f = segF - idx;
      drawPoint(pts[idx].x + (pts[idx + 1].x - pts[idx].x) * f, pts[idx].y + (pts[idx + 1].y - pts[idx].y) * f, '#FFFFFF', 5.5);
      drawLocusMonkey(pts[1].x, pts[1].y, { mode: 'idle', scale: 0.82, speech: `Every Normal passes through C! ∠i = ${s.laserDeg}°` });

      return {
        latex: `\\angle i = \\angle r = ${s.laserDeg}^\\circ, \\; \\text{Chord} = 2R\\cos i = ${fmt(2 * R * Math.cos(inc))}`,
        badge: { text: 'Normal = Radius', color: 'emerald' },
        stats: [
          { label: 'Incidence = Reflect', val: `${s.laserDeg}°`, cls: 'text-optMagenta' },
          { label: 'Equal Chord Len', val: fmt(2 * R * Math.cos(inc)), cls: 'text-optGold' }
        ]
      };
    }

    function drawPulley(wx, wy, wr, ang, color, teeth) {
      const p = w2s(wx, wy), r = wr * getScale();
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(-ang);
      ctx.fillStyle = hexRgba(color, 0.2); ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      ctx.beginPath();
      const out = r + 6, inn = r - 3;
      for (let i = 0; i < teeth; i++) {
        const a1 = (i / teeth) * Math.PI * 2, a2 = ((i + 0.35) / teeth) * Math.PI * 2;
        const a3 = ((i + 0.5) / teeth) * Math.PI * 2, a4 = ((i + 0.85) / teeth) * Math.PI * 2;
        if (i === 0) ctx.moveTo(Math.cos(a1) * inn, Math.sin(a1) * inn);
        else ctx.lineTo(Math.cos(a1) * inn, Math.sin(a1) * inn);
        ctx.lineTo(Math.cos(a2) * out, Math.sin(a2) * out);
        ctx.lineTo(Math.cos(a3) * out, Math.sin(a3) * out);
        ctx.lineTo(Math.cos(a4) * inn, Math.sin(a4) * inn);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = hexRgba(color, 0.55); ctx.lineWidth = 2.6;
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78); ctx.stroke();
      }
      ctx.fillStyle = '#05070E'; ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

      sl('sl_m2_g', (v) => STATE.m2.g = v); sl('sl_m2_f', (v) => STATE.m2.f = v); sl('sl_m2_c', (v) => STATE.m2.c = v);

      sl('sl_m2_pr', (v) => STATE.m2.pr = v);
      document.getElementById('btnM2Pt')?.addEventListener('click', () => { STATE.m2.c = +(STATE.m2.g ** 2 + STATE.m2.f ** 2).toFixed(2); syncSliders(); showPillToast('Point Circle: g² + f² - c = 0', OPT.gold); });
      document.getElementById('btnM2Im')?.addEventListener('click', () => { STATE.m2.c = +(STATE.m2.g ** 2 + STATE.m2.f ** 2 + 4).toFixed(2); syncSliders(); showPillToast('Imaginary Ghost Circle: g² + f² - c < 0', OPT.magenta); });

      sl('sl_m3_r', (v) => STATE.m3.r = v);
      document.getElementById('btnM3Snap')?.addEventListener('click', () => {
        const s = STATE.m3;
        const A = s.ly1 - s.ly2, B = s.lx2 - s.lx1, C = s.lx1 * s.ly2 - s.lx2 * s.ly1;
        const n = Math.hypot(A, B) || 1;
        const curP = Math.abs(A * s.h + B * s.k + C) / n;
        const sgn = (A * s.h + B * s.k + C) >= 0 ? 1 : -1;
        const sh = (s.r - curP) * sgn;
        s.lx1 += (A / n) * sh; s.ly1 += (B / n) * sh; s.lx2 += (A / n) * sh; s.ly2 += (B / n) * sh;
        triggerSnapPulse('m3_btn', s.h, s.k + s.r, '★ SNAPPED TO EXACT TANGENT (p = r)', OPT.magenta);
      });

        if (k === '3') { s.r1 = 2.1; s.r2 = 1.5; s.x1 = -1.8; s.x2 = 1.8; }
        if (k === '2') { s.r1 = 2.3; s.r2 = 1.8; s.x1 = -1.3; s.x2 = 1.3; }
        if (k === '1') { s.r1 = 2.7; s.r2 = 1.3; s.x1 = -0.5; s.x2 = 0.9; }
        if (k === '0') { s.r1 = 2.9; s.r2 = 1.1; s.x1 = 0; s.x2 = 0.5; }
        if (k === 'ortho') { s.r1 = 2.4; s.r2 = 1.8; const dO = 3.0; s.x1 = -dO / 2; s.x2 = dO / 2; }
        syncSliders();
      }));

      sl('sl_m8_r1', (v) => STATE.m8.c1.r = v); sl('sl_m8_r2', (v) => STATE.m8.c2.r = v); sl('sl_m8_r3', (v) => STATE.m8.c3.r = v);

      sl('sl_m9_c', (v) => STATE.m9.p4.lineC = v);

    /* ============================================================================
       CANVAS POINTER EVENTS (Handles + Pan/Zoom + Laser Chalk Overlay)
       ============================================================================ */
    function getPtr(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const p = getPtr(e);
      canvas.setPointerCapture(e.pointerId);

      // Laser Chalk Mode takes priority
      if (APP.chalkMode) {
        APP.activeStroke = { color: APP.chalkColor, pts: [p] };
        return;
      }

      // Check draggable geometry handles
      for (let i = APP.handles.length - 1; i >= 0; i--) {
        const h = APP.handles[i];
        const sp = w2s(h.wx, h.wy);
        if (Math.hypot(p.x - sp.x, p.y - sp.y) <= h.radius) {
          APP.draggingHandle = { id: h.id, onDrag: h.onDrag };
          canvas.classList.add('dragging');
          return;
        }
      }

      // Otherwise pan the Obsidian void
      APP.panning = { sx: p.x, sy: p.y, ox: APP.panX, oy: APP.panY };
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      const p = getPtr(e);
      if (APP.chalkMode) {
        if (APP.activeStroke) APP.activeStroke.pts.push(p);
        return;
      }
      if (APP.draggingHandle) {
        const w = s2w(p.x, p.y);
        APP.draggingHandle.onDrag(w.x, w.y);
        return;
      }
      if (APP.panning) {
        APP.panX = APP.panning.ox + (p.x - APP.panning.sx);
        APP.panY = APP.panning.oy + (p.y - APP.panning.sy);
        updateMetrics();
        return;
      }
      let found = null;
      for (let i = APP.handles.length - 1; i >= 0; i--) {
        const sp = w2s(APP.handles[i].wx, APP.handles[i].wy);
        if (Math.hypot(p.x - sp.x, p.y - sp.y) <= APP.handles[i].radius) { found = APP.handles[i].id; break; }
      }
      APP.hoveredHandle = found;
      canvas.classList.toggle('hover-handle', !!found);
    });

    const endPtr = () => {
      if (APP.activeStroke) {
        if (APP.activeStroke.pts.length > 1) APP.chalkStrokes.push(APP.activeStroke);
        APP.activeStroke = null;
      }
      APP.draggingHandle = null;
      APP.panning = null;
      canvas.classList.remove('dragging');
    };
    canvas.addEventListener('pointerup', endPtr);
    canvas.addEventListener('pointercancel', endPtr);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      APP.zoom = clamp(APP.zoom * factor, 0.55, 2.4);
    }, { passive: false });

    /* ============================================================================
       60FPS ANIMATION LOOP
       ============================================================================ */
    function animate(now) {
      const dt = Math.max(0, Math.min((now - APP.lastFrame) / 1000, 0.05));
      APP.lastFrame = now;

      if (APP.playing) {
        APP.time += dt;
        APP.monkey.phase += dt * 4.5;
      }

      // Natural Monkey Blinking
      APP.monkey.blinkTimer += dt;
      if (!APP.monkey.blinking && APP.monkey.blinkTimer > 3.1) { APP.monkey.blinking = true; APP.monkey.blinkTimer = 0; }
      else if (APP.monkey.blinking && APP.monkey.blinkTimer > 0.14) { APP.monkey.blinking = false; APP.monkey.blinkTimer = 0; }

      APP.handles = [];
      const showGrid = !(APP.activeModule === 9 && (STATE.m10.sim === 'satellite' || STATE.m10.sim === 'belt'));
      drawObsidianVoid(showGrid);

      let res = null;
      try {
        switch (APP.activeModule) {
          case 0: res = renderM1(dt); break;
          case 1: res = renderM2(dt); break;
          case 2: res = renderM3(dt); break;
          case 3: res = renderM4(); break;
          case 4: res = renderM5(dt); break;
          case 5: res = renderM6(dt); break;
          case 6: res = renderM7(dt); break;
          case 7: res = renderM8(dt); break;
          case 8: res = renderM9(dt); break;
          case 9: res = renderM10(dt); break;
        }
      } catch (err) {
        console.error('Geometry render error:', err);
      }

      drawRipples(now);
      drawLaserChalk();

      if (now - APP.lastHudSync > 65) {
        APP.lastHudSync = now;
        updateHudDom(res);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('load', () => {
      updateMetrics();
      buildNav();
      buildPanel();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
