<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CIRCLES — Obsidian Optics JEE Main & Advanced Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- KaTeX for textbook-grade LaTeX rendering (with graceful offline fallback) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: '#05070E',
            optCyan: '#00F0FF',
            optGold: '#FFB800',
            optMagenta: '#FF2A85',
            optEmerald: '#00E676',
            optSlate: '#64748B',
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070E;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    /* Obsidian Optics Glassmorphism */
    .glass-hud {
      background: rgba(11, 15, 25, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .glass-pill {
      background: rgba(11, 15, 25, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    /* Tabular numerals so numbers never jitter while dragging */
    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Sleek custom scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.25); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.55); }

    /* Neon semantic range sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.85);
      cursor: pointer;
      border: 2px solid #05070E;
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.18); }
    input[type="range"].gold-slider::-webkit-slider-thumb { background: #FFB800; box-shadow: 0 0 10px rgba(255, 184, 0, 0.85); }
    input[type="range"].magenta-slider::-webkit-slider-thumb { background: #FF2A85; box-shadow: 0 0 10px rgba(255, 42, 133, 0.85); }
    input[type="range"].emerald-slider::-webkit-slider-thumb { background: #00E676; box-shadow: 0 0 10px rgba(0, 230, 118, 0.85); }

    /* Interactive Canvas */
    #geoCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #geoCanvas.dragging { cursor: grabbing; }
    #geoCanvas.hover-handle { cursor: pointer; }
    #geoCanvas.chalk-mode { cursor: crosshair; }

    /* Smooth Clean-Board HUD Collapse */
    .hud-collapsible {
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }
    body.clean-board .hide-left { transform: translateX(-125%); opacity: 0; pointer-events: none; }
    body.clean-board .hide-right { transform: translateX(125%); opacity: 0; pointer-events: none; }
    body.clean-board .hide-top { transform: translateY(-140%); opacity: 0; pointer-events: none; }

    /* KaTeX Styling */
    .katex { font-size: 1.0em; color: #F8FAFC; }
    .katex-display { margin: 0.2em 0; }

    /* X-Ray hover badges */
    .xray-badge {
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .xray-badge:hover, .xray-badge.active {
      transform: translateY(-1px);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
    }
  </style>
</head>
<body class="bg-obsidian text-slate-100 overflow-hidden">

  <!-- Full-Viewport High-DPI Canvas -->
  <div class="fixed inset-0 z-0">
    <canvas id="geoCanvas"></canvas>
  </div>

  <!-- Compact Top Smartboard Toolbar -->
  <header class="fixed top-2.5 left-3 right-3 z-30 flex items-center justify-between gap-2 pointer-events-none">

    <div class="glass-pill rounded-2xl px-3 py-1.5 flex items-center gap-2.5 pointer-events-auto hud-collapsible hide-top max-w-[52vw] sm:max-w-none">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-400 via-sky-500 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 shrink-0">

          <circle cx="12" cy="12" r="8" />

      <div class="truncate">
        <div class="flex items-center gap-2">

          <span class="hidden xl:inline-flex px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/15 text-optGold border border-amber-400/30">

    <!-- Global Smartboard Controls -->

        <span id="playPauseIcon">⏸</span>
        <span class="hidden lg:inline" id="playPauseLabel">Pause</span>

      <!-- Locus the Monkey Toggle -->
      <button id="btnMonkeyToggle" title="Toggle Locus the Monkey Mascot"
        class="glass-pill hover:bg-white/10 active:scale-95 transition rounded-xl px-2.5 py-2 flex items-center gap-1.5 text-xs font-semibold text-optGold border-amber-400/30 hud-collapsible hide-top">

      <button id="btnResetView" title="Reset Camera Pan/Zoom & Module"

        ↺ <span class="hidden xl:inline">Reset</span>
      </button>

      <!-- Clean Board Toggle (ALWAYS ACCESSIBLE) -->
      <button id="btnCleanBoard" title="Smartboard Clean View (Shortcut: H)"
        class="rounded-xl px-3 sm:px-3.5 py-2 text-xs font-bold flex items-center gap-1.5 transition active:scale-95 shadow-lg bg-gradient-to-r from-cyan-400 to-sky-500 hover:from-cyan-300 hover:to-sky-400 text-slate-950 border border-cyan-200/40">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
        <span id="cleanBoardLabel">Clean Board</span>
      </button>
    </div>
  </header>

  <!-- Floating Laser Chalk Palette (Appears when Laser Chalk Mode is Active) -->
  <div id="chalkToolbar"
    class="fixed top-[60px] left-1/2 -translate-x-1/2 z-40 glass-pill rounded-2xl px-3 py-1.5 flex items-center gap-2 border-fuchsia-400/40 shadow-2xl hidden">
    <span class="text-[10px] font-bold uppercase tracking-wider text-optMagenta pr-1">Laser Ink</span>
    <button data-ink="#FFB800" class="ink-swatch w-5 h-5 rounded-full bg-[#FFB800] ring-2 ring-white scale-110 transition"></button>
    <button data-ink="#FF2A85" class="ink-swatch w-5 h-5 rounded-full bg-[#FF2A85] opacity-75 hover:opacity-100 transition"></button>
    <button data-ink="#00F0FF" class="ink-swatch w-5 h-5 rounded-full bg-[#00F0FF] opacity-75 hover:opacity-100 transition"></button>
    <button data-ink="#FFFFFF" class="ink-swatch w-5 h-5 rounded-full bg-[#FFFFFF] opacity-75 hover:opacity-100 transition"></button>
    <div class="w-px h-4 bg-white/15 mx-0.5"></div>
    <button id="btnChalkUndo" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-semibold text-slate-200">Undo</button>
    <button id="btnChalkClear" class="px-2 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/35 text-[11px] font-semibold text-rose-300">Clear (C)</button>

  <!-- Left Collapsible 10-Module Navigation Sidebar -->
  <nav id="moduleNav"
    class="fixed z-20 left-3 top-[60px] right-3 lg:right-auto lg:bottom-3 lg:w-56 glass-hud rounded-2xl p-1.5 flex lg:flex-col gap-1 overflow-x-auto lg:overflow-y-auto hud-collapsible hide-left">
    <div class="hidden lg:flex items-center justify-between px-2.5 pt-1.5 pb-2 border-b border-white/10">
      <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">10 JEE Labs</span>
      <span class="text-[10px] tabular text-optCyan">S₁ · S₂ · L</span>

  </nav>

  <!-- Right Floating Inspector & Live KaTeX HUD -->
  <aside id="inspectorPanel"
    class="fixed z-20 right-3 bottom-3 top-auto lg:top-[60px] left-3 lg:left-auto lg:w-[345px] xl:w-[368px] max-h-[40vh] lg:max-h-none glass-hud rounded-2xl flex flex-col overflow-hidden hud-collapsible hide-right">
    <div class="px-3.5 py-2.5 border-b border-white/10 flex items-center justify-between gap-2 bg-white/[0.02]">
      <div class="min-w-0">
        <div id="panelModuleBadge" class="text-[10px] font-bold uppercase tracking-widest text-optCyan">Lab 01</div>
        <h2 id="panelModuleTitle" class="text-sm font-bold text-white truncate">Definition &amp; Locus</h2>

      <span id="panelStatusBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold border shrink-0 hidden">LIVE</span>
    </div>
    <div id="panelBody" class="p-3 overflow-y-auto space-y-3 flex-1">

  <!-- Bottom-Center Live KaTeX Ribbon (Visible even in Clean Board for classroom legibility) -->
  <div id="bottomMathHud"
    class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 glass-pill rounded-2xl px-4 py-2 hidden lg:flex items-center gap-2.5 max-w-[46vw] pointer-events-none">
    <span class="w-2 h-2 rounded-full bg-optCyan animate-pulse shrink-0"></span>
    <div id="hudEquation" class="text-sm text-white truncate"></div>
  </div>

  <!-- Magnetic Snap & Toast Pill Badge -->
  <div id="snapToast"
    class="fixed top-[104px] left-1/2 -translate-x-1/2 z-50 glass-pill px-4 py-1.5 rounded-full text-xs font-bold tracking-wide shadow-2xl opacity-0 pointer-events-none transition-all duration-300 -translate-y-2 border border-optGold/50 text-optGold">
  </div>

  <script>
    /* ============================================================================
       CIRCLES — OBSIDIAN OPTICS JEE MAIN & ADVANCED SMARTBOARD STUDIO
       10 Interactive Modules · KaTeX · Laser Chalk · Magnetic Snap · Locus Monkey
       ============================================================================ */

    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- Strict Obsidian Optics Semantic Color Grammar ----------
    const OPT = {
      void: '#05070E',
      grid: '#111827',
      cyan: '#00F0FF',     // Primary Circle S1
      gold: '#FFB800',     // Secondary Circle S2 / Locus Trails
      magenta: '#FF2A85',  // Tangents / Radical Axis L
      emerald: '#00E676',  // Normals / 90° Orthogonality Markers
      slate: '#64748B',    // Auxiliary / Ghost Lines / Radii
      white: '#F8FAFC'
    };

    // ---------- Application Runtime State ----------
    const APP = {
      width: window.innerWidth,
      height: window.innerHeight,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      baseScale: 42,
      zoom: 1,
      panX: 0,
      panY: 0,
      originX: window.innerWidth * 0.5,
      originY: window.innerHeight * 0.5,
      playing: true,
      monkeyOn: true,
      cleanBoard: false,
      activeModule: 0,
      time: 0,
      lastFrame: performance.now(),
      lastHudSync: 0,

      // Pointer & Dragging
      handles: [],
      draggingHandle: null,
      hoveredHandle: null,
      panning: null,

      // Laser Chalk Overlay (screen-space strokes)
      chalkMode: false,
      chalkColor: '#FFB800',
      chalkStrokes: [],
      activeStroke: null,

      // Magnetic Snap & Pulse Ripples
      ripples: [],
      lastSnapKey: '',
      lastSnapTime: 0,

      // X-Ray hover key for Module 2 General Form
      xrayKey: null,

      // Monkey animation state
      monkey: { blinkTimer: 0, blinking: false, phase: 0 }
    };

    function getScale() {
      return APP.baseScale * APP.zoom;
    }

    // ---------- 10 Curriculum Modules Metadata ----------
    const MODULES = [
      { id: 0, num: '01', short: 'Definition & Locus', icon: '◎' },
      { id: 1, num: '02', short: 'Equations & X-Ray', icon: '𝑓' },
      { id: 2, num: '03', short: 'Line & Circle (p vs r)', icon: '⦠' },
      { id: 3, num: '04', short: 'T = 0 Unification', icon: '⚡' },
      { id: 4, num: '05', short: 'Tangents & Director', icon: '⏊' },
      { id: 5, num: '06', short: 'Family of Circles', icon: '∞' },
      { id: 6, num: '07', short: 'Two Circles & DCT/TCT', icon: '⧇' },
      { id: 7, num: '08', short: 'Radical Axis & Center', icon: '⟁' },
      { id: 8, num: '09', short: 'JEE Adv Masterclass', icon: '★' },
      { id: 9, num: '10', short: 'Real-World Physics', icon: '⚙' }
    ];

    // ---------- Initial Per-Module Mathematical State ----------
    function createInitialState() {
      return {
        // M1: Definition & Locus
        m1: { h: 0, k: 0, r: 3.3, theta: 0.4, trail: [] },

        // M2: Equations & X-Ray Lab
        m2: {
          subTab: 'general', // 'standard' | 'general' | 'diametric' | 'parametric'
          h: 1.0, k: 0.5, r: 3.0,
          g: -1.4, f: -1.0, c: -5.5,
          ax: -3.2, ay: -1.0, bx: 3.2, by: 1.4, pTheta: 1.0,
          ph: 0, pk: 0, pr: 3.2, thetaDeg: 40
        },

        // M3: Line & Circle (p vs r)
        m3: {
          h: 0, k: 0, r: 2.8,
          lx1: -4.2, ly1: 1.4,
          lx2: 4.2, ly2: 3.6,
          monkeyT: 0
        },

        // M4: T = 0 Unification Lab
        m4: {
          h: 0, k: 0, r: 2.6,
          px: 4.4, py: 1.6,
          showBisected: true
        },

        // M5: Tangents, Normals & Director Circle
        m5: {
          h: -0.3, k: 0, r: 2.4,
          px: 3.6, py: 1.9,
          lockDirector: false,
          dirAngle: 0.65,
          trail: []
        },

        // M6: Family of Circles (S + λL = 0 & S1 + λS2 = 0)
        m6: {
          mode: 'twoCircles', // 'circleLine' | 'twoCircles'
          lambda: 0.7,
          dir: 1,
          // Circle + Line: S1 = (0,0,r=2.8), L: x - y + 1.2 = 0
          // Two Circles: S1(-1.6, 0, r=2.6), S2(1.8, 0.3, r=2.2)
          s1: { x: -1.6, y: 0, r: 2.6 },
          s2: { x: 1.8, y: 0.3, r: 2.2 },
          lineA: 1, lineB: -1, lineC: 1.1
        },

        // M7: Two Circles & Common Tangents
        m7: {
          x1: -3.0, y1: 0, r1: 2.1,
          x2: 2.9, y2: 0.2, r2: 1.4,
          monkeyT: 0
        },

        // M8: Radical Axis & Radical Center
        m8: {
          c1: { x: -3.2, y: -0.9, r: 1.6 },
          c2: { x: 2.7, y: -1.3, r: 2.0 },
          c3: { x: 0.1, y: 2.7, r: 1.4 },
          showOrthoCircle: true,
          monkeySlide: 0
        },

        // M9: JEE Advanced Masterclass (4-Stage Chalkboard Reveal)
        m9: {
          problem: 0, // 0..6
          stage: 0,   // 0: Setup, 1: Geometric Insight, 2: Algebraic Shortcut, 3: Final Answer
          // P1: Black Book Shortest/Longest from P(x1,y1)
          p1: { h: -1.0, k: -0.2, r: 2.2, px: 3.8, py: 2.2, qAng: 0.9 },
          // P2: Cengage Locus of Midpoints of Chords Subtending 90°
          p2: { r: 3.8, rot: 0, trail: [] },
          // P3: JEE Adv Locus of Center Orthogonal to S1 & S2
          p3: { s1: { x: -2.8, y: 0, r: 1.5 }, s2: { x: 2.5, y: 0, r: 1.8 }, py: 2.4, trail: [] },
          // P4: JEE Adv Tangents from Line L at 90° (Line ∩ Director Circle)
          p4: { h: 0, k: 0, r: 2.3, lineM: 0.5, lineC: 2.2, slideT: 0, trail: [] },
          // P5: Black Book Circumcircle & Area of ΔPAB (Tangents + Chord of Contact)
          p5: { h: -1.2, k: 0, r: 2.0, px: 3.4, py: 1.4 },
          // P6: Cengage Kissing Circles on Common Tangent (1/√r3 = 1/√r1 + 1/√r2)
          p6: { r1: 2.2, r2: 1.5 },
          // P7: JEE Adv Mirror Reflection of Circle in Line L
          p7: { h: -2.2, k: 1.6, r: 1.4, lineAng: 58, lineOffset: 0.3 }
        },

        // M10: Real-World Applications
        m10: {
          sim: 'belt', // 'belt' | 'satellite' | 'laser'
          beltType: 'open', r1: 2.1, r2: 1.25, speed: 1.1, gearAng: 0,
          satAlt: 2400, satAng: 0.65,
          laserDeg: 52, laserBounces: 7, laserProg: 0
        }
      };
    }

    let STATE = createInitialState();

    /* ============================================================================
       VIEWPORT, COORDINATE TRANSFORMS & MAGNETIC SNAP ENGINE
       ============================================================================ */
    function updateMetrics() {
      APP.width = window.innerWidth;
      APP.height = window.innerHeight;
      APP.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(APP.width * APP.dpr);
      canvas.height = Math.floor(APP.height * APP.dpr);
      ctx.setTransform(APP.dpr, 0, 0, APP.dpr, 0, 0);

      const isDesktop = APP.width >= 1024;
      if (APP.cleanBoard || !isDesktop) {
        APP.originX = APP.width * 0.5 + APP.panX;
        APP.originY = (isDesktop ? APP.height * 0.5 : APP.height * 0.35) + APP.panY;
        APP.baseScale = Math.max(26, Math.min(APP.width, APP.height) / (isDesktop ? 13 : 14.5));
      } else {
        const leftW = 240;
        const rightW = 382;
        const availW = APP.width - leftW - rightW;
        APP.originX = leftW + availW * 0.5 + APP.panX;
        APP.originY = APP.height * 0.5 + APP.panY;
        APP.baseScale = Math.max(28, Math.min(availW / 12.2, (APP.height - 120) / 11.2));
      }
    }

    function w2s(wx, wy) {
      const sc = getScale();
      return { x: APP.originX + wx * sc, y: APP.originY - wy * sc };
    }
    function s2w(sx, sy) {
      const sc = getScale();
      return { x: (sx - APP.originX) / sc, y: (APP.originY - sy) / sc };
    }
    function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
    function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
    function fmt(n, d = 2) {
      if (!Number.isFinite(n)) return '∞';
      return (Math.abs(n) < 1e-6 ? 0 : n).toFixed(d);
    }
    function fmtSign(n, d = 2) {
      const v = Math.abs(n) < 1e-6 ? 0 : n;
      return (v >= 0 ? '+ ' : '- ') + Math.abs(v).toFixed(d);
    }
    function hexRgba(hex, a) {
      const c = hex.replace('#', '');
      const n = parseInt(c, 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
    }

    function showPillToast(msg, color = OPT.gold) {
      const el = document.getElementById('snapToast');
      el.textContent = msg;
      el.style.color = color;
      el.style.borderColor = hexRgba(color, 0.55);
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%, 0)';
      clearTimeout(el._t);
      el._t = setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -8px)';
      }, 1900);
    }

    function triggerSnapPulse(key, wx, wy, msg, color = OPT.gold) {
      const now = performance.now();
      if (APP.lastSnapKey === key && now - APP.lastSnapTime < 1500) return;
      APP.lastSnapKey = key;
      APP.lastSnapTime = now;
      APP.ripples.push({ wx, wy, start: now, color });
      showPillToast(msg, color);
    }

    function renderMath(el, latex, fallback) {
      if (!el) return;
      const katexReady = Boolean(window.katex && typeof window.katex.render === 'function');
      if (el.dataset.tex === latex && (!katexReady || el.dataset.katexDone === '1')) return;
      el.dataset.tex = latex;
      try {
        if (katexReady) {
          window.katex.render(latex, el, { throwOnError: false, displayMode: false });
          el.dataset.katexDone = '1';
        } else {
          el.dataset.katexDone = '0';
          el.innerHTML = fallback || latex;
        }
      } catch {
        el.dataset.katexDone = '0';
        el.innerHTML = fallback || latex;
      }
    }

    /* ============================================================================
       OBSIDIAN OPTICS CANVAS DRAWING PRIMITIVES
       ============================================================================ */
    function drawObsidianVoid(showAxes = true) {
      const { width, height, originX, originY } = APP;
      const sc = getScale();

      // Deep-space radial vignette
      const grad = ctx.createRadialGradient(originX, originY, 30, originX, originY, Math.max(width, height) * 0.78);
      grad.addColorStop(0, '#0C1324');
      grad.addColorStop(0.55, '#070B16');
      grad.addColorStop(1, '#05070E');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      if (!showAxes) return;

      const minX = Math.floor(-originX / sc) - 1;
      const maxX = Math.ceil((width - originX) / sc) + 1;
      const minY = Math.floor((originY - height) / sc) - 1;
      const maxY = Math.ceil(originY / sc) + 1;

      ctx.save();
      // Ultra-faint grid (#111827)
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = minX; x <= maxX; x++) {
        if (x === 0) continue;
        const sx = originX + x * sc;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, height);
      }
      for (let y = minY; y <= maxY; y++) {
        if (y === 0) continue;
        const sy = originY - y * sc;
        ctx.moveTo(0, sy); ctx.lineTo(width, sy);
      }
      ctx.stroke();

      // Crisp Coordinate Axes
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, originY); ctx.lineTo(width, originY);
      ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
      ctx.stroke();

      // Numeric ticks
      ctx.fillStyle = 'rgba(148, 163, 184, 0.58)';
      ctx.font = '500 10px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let x = minX; x <= maxX; x++) {
        if (x === 0) continue;
        const sx = originX + x * sc;
        if (sx > 16 && sx < width - 16) ctx.fillText(String(x), sx, originY + 5);
      }
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let y = minY; y <= maxY; y++) {
        if (y === 0) continue;
        const sy = originY - y * sc;
        if (sy > 16 && sy < height - 16) ctx.fillText(String(y), originX - 6, sy);
      }
      ctx.fillStyle = OPT.cyan;
      ctx.fillText('O', originX - 6, originY + 10);
      ctx.restore();
    }

    function drawCircle(wx, wy, wr, color, lw = 2.5, dashed = false, fillAlpha = 0.04, glow = 14) {
      if (wr <= 0.001) return;
      const p = w2s(wx, wy);
      const r = wr * getScale();
      ctx.save();
      if (dashed) ctx.setLineDash([7, 6]);
      if (fillAlpha > 0) {
        ctx.fillStyle = hexRgba(color, fillAlpha);
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    function drawLine(x1, y1, x2, y2, color, lw = 2.2, dashed = false, glow = 10) {
      const p1 = w2s(x1, y1), p2 = w2s(x2, y2);
      ctx.save();
      if (dashed) ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      ctx.restore();
    }

    function drawInfLine(A, B, C, color, lw = 2.2, dashed = false, glow = 10) {
      const norm = Math.hypot(A, B);
      if (norm < 1e-8) return;
      const x0 = (-A * C) / (norm * norm), y0 = (-B * C) / (norm * norm);
      const dx = -B / norm, dy = A / norm;
      drawLine(x0 - dx * 45, y0 - dy * 45, x0 + dx * 45, y0 + dy * 45, color, lw, dashed, glow);
    }

    function drawRightAngle(vx, vy, ax, ay, bx, by, color = OPT.emerald, sizeW = 0.28) {
      const u1x = ax - vx, u1y = ay - vy, u2x = bx - vx, u2y = by - vy;
      const l1 = Math.hypot(u1x, u1y), l2 = Math.hypot(u2x, u2y);
      if (l1 < 1e-5 || l2 < 1e-5) return;
      const s = Math.min(sizeW, l1 * 0.4, l2 * 0.4);
      const p1 = w2s(vx + (u1x / l1) * s, vy + (u1y / l1) * s);
      const p2 = w2s(vx + (u2x / l2) * s, vy + (u2y / l2) * s);
      const pc = w2s(vx + (u1x / l1) * s + (u2x / l2) * s, vy + (u1y / l1) * s + (u2y / l2) * s);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.9;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(pc.x, pc.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      ctx.restore();
    }

    function roundRect(c, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + rad, y);
      c.arcTo(x + w, y, x + w, y + h, rad);
      c.arcTo(x + w, y + h, x, y + h, rad);
      c.arcTo(x, y + h, x, y, rad);
      c.arcTo(x, y, x + w, y, rad);
      c.closePath();
    }

    function drawPoint(wx, wy, color, radius = 5.5, label = '', offset = { x: 10, y: -12 }) {
      const p = w2s(wx, wy);
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(p.x, p.y, radius * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      if (label) {
        ctx.font = '600 11.5px "JetBrains Mono", monospace';
        const tw = ctx.measureText(label).width;
        const lx = p.x + offset.x, ly = p.y + offset.y;
        ctx.fillStyle = 'rgba(5, 7, 14, 0.84)';
        roundRect(ctx, lx - 5, ly - 10, tw + 10, 18, 6);
        ctx.fill();
        ctx.strokeStyle = hexRgba(color, 0.45);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, lx, ly - 1);
      }
      ctx.restore();
    }

    function drawHandle(id, wx, wy, color, label, onDrag) {
      APP.handles.push({ id, wx, wy, radius: 22, onDrag });
      const active = APP.hoveredHandle === id || (APP.draggingHandle && APP.draggingHandle.id === id);
      const p = w2s(wx, wy);
      ctx.save();
      ctx.strokeStyle = hexRgba(color, active ? 0.95 : 0.42);
      ctx.lineWidth = active ? 2.4 : 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, active ? 13 : 10, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      drawPoint(wx, wy, color, active ? 7 : 5.5, label);
    }

    function drawCanvasBadge(wx, wy, text, color = OPT.gold) {
      const p = w2s(wx, wy);
      ctx.save();
      ctx.font = '700 11.5px "Inter", sans-serif';
      const tw = ctx.measureText(text).width;
      const bw = tw + 18, bh = 23;
      const bx = clamp(p.x - bw / 2, 12, APP.width - bw - 12);
      const by = clamp(p.y - bh / 2, 64, APP.height - bh - 12);
      ctx.fillStyle = 'rgba(11, 15, 25, 0.92)';
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      roundRect(ctx, bx, by, bw, bh, 999);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + bw / 2, by + bh / 2);
      ctx.restore();
    }

    function drawGoldTrail(pts, color = OPT.gold) {
      if (!pts || pts.length < 2) return;
      ctx.save();
      for (let i = 1; i < pts.length; i++) {
        const p1 = w2s(pts[i - 1].x, pts[i - 1].y);
        const p2 = w2s(pts[i].x, pts[i].y);
        const alpha = i / pts.length;
        ctx.strokeStyle = hexRgba(color, alpha * 0.92);
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.lineWidth = 1.5 + alpha * 2.4;
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawRipples(now) {
      for (let i = APP.ripples.length - 1; i >= 0; i--) {
        const rp = APP.ripples[i];
        const age = Math.max(0, (now - rp.start) / 750);
        if (age >= 1) { APP.ripples.splice(i, 1); continue; }
        const p = w2s(rp.wx, rp.wy);
        const radius = Math.max(0.5, 10 + age * 68);
        ctx.save();
        ctx.strokeStyle = hexRgba(rp.color, (1 - age) * 0.9);
        ctx.shadowColor = rp.color;
        ctx.shadowBlur = 14;
        ctx.lineWidth = Math.max(0.5, 2.6 * (1 - age * 0.6));
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawLaserChalk() {
      const all = APP.activeStroke ? [...APP.chalkStrokes, APP.activeStroke] : APP.chalkStrokes;
      if (!all.length) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const st of all) {
        if (st.pts.length < 2) continue;
        ctx.strokeStyle = st.color;
        ctx.shadowColor = st.color;
        ctx.shadowBlur = 12;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(st.pts[0].x, st.pts[0].y);
        for (let i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i].x, st.pts[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* ============================================================================
       UPGRADED "LOCUS THE MONKEY" PHYSICS ENGINE
       Supports: unicycle, jumping/missing, balancing, walking, excited, confused
       ============================================================================ */
    function drawLocusMonkey(wx, wy, opts = {}) {
      if (!APP.monkeyOn) return;
      const {
        speech = '',
        facing = 1,
        scale = 0.95,
        mode = 'walk', // 'walk' | 'unicycle' | 'jumpMiss' | 'balance' | 'idle'
        mood = 'happy' // 'happy' | 'excited' | 'confused'
      } = opts;

      const p = w2s(wx, wy);
      const ph = APP.monkey.phase;

      let offsetY = 0;
      let tilt = 0;
      let armSwing = Math.sin(APP.time * 3) * 0.15;
      let legSwing = 0;

      if (mode === 'walk') {
        offsetY = Math.abs(Math.sin(ph * 2)) * 5;
        tilt = Math.sin(ph * 2) * 0.13;
        armSwing = Math.sin(ph * 2) * 0.52;
        legSwing = Math.sin(ph * 2) * 0.48;
      } else if (mode === 'unicycle') {
        offsetY = 14 + Math.sin(ph * 3) * 1.5;
        tilt = Math.sin(ph * 1.5) * 0.08;
        armSwing = Math.sin(ph * 2.5) * 0.35;
        legSwing = ph * 2.6;
      } else if (mode === 'jumpMiss') {
        // Comical jump toward unreachable line and land back
        const jumpCycle = Math.max(0, Math.sin(APP.time * 3.8));
        offsetY = jumpCycle * 26;
        tilt = (jumpCycle > 0.2 ? -0.22 : 0.08);
        armSwing = jumpCycle > 0.2 ? -1.1 : 0.2;
      } else if (mode === 'balance') {
        offsetY = 2;
        tilt = Math.sin(APP.time * 4.5) * 0.16;
        armSwing = 1.25; // arms stretched out tightrope-style
      } else {
        offsetY = Math.sin(APP.time * 2.4) * 1.8;
      }

      ctx.save();
      ctx.translate(p.x, p.y - 16 * scale - offsetY);
      ctx.rotate(tilt);
      ctx.scale(facing * scale, scale);

      // Unicycle Wheel & Pedals (Definition Mode)
      if (mode === 'unicycle') {
        ctx.save();
        ctx.translate(0, 22);
        // Glowing wheel rim
        ctx.strokeStyle = OPT.cyan;
        ctx.shadowColor = OPT.cyan;
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;
        // Rotating spokes
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 4; i++) {
          const a = legSwing + (i * Math.PI) / 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * -9, Math.sin(a) * -9);
          ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
          ctx.stroke();
        }
        // Seat post
        ctx.strokeStyle = OPT.gold;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -13); ctx.stroke();
        ctx.restore();
      } else {
        // Soft ground shadow
        ctx.fillStyle = 'rgba(0,0,0,0.36)';
        ctx.beginPath(); ctx.ellipse(0, 21 + offsetY * 0.3, 12, 3.6, 0, 0, Math.PI * 2); ctx.fill();
      }

      // Curly animated tail
      ctx.save();
      ctx.strokeStyle = '#7C4A22';
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';
      const wag = Math.sin(APP.time * 5.2) * 5;
      ctx.beginPath();
      ctx.moveTo(-8, 6);
      ctx.bezierCurveTo(-19, 4 + wag, -24, -10 + wag, -16, -14 + wag * 0.5);
      ctx.stroke();
      ctx.restore();

      // Legs
      ctx.strokeStyle = '#6B3E1B';
      ctx.lineWidth = 4.2;
      ctx.lineCap = 'round';
      if (mode === 'unicycle') {
        const px1 = Math.cos(legSwing) * 5, py1 = 22 + Math.sin(legSwing) * 5;
        const px2 = Math.cos(legSwing + Math.PI) * 5, py2 = 22 + Math.sin(legSwing + Math.PI) * 5;
        ctx.beginPath(); ctx.moveTo(-3, 9); ctx.lineTo(px1, py1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, 9); ctx.lineTo(px2, py2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(-4, 10); ctx.lineTo(-4 - Math.sin(legSwing) * 7, 19); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4, 10); ctx.lineTo(4 + Math.sin(legSwing) * 7, 19); ctx.stroke();
        ctx.fillStyle = OPT.gold;
        ctx.beginPath();
        ctx.ellipse(-4 - Math.sin(legSwing) * 7 + 1.5, 20, 4.2, 2.3, 0, 0, Math.PI * 2);
        ctx.ellipse(4 + Math.sin(legSwing) * 7 + 1.5, 20, 4.2, 2.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fuzzy Torso & Tan Belly
      ctx.fillStyle = '#8B5427';
      ctx.beginPath(); ctx.ellipse(0, 3, 10, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F3CFA0';
      ctx.beginPath(); ctx.ellipse(1.5, 4, 6.2, 7.2, 0, 0, Math.PI * 2); ctx.fill();

      // Arms
      ctx.strokeStyle = '#7C4A22';
      ctx.lineWidth = 3.8;
      if (mode === 'balance') {
        ctx.beginPath(); ctx.moveTo(-7, -1); ctx.lineTo(-17, -4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(7, -1); ctx.lineTo(17, -4); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(-7, -1); ctx.lineTo(-12 - Math.cos(armSwing) * 3, 6 + Math.sin(armSwing) * 6); ctx.stroke();
        const hx = 11 + Math.sin(armSwing) * 4, hy = 2 - Math.cos(armSwing) * 5;
        ctx.beginPath(); ctx.moveTo(7, -1); ctx.lineTo(hx, hy); ctx.stroke();
      }

      // Ears & Head
      ctx.fillStyle = '#8B5427';
      ctx.beginPath(); ctx.arc(-11, -13, 4.8, 0, Math.PI * 2); ctx.arc(11, -13, 4.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F3CFA0';
      ctx.beginPath(); ctx.arc(-11, -13, 2.6, 0, Math.PI * 2); ctx.arc(11, -13, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8B5427';
      ctx.beginPath(); ctx.arc(0, -13, 11, 0, Math.PI * 2); ctx.fill();

      // Face mask
      ctx.fillStyle = '#F3CFA0';
      ctx.beginPath();
      ctx.arc(-3.4, -15, 5, 0, Math.PI * 2);
      ctx.arc(3.4, -15, 5, 0, Math.PI * 2);
      ctx.ellipse(0, -9.5, 8, 5.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Blinking Eyes
      if (APP.monkey.blinking) {
        ctx.strokeStyle = '#1E1B18'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(-5.2, -14.5); ctx.lineTo(-2, -14.5); ctx.moveTo(2, -14.5); ctx.lineTo(5.2, -14.5); ctx.stroke();
      } else {
        ctx.fillStyle = '#1E1B18';
        ctx.beginPath(); ctx.arc(-3.5, -14.5, 2.1, 0, Math.PI * 2); ctx.arc(3.5, -14.5, 2.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(-2.8, -15.2, 0.75, 0, Math.PI * 2); ctx.arc(4.2, -15.2, 0.75, 0, Math.PI * 2); ctx.fill();
      }

      // Expressive Mouth
      ctx.strokeStyle = '#4A2511'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (mood === 'confused') {
        ctx.moveTo(-3.4, -8.5); ctx.quadraticCurveTo(0, -10.6, 3.4, -8.3);
      } else if (mood === 'excited') {
        ctx.fillStyle = '#FF2A85'; ctx.arc(0, -9.5, 3.8, 0, Math.PI); ctx.fill();
      } else {
        ctx.arc(0, -10.2, 4.2, 0.2, Math.PI - 0.2);
      }
      ctx.stroke();

      // Golden Explorer Cap
      ctx.fillStyle = OPT.gold;
      ctx.beginPath(); ctx.arc(0, -21, 8.2, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#D97706';
      ctx.beginPath(); ctx.ellipse(4.4, -21, 6.8, 2.1, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Clean non-overlapping Speech Bubble
      if (speech) {
        ctx.save();
        ctx.font = '600 11px "Inter", sans-serif';
        const tw = ctx.measureText(speech).width;
        const bw = tw + 20, bh = 24;
        const bx = clamp(p.x - bw / 2, 12, APP.width - bw - 12);
        const by = clamp(p.y - (mode === 'unicycle' ? 78 : 66) * scale - offsetY, 64, APP.height - bh - 12);

        ctx.fillStyle = 'rgba(11, 15, 25, 0.92)';
        ctx.strokeStyle = hexRgba(OPT.gold, 0.65);
        ctx.lineWidth = 1.25;
        ctx.shadowColor = hexRgba(OPT.gold, 0.25);
        ctx.shadowBlur = 10;
        roundRect(ctx, bx, by, bw, bh, 10);
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#FEF3C7';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(speech, bx + bw / 2, by + bh / 2);
        ctx.restore();
      }
    }

    /* ============================================================================
       EXACT COORDINATE GEOMETRY SOLVERS
       ============================================================================ */
    function getTangentsFromPoint(h, k, r, px, py) {
      const dx = px - h, dy = py - k, d = Math.hypot(dx, dy);
      if (d <= r + 1e-6 || r <= 1e-6) return [];
      const base = Math.atan2(dy, dx), alpha = Math.acos(clamp(r / d, -1, 1));
      return [
        { x: h + r * Math.cos(base + alpha), y: k + r * Math.sin(base + alpha) },
        { x: h + r * Math.cos(base - alpha), y: k + r * Math.sin(base - alpha) }
      ];
    }

    function getCommonTangents(x1, y1, r1, x2, y2, r2) {
      const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
      const dct = [], tct = [];
      if (d < 1e-6) return { dct, tct, d };
      const base = Math.atan2(dy, dx);

      if (d >= Math.abs(r1 - r2) - 0.04) {
        if (Math.abs(d - Math.abs(r1 - r2)) < 0.04) {
          const sgn = r1 >= r2 ? 1 : -1;
          const tx = x1 + sgn * r1 * Math.cos(base), ty = y1 + sgn * r1 * Math.sin(base);
          const nx = -Math.sin(base), ny = Math.cos(base);
          dct.push({ p1: { x: tx - nx * 4, y: ty - ny * 4 }, p2: { x: tx + nx * 4, y: ty + ny * 4 }, isTouch: true });
        } else {
          const a = Math.acos(clamp((r1 - r2) / d, -1, 1));
          for (const ang of [base + a, base - a]) {
            dct.push({
              p1: { x: x1 + r1 * Math.cos(ang), y: y1 + r1 * Math.sin(ang) },
              p2: { x: x2 + r2 * Math.cos(ang), y: y2 + r2 * Math.sin(ang) },
              isTouch: false
            });
          }
        }
      }
      if (d >= r1 + r2 - 0.04) {
        if (Math.abs(d - (r1 + r2)) < 0.04) {
          const tx = x1 + r1 * Math.cos(base), ty = y1 + r1 * Math.sin(base);
          const nx = -Math.sin(base), ny = Math.cos(base);
          tct.push({ p1: { x: tx - nx * 4, y: ty - ny * 4 }, p2: { x: tx + nx * 4, y: ty + ny * 4 }, isTouch: true });
        } else {
          const b = Math.acos(clamp((r1 + r2) / d, -1, 1));
          for (const ang of [base + b, base - b]) {
            tct.push({
              p1: { x: x1 + r1 * Math.cos(ang), y: y1 + r1 * Math.sin(ang) },
              p2: { x: x2 - r2 * Math.cos(ang), y: y2 - r2 * Math.sin(ang) },
              isTouch: false
            });
          }
        }
      }
      return { dct, tct, d };
    }

    function getCircleIntersections(x1, y1, r1, x2, y2, r2) {
      const d = Math.hypot(x2 - x1, y2 - y1);
      if (d < 1e-6 || d > r1 + r2 || d < Math.abs(r1 - r2)) return [];
      const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
      const xm = x1 + (a * (x2 - x1)) / d, ym = y1 + (a * (y2 - y1)) / d;
      const rx = (-(y2 - y1) * h) / d, ry = ((x2 - x1) * h) / d;
      return [{ x: xm + rx, y: ym + ry }, { x: xm - rx, y: ym - ry }];
    }

    function getLineCircleIntersections(h, k, r, A, B, C) {
      const norm2 = A * A + B * B;
      if (norm2 < 1e-8) return [];
      const distSigned = (A * h + B * k + C) / Math.sqrt(norm2);
      const p = Math.abs(distSigned);
      if (p > r + 1e-5) return [];
      const mx = h - (A * (A * h + B * k + C)) / norm2;
      const my = k - (B * (A * h + B * k + C)) / norm2;
      const half = Math.sqrt(Math.max(0, r * r - p * p));
      const ux = -B / Math.sqrt(norm2), uy = A / Math.sqrt(norm2);
      if (half < 1e-4) return [{ x: mx, y: my }];
      return [{ x: mx + ux * half, y: my + uy * half }, { x: mx - ux * half, y: my - uy * half }];
    }

    function getRadicalAxis(c1, c2) {
      return {
        A: 2 * (c2.x - c1.x),
        B: 2 * (c2.y - c1.y),
        C: (c1.x * c1.x + c1.y * c1.y - c1.r * c1.r) - (c2.x * c2.x + c2.y * c2.y - c2.r * c2.r)
      };
    }

    function intersectLines(L1, L2) {
      const det = L1.A * L2.B - L2.A * L1.B;
      if (Math.abs(det) < 1e-6) return null;
      return { x: (L1.B * L2.C - L2.B * L1.C) / det, y: (L2.A * L1.C - L1.A * L2.C) / det };
    }

    // ---------- MODULE 3: Line & Circle (p vs r + Magnetic Snap + Monkey Physics) ----------
    function renderM3(dt) {
      const s = STATE.m3;
      if (APP.playing) s.monkeyT += dt * 1.4;

      // Line through (lx1, ly1) and (lx2, ly2): A x + B y + C = 0
      const A = s.ly1 - s.ly2;
      const B = s.lx2 - s.lx1;
      const C = s.lx1 * s.ly2 - s.lx2 * s.ly1;
      const norm = Math.hypot(A, B) || 1;
      const signedD = (A * s.h + B * s.k + C) / norm;
      const p = Math.abs(signedD);

      const mx = s.h - (A * (A * s.h + B * s.k + C)) / (norm * norm);
      const my = s.k - (B * (A * s.h + B * s.k + C)) / (norm * norm);

      const isTangent = Math.abs(p - s.r) < 0.08;
      const isSecant = !isTangent && p < s.r;

      if (isTangent) triggerSnapPulse('m3_tan', mx, my, '★ MAGNETIC SNAP: TANGENT (p = r)', OPT.magenta);

      drawCircle(s.h, s.k, s.r, OPT.cyan, 2.7, false, 0.05);
      drawInfLine(A, B, C, isTangent ? OPT.magenta : isSecant ? OPT.gold : OPT.slate, 2.4);

      // Perpendicular drop CM (Emerald normal)
      drawLine(s.h, s.k, mx, my, OPT.emerald, 2.2, true);
      if (p > 0.15) drawRightAngle(mx, my, s.h, s.k, mx - B, my + A, OPT.emerald, 0.28);
      drawPoint(mx, my, OPT.emerald, 4.8, `M (p=${fmt(p)})`);

      let chordLen = 0;
      let monkeyPos = { x: s.h, y: s.k + s.r };
      let mMode = 'jumpMiss', mMood = 'confused', speech = `p > r! I jump and miss the line!`;
      let badge = { text: 'Disjoint (p > r)', color: 'slate' };

      const ux = -B / norm, uy = A / norm;
      if (isSecant) {
        badge = { text: 'Secant (p < r)', color: 'gold' };
        const half = Math.sqrt(Math.max(0, s.r * s.r - p * p));
        chordLen = 2 * half;
        const p1 = { x: mx - ux * half, y: my - uy * half };
        const p2 = { x: mx + ux * half, y: my + uy * half };
        drawLine(p1.x, p1.y, p2.x, p2.y, OPT.gold, 4.2, false, 16);
        drawPoint(p1.x, p1.y, OPT.gold, 5.5, 'A');
        drawPoint(p2.x, p2.y, OPT.gold, 5.5, 'B');
        const slide = Math.sin(s.monkeyT) * half;
        monkeyPos = { x: mx + ux * slide, y: my + uy * slide };
        mMode = APP.playing ? 'walk' : 'idle';
        mMood = 'happy';
        speech = `Zipping across chord AB = ${fmt(chordLen)}!`;
      } else if (isTangent) {
        badge = { text: 'TANGENT (p = r) ★', color: 'magenta' };
        drawPoint(mx, my, OPT.magenta, 7.5, 'Contact T');
        monkeyPos = { x: mx, y: my };
        mMode = 'balance';
        mMood = 'excited';
        speech = 'Triumph! Balanced on Tangent (p = r)!';
      } else {
        // Place monkey on circle edge closest to line, trying to jump!
        const angToLine = Math.atan2(my - s.k, mx - s.h);
        monkeyPos = { x: s.h + s.r * Math.cos(angToLine), y: s.k + s.r * Math.sin(angToLine) };
      }

      // Magnetic snap helper on drag of line handles
      const snapLineHandle = (which, wx, wy) => {
        const nxClamp = clamp(wx, -6.5, 6.5), nyClamp = clamp(wy, -4.8, 4.8);
        const otherX = which === 1 ? s.lx2 : s.lx1;
        const otherY = which === 1 ? s.ly2 : s.ly1;
        if (dist(nxClamp, nyClamp, otherX, otherY) < 0.35) return;
        if (which === 1) { s.lx1 = nxClamp; s.ly1 = nyClamp; }
        else { s.lx2 = nxClamp; s.ly2 = nyClamp; }
        // Check magnetic pull to tangency
        const nA = s.ly1 - s.ly2, nB = s.lx2 - s.lx1, nC = s.lx1 * s.ly2 - s.lx2 * s.ly1;
        const nNorm = Math.hypot(nA, nB);
        if (nNorm > 0.2) {
          const curP = Math.abs(nA * s.h + nB * s.k + nC) / nNorm;
          if (Math.abs(curP - s.r) < 0.14) {
            const sgn = (nA * s.h + nB * s.k + nC) >= 0 ? 1 : -1;
            const shift = (s.r - curP) * sgn;
            const nx = nA / nNorm, ny = nB / nNorm;
            s.lx1 += nx * shift; s.ly1 += ny * shift;
            s.lx2 += nx * shift; s.ly2 += ny * shift;
          }
        }
      };

      drawHandle('m3_l1', s.lx1, s.ly1, OPT.magenta, 'L₁', (wx, wy) => snapLineHandle(1, wx, wy));
      drawHandle('m3_l2', s.lx2, s.ly2, OPT.magenta, 'L₂', (wx, wy) => snapLineHandle(2, wx, wy));
      drawPoint(s.h, s.k, OPT.cyan, 5, 'C');
      drawLocusMonkey(monkeyPos.x, monkeyPos.y, { mode: mMode, mood: mMood, speech });

      return {
        latex: `p = ${fmt(p)} \\; ${isTangent ? '=' : isSecant ? '<' : '>'} \\; r = ${fmt(s.r)}`,
        badge,
        stats: [
          { label: 'Perpendicular p', val: fmt(p), cls: 'text-optEmerald' },
          { label: 'Radius r', val: fmt(s.r), cls: 'text-optCyan' },
          { label: 'Chord 2√(r²-p²)', val: isSecant ? fmt(chordLen) : '0.00', cls: 'text-optGold' },
          { label: 'Condition', val: isTangent ? 'p = r (Tangent)' : isSecant ? 'p < r (Secant)' : 'p > r (Miss)', cls: 'text-optMagenta' }
        ]
      };
    }

    // ---------- MODULE 4: The "T = 0 Unification" Lab ----------
    function renderM4() {
      const s = STATE.m4;
      const d = dist(s.h, s.k, s.px, s.py);
      const S1 = d * d - s.r * s.r;
