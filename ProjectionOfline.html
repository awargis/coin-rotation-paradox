@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap');

html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#0a0a0f; font-family:'Sora',sans-serif; }

.stage-btn {

  cursor:pointer; transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  backdrop-filter:blur(8px);
}
.stage-btn:hover { border-color:rgba(120,200,255,0.5); color:#fff; transform:scale(1.15); }
.stage-btn.active {
  border-color:#78c8ff; color:#78c8ff; background:rgba(120,200,255,0.15);

}

.info-panel {
  background:rgba(10,10,20,0.85); backdrop-filter:blur(16px);

}

.formula-tag {
  font-family:'JetBrains Mono',monospace;

}

.formula-wrong { background:rgba(255,80,80,0.1); color:rgba(255,80,80,0.5); border:1px solid rgba(255,80,80,0.15); text-decoration:line-through; }

.progress-bar { height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }

#confusion-overlay {

.math-formula {

  filter:blur(1.5px); animation:floatFormula 4s ease-in-out infinite;
  white-space:nowrap;
}
@keyframes floatFormula {
  0%,100% { transform:translateY(0) rotate(0deg); opacity:0.3; }
  50% { transform:translateY(-20px) rotate(2deg); opacity:0.7; }
}

.label-3d {
  position:absolute; pointer-events:none; font-family:'JetBrains Mono',monospace;
  font-weight:600; text-shadow:0 0 12px currentColor, 0 2px 8px rgba(0,0,0,0.8);
  transition:opacity 0.5s ease; white-space:nowrap;
}

#title-text {
  font-family:'Sora',sans-serif; font-weight:700;
  background:linear-gradient(135deg,#78c8ff,#a78bfa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

.hint-text {
  font-family:'Sora',sans-serif; font-size:11px; color:rgba(255,255,255,0.3);
  letter-spacing:0.5px;
}

  <script>
// ============ CONFIG & SDK ============
const defaultConfig = {
  main_title: 'Projection of a Line on a Plane',
  background_color: '#0a0a0f',
  accent_color: '#78c8ff',
  surface_color: '#1a1a2e',
  text_color: '#e0e0e0',
  secondary_action_color: '#a78bfa',
  font_family: 'Sora',
  font_size: 16
};

function applyConfig(config) {
  const t = document.getElementById('title-text');
  if (t) t.textContent = config.main_title || defaultConfig.main_title;
  const ff = config.font_family || defaultConfig.font_family;
  document.querySelectorAll('#title-text,.info-panel').forEach(el => {
    el.style.fontFamily = `${ff}, sans-serif`;
  });
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get:()=>config.background_color||defaultConfig.background_color, set:(v)=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})} },
      { get:()=>config.surface_color||defaultConfig.surface_color, set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})} },
      { get:()=>config.text_color||defaultConfig.text_color, set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})} },
      { get:()=>config.accent_color||defaultConfig.accent_color, set:(v)=>{config.accent_color=v;window.elementSdk.setConfig({accent_color:v})} },
      { get:()=>config.secondary_action_color||defaultConfig.secondary_action_color, set:(v)=>{config.secondary_action_color=v;window.elementSdk.setConfig({secondary_action_color:v})} }
    ],
    borderables: [],
    fontEditable: { get:()=>config.font_family||defaultConfig.font_family, set:(v)=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})} },
    fontSizeable: { get:()=>config.font_size||defaultConfig.font_size, set:(v)=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})} }
  }),
  mapToEditPanelValues: (config) => new Map([
    ['main_title', config.main_title || defaultConfig.main_title]
  ])
});

// ============ THREE.JS SCENE ============
let scene, camera, renderer, clock;
let stick, stickP, stickQ, shadowLine, shadowMesh;
let planeFloor, lightSource, lightHelper;
let normalArrow, projectionLine;
let particles = [];
let lightBeams = [];
let currentStage = 0;
let targetStickAngle = Math.PI / 4;
let currentStickAngle = Math.PI / 4;
let isAutoRotating = false;
let autoRotateTime = 0;
let orbitAngleX = 0, orbitAngleY = 0.4, orbitDist = 12;
let targetOrbitX = 0, targetOrbitY = 0.4, targetOrbitDist = 12;
let isDragging = false, lastMouse = { x:0, y:0 };
const stickLength = 4;

// Label tracking
const labelData = {};
const labelElements = {};

function init() {
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050508, 0.025);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  updateCamera();

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Ambient
  scene.add(new THREE.AmbientLight(0x1a1a3e, 0.3));

  // Floor plane
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshStandardMaterial({
    color:0x12121f, roughness:0.6, metalness:0.3
  });
  planeFloor = new THREE.Mesh(floorGeo, floorMat);
  planeFloor.rotation.x = -Math.PI / 2;
  planeFloor.position.y = -2;
  planeFloor.receiveShadow = true;
  planeFloor.visible = false;
  scene.add(planeFloor);

  // Grid on floor
  const gridHelper = new THREE.GridHelper(20, 20, 0x1e1e3a, 0x14142a);
  gridHelper.position.y = -1.99;
  gridHelper.visible = false;
  gridHelper.name = 'grid';
  scene.add(gridHelper);

  // Stick (line PQ)
  const stickGeo = new THREE.CylinderGeometry(0.06, 0.06, stickLength, 12);
  const stickMat = new THREE.MeshStandardMaterial({
    color:0x78c8ff, emissive:0x2a5580, roughness:0.3, metalness:0.7
  });
  stick = new THREE.Mesh(stickGeo, stickMat);
  stick.castShadow = true;
  stick.visible = false;
  scene.add(stick);

  // Endpoints spheres
  const sphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const pMat = new THREE.MeshStandardMaterial({ color:0x50dc8c, emissive:0x1a6b3a, roughness:0.3 });
  const qMat = new THREE.MeshStandardMaterial({ color:0xffa64d, emissive:0x6b3a1a, roughness:0.3 });
  stickP = new THREE.Mesh(sphereGeo, pMat);
  stickQ = new THREE.Mesh(sphereGeo, qMat);
  stickP.visible = false;
  stickQ.visible = false;
  scene.add(stickP);
  scene.add(stickQ);

  // Shadow on floor
  const shadowGeo = new THREE.CylinderGeometry(0.04, 0.04, 1, 8);
  const shadowMat = new THREE.MeshBasicMaterial({ color:0x3a3a5a, transparent:true, opacity:0.7 });
  shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
  shadowMesh.visible = false;
  scene.add(shadowMesh);

  // Normal vector arrow
  const normalGeo = new THREE.CylinderGeometry(0.03, 0.03, 3, 8);
  const normalMat = new THREE.MeshStandardMaterial({ color:0xff6b6b, emissive:0x6b2a2a, roughness:0.3 });
  normalArrow = new THREE.Mesh(normalGeo, normalMat);
  normalArrow.position.set(0, -0.5, 0);
  normalArrow.visible = false;
  scene.add(normalArrow);

  // Normal arrow tip
  const tipGeo = new THREE.ConeGeometry(0.1, 0.3, 8);
  const tipMat = new THREE.MeshStandardMaterial({ color:0xff6b6b, emissive:0x6b2a2a });
  const normalTip = new THREE.Mesh(tipGeo, tipMat);
  normalTip.position.y = 1.5;
  normalArrow.add(normalTip);

  // Light source object
  const lightGeo = new THREE.SphereGeometry(0.3, 16, 16);
  const lightMat = new THREE.MeshBasicMaterial({ color:0xffdd77 });
  lightSource = new THREE.Mesh(lightGeo, lightMat);
  lightSource.position.set(0, 7, 0);
  lightSource.visible = false;
  scene.add(lightSource);

  // Spot light
  const spot = new THREE.SpotLight(0xfff5e0, 2, 30, Math.PI/4, 0.5, 1);
  spot.position.set(0, 8, 0);
  spot.target.position.set(0, -2, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(2048, 2048);
  spot.shadow.bias = -0.0005;
  spot.visible = false;
  spot.name = 'spotlight';
  scene.add(spot);
  scene.add(spot.target);

  // Light beams (volumetric feel)
  for (let i = 0; i < 5; i++) {
    const beamGeo = new THREE.CylinderGeometry(0.02, 0.15, 9, 6);
    const beamMat = new THREE.MeshBasicMaterial({ color:0xffeeaa, transparent:true, opacity:0 });
    const beam = new THREE.Mesh(beamGeo, beamMat);
    beam.position.set((i-2)*0.8, 3, (i%2-0.5)*0.5);
    beam.visible = false;
    lightBeams.push(beam);
    scene.add(beam);
  }

  // Particles
  for (let i = 0; i < 60; i++) {
    const pGeo = new THREE.SphereGeometry(0.015, 4, 4);
    const pMat2 = new THREE.MeshBasicMaterial({ color:0x78c8ff, transparent:true, opacity:0 });
    const p = new THREE.Mesh(pGeo, pMat2);
    p.position.set((Math.random()-0.5)*12, Math.random()*8-2, (Math.random()-0.5)*12);
    p.userData = { speed: Math.random()*0.3+0.1, phase: Math.random()*Math.PI*2 };
    particles.push(p);
    scene.add(p);
  }

  // Angle arc (will be updated)
  updateStick();
  setupEvents();
  animate();
}

function updateCamera() {
  const x = orbitDist * Math.sin(orbitAngleX) * Math.cos(orbitAngleY);
  const y = orbitDist * Math.sin(orbitAngleY) + 1;
  const z = orbitDist * Math.cos(orbitAngleX) * Math.cos(orbitAngleY);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0.5, 0);
}

function updateStick() {
  const angle = currentStickAngle;
  const halfLen = stickLength / 2;

  // Stick center at y=1 area
  const cy = 1;
  const dx = Math.sin(angle) * halfLen;
  const dy = Math.cos(angle) * halfLen;

  stick.position.set(0, cy, 0);
  stick.rotation.z = angle;

  const px = -dx, py = cy + dy;
  const qx = dx, qy = cy - dy;
  stickP.position.set(px, py, 0);
  stickQ.position.set(qx, qy, 0);

  // Shadow projection on floor (y = -2)
  const shadowLen = Math.abs(px - qx);
  const shadowCx = (px + qx) / 2;
  shadowMesh.scale.set(1, shadowLen || 0.01, 1);
  shadowMesh.position.set(shadowCx, -1.98, 0);
  shadowMesh.rotation.z = Math.PI / 2;

  // Update labels
  labelData['P'] = { x: px, y: py, z: 0, color: '#50dc8c', size: 15 };
  labelData['Q'] = { x: qx, y: qy, z: 0, color: '#ffa64d', size: 15 };
  labelData['Projection'] = { x: shadowCx, y: -2.5, z: 0, color: '#a78bfa', size: 13 };
  labelData['Normal Vector'] = { x: 0.4, y: 0.6, z: 0, color: '#ff6b6b', size: 11 };

  const angleDeg = (angle * 180 / Math.PI).toFixed(1);
  labelData['θ'] = { x: 0.6, y: cy + 0.3, z: 0, color: '#ffdd77', size: 14 };
  labelData['sin(θ)'] = { x: shadowCx + 1.5, y: -2.5, z: 0, color: '#50dc8c', size: 13 };
  labelData['cos(θ)'] = { x: shadowCx + 1.5, y: -3.0, z: 0, color: '#ff5555', size: 12 };
}

function projectToScreen(x, y, z) {
  const v = new THREE.Vector3(x, y, z);
  v.project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * window.innerWidth,
    y: (-v.y * 0.5 + 0.5) * window.innerHeight
  };
}

function updateLabels() {
  const container = document.getElementById('labels-container');
  for (const [name, data] of Object.entries(labelData)) {
    if (!data.visible) {
      if (labelElements[name]) labelElements[name].style.opacity = '0';
      continue;
    }
    let el = labelElements[name];
    if (!el) {
      el = document.createElement('div');
      el.className = 'label-3d';
      container.appendChild(el);
      labelElements[name] = el;
    }
    const pos = projectToScreen(data.x, data.y, data.z);
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.color = data.color;
    el.style.fontSize = data.size + 'px';
    el.style.opacity = data.opacity || '1';
    el.style.transform = 'translate(-50%,-50%)';
    el.textContent = name;

    if (name === 'cos(θ)' && data.strikethrough) {
      el.style.textDecoration = 'line-through';
      el.style.opacity = '0.3';
    } else {
      el.style.textDecoration = 'none';
    }
  }
}

// ============ STAGES ============
const stageInfo = [
  { title:'The Confusion', body:'Complex formulas everywhere... but what does projection really mean? Let\'s strip it down to something physical.' },
  { title:'Setup — Stick in Air', body:'A line segment PQ floats in 3D space — like a stick suspended in air. Below it: a flat plane (the floor).' },
  { title:'Light Source', body:'A strong light appears directly above — rays travel vertically downward, like the midday sun.' },
  { title:'Shadow Formation', body:'The stick casts a shadow on the plane. This shadow IS the projection.<br><br><span class="formula-tag formula-correct">Shadow = Projection</span>' },
  { title:'Angle Trap', body:'The angle θ is measured between the line PQ and the plane\'s normal vector (pointing straight up). The normal is perpendicular to the plane.' },
  { title:'Sin vs Cos Insight', body:'The projection length depends on <span class="formula-tag formula-correct">sin(θ)</span> — NOT <span class="formula-tag formula-wrong">cos(θ)</span>.<br><br>Because θ is with the normal, not the plane itself.' },
  { title:'Dynamic Interaction', body:'Watch the stick rotate! As the angle changes, the shadow length changes in real-time. Drag to orbit the scene.' },
  { title:'Final Insight', body:'<span style="color:#78c8ff">Blue stick</span> = Original vector<br><span style="color:#a78bfa">Purple shadow</span> = Projection<br><span style="color:#ff6b6b">Red arrow</span> = Normal<br><br>Projection = |PQ| × sin(θ)' }
];

function setStage(n) {
  if (n < 1 || n > 8) return;
  currentStage = n;

  document.querySelectorAll('.stage-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.stage) === n);
  });
  document.getElementById('stage-num').textContent = n;
  document.getElementById('progress-fill').style.width = (n * 12.5) + '%';

  const info = stageInfo[n-1];
  const panel = document.getElementById('info-panel');
  document.getElementById('info-title').textContent = info.title;
  document.getElementById('info-body').innerHTML = info.body;
  panel.style.opacity = n > 1 ? '1' : '0';

  // Confusion overlay
  const confusion = document.getElementById('confusion-overlay');
  if (n === 1) {
    confusion.style.opacity = '1';
    confusion.style.pointerEvents = 'auto';
    setTimeout(() => {
      confusion.style.opacity = '0';
      confusion.style.pointerEvents = 'none';
    }, 2500);
  } else {
    confusion.style.opacity = '0';
    confusion.style.pointerEvents = 'none';
  }

  const grid = scene.getObjectByName('grid');
  const spot = scene.getObjectByName('spotlight');

  // Reset visibility
  Object.values(labelData).forEach(d => { d.visible = false; d.opacity = '1'; d.strikethrough = false; });
  isAutoRotating = false;

  // Stage-specific setup
  if (n >= 2) {
    planeFloor.visible = true;
    if (grid) grid.visible = true;
    stick.visible = true;
    stickP.visible = true;
    stickQ.visible = true;
    labelData['P'].visible = true;
    labelData['Q'].visible = true;
  } else {
    planeFloor.visible = false;
    if (grid) grid.visible = false;
    stick.visible = false;
    stickP.visible = false;
    stickQ.visible = false;
  }

  if (n >= 3) {
    lightSource.visible = true;
    if (spot) spot.visible = true;
    lightBeams.forEach(b => { b.visible = true; b.material.opacity = 0.06; });
  } else {
    lightSource.visible = false;
    if (spot) spot.visible = false;
    lightBeams.forEach(b => { b.visible = false; b.material.opacity = 0; });
  }

  if (n >= 4) {
    shadowMesh.visible = true;
    labelData['Projection'].visible = true;
  } else {
    shadowMesh.visible = false;
  }

  if (n >= 5) {
    normalArrow.visible = true;
    labelData['Normal Vector'].visible = true;
    labelData['θ'].visible = true;
  } else {
    normalArrow.visible = false;
  }

  if (n >= 6) {
    labelData['sin(θ)'].visible = true;
    labelData['cos(θ)'].visible = true;
    labelData['cos(θ)'].strikethrough = true;
    labelData['cos(θ)'].opacity = '0.3';
  }

  if (n === 7) {
    isAutoRotating = true;
  }

  // Particles visibility
  particles.forEach(p => {
    p.material.opacity = n >= 2 ? 0.15 : 0;
  });

  // Camera angle per stage
  if (n <= 3) { targetOrbitX = 0.5; targetOrbitY = 0.35; targetOrbitDist = 14; }
  if (n === 4) { targetOrbitX = 0.3; targetOrbitY = 0.25; targetOrbitDist = 12; }
  if (n === 5) { targetOrbitX = 0.1; targetOrbitY = 0.3; targetOrbitDist = 11; }
  if (n >= 6) { targetOrbitX = 0.4; targetOrbitY = 0.3; targetOrbitDist = 12; }
  if (n === 8) { targetOrbitX = 0.6; targetOrbitY = 0.35; targetOrbitDist = 11; }

  if (n !== 7) {
    targetStickAngle = Math.PI / 4;
  }
}

// ============ EVENTS ============
function setupEvents() {
  // Stage buttons
  document.querySelectorAll('.stage-btn').forEach(btn => {
    btn.addEventListener('click', () => setStage(parseInt(btn.dataset.stage)));
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    const n = parseInt(e.key);
    if (n >= 1 && n <= 8) setStage(n);
  });

  // Orbit controls
  const canvas = renderer.domElement;
  canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x:e.clientX, y:e.clientY }; });
  canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    targetOrbitX += dx * 0.005;
    targetOrbitY = Math.max(-0.5, Math.min(1.2, targetOrbitY + dy * 0.005));
    lastMouse = { x:e.clientX, y:e.clientY };
  });
  canvas.addEventListener('mouseup', () => isDragging = false);
  canvas.addEventListener('mouseleave', () => isDragging = false);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    targetOrbitDist = Math.max(5, Math.min(25, targetOrbitDist + e.deltaY * 0.01));
  }, { passive:false });

  // Touch
  let lastTouchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastMouse = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - lastMouse.x;
      const dy = e.touches[0].clientY - lastMouse.y;
      targetOrbitX += dx * 0.005;
      targetOrbitY = Math.max(-0.5, Math.min(1.2, targetOrbitY + dy * 0.005));
      lastMouse = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      targetOrbitDist = Math.max(5, Math.min(25, targetOrbitDist + (lastTouchDist-dist)*0.03));
      lastTouchDist = dist;
    }
  }, { passive:false });
  canvas.addEventListener('touchend', () => isDragging = false);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ============ ANIMATE ============
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // Smooth orbit
  orbitAngleX += (targetOrbitX - orbitAngleX) * 0.05;
  orbitAngleY += (targetOrbitY - orbitAngleY) * 0.05;
  orbitDist += (targetOrbitDist - orbitDist) * 0.05;
  updateCamera();

  // Auto-rotate stick in stage 7
  if (isAutoRotating) {
    autoRotateTime += dt;
    targetStickAngle = Math.PI/6 + Math.sin(autoRotateTime * 0.5) * Math.PI/4;
  }

  // Smooth stick angle
  currentStickAngle += (targetStickAngle - currentStickAngle) * 0.04;
  updateStick();

  // Light beams pulse
  lightBeams.forEach((b, i) => {
    if (b.visible) {
      b.material.opacity = 0.03 + Math.sin(t * 1.5 + i) * 0.02;
    }
  });

  // Light source glow
  if (lightSource.visible) {
    lightSource.scale.setScalar(1 + Math.sin(t * 2) * 0.08);
  }

  // Particles float
  particles.forEach(p => {
    if (p.material.opacity > 0) {
      p.position.y += Math.sin(t * p.userData.speed + p.userData.phase) * 0.002;
      p.position.x += Math.sin(t * 0.3 + p.userData.phase) * 0.001;
    }
  });

  updateLabels();
  renderer.render(scene, camera);
}

// ============ INIT ============
init();

// Auto-start: show confusion, then transition
setTimeout(() => setStage(1), 100);
</script>
