<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Rule: Mechanical Gear System | Interactive 3D Calculus</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel-bg: rgba(10, 12, 20, 0.85);
            --text: #e0e0e0;
            --accent: #4da8da;
            --accent2: #e8a850;
            --accent3: #5cdb8b;
            --glow: rgba(77, 168, 218, 0.5);
            --danger: #e05555;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #ui-overlay > * {
            pointer-events: auto;
        }
        #top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        #title {
            font-size: clamp(1.2rem, 2.2vw, 1.7rem);
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.03em;
            text-shadow: 0 0 30px var(--glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #title .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #4da8da33, #4da8da11);
            border: 1.5px solid #4da8da66;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        #subtitle {
            font-size: 0.8rem;
            color: #8899aa;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #bottom-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px 20px;
            align-items: flex-end;
            justify-content: center;
        }
        .control-group {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px 18px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 140px;
            transition: all 0.35s ease;
        }
        .control-group:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .control-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8899aa;
            font-weight: 600;
        }
        .control-value {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
        }
        .control-value.highlight {
            color: var(--accent2);
            text-shadow: 0 0 18px rgba(232, 168, 80, 0.5);
        }
        #rotation-slider {
            -webkit-appearance: none;
            width: 100%;
            min-width: 180px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #2a3a50, #4da8da, #e8a850);
            outline: none;
            cursor: pointer;
        }
        #rotation-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #4da8da;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.6), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.2s;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.25s;
            white-space: nowrap;
            font-family: var(--font-sans);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
        }
        .btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.45);
        }
        .btn.xray-active {
            background: #6c3cb0;
            border-color: #8b5cf6;
            color: #fff;
            box-shadow: 0 0 22px rgba(139, 92, 246, 0.5);
            animation: xrayPulse 2s ease-in-out infinite;
        }
        @keyframes xrayPulse {
            0%, 100% { box-shadow: 0 0 22px rgba(139, 92, 246, 0.5); }
            50% { box-shadow: 0 0 38px rgba(139, 92, 246, 0.8); }
        }
        #math-panel {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 18px 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            pointer-events: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            transition: all 0.4s;
        }
        #math-panel .math-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: #bbb;
        }
        #math-panel .math-row .eq {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }
        #math-panel .math-row .val {
            color: var(--accent2);
            font-weight: 700;
        }
        #math-panel .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 0;
        }
        #math-panel .final {
            font-size: 1.15rem;
            color: #5cdb8b;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.04em;
            text-shadow: 0 0 20px rgba(92, 219, 139, 0.5);
        }
        @media (max-width: 768px) {
            #math-panel {
                right: 6px;
                top: auto;
                bottom: 200px;
                transform: none;
                min-width: 150px;
                padding: 12px 14px;
                gap: 6px;
                border-radius: 14px;
            }
            #math-panel .math-row { font-size: 0.75rem; }
            #math-panel .final { font-size: 0.95rem; }
            #bottom-panel { padding: 10px 8px 14px; gap: 8px; }
            .control-group { padding: 10px 12px; min-width: 100px; border-radius: 12px; }
            .btn { padding: 7px 12px; font-size: 0.72rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div id="top-bar">
            <div id="title"><span class="icon">⚙️</span>Chain Rule: Gear System</div>
            <div id="subtitle">Interactive Calculus Simulator</div>
        </div>
        <div id="bottom-panel">
            <div class="control-group" style="flex:2;min-width:200px;">
                <span class="control-label">🔧 Gear A Rotation (x turns)</span>
                <input type="range" id="rotation-slider" min="0" max="10" step="0.01" value="0">
                <span class="control-value" id="slider-value-display">x = 0.00 turns</span>
            </div>
            <div class="control-group">
                <span class="control-label">⚡ Speed</span>
                <div class="btn-row">
                    <button class="btn" data-speed="0.25">🐢 Slow</button>
                    <button class="btn active" data-speed="1">▶ Normal</button>
                    <button class="btn" data-speed="3">⚡ Fast</button>
                </div>
            </div>
            <div class="control-group">
                <span class="control-label">🔬 View Mode</span>
                <button class="btn" id="xray-toggle">💀 X-Ray Mode</button>
            </div>
            <div class="control-group">
                <span class="control-label">🔄 Auto-Rotate</span>
                <button class="btn active" id="auto-toggle">▶ Running</button>
            </div>
        </div>
    </div>
    <div id="math-panel">
        <div class="math-row"><span>📐</span><span class="eq">x</span><span>=</span><span class="val" id="disp-x">0.00</span><span>turns</span></div>
        <div class="math-row"><span>🔗</span><span class="eq">u = 3x</span><span>=</span><span class="val" id="disp-u">0.00</span><span>turns</span></div>
        <div class="math-row"><span>🎯</span><span class="eq">y = ½u</span><span>=</span><span class="val" id="disp-y">0.00</span><span>turns</span></div>
        <div class="divider"></div>
        <div class="math-row"><span>📏</span><span>du/dx =</span><span class="val">3</span></div>
        <div class="math-row"><span>📏</span><span>dy/du =</span><span class="val">1/2</span></div>
        <div class="divider"></div>
        <div class="final" id="final-result">dy/dx = 3/2 = 1.50</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---------- DOM REFS ----------
        const container = document.getElementById('canvas-container');
        const slider = document.getElementById('rotation-slider');
        const sliderDisplay = document.getElementById('slider-value-display');
        const dispX = document.getElementById('disp-x');
        const dispU = document.getElementById('disp-u');
        const dispY = document.getElementById('disp-y');
        const finalResult = document.getElementById('final-result');
        const xrayToggle = document.getElementById('xray-toggle');
        const autoToggle = document.getElementById('auto-toggle');
        const speedButtons = document.querySelectorAll('[data-speed]');

        // ---------- SCENE ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080a14);
        scene.fog = new THREE.FogExp2(0x080a14, 0.00025);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.3, 60);
        camera.position.set(2, 8, 10);
        camera.lookAt(0, 0, 0);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI * 0.7;
        controls.minPolarAngle = 0.2;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.35;
        controls.update();

        // ---------- LIGHTING ----------
        const ambientLight = new THREE.AmbientLight(0x1a2a40, 1.8);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffeedd, 6);
        keyLight.position.set(8, 12, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -15;
        keyLight.shadow.camera.right = 15;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        scene.add(keyLight);
        const rimLight = new THREE.DirectionalLight(0x8899cc, 3.5);
        rimLight.position.set(-4, 3, -6);
        scene.add(rimLight);
        const fillLight = new THREE.DirectionalLight(0x334466, 2);
        fillLight.position.set(0, -2, 2);
        scene.add(fillLight);
        const spotLight = new THREE.SpotLight(0xffffff, 12, 25, Math.PI / 7, 0.3, 0.5);
        spotLight.position.set(0, 10, 2);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        scene.add(spotLight);

        // ---------- ENVIRONMENT ----------
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111820, roughness: 0.25, metalness: 0.7 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -4.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.PolarGridHelper(12, 48, 32, 256, 0x2a3050, 0x1a2030);
        gridHelper.position.y = -4.48;
        scene.add(gridHelper);

        // ---------- PARTICLES ----------
        const particlesCount = 600;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);
        const particleSpeeds = new Float32Array(particlesCount);
        for (let i = 0; i < particlesCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 16;
            positions[i * 3 + 1] = Math.random() * 10 - 2;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 14;
            particleSpeeds[i] = 0.3 + Math.random() * 1.2;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0x8899cc, size: 0.025, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // ---------- VOLUMETRIC BEAMS ----------
        function createLightBeam(x, y, z, height, color, opacity) {
            const geo = new THREE.CylinderGeometry(0.04, 0.35, height, 16, 1, true);
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(geo, mat);
            beam.position.set(x, y, z);
            return beam;
        }
        const beam1 = createLightBeam(-2, 2, 0, 9, 0x8899cc, 0.08);
        const beam2 = createLightBeam(1.5, 2.5, -1, 8, 0xaaccdd, 0.06);
        scene.add(beam1);
        scene.add(beam2);

        // ---------- GEAR FACTORY ----------
        function createGearShape(pitchRadius, numTeeth, toothHeight) {
            const shape = new THREE.Shape();
            const outerR = pitchRadius + toothHeight / 2;
            const innerR = pitchRadius - toothHeight / 2;
            const anglePerTooth = (2 * Math.PI) / numTeeth;
            const points = [];
            for (let t = 0; t < numTeeth; t++) {
                const base = t * anglePerTooth;
                const vStart = base - anglePerTooth * 0.19;
                const vEnd = base + anglePerTooth * 0.19;
                const riseEnd = vEnd + anglePerTooth * 0.12;
                const toothEnd = riseEnd + anglePerTooth * 0.38;
                const fallEnd = toothEnd + anglePerTooth * 0.12;
                for (let s = 0; s <= 6; s++) { const ang = vStart + (s/6)*(vEnd-vStart); points.push({angle:ang,radius:innerR}); }
                for (let s = 1; s <= 4; s++) { const ang = vEnd + (s/4)*(riseEnd-vEnd); const t_s = s/4; points.push({angle:ang,radius:innerR + (outerR-innerR)*(t_s*t_s*(3-2*t_s))}); }
                for (let s = 1; s <= 6; s++) { const ang = riseEnd + (s/6)*(toothEnd-riseEnd); points.push({angle:ang,radius:outerR}); }
                for (let s = 1; s <= 4; s++) { const ang = toothEnd + (s/4)*(fallEnd-toothEnd); const t_s = s/4; points.push({angle:ang,radius:outerR - (outerR-innerR)*(t_s*t_s*(3-2*t_s))}); }
            }
            const first = points[0];
            shape.moveTo(first.radius*Math.cos(first.angle), first.radius*Math.sin(first.angle));
            for (let i=1;i<points.length;i++) shape.lineTo(points[i].radius*Math.cos(points[i].angle), points[i].radius*Math.sin(points[i].angle));
            shape.closePath();
            const hole = new THREE.Path();
            hole.absarc(0,0,pitchRadius*0.22,0,Math.PI*2,true);
            shape.holes.push(hole);
            return shape;
        }

        function createGear(pitchRadius, numTeeth, toothHeight, thickness, color, metalness=0.85, roughness=0.28) {
            const group = new THREE.Group();
            const shape = createGearShape(pitchRadius, numTeeth, toothHeight);
            const extSettings = { steps:2, depth:thickness, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:3 };
            const geo = new THREE.ExtrudeGeometry(shape, extSettings);
            geo.rotateX(-Math.PI/2);
            const mat = new THREE.MeshStandardMaterial({ color, metalness, roughness });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            const hubR = pitchRadius*0.3, hubH = thickness*0.6;
            const hubGeo = new THREE.CylinderGeometry(hubR, hubR, hubH, 32);
            const hubMat = new THREE.MeshStandardMaterial({ color:color.clone().multiplyScalar(1.1), metalness:0.9, roughness:0.2 });
            const topHub = new THREE.Mesh(hubGeo, hubMat);
            topHub.position.y = thickness/2 + hubH/2 - 0.03;
            topHub.castShadow = true;
            group.add(topHub);
            const bottomHub = new THREE.Mesh(hubGeo, hubMat);
            bottomHub.position.y = -thickness/2 - hubH/2 + 0.03;
            bottomHub.castShadow = true;
            group.add(bottomHub);
            group.userData = { pitchRadius, numTeeth, toothHeight, thickness, baseColor:color.clone(), metalness, roughness, gearMesh:mesh, hubTop:topHub, hubBottom:bottomHub };
            return group;
        }

        // ---------- CREATE GEARS ----------
        const gearA = createGear(3.0, 30, 0.55, 0.55, new THREE.Color(0xc8d0da), 0.88, 0.25);
        gearA.position.set(-4.0, 0, 0);
        gearA.name = 'GearA';
        scene.add(gearA);

        const gearB = createGear(1.0, 10, 0.28, 0.45, new THREE.Color(0xd5dbe3), 0.82, 0.3);
        gearB.position.set(0, 0, 0);
        gearB.name = 'GearB';
        gearB.rotation.y = Math.PI / 10;
        scene.add(gearB);

        const gearC = createGear(2.0, 20, 0.4, 0.5, new THREE.Color(0xbfc8d2), 0.86, 0.27);
        gearC.position.set(3.0, 0, 0);
        gearC.name = 'GearC';
        gearC.rotation.y = -Math.PI / 20;
        scene.add(gearC);

        const allGears = [gearA, gearB, gearC];

        // ---------- RADIUS INDICATORS ----------
        function createRadiusIndicator(pitchRadius, colorHex, label) {
            const group = new THREE.Group();
            const lineLength = pitchRadius;
            // Cylinder from center to edge along +X
            const cylGeo = new THREE.CylinderGeometry(0.04, 0.04, lineLength, 8);
            const cylMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
            const cylinder = new THREE.Mesh(cylGeo, cylMat);
            cylinder.rotation.z = -Math.PI / 2; // align cylinder (Y axis) to X axis
            cylinder.position.x = lineLength / 2;
            group.add(cylinder);

            // Tip sphere
            const sphereGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.x = lineLength;
            group.add(sphere);

            // Sprite label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.font = 'bold 28px "Inter","Segoe UI","Helvetica Neue",sans-serif';
            ctx.fillStyle = colorHex;
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 15;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, canvas.width/2, canvas.height/2);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(1.2, 0.3, 1);
            sprite.position.set(lineLength + 0.4, 0.2, 0);
            group.add(sprite);

            return group;
        }

        const radiusIndicatorA = createRadiusIndicator(3.0, '#4da8da', 'r = 3.0');
        radiusIndicatorA.position.copy(gearA.position);
        scene.add(radiusIndicatorA);

        const radiusIndicatorB = createRadiusIndicator(1.0, '#e8a850', 'r = 1.0');
        radiusIndicatorB.position.copy(gearB.position);
        scene.add(radiusIndicatorB);

        const radiusIndicatorC = createRadiusIndicator(2.0, '#5cdb8b', 'r = 2.0');
        radiusIndicatorC.position.copy(gearC.position);
        scene.add(radiusIndicatorC);

        // ---------- GLOW RINGS ----------
        function createGlowRing(radius, y, colorHex) {
            const geo = new THREE.TorusGeometry(radius, 0.03, 16, 80);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
            const ring = new THREE.Mesh(geo, mat);
            ring.rotation.x = Math.PI/2;
            ring.position.y = y;
            return ring;
        }
        const glowA = createGlowRing(3.0, 0.28, 0x4da8da);
        glowA.position.x = gearA.position.x;
        scene.add(glowA);
        const glowB = createGlowRing(1.0, 0.23, 0xe8a850);
        glowB.position.x = gearB.position.x;
        scene.add(glowB);
        const glowC = createGlowRing(2.0, 0.25, 0x5cdb8b);
        glowC.position.x = gearC.position.x;
        scene.add(glowC);

        // ---------- HOLOGRAPHIC PANELS ----------
        function createHoloPanel(text, position, scale=1, colorHex='#4da8da') {
            const canvas = document.createElement('canvas');
            canvas.width=512; canvas.height=128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.font = 'bold 42px "Inter","Segoe UI","Helvetica Neue",sans-serif';
            ctx.fillStyle = colorHex;
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 20;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map:texture, transparent:true, opacity:0.85, blending:THREE.NormalBlending, depthWrite:false, side:THREE.DoubleSide });
            const panel = new THREE.Mesh(new THREE.PlaneGeometry(2.5*scale,0.625*scale), mat);
            panel.position.copy(position);
            panel.lookAt(new THREE.Vector3(position.x, position.y+3, position.z));
            return panel;
        }
        const panelDuDx = createHoloPanel('du/dx = 3', new THREE.Vector3(-2.0,2.2,1.5),0.9,'#e8a850');
        scene.add(panelDuDx);
        const panelDyDu = createHoloPanel('dy/du = 1/2', new THREE.Vector3(1.5,2.2,1.5),0.9,'#5cdb8b');
        scene.add(panelDyDu);
        const panelX = createHoloPanel('x', new THREE.Vector3(-4.0,2.6,-1.2),0.7,'#4da8da');
        scene.add(panelX);
        const panelU = createHoloPanel('u', new THREE.Vector3(0,2.6,-1.2),0.7,'#e8a850');
        scene.add(panelU);
        const panelY = createHoloPanel('y', new THREE.Vector3(3.0,2.6,-1.2),0.7,'#5cdb8b');
        scene.add(panelY);

        // ---------- CONNECTION ARROWS (X-Ray) ----------
        const connectionGroup = new THREE.Group();
        connectionGroup.visible = false;
        scene.add(connectionGroup);
        function createConnectionArrow(from, to, colorHex) {
            const group = new THREE.Group();
            const mid = new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(from.x, from.y+2.8, from.z),
                new THREE.Vector3(mid.x, mid.y+3.2, mid.z),
                new THREE.Vector3(to.x, to.y+2.8, to.z)
            );
            const tubeGeo = new THREE.TubeGeometry(curve,40,0.06,8,false);
            const tubeMat = new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false });
            group.add(new THREE.Mesh(tubeGeo, tubeMat));
            const arrowGeo = new THREE.ConeGeometry(0.2,0.5,8,8);
            const arrowMat = new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
            const arrow = new THREE.Mesh(arrowGeo, arrowMat);
            const endPt = curve.getPoint(1);
            arrow.position.copy(endPt);
            const dir = new THREE.Vector3().subVectors(to, from).normalize();
            arrow.lookAt(endPt.clone().add(dir));
            group.add(arrow);
            return group;
        }
        connectionGroup.add(createConnectionArrow(new THREE.Vector3(-4,0,0), new THREE.Vector3(0,0,0), 0xe8a850));
        connectionGroup.add(createConnectionArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(3,0,0), 0x5cdb8b));

        // ---------- STATE ----------
        let rotationTurns = 0;
        let targetRotationTurns = 0;
        let autoRotate = true;
        let rotationSpeed = 1.0;
        let xrayMode = false;
        let isDraggingSlider = false;

        // ---------- XRAY TOGGLE ----------
        xrayToggle.addEventListener('click', () => {
            xrayMode = !xrayMode;
            connectionGroup.visible = xrayMode;
            allGears.forEach(gear => {
                const ud = gear.userData;
                ud.gearMesh.material.transparent = xrayMode;
                ud.gearMesh.material.opacity = xrayMode ? 0.3 : 1;
                ud.gearMesh.material.metalness = xrayMode ? 0.3 : ud.metalness;
                ud.gearMesh.material.roughness = xrayMode ? 0.5 : ud.roughness;
                if (ud.hubTop) { ud.hubTop.material.transparent = xrayMode; ud.hubTop.material.opacity = xrayMode ? 0.35 : 1; }
                if (ud.hubBottom) { ud.hubBottom.material.transparent = xrayMode; ud.hubBottom.material.opacity = xrayMode ? 0.35 : 1; }
                ud.gearMesh.material.needsUpdate = true;
            });
            xrayToggle.textContent = xrayMode ? '💀 X-Ray ON' : '💀 X-Ray Mode';
            xrayToggle.classList.toggle('xray-active', xrayMode);
        });

        // ---------- UPDATE ROTATIONS ----------
        function updateGearRotations() {
            const a = rotationTurns;
            gearA.rotation.y = -a * Math.PI * 2;
            gearB.rotation.y = (3*a) * Math.PI*2 + Math.PI/10;
            gearC.rotation.y = -(1.5*a) * Math.PI*2 - Math.PI/20;
            glowA.rotation.z += 0.01;
            glowB.rotation.z -= 0.015;
            glowC.rotation.z += 0.008;
        }

        function updateUI() {
            const a = rotationTurns;
            slider.value = Math.min(10, Math.max(0, a));
            sliderDisplay.textContent = `x = ${a.toFixed(2)} turns`;
            dispX.textContent = a.toFixed(2);
            dispU.textContent = (3*a).toFixed(2);
            dispY.textContent = (1.5*a).toFixed(2);
            finalResult.textContent = `dy/dx = 3/2 = ${1.5.toFixed(2)}`;
        }

        // ---------- SLIDER ----------
        slider.addEventListener('input', ()=>{
            isDraggingSlider = true;
            targetRotationTurns = parseFloat(slider.value);
            rotationTurns = targetRotationTurns;
            autoRotate = false;
            autoToggle.textContent = '⏸ Paused';
            autoToggle.classList.remove('active');
            updateGearRotations();
            updateUI();
            clearTimeout(window.dragTimeout);
            window.dragTimeout = setTimeout(()=>{ isDraggingSlider = false; }, 1500);
        });

        // ---------- BUTTONS ----------
        autoToggle.addEventListener('click', ()=>{
            autoRotate = !autoRotate;
            if (autoRotate) { targetRotationTurns = rotationTurns; autoToggle.textContent='▶ Running'; autoToggle.classList.add('active'); }
            else { autoToggle.textContent='⏸ Paused'; autoToggle.classList.remove('active'); }
        });
        speedButtons.forEach(btn => btn.addEventListener('click', ()=>{
            speedButtons.forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            rotationSpeed = parseFloat(btn.dataset.speed);
        }));

        // ---------- KEYBOARD ----------
        window.addEventListener('keydown', e => {
            switch(e.key.toLowerCase()){
                case 'x': xrayToggle.click(); break;
                case ' ': e.preventDefault(); autoToggle.click(); break;
                case '1': rotationSpeed=0.25; speedButtons.forEach(b=>b.classList.remove('active')); document.querySelector('[data-speed="0.25"]').classList.add('active'); break;
                case '2': rotationSpeed=1; speedButtons.forEach(b=>b.classList.remove('active')); document.querySelector('[data-speed="1"]').classList.add('active'); break;
                case '3': rotationSpeed=3; speedButtons.forEach(b=>b.classList.remove('active')); document.querySelector('[data-speed="3"]').classList.add('active'); break;
                case 'r': rotationTurns=0; targetRotationTurns=0; updateGearRotations(); updateUI(); break;
                case 'f': controls.target.set(0,0,0); camera.position.set(2,8,10); camera.lookAt(0,0,0); controls.update(); break;
            }
        });

        window.addEventListener('resize', ()=>{
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- ANIMATION LOOP ----------
        const clock = new THREE.Clock();
        let timeAccum = 0;
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            timeAccum += dt;
            if (autoRotate && !isDraggingSlider) {
                targetRotationTurns += rotationSpeed * dt;
                if (targetRotationTurns > 10) targetRotationTurns %= 10;
            }
            rotationTurns += (targetRotationTurns - rotationTurns) * (1 - Math.exp(-12*dt));
            rotationTurns = Math.max(0, Math.min(10, rotationTurns));
            updateGearRotations();
            updateUI();

            const posArr = particlesGeo.attributes.position.array;
            for (let i=0;i<particlesCount;i++) {
                posArr[i*3+1] += particleSpeeds[i]*dt*0.3;
                if (posArr[i*3+1] > 8) posArr[i*3+1] = -2;
            }
            particlesGeo.attributes.position.needsUpdate = true;

            const floatOffset = Math.sin(timeAccum*1.3)*0.15;
            panelDuDx.position.y = 2.2 + floatOffset;
            panelDyDu.position.y = 2.2 + floatOffset*0.8;
            panelX.position.y = 2.6 + floatOffset*0.6;
            panelU.position.y = 2.6 + floatOffset*0.7;
            panelY.position.y = 2.6 + floatOffset*0.5;

            beam1.material.opacity = 0.06 + Math.sin(timeAccum*0.7)*0.03;
            beam2.material.opacity = 0.05 + Math.cos(timeAccum*0.9)*0.025;
            glowA.scale.setScalar(1+Math.sin(timeAccum*2)*0.15);
            glowB.scale.setScalar(1+Math.sin(timeAccum*2)*0.13);
            glowC.scale.setScalar(1+Math.sin(timeAccum*2)*0.17);

            controls.autoRotateSpeed = isDraggingSlider ? 0.1 : 0.35;
            controls.update();
            renderer.render(scene, camera);
        }

        updateGearRotations();
        updateUI();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
