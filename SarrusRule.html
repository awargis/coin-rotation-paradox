<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Determinant HUD - Cinematic Edition</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #020202; font-family: 'Share Tech Mono', monospace; }

        /* Environmental Effects */
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            pointer-events: none; z-index: 80;
        }

        .grid-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3; pointer-events: none; z-index: 1;
            transform: perspective(500px) rotateX(20deg) scale(1.5);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .hud-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; cursor: crosshair; user-select: none; z-index: 10;
        }

        .hud-title {
            color: #00FFFF; font-size: clamp(16px, 3vw, 32px); letter-spacing: 0.6em;
            text-transform: uppercase; margin-bottom: 2%; opacity: 0.8;
            text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF, 0 0 40px rgba(0,255,255,0.5);
            animation: titlePulse 4s ease-in-out infinite; z-index: 20;
        }

        @keyframes titlePulse {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 10px #00FFFF); }
            50% { opacity: 1; filter: drop-shadow(0 0 25px #00FFFF); }
        }

        .matrix-wrapper {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            width: 100%; max-width: 800px; z-index: 20;
        }

        /* Holographic Targeting Rings */
        .target-ring {
            position: absolute; border-radius: 50%;
            border: 1px dashed rgba(0, 255, 255, 0.2);
            pointer-events: none; z-index: 0;
        }
        .ring-1 { width: 500px; height: 500px; animation: spin 20s linear infinite; border-width: 2px; }
        .ring-2 { width: 350px; height: 350px; animation: spinReverse 15s linear infinite; border: 1px solid rgba(0, 255, 255, 0.1); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }

        .matrix-svg {
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.5));
            width: 100%; height: auto; z-index: 10;
        }

        .matrix-cell {
            font-family: 'Share Tech Mono', monospace;
            fill: #00FFFF; font-size: 52px; text-anchor: middle;
            dominant-baseline: central; font-weight: bold;
            filter: drop-shadow(0 0 8px #00FFFF);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bracket-line {
            stroke: #00FFFF; stroke-width: 4; fill: none;
            opacity: 0.7; filter: drop-shadow(0 0 8px #00FFFF);
        }

        /* Enhanced Lasers */
        .laser-line {
            fill: none; stroke-width: 6; stroke-linecap: round;
            filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 30px currentColor);
        }

        .laser-green { stroke: #39FF14; color: #39FF14; }
        .laser-red { stroke: #FF4500; color: #FF4500; }

        .cell-green {
            fill: #FFFFFF !important;
            filter: drop-shadow(0 0 15px #39FF14) drop-shadow(0 0 35px #39FF14) !important;
            font-size: 60px;
        }

        .cell-red {
            fill: #FFFFFF !important;
            filter: drop-shadow(0 0 15px #FF4500) drop-shadow(0 0 35px #FF4500) !important;
            font-size: 60px;
        }

        .cell-dim { fill: rgba(0,255,255,0.1) !important; filter: none !important; font-size: 48px; }

        .step-label {
            color: #FFFFFF; font-size: clamp(14px, 2vw, 24px); letter-spacing: 0.3em;
            text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF; margin-top: 4%; opacity: 0;
            text-align: center; padding: 0 5%; z-index: 20;
            background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 30px; border-radius: 4px; box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }

        .click-hint {
            position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
            color: #00FFFF; font-size: clamp(12px, 1.5vw, 16px);
            letter-spacing: 0.5em; animation: hintBlink 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; z-index: 20;
        }

        @keyframes hintBlink { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; filter: drop-shadow(0 0 8px #00FFFF); } }

        /* Cinematic Chromatic Glitch */
        .glitch-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 95; opacity: 0;
        }
        .glitch-red { background: rgba(255, 0, 0, 0.1); transform: translateX(-10px); mix-blend-mode: screen; }
        .glitch-cyan { background: rgba(0, 255, 255, 0.1); transform: translateX(10px); mix-blend-mode: screen; }

        /* Scanline Upgrade */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; opacity: 0.6;
        }

        .scanbar {
            position: absolute; top: 0; left: 0; width: 100%; height: 8px;
            background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            pointer-events: none; z-index: 91; animation: scanMove 6s linear infinite;
        }

        @keyframes scanMove { 0% { top: -10px; } 100% { top: 100%; } }

        /* Formula Panel Enhancement */
        .formula-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0; pointer-events: none; text-align: center; z-index: 100; width: 80%;
        }

        .formula-text {
            color: #fff; font-size: clamp(16px, 2.8vw, 36px); letter-spacing: 0.1em;
            text-shadow: 0 0 20px #fff, 0 0 40px #00FFFF, 0 0 80px #00FFFF;
            line-height: 2; white-space: nowrap; font-weight: bold;
        }

        .formula-border {
            border: 2px solid rgba(0,255,255,0.8); padding: 4% 6%;
            background: rgba(0, 20, 20, 0.85); backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,255,255,0.3), inset 0 0 30px rgba(0,255,255,0.2);
            position: relative; overflow: hidden;
        }

        .formula-border::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); animation: shine 3s infinite;
        }

        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* Flashbang Effect */
        .flashbang {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 999; opacity: 0; pointer-events: none;
        }

        .product-label {
            font-family: 'Share Tech Mono', monospace; font-weight: bold; letter-spacing: 2px;
            fill: #FFFFFF; font-size: 24px; text-anchor: middle; dominant-baseline: central; opacity: 0;
            filter: drop-shadow(0 0 10px currentColor);
        }
    </style>
</head>
<body class="h-full w-full">
    <div class="grid-bg"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="scanbar"></div>
    <div class="flashbang" id="flashbang"></div>
    
    <div class="glitch-layer glitch-red" id="glitchRed"></div>
    <div class="glitch-layer glitch-cyan" id="glitchCyan"></div>

    <div class="hud-container" id="hudContainer">
        <div class="hud-title" id="hudTitle">DETERMINANT HUD</div>
        
        <div class="matrix-wrapper" id="matrixWrapper">
            <div class="target-ring ring-1"></div>
            <div class="target-ring ring-2"></div>

            <svg id="matrixSvg" class="matrix-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                <path class="bracket-line" d="M 120 40 L 90 40 L 90 360 L 120 360" />
                <path class="bracket-line" d="M 480 40 L 510 40 L 510 360 L 480 360" />
                
                <text id="cellA" class="matrix-cell" x="180" y="120">2</text>
                <text id="cellB" class="matrix-cell" x="300" y="120">1</text>
                <text id="cellC" class="matrix-cell" x="420" y="120">3</text>
                
                <text id="cellD" class="matrix-cell" x="180" y="200">4</text>
                <text id="cellE" class="matrix-cell" x="300" y="200">5</text>
                <text id="cellF" class="matrix-cell" x="420" y="200">6</text>
                
                <text id="cellG" class="matrix-cell" x="180" y="280">7</text>
                <text id="cellH" class="matrix-cell" x="300" y="280">8</text>
                <text id="cellI" class="matrix-cell" x="420" y="280">9</text>
                
                <g id="laserGroup"></g>
                
                <text id="prodLabel" class="product-label" x="300" y="380"></text>
            </svg>
        </div>

        <div class="step-label" id="stepLabel"></div>
        <div class="click-hint" id="clickHint">[ INITIATE SEQUENCE ]</div>

        <div class="formula-panel" id="formulaPanel">
            <div class="formula-border">
                <div class="formula-text">
                    |A| = (aei + bfg + cdh) − (ceg + bdi + afh)<br>
                    <span id="formulaCalc" style="color:#39FF14; font-size: 1.1em; filter: drop-shadow(0 0 10px #39FF14);"></span>
                </div>
            </div>
        </div>
    </div>

<script>
const M = { a:2, b:1, c:3, d:4, e:5, f:6, g:7, h:8, i:9 };
const pos = {
    a:[180,120], b:[300,120], c:[420,120],
    d:[180,200], e:[300,200], f:[420,200],
    g:[180,280], h:[300,280], i:[420,280]
};

const cells = {};
let step = -1;

function getCell(id) {
    if (!cells[id]) cells[id] = document.getElementById('cell' + id.toUpperCase());
    return cells[id];
}

// Cinematic Hollywood Impact function
function impactEffect() {
    // Chromatic Split
    gsap.to('#glitchRed', { opacity: 1, duration: 0.05, yoyo: true, repeat: 3, onComplete: () => gsap.set('#glitchRed', { opacity: 0 }) });
    gsap.to('#glitchCyan', { opacity: 1, duration: 0.05, delay: 0.02, yoyo: true, repeat: 3, onComplete: () => gsap.set('#glitchCyan', { opacity: 0 }) });
    
    // Camera Shake
    gsap.fromTo('#hudContainer', 
        { x: () => gsap.utils.random(-15, 15), y: () => gsap.utils.random(-15, 15), rotation: () => gsap.utils.random(-1, 1) },
        { x: 0, y: 0, rotation: 0, duration: 0.3, ease: 'elastic.out(1, 0.3)' }
    );
}

function setStepLabel(text) {
    const el = document.getElementById('stepLabel');
    gsap.to(el, { opacity: 0, scale: 0.9, duration: 0.15, onComplete: () => {
        el.textContent = text;
        gsap.to(el, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.7)' });
    }});
}

function colorCells(ids, cls) {
    ids.forEach((id, index) => {
        const c = getCell(id);
        c.classList.remove('cell-green', 'cell-red', 'cell-dim');
        if (cls) c.classList.add(cls);
        // Pop animation for cell
        gsap.fromTo(c, { scale: 1.5 }, { scale: 1, duration: 0.5, ease: 'elastic.out(1, 0.3)', delay: index * 0.05 });
    });
}

function dimAll() {
    'abcdefghi'.split('').forEach(id => getCell(id).classList.add('cell-dim'));
}

function createLaser(points, color, curved) {
    const g = document.getElementById('laserGroup');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

    let d;
    if (curved && points.length === 3) {
        const [p0, p1, p2] = points;
        const cx1 = (p0[0] + p1[0]) / 2; const cy1 = (p0[1] + p1[1]) / 2 + (p1[1] < p0[1] ? -40 : 40);
        const cx2 = (p1[0] + p2[0]) / 2; const cy2 = (p1[1] + p2[1]) / 2 + (p2[1] < p1[1] ? -40 : 40);
        d = `M ${p0[0]} ${p0[1]} Q ${cx1} ${cy1} ${p1[0]} ${p1[1]} Q ${cx2} ${cy2} ${p2[0]} ${p2[1]}`;
    } else if (points.length === 2) {
        d = `M ${points[0][0]} ${points[0][1]} L ${points[1][0]} ${points[1][1]}`;
    } else {
        d = `M ${points[0][0]} ${points[0][1]} L ${points[1][0]} ${points[1][1]} L ${points[2][0]} ${points[2][1]}`;
    }

    path.setAttribute('d', d);
    path.classList.add('laser-line', color === 'green' ? 'laser-green' : 'laser-red');

    const len = 2000;
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    g.appendChild(path);

    // High-energy cinematic draw & flicker
    gsap.to(path, { strokeDashoffset: 0, duration: 0.6, ease: 'power4.out' });
    gsap.to(path, { opacity: 0.6, duration: 0.05, yoyo: true, repeat: 10, delay: 0.6 });

    return path;
}

function showProduct(text, color) {
    const el = document.getElementById('prodLabel');
    el.textContent = text;
    el.style.fill = '#FFFFFF';
    el.style.color = color === 'green' ? '#39FF14' : '#FF4500';
    gsap.fromTo(el, { opacity: 0, y: 400, scale: 0.5 }, { opacity: 1, y: 380, scale: 1, duration: 0.5, ease: 'back.out(2)' });
}

function hideProduct() {
    gsap.to(document.getElementById('prodLabel'), { opacity: 0, y: 360, duration: 0.3 });
}

const posTerms = [
    { cells: ['a','e','i'], val: M.a*M.e*M.i, expr: `${M.a}×${M.e}×${M.i}=${M.a*M.e*M.i}` },
    { cells: ['b','f','g'], val: M.b*M.f*M.g, expr: `${M.b}×${M.f}×${M.g}=${M.b*M.f*M.g}` },
    { cells: ['c','d','h'], val: M.c*M.d*M.h, expr: `${M.c}×${M.d}×${M.h}=${M.c*M.d*M.h}` }
];
const negTerms = [
    { cells: ['c','e','g'], val: M.c*M.e*M.g, expr: `${M.c}×${M.e}×${M.g}=${M.c*M.e*M.g}` },
    { cells: ['b','d','i'], val: M.b*M.d*M.i, expr: `${M.b}×${M.d}×${M.i}=${M.b*M.d*M.i}` },
    { cells: ['a','f','h'], val: M.a*M.f*M.h, expr: `${M.a}×${M.f}×${M.h}=${M.a*M.f*M.h}` }
];

const posSum = posTerms.reduce((s,t) => s + t.val, 0);
const negSum = negTerms.reduce((s,t) => s + t.val, 0);
const det = posSum - negSum;

function resetCells() {
    'abcdefghi'.split('').forEach(id => {
        const c = getCell(id);
        c.classList.remove('cell-green', 'cell-red', 'cell-dim');
    });
}

function clearLasers() {
    document.getElementById('laserGroup').innerHTML = '';
}

const steps = [
    () => { impactEffect(); setStepLabel('3×3 MATRIX LOADED — SARRUS METHOD'); document.getElementById('clickHint').textContent = "[ CLICK TO ADVANCE ]"; },
    () => {
        impactEffect(); colorCells(['a','e','i'], 'cell-green'); createLaser([pos.a, pos.e, pos.i], 'green');
        showProduct(`+ ${posTerms[0].expr}`, 'green'); setStepLabel('▶ MAIN DIAGONAL: aei');
    },
    () => {
        impactEffect(); hideProduct(); colorCells(['a','e','i'], 'cell-dim'); colorCells(['b','f','g'], 'cell-green');
        createLaser([pos.b, pos.f, pos.g], 'green', true); showProduct(`+ ${posTerms[1].expr}`, 'green'); setStepLabel('▶ POSITIVE TRIANGLE: bfg');
    },
    () => {
        impactEffect(); hideProduct(); colorCells(['b','f','g'], 'cell-dim'); colorCells(['c','d','h'], 'cell-green');
        createLaser([pos.c, pos.d, pos.h], 'green', true); showProduct(`+ ${posTerms[2].expr}`, 'green'); setStepLabel('▶ POSITIVE TRIANGLE: cdh');
    },
    () => {
        impactEffect(); hideProduct(); clearLasers(); dimAll(); colorCells(['c','e','g'], 'cell-red');
        createLaser([pos.c, pos.e, pos.g], 'red'); showProduct(`− ${negTerms[0].expr}`, 'red'); setStepLabel('◀ ANTI-DIAGONAL: ceg');
    },
    () => {
        impactEffect(); hideProduct(); colorCells(['c','e','g'], 'cell-dim'); colorCells(['b','d','i'], 'cell-red');
        createLaser([pos.b, pos.d, pos.i], 'red', true); showProduct(`− ${negTerms[1].expr}`, 'red'); setStepLabel('◀ NEGATIVE TRIANGLE: bdi');
    },
    () => {
        impactEffect(); hideProduct(); colorCells(['b','d','i'], 'cell-dim'); colorCells(['a','f','h'], 'cell-red');
        createLaser([pos.a, pos.f, pos.h], 'red', true); showProduct(`− ${negTerms[2].expr}`, 'red'); setStepLabel('◀ NEGATIVE TRIANGLE: afh');
    },
    () => {
        // Blinding Cinematic Flashbang Reveal
        gsap.to('#flashbang', { opacity: 1, duration: 0.1, yoyo: true, repeat: 1, ease: 'power4.inOut' });
        impactEffect(); hideProduct(); clearLasers();
        
        // Blast matrix outwards
        'abcdefghi'.split('').forEach((id, i) => {
            const c = getCell(id);
            gsap.to(c, {
                opacity: 0, x: () => gsap.utils.random(-300, 300), y: () => gsap.utils.random(-300, 300), 
                rotation: () => gsap.utils.random(-90, 90), duration: 1.5, ease: 'expo.out'
            });
        });
        
        gsap.to('.bracket-line', { opacity: 0, x: (i) => i === 0 ? -100 : 100, duration: 1, ease: 'expo.out' });
        gsap.to('.target-ring', { scale: 3, opacity: 0, duration: 1.5, ease: 'expo.out' });
        gsap.to('#stepLabel, #clickHint', { opacity: 0, duration: 0.3 });

        // Heavy Hologram Formula pop-in
        const fp = document.getElementById('formulaPanel');
        const fc = document.getElementById('formulaCalc');
        fc.innerHTML = `= (${posTerms.map(t=>t.val).join(' + ')}) − (${negTerms.map(t=>t.val).join(' + ')})<br>= ${posSum} − ${negSum} = <span style="color:#FFF;font-size:1.5em;text-shadow:0 0 20px #FFF,0 0 60px #39FF14">${det}</span>`;

        gsap.to(fp, { opacity: 1, duration: 1.5, delay: 0.2, ease: 'power3.out' });
        gsap.fromTo(fp, { scale: 0.2, rotationX: 90 }, { scale: 1, rotationX: 0, duration: 1.5, delay: 0.2, ease: 'elastic.out(1,0.5)' });
    }
];

document.getElementById('hudContainer').addEventListener('click', () => {
    step++;
    if (step < steps.length) {
        steps[step]();
    } else {
        step = -1;
        document.getElementById('laserGroup').innerHTML = '';
        gsap.set('#formulaPanel', { opacity: 0 });
        resetCells();
        'abcdefghi'.split('').forEach(id => {
            gsap.set(getCell(id), { opacity: 1, x: 0, y: 0, rotation: 0 });
        });
        gsap.to('.target-ring', { scale: 1, opacity: 1, duration: 1 });
        gsap.set('.bracket-line', { opacity: 0.7, x: 0 });
        gsap.to('#clickHint', { opacity: 0.8, duration: 0.5 });
        document.getElementById('clickHint').textContent = "[ INITIATE SEQUENCE ]";
        setStepLabel('');
    }
});

// Element SDK Passthrough (Maintained)
const onConfigChange = async (config) => { document.getElementById('hudTitle').textContent = config.matrix_title || 'DETERMINANT HUD'; };
if(window.elementSdk) {
    window.elementSdk.init({
        defaultConfig: { matrix_title: 'DETERMINANT HUD' },
        onConfigChange,
        mapToCapabilities: (c) => ({ recolorables: [], borderables: [] }),
        mapToEditPanelValues: (c) => new Map([['matrix_title', c.matrix_title || 'DETERMINANT HUD']])
    });
}
</script>
</body>
</html>
